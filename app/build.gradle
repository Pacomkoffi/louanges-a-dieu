plugins {
    id 'com.android.application'
}

// Le numéro de version augmente à chaque construction sur GitHub,
// pour que chaque nouvel APK puisse s'installer par-dessus l'ancien.
def numeroConstruction = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.pakbienheureux.louangesadieu'
    compileSdk 34

    defaultConfig {
        applicationId "com.pakbienheureux.louangesadieu"
        minSdk 24
        targetSdk 34
        versionCode numeroConstruction
        versionName "3.${numeroConstruction}"
    }

    signingConfigs {
        release {
            // Clé de signature de l'application : à garder précieusement (voir LISEZMOI.md)
            storeFile file("louanges.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "jeN4HiwzPHuM02Kakcu4"
            keyAlias "louanges"
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "jeN4HiwzPHuM02Kakcu4"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

 clarté, reste avec moi!"]],[0,["Je ne crains rien quand Ton bras me protège;","Mes pleurs n’ont plus d’amertume et l’effroi","Que m’inspiraient la mort et son cortège","A disparu... Seigneur, reste avec moi!"]],[0,["Montre Ta croix à ma vue expirante,","Et que Ton ciel s’illumine à ma foi!","L’ombre s’enfuit, voici l’aube éclatante!...","Dans la vie et la mort, reste avec moi!"]]]},{"n":190,"t":"Reste avec nous, Seigneur, le jour décline,","s":[[0,["Reste avec nous, Seigneur, le jour décline,","La nuit s’approche et nous menace tous;","Nous implorons Ta présence divine:","Reste avec nous, Seigneur, reste avec nous!"]],[0,["En Toi nos cœurs ont salué leur Maître,","En Toi notre âme a trouvé son Époux;","À Ta lumière elle se sent renaître:","Reste avec nous, Seigneur, reste avec nous!"]],[0,["Dans nos combats si Ta main nous délaisse","Satan vainqueur nous tiendra sous ses coups","Que Ta puissance arme notre faiblesse;","Reste avec nous, Seigneur, reste avec nous!"]],[0,["Sous Ton regard, la joie est sainte et bonne","Près de Ton cœur les pleurs même sont doux","Soit que Ta main nous frappe ou nous couronne","Reste avec nous, Seigneur, reste avec nous!"]],[0,["Et quand, au bout de ce pèlerinage,","Nous partirons pour le grand rendez-vous,","Pour nous guider dans ce dernier passage,","Reste avec nous, Seigneur, reste avec nous!"]]]},{"n":191,"t":"Quelle communion, quelle parfaite union,","s":[[0,["Quelle communion, quelle parfaite union,","Reposant sur les bras puissants de Dieu!","Quelle bénédiction, quelle paix des cieux,","Reposant sur les bras puissants de Dieu!"]],[1,["Repos, repos,","Abrité contre tous les dangers,","Repos, repos,","Repos dans le Dieu d’Eternité!"]],[0,["Douceur de marcher sur la route des cieux","Reposant sur les bras puissants de Dieu!","La clarté grandit sur notre sentier,","Reposant sur les bras puissants de Dieu!"]],[0,["Que pourrais-je craindre? Qui pourrait m’atteindre?","Reposant sur les bras puissants de Dieu.","Ma paix est bénie, pécheur repenti,","Reposant sur les bras puissants de Dieu!"]]]},{"n":192,"t":"Sous un ciel ténébreux,","s":[[0,["Sous un ciel ténébreux,","Là-haut sur la colline,","Symbole de notre salut;","Faite de bois rugueux,","Une croix se dessine,","C’est là qu’un Dieu pour nous mourut."]],[1,["Vieille Croix, bois maudit du calvaire,","Doux fardeau, joug facile et léger,","Pour Le suivre au chemin solitaire","Le Sauveur m’invite à m’en charger."]],[0,["Il gravit Golgotha,","Dans la peine et la honte, Courbé sous cet","infâme bois. Et maintenant, Il veut","Qu’à Sa suite, je monte,","En portant avec Lui Sa Croix."]],[0,["Il souffrit là, pour moi,","Le pécheur misérable,","Les tourments d’un horrible sort;","Il mourut, Lui, le Roi,","Pour l’esclave coupable,","Et j’ai la vie par Sa mort."]]]},{"n":193,"t":"O Dieu! Toute ma prière","s":[[0,["O Dieu! Toute ma prière","Et mon vœu le plus ardent,","C’est qu’en Toi je trouve un Père","Et que je sois Ton enfant."]],[0,["Je sais déjà que la vie","N’est heureuse qu’en Ta paix;","Qu’autrement elle est remplie","De fautes et de regrets."]],[0,["Que Ta puissance m’attire","A Jésus, notre Sauveur!","C’est à Lui que je désire","Donner à jamais mon cœur."]],[0,["Que Ton Esprit me remplisse","D’une pure et vive foi,","Et que mon âme obéisse,","Seigneur, à Ta sainte loi!"]]]},{"n":194,"t":"Seigneur, Tu donnes Ta grâce","s":[[0,["Seigneur, Tu donnes Ta grâce","Au cœur qui regarde à Toi:","Ah! Que sa douce efficace","Se répande aussi sur moi!","Oui sur moi! Oui sur moi!","Se répande aussi sur moi!"]],[0,["Père tendre et secourable,","Je fus rebelle à ta loi;","Quoiqu’impur et misérable,","Oh! Pardonne et bénis-moi!","Bénis-moi! Bénis-moi!","Oh! Pardonne et bénis-moi!"]],[0,["Rédempteur toujours propice,","Je veux m’attacher à Toi;","J’ai faim, j’ai soif de justice:","Je T’appelle, réponds-moi!","Réponds-moi! Réponds-moi!","Je T’appelle, réponds-moi!"]],[0,["Saint-Esprit, souffle de vie,","Viens en mon cœur par la foi!","Dans le Sang qui purifie,","De tout péché lave-moi!","Lave-moi! Lave-moi!","De tout péché lave-moi!"]],[0,["Par Ton amour, ô bon Père,","Par le Sang versé pour moi,","Par l’Esprit qui seul opère,","Dieu trois fois Saint! Sauve-moi!","Sauve-moi! Sauve-moi!","Dieu trois fois saint, sauve-moi!"]]]},{"n":195,"t":"Tu peux me demander qui est ce Jésus","s":[[0,["Tu peux me demander qui est ce Jésus","Dont je parle toujours, et de plus en plus.","Je voudrais te dire ce qu’il est pour moi,","Cesse de médire, et écoute-moi:"]],[0,["Mon Dieu est Tout-Puissant,","Son Nom le plus grand,","Il peut te diriger, Il veut te sauver.","Sa main a partagé les flots de la mer,","Il y fit un sentier, Israël y marchait."]],[0,["Il a rempli mon cœur, Il est mon tout.","Jésus est tout pour moi, Il est si doux,","Il m’a donné la vie, plus de courroux.","Jésus vit dans mon cœur,","Qu’en est-il de vous?"]]]},{"n":196,"t":"C’est Toi, Jésus! que recherche mon âme;","s":[[0,["C’est Toi, Jésus! que recherche mon âme;","À Te trouver se bornent mes souhaits;","C’est Ton regard que sur moi je réclame;","Rends-moi, Seigneur, rends-moi Ta douce paix."]],[0,["Longtemps j’errai dans les sentiers du monde,","Ne connaissant ni Ton nom, ni Ta loi:","Tu me cherchas en cette nuit profonde,","Et, pour toujours, m’en tiras par la foi."]],[0,["De ton amour la voix se fit entendre:","J'appris alors que Tu m’as racheté,","Et Ton Esprit à mon cœur fît comprendre","Ce qu’est pour nous, ô Dieu! Ta charité."]],[0,["Prends donc pitié de ma grande misère;","Soumets mon cœur, brise sa dureté;","A Golgotha mon âme Te fut chère:","Je compte ô Dieu! Sur Ta fidélité."]]]},{"n":197,"t":"Quand ma vie s’écoulait, triste et sans but,","s":[[0,["Quand ma vie s’écoulait, triste et sans but,","Privée de joie, de paix, de plein salut,","Alors, ont brillé sur mon cœur souillé,","La lumière et l’amour de Jésus."]],[1,["Jésus est le vrai Roi de mon cœur","Lui seul règne en moi, je suis par la foi","Libre de tout lien, plus que vainqueur:","Oui, Jésus est le vrai Roi de mon cœur."]],[0,["Alors, tout mon fardeau fut enlevé,","Et sur mon cœur, le soleil s’est levé.","Puis Jésus me dit: «Donne-moi ta vie»","Et Il me remplit de Son Esprit!"]],[0,["Jésus est sur le trône de mon cœur,","Il remplit mon âme de vrai bonheur,","Et j’aurai là-haut couronne et repos:","Oui, le meilleur ami, c’est Jésus!"]],[0,["Le monde avec ses trésors peut périr,","Mais l’Amour du Sauveur ne peut tarir,","Car à Golgotha, Il me racheta;","Désormais, ma vie est pour Jésus!"]]]},{"n":198,"t":"Le cri de mon âme","s":[[0,["Le cri de mon âme","S’élève vers Toi.","Elle Te réclame,","Jésus, pour son Roi.","Ton joug est facile,","Ton fardeau léger;","Sur mon cœur docile","Règne, ô bon Berger!"]],[0,["Trop longtemps, le monde","Trompa mes désirs.","Changeants comme l’onde","Sont tous ses plaisirs.","Sa joie est frivole,","Tout est vanité;","Seule, Ta Parole","Est la vérité."]],[0,["Parole éternelle,","Ô Christ rédempteur,","Prends-moi sous Ton aile,","Habite en mon cœur.","Dans la nuit profonde,","Tiens-moi par la main;","Lumière du monde,","Luis sur mon chemin!"]],[0,["Source de l’eau vive,","Pain venu des deux,","Que par Toi je vive","Paisible et joyeux!","Quand luira l’aurore","Du jour éternel,","Que je vive encore","Pour Toi, dans le Ciel!"]]]},{"n":199,"t":"Il m’a sauvé, il m’a sauvé","s":[[0,["Il m’a sauvé, il m’a sauvé","Bénis soit Son Nom.","Mon Sauveur","Sois loué à perpétuité."]],[0,["Dans Son amour, dans Son amour","Il m’a racheté","Mon Sauveur","Sois loué à perpétuité."]],[0,["Je Le suivrai, je Le suivrai","Toujours avec joie.","Mon Sauveur","Sois loué à perpétuité."]],[0,["Alléluia! Alléluia!","Bénis sois Son Nom","Mon Sauveur","Sois loué à perpétuité."]]]},{"n":200,"t":"Je L’aime (ter)","s":[[1,["Je L’aime (ter)","Jésus mon doux Sauveur","Je L’aime de tout mon cœur"]],[0,["Quand je suis ballotté,","Par les flots de la mer,","Lorsque la nuit m’environne,","Seigneur soit tout près de moi."]],[0,["Jésus mon seul ami,","Jésus mon seul appui,","Jésus mon seul soutien,","Seigneur soit tout près de moi."]]]},{"n":201,"t":"Jésus m’a tant aimé (bis)","s":[[0,["Jésus m’a tant aimé (bis)","Il a donné Sa vie pour moi","Jésus m’a tant aimé","Jésus m’a pardonné, (bis)","Tous mes péchés sont effacés","Jésus m’a pardonné."]],[0,["Jésus conduit mes pas. (bis)","Pendant mon voyage ici-bas,","Jésus conduit mes pas."]],[0,["Jésus revient bientôt, (bis)","Pour me donner le vrai repos,","Jésus revient bientôt."]]]},{"n":202,"t":"La victoire est à moi (bis)","s":[[0,["La victoire est à moi (bis)","Aujourd’hui j’ai la victoire","Dieu dit : Satan, tu as perdu","Aujourd’hui j’ai la victoire."]],[0,["La vraie paix est en moi (bis)","Aujourd’hui j’ai la vraie paix","Dieu dit : Satan, tu as perdu","Aujourd’hui j’ai la vraie paix"]]]},{"n":203,"t":"Non, non, non","s":[[1,["Non, non, non","Jamais ne passera","La parole de Dieu","Jamais ne passera"]],[0,["Si tu es pécheur","C’est toi qui passeras","La parole de Dieu","Jamais ne passera."]]]},{"n":204,"t":"Seigneur, attire mon cœur à Toi,","s":[[0,["Seigneur, attire mon cœur à Toi,","Je Te désire tout près de moi,","Ma délivrance dans le danger,","C’est Ta Présence, Divin Berger, (bis)"]],[0,["Par Ta puissance, brise, soumets","Ma résistance à tout jamais,","Courbe mon être, ma volonté,","Sois-en le Maître incontesté (bis)"]],[0,["Quand je contemple, près de Ta Croix,","Ton grand exemple, Jésus, mon Roi.","Ah ! je n’aspire qu’à m’immoler,","Tant je désire Te ressembler! (bis)"]],[0,["Prompt, je m’élance pour T’obéir,","Prompt, je m’avance pour Te servir;","Mais, sous Ton aile, loin du péché,","Sauveur fidèle, tiens-moi caché (bis)"]]]},{"n":205,"t":"Viens! Mon âme Te réclame,","s":[[0,["Viens! Mon âme Te réclame,","Car c’est Toi qui m’as cherché.","Pour Te suivre, je Te livre","Mon cœur avec son péché."]],[1,["Viens! Mon âme Te réclame,","Mon bonheur est tout en Toi.","Je T’adore, je T’implore;","O Jésus, demeure en moi!"]],[0,["Oui, Ta grâce seule efface","Toutes mes iniquités,","Tu pardonnes, Tu me donnes","La paix de Tes rachetés."]],[0,["Quand je doute, quand ma route","Passe auprès du tentateur,","Ta main sûre me rassure","Et me rend plus que vainqueur."]],[0,["Ah! Demeure à chaque heure,","Mon rempart, mon défenseur,","Ma victoire et ma gloire,","Mon Jésus, mon seul Sauveur!"]]]},{"n":206,"t":"Mon frère, quelle heure est-il à ton réveil ?","s":[[0,["Mon frère, quelle heure est-il à ton réveil ?","Sais-tu que le Seigneur va revenir ?","Prépare-toi pour cette Rencontre"]],[0,["Car dans peu de temps ce sera trop tard.","Ma sœur, quelle heure est-il à ton réveil ?","Sais-tu que le Seigneur va revenir ?","Prépare-toi pour cette Rencontre","Car dans peu de temps ce sera trop tard."]]]},{"n":207,"t":"Entends-tu? Jésus t’appelle;","s":[[0,["Entends-tu? Jésus t’appelle;","Viens, ô pêcheur, Il t’attend...","À cette voix si fidèle","Tu résistas trop souvent."]],[1,["Laisse entrer le Roi de gloire;","Ouvre ton cœur à Jésus!","Laisse entrer le Roi de gloire,","Hâte-toi, ne tarde plus."]],[0,["Pour le péché, pour le monde,","Tu trouves place en ton cœur...","Point pour le Sauveur du monde,","Rien pour l’Homme de douleur!"]],[0,["Jésus frappe, Il frappe encore; Ouvre à ton","Libérateur,","El pour toi luira l’aurore","Du véritable bonheur."]],[0,["Aujourd’hui, c’est jour de grâce;","Ne compte pas sur demain.","Pendant que ton Sauveur passe,","Saisis Sa puissante main!"]]]},{"n":208,"t":"C’est la joie (ter) du ciel","s":[[0,["C’est la joie (ter) du ciel","Qui déborde de mon cœur,","Gloire à mon Sauveur!","O vous qui n’avez pas cette joie","Voulez-vous venir, venir la recevoir;","O vous qui n’avez pas cette joie,","Voulez-vous venir aujourd’hui la recevoir.","Oh! La joie immense, infinie,","De donner à Jésus sa vie,","De pouvoir combattre","Et lutter jusqu’au bout;","D’avoir la victoire en tout et partout."]]]},{"n":209,"t":"Demain peut-être, je Te croirai,","s":[[0,["Demain peut-être, je Te croirai,","Et pour mon maître","Je Te prendrai.","Ainsi, quand Dieu l’invite,","L’âme répond: attends!","Ah! Pécheur, entre vite;","Viens, il est temps!"]],[0,["Demain, peut-être, plus de pardon!","Quoi! Méconnaître","Un pareil don!","Dieu t’offre, dans Sa grâce,","Le bonheur des élus;","Avant que l’heure passe,","Viens à Jésus!"]],[0,["Demain, peut-être, du châtiment","Tu vas connaître","L’affreux tourment.","Jésus t’appelle, Il t’aime,","Il est le seul Chemin;","Viens, c’est l’instant suprême!","Pourquoi demain?"]]]},{"n":210,"t":"Gémissant sous l’esclavage,","s":[[0,["Gémissant sous l’esclavage,","Dans la sombre nuit,","Amis, reprenez courage:","Déjà l’aube luit."]],[1,["Oh! Joyeuse espérance!","Voici la délivrance!","Nous connaissons la puissance","De notre grand Libérateur,","Et nous vous disons: Confiance!","Venez, donnez-Lui votre cœur!"]],[0,["Que de larmes, que de chutes","Dans la sombre nuit!","Voici la fin de vos luttes:","Déjà l’aube luit."]],[0,["Prenant en dégoût la vie,","Cœurs découragés!","Que pourrait votre énergie,","Pauvres naufragés?"]],[0,["Sans cesse à nouveau vaincue","Dans la sombre nuit,","Votre pauvre âme abattue","Ne croit plus en Lui…"]],[0,["Lui, qui fît tomber nos chaînes","Et nous affranchit,","Voit aussi vos luttes vaines","Dans la sombre nuit..."]]]},{"n":211,"t":"Dans ma misère et mon péché,","s":[[0,["Dans ma misère et mon péché,","O mon Sauveur, Tu m’as cherché.","Tel que je suis, je viens à Toi.","Seigneur, accepte-moi."]],[0,["J’ai faim, j’ai soif de Ton pardon,","Et je l’implore comme un don.","Tel que je suis, je viens à Toi.","Seigneur, pardonne-moi."]],[0,["Je ne saurais, Jésus, t’offrir","Qu’un pauvre cœur, las de souffrir.","Tel que je suis, je viens à Toi.","Seigneur, enrichis-moi."]]]},{"n":212,"t":"J’ai trouvé la paix profonde,","s":[[0,["J’ai trouvé la paix profonde,","J’ai trouvé le vrai bonheur,","Et la grâce comme une onde","A purifié mon cœur.","À la source des eaux pures,","J’ai puisé le plein pardon,","Et de toutes mes blessures","J’ai reçu la guérison."]],[1,["J’aimerais te voir mon frère,","Venir à ces vives eaux,","Jouir déjà sur la terre","D’un ciel si parfait, si beau!"]],[0,["Pour trouver la paix profonde,","Il te faut un cœur brisé,","Pour la grâce comme une onde,","Il faut l’esprit affligé.","Pour puiser aux sources pures,","Pour avoir entier pardon.","Prends la seule route sûre:","Au Calvaire est ta rançon."]],[0,["Sais-tu que la vie est belle","Sous le regard du Seigneur,","Et la jeunesse éternelle,","Avec Christ pour ton bonheur?","Avec Jésus plus de crainte,","Mourir, oh! C’est triompher!","Souffrir pour Jésus sans plainte,","C’est bien vers le ciel marcher."]],[0,["Quand, au bout de la carrière,","Nous nous verrons tous là-haut.","Te verrai-je alors, mon frère,","Heureux près des vives eaux?","Quand la parfaite harmonie","De ce monde merveilleux","Charmera l’âme ravie,","Seras-tu près de ton Dieu?"]]]},{"n":213,"t":"Bientôt le Seigneur va venir!","s":[[0,["Bientôt le Seigneur va venir!","Es-tu prêt?","Bientôt le ciel, Il veut t’ouvrir!","Es-tu prêt? Es-tu prêt?"]],[1,["Es-tu prêt? Es-tu prêt pour l’éternité?","Es-tu prêt ?","Es-tu prêt?Le Sauveur t’a-t-Il racheté?"]],[0,["Bientôt l’appel retentira!","Es-tu prêt?","Bientôt la mort te surprendra!","Es-tu prêt? Es-tu prêt?"]],[0,["Bientôt Jésus va te juger!","Es-tu prêt?","Oh! Devra-t-Il te condamner?","Es-tu prêt? Es-tu prêt?"]],[0,["Bientôt dans le ciel enlevés!","Es-tu prêt?","Tous les élus seront sauvés!","Es-tu prêt? Es-tu prêt?"]]]},{"n":214,"t":"Pourquoi donc attendre, mon frère?","s":[[0,["Pourquoi donc attendre, mon frère?","Ton Sauveur t’appelle aujourd’hui.","Lève-toi, sors de ta misère,","Il t’aime, H t’aime, viens à Lui."]],[1,["Pourquoi? Pourquoi?","Ne viens-tu pas aujourd’hui?","Pourquoi? Pourquoi?","Ne veux-tu donc pas de Lui"]],[0,["L'heure de ton salut s’envole;","Maintenant tu pourrais encore","Saisir Jésus qui seul console,","L'avoir, ce serait ton trésor."]],[0,["Ne sens-tu pas au fond de l’âme","La puissance de l’Esprit-Saint?","Ne veux-tu pas que de Sa flamme","Jésus te vivifie enfin?"]],[0,["Pourquoi refuses-tu, mon frère,","Quand la mort s’approche de toi?","Tandis que brille la lumière,","Viens à Jésus, viens à la croix."]]]},{"n":215,"t":"Viens, âme perdue,","s":[[0,["Viens, âme perdue,","Viens à ton Sauveur!","Vois Sa main tendue,","Saisis la sans peur.","C’est Lui qui t’invite;","Réponds à Sa voix:","Si ton cœur hésite,","Regarde à la croix!"]],[1,["Oui, la victoire, tu L’auras,","Et pour Sa gloire, tu vivras.","Jésus t’appelle: En avant!","Il est fidèle et puissant."]],[0,["Viens! Son sang expie","Ton iniquité,","Et donne la vie","Pour l’éternité,","Il meurt à ta place,","Il souffrit pour toi,","Accepte Sa grâce","Et dis avec foi:"]],[1,["Oui, la victoire Je l’aurai,","Et pour Sa gloire Je vivrai","Jésus m’appelle: En avant!","Il est fidèle et puissant."]],[0,["À Toi je veux être,","À Toi pour toujours!","Jésus sois mon Maître,","Ma paix, mon secours.","Ma seule espérance,","Mon unique bien,","Sois ma délivrance,","Mon ferme soutien !"]],[1,["Oui, la victoire, nous l’aurons,","Et pour Sa gloire, nous vivrons.","Une couronne nous attend;","Jésus la donne: en avant!"]]]},{"n":216,"t":"Viens à Jésus, Il t’appelle,","s":[[0,["Viens à Jésus, Il t’appelle,","Il t’appelle aujourd’hui.","Trop longtemps tu fus rebelle:","Aujourd’hui viens à Lui!"]],[0,["Jésus t’aime, (bis)","Jésus t’aime aujourd’hui.","Malgré ta misère extrême","Aujourd’hui viens à Lui!"]],[0,["Il pardonne, (bis)","Il pardonne aujourd’hui.","Reçois le salut qu’il donne,","Aujourd’hui viens à Lui!"]]]},{"n":217,"t":"Jésus est merveilleux, (ter)","s":[[0,["Jésus est merveilleux, (ter)","Il est mon Dieu.","Il est le Tout-Puissant,","Créateur omniscient,","Son nom est Merveilleux,","Il est mon Dieu.","Il est mon Berger,","Du temps le Rocher,","Le Dieu d’éternité.","A genoux devant Lui,","Oui, nous nous prosternons,","Adorons et prions Jésus, Jésus."]]]},{"n":218,"t":"Sans un Dieu puissant pour Père,","s":[[0,["Sans un Dieu puissant pour Père,","Que ferez-vous? Que ferez-vous?","Sans un Dieu Sauveur pour Frère,","Que ferez-vous? Que ferez-vous?","Pécheurs, l’âme est immortelle,","Sans Dieu que deviendra-t-elle?","Voici l’heure solennelle:","Que ferez-vous? Que ferez-vous?"]],[0,["Possédez-vous un refuge?","Que ferez-vous? Que ferez-vous?","En présence du grand Juge.","Que ferez-vous? Que ferez-vous?","Vieillards que la mort talonne,","Jeunes gens que rien n’étonne,","Pécheurs que la mort moissonne,","Que ferez-vous? Que ferez-vous?"]],[0,["Frères, reprenez courage,","Espérez tous! Espérez tous!","Jésus apporte un message,","Il est pour vous. Il est pour vous.","Que la mort se change en fête,","Christ a payé votre dette!","Pour célébrer Sa conquête,","Unissons-nous et chantons tous:","Par l’amour de Dieu le Père,","Je suis sauvé! Je suis sauvé!","Par le Sang de Christ, mon Frère,","Je suis lavé! Je suis lavé!","Plus de douleur, plus de plainte,","Plus de chagrin, de contrainte,","Chante, mon cœur! Sois sans crainte!","Je suis sauvé! Je suis sauvé!"]]]},{"n":219,"t":"Quelle nouvelle:","s":[[0,["Quelle nouvelle:","Jésus est Puissant pour sauver!","Quelle nouvelle:","Jésus veut pardonner!"]],[0,["Quelle nouvelle:","Dans Son amour sans limite,","Quelle nouvelle:","Qu’Il ait fait cela pour moi!"]],[1,["Pour moi, pour moi, (bis)","Une place est déjà préparée.","Je suis vainqueur (bis)","Par le Sang précieux de Jésus!"]]]},{"n":220,"t":"Viens à la Croix, âme perdue,","s":[[0,["Viens à la Croix, âme perdue,","Brebis sans berger;","Tu verras une main tendue","Pour te sauver."]],[0,["Viens à la Croix, âme souillée,","Pécheur repentant;","Là tu seras purifiée","En un instant."]],[0,["Viens à la Croix, âme chargée","De pesants fardeaux;","Là tu trouveras, soulagée,","Le vrai repos."]],[0,["Viens à la Croix, âme affaiblie,","Chrétien chancelant;","Là se trouvent force, énergie,","Secours puissant."]],[0,["Viens à la Croix, âme assiégée","Par le Tentateur;","Là ta victoire est assurée","Dans le Seigneur."]],[0,["Dans tes soucis, tes deuils, tes larmes,","Entends cette voix","Qui te dit: Viens dans tes alarmes,","Viens à la Croix!"]]]},{"n":221,"t":"Oh! viens à Moi, ton Sauveur et ton Frère,","s":[[0,["Oh! viens à Moi, ton Sauveur et ton Frère,","Je donnerai, pèlerin, à ton cœur,","Tous mes Trésors au lieu de ta misère","Et mon Repos au sein de ton labeur!"]],[1,["Oh! viens à Moi! (ter)","Mon Repos est pour toi. (ter)"]],[0,["La Paix pour toi, et plus d’inquiétude!","Tous tes péchés, oh! viens les déposer","Devant la Croix, remède à toute chute,","Viens sur Mon Cœur, enfin, te reposer!"]],[1,["Oh! viens à Moi! (ter)","Ma Paix, elle est pour toi. (ter)"]],[0,["Accours vers Moi, si tu te sens coupable,","Si du péché tu crains le châtiment,","Ne sais-tu pas, vérité redoutable,","Qu’après la mort suivra le Jugement?"]],[1,["Oh! viens à Moi! (ter)","Mon Pardon est pour toi. (ter)"]],[0,["Elle est pour toi, Ma Joie impérissable!","Il est pour toi, Mon merveilleux Amour!","Elle est à toi, la Source intarissable","De tous Mes Biens si tu viens en ce jour!"]],[1,["Oh! viens à Moi! (ter)","Tous mes Biens sont pour toi. (ter)"]]]},{"n":222,"t":"On frappe! On frappe! entends-tu?","s":[[0,["On frappe! On frappe! entends-tu?","Passant, qui donc cherches-tu?","Pourquoi, voyageur étrange,","À ma porte es-tu venu?","N’es-tu pas quelque saint ange","Sur la terre descendu?"]],[0,["C'est Moi, c’est Moi, ton Sauveur!","Je veux entrer dans ton cœur.","Pourquoi me laisser attendre?","Ouvre, c’est un bienfaiteur.","Qui chez toi s’offre à répandre","Tous les trésors du bonheur."]],[0,["Vraiment! Vraiment! C’est Sa voix;","C’est Lui! C’est Lui! Je Le vois.","Oh! Ta grâce est la plus forte,","Mon Sauveur, je Te reçois!","Je ne puis fermer la porte,","Quand Tu me montres Ta croix."]]]},{"n":223,"t":"Quelqu’un frappe à votre porte:","s":[[0,["Quelqu’un frappe à votre porte:","Ouvrez-Lui! Ouvrez aujourd’hui!","C’est le Ciel qu’il vous apporte:","Ouvrez-Lui, Ouvrez aujourd’hui!"]],[1,["Chez vous Il veut prendre place;","Ouvrez avant qu’il se lasse!","Le temps presse, le temps passe;","Ouvrez- Lui! Ouvrez aujourd’hui!"]],[0,["Ouvrez! C’est Lui qui pardonne:","Ouvrez-Lui! Ouvrez aujourd’hui!","Acceptez tout ce qu’il donne:","Ouvrez-Lui! Ouvrez aujourd’hui!"]],[1,["Sa main va briser vos chaînes;","Ses promesses sont certaines;","Bientôt finiront vos peines;","Ouvrez-Lui! Ouvrez aujourd’hui!"]],[0,["Seul Il ôte les souillures:","Ouvrez-Lui! Ouvrez aujourd’hui!","Seul Il guérit les blessures:","Ouvrez-Lui! Ouvrez aujourd’hui!"]],[1,["Quand la mort va vous surprendre","Seul Il pourra vous défendre,","Et sous Son aile vous prendre:","Ouvrez-Lui! Ouvrez aujourd’hui!"]],[0,["Écoutez l’appel si tendre!","Ouvrez-Lui! Ouvrez aujourd’hui!","C’est assez Le faire attendre;","Ouvrez-Lui! Ouvrez aujourd’hui!"]],[1,["Le Roi des rois vous implore:","Qui peut résister encore?","Oh! Que votre âme L’adore!","Ouvrez-Lui! Ouvrez aujourd’hui!"]]]},{"n":224,"t":"Oh! Alléluia, quelle joie, car Jésus vit! (bis)","s":[[0,["Oh! Alléluia, quelle joie, car Jésus vit! (bis)","Oh! Alléluia, quelle joie, car Jésus vit en moi.","Oh! Alléluia, quelle joie, car Jésus vit!"]],[0,["Je suis heureux, Jésus vit en moi (ter)","Chante gloire et alléluia! Jésus vit en moi!"]]]},{"n":225,"t":"Ô toi qui souffres solitaire,","s":[[0,["Ô toi qui souffres solitaire,","Dieu te cherche dans cet instant,","Toi qui gémis dans ta misère,","Dieu te cherche et Son cœur t’attend."]],[1,["Dieu te cherche, (bis)","Dieu te cherche pour te guérir.","Dieu te cherche, (bis)","Dieu te cherche, veux-tu venir?"]],[0,["Et si ton âme est altérée,","Dieu te cherche pour l’abreuver;","Si du péché tu l’as souillée,","Dieu te cherche pour la sauver."]],[0,["Si ton cœur désire la vie,","Dieu te cherche, Il est éternel;","Si tu veux la gloire infinie,","Dieu te cherche, Il t’ouvre le ciel."]],[0,["Ouvre donc ton cœur à la grâce,","Dieu te cherche, viens donc à Lui.","Oh! N’attends pas que ce jour passe,","Dieu te cherche, viens aujourd’hui!"]]]},{"n":226,"t":"Bien loin de toi mon Père,","s":[[0,["Bien loin de toi mon Père,","J’ai dissipé mes biens;","Dans ma douleur amère,","Je reviens, je reviens…"]],[0,["Vois, mon âme souffrante,","Et mon corps épuisé;","Saisis ma main tremblante,","Guéris mon cœur brisé!"]],[0,["La honte et la misère","Ont sillonné mon front;","J’ai péché, tendre Père,","J’implore Ton pardon!"]],[0,["Non je ne suis pas digne","D’être appelé Ton fils;","De Tes grâces, indigne,","J’ai méconnu le prix."]],[0,["Traite-moi, je Te prie,","Comme Ton serviteur;","Mon passé m’humilie,","Grâce pour moi, pécheur!"]],[0,["...Mais que vois-je à cette heure?","Père, ô Père, c’est Toi!","Du seuil de Ta Demeure","Tu t’avances vers moi!"]],[0,["O bonheur! Tu me donnes","Le baiser paternel,","O bonheur! Tu pardonnes:","Et Tu m’ouvres le Ciel!"]]]},{"n":227,"t":"Où cherchez-vous le bonheur,","s":[[0,["Où cherchez-vous le bonheur,","Dans ce monde où tout passe?","Avez-vous dans votre cœur,","Pour Jésus une place?","À votre porte Il se tient.","Sans se lasser Il revient...","Pour Jésus votre Sauveur,","N’avez-vous point de place?"]],[1,["N’avez-vous point de place?","N’avez-vous point de place?","Pour Jésus, votre Sauveur,","N’avez-vous point de place?"]],[0,["S’il a souffert, c’est pour vous,","Oh! merveilleuse grâce!","Lorsqu’il luttait à genoux,","Dieu Lui voilant Sa Face!","Ah! de Sa sublime croix.","N’entendez-vous pas la voix","Qui vous dit: Pauvre pécheur,","N’as-tu donc point de place?"]],[1,["N’avez-vous point de place?","N’avez-vous point de place?","Ah! Pour l’Homme de douleur","N’avez-vous point de place?"]],[0,["Si le monde a votre cœur,","Croyez-vous donc qu’il fasse","Jusqu’au bout votre bonheur?","Vous savez que tout passe.","Oh! pendant qu’il en est temps,","Écoutez les doux accents","De la voix du grand Vainqueur,","Et faites-Lui donc place!"]],[1,["N’avez-vous point de place?","N’avez-vous point de place?","Pour Jésus, le grand Vainqueur,","N’avez-vous point de place?"]]]},{"n":228,"t":"Seigneur nous voulons Te remercier","s":[[0,["Seigneur nous voulons Te remercier","Pour cette merveilleuse journée","Car pour nous maintenant","Qu’il pleuve, ou neige, ou fasse grand vent.","La joie qui est dans nos cœurs","Est comme le soleil qui est au zénith.","Entouré de mes frères et sœurs","Je veux glorifier Ton Nom.","Que Ton Nom soit sanctifié (ter) Seigneur.","Que Ton Nom soit glorifié (ter) Seigneur."]]]},{"n":229,"t":"Qu’Il soit ton espérance,","s":[[0,["Qu’Il soit ton espérance,","Bons comme mauvais jours.","Qu’Il soit dans la souffrance,","Ton unique recours.","Dis-Lui, dis-Lui toutes tes peines ;","Remets-Lui tes douleurs.","Il a brisé tes chaînes,","Il séchera tes pleurs,","C’est la devise des disciples de Jésus."]]]},{"n":230,"t":"Où trouver une retraite,","s":[[0,["Où trouver une retraite,","Où trouver un sûr abri,","Quand, du sein de la tempête,","Dieu me parle au Sinaï?","Vois la mort que j’ai soufferte","Pour devenir ton Sauveur!","Entre par la plaie ouverte","Et cache-toi dans Mon cœur!"]],[0,["Quelle cité de refuge","S’offre pour l’homme perdu,","Quand fuyant devant son Juge,","Il tremble et pleure, éperdu?","Vers moi, sans repos ni trêve,","Accours, c’est ton seul espoir!","Mon cœur, qu’a percé le glaive,","S’ouvre pour te recevoir."]],[0,["Quand il faudra rendre compte,","O Dieu! qui T’affrontera?","Ou cacherais-je ma honte,","Quand Ton œil me sondera?","Si tu veux fuir ma colère,","Cache-toi dans Mon amour!","Approche-toi du Calvaire,","Et ne crains plus le grand Jour."]],[0,["Mais mes fautes, plus nombreuses","Que le sable au bord des mers,","Rendent mes nuits trop affreuses","Et mes regrets trop amers!","Pauvre âme, sois rassurée!","Mon Sang, à flots épanché,","Couvre, comme une marée,","De sable de ton péché,"]],[0,["À son banquet misérable","Le monde m’appelle en vain.","Oh! fais-moi place à Ta table,","Et donnes-moi de Ton pain!","Prends! Je suis le pain de vie.","Prends ta place à ce festin","Où Dieu même te convie,","Et qui n’aura point de fin."]]]},{"n":231,"t":"Je me repose sur le Dieu","s":[[0,["Je me repose sur le Dieu","Grand et fort","C’est Lui qui me conduit","Assure mes pas jusqu’au port"]],[0,["Je lève mes mains","Pour célébrer Ta gloire","Dieu Tout-Puissant","Nul n’est comme Toi"]]]},{"n":232,"t":"O vous qui n’avez pas la paix,","s":[[0,["O vous qui n’avez pas la paix,","Venez, Jésus la donne,","Pure, profonde et pour jamais:","Venez, Jésus pardonne."]],[1,["Quand Jésus remplit un cœur,","Il déborde de bonheur,","Et l’effroi ne l’atteint plus:","Gloire, gloire à Jésus!"]],[0,["Vous qui tombez à chaque pas,","Venez, Jésus délivre;","Celui qui se jette en Ses bras","Peut à toujours Le suivre."]],[1,["Quand Jésus remplit un cœur,","Il déborde de bonheur,","Car il ne chancelle plus.","Gloire, gloire à Jésus!"]],[0,["Vous qui tremblez sous la terreur","Que la mort vous inspire,","Venez, votre Libérateur","À détruit son empire!"]],[1,["Avec Lui nous revivrons","Avec Lui nous régnerons,","Et la mort ne sera plus:","Gloire, gloire à Jésus!"]]]},{"n":233,"t":"Venez, cœurs souffrants et meurtris,","s":[[0,["Venez, cœurs souffrants et meurtris,","Au médecin de l’âme.","Par Jésus vous serez guéris;","Que votre voix l’acclame:"]],[1,["Nom célébré par les élus,","Adoré par les anges,","Thème éternel de nos louanges,","Jésus! Jésus! Jésus!"]],[0,["En Christ nous sommes pardonnés;","C’est la Bonne Nouvelle,","Par Lui les cieux nous sont donnés,","Et la vie éternelle,"]],[0,["Vous tous qui souffrez isolés,","Venez, Jésus vous aime;","Pour le troupeau des désolés","Il s’est offert Lui-même."]],[0,["D’un seul cœur, d’une seule voix,","Exaltons Sa victoire;","Et, dans le ciel, du Roi des rois","Nous redirons la gloire."]]]},{"n":234,"t":"Pécheur, qui t’appelle ainsi?","s":[[0,["Pécheur, qui t’appelle ainsi?","La voix maternelle","Est moins douce: viens ici,","Sous Mon aile!"]],[0,["Toi que le mal a meurtri","Pauvre cœur rebelle,","Accours! Tu seras guéri","Sous Mon aile."]],[0,["Car qui touche à l’un des miens","Touche à Ma prunelle;","Heureux celui que Je tiens","Sous Mon aile."]],[0,["Là tu verras les clartés","De l’aube immortelle:","Il n’est point d’obscurités","Sous Mon aile."]],[0,["Ce trésor longtemps cherché:","La vie éternelle,","Tu le trouveras caché","Sous Mon aile!"]],[0,["Ô Jésus! qu’à Ton amour","Je reste fidèle;","Garde-moi de jour en jour","Sous Ton aile;"]],[0,["Et quand sonnera pour moi","L’heure solennelle,","Que je m’endorme avec Toi","Sous Ton aile!"]]]},{"n":235,"t":"Par ce chemin solitaire,","s":[[0,["Par ce chemin solitaire,","Voyageur où courez-vous?","Vers une nouvelle terre,","Que Dieu prépara pour nous.","Par-delà plaines et cimes,","Vers ces demeures sublimes, (bis)","Amis, venez avec nous!","Vers ces demeures sublimes,","Amis, venez avec nous!"]],[0,["Dans cette terre nouvelle,","Voyageurs qu’espérez-vous?","Une couronne immortelle,","Que Christ mérita pour nous.","Là toujours en Sa présence,","Plus de larmes, de souffrances, (bis)","Amis, venez avec nous!","Plus de larmes, de souffrances,","Amis, venez avec nous!"]],[0,["Bien faible est votre cortège.","Quels dangers affrontez-vous?","Le Tout-Puissant nous protège","Et Son Ange est avec nous","L’Éternel est notre égide;","Nous avons Jésus pour guide, (bis)","Amis, venez avec nous!","Nous avons Jésus pour guide;","Amis, venez avec nous!"]],[0,["Trouverons-nous de la place?","Ce bonheur est-il pour nous?","Venez! en ce jour de grâce,","Le ciel est ouvert pour tous.","A la source de la vie","Dieu Lui-même vous convie, (bis)","Amis, venez avec nous!","Dieu Lui-même vous convie;","Amis, venez avec nous!"]]]},{"n":236,"t":"Bientôt ce sera la grande fête dans le ciel","s":[[0,["Bientôt ce sera la grande fête dans le ciel","Tous les élus se rassembleront,","Ils sortiront de tous les âges,","Ils couronneront le Roi du ciel et de la terre","Des cris retentiront dans le ciel,","Gloire à l’Agneau!"]],[0,["Pendant ce temps toute la terre sera en flammes","Tous les rebelles souffriront,","Tous ceux qui ont foulé aux pieds,","Le Sang que le Seigneur Jésus","A versé pour le monde.","Ils périront et aucun d’eux n’échappera."]]]},{"n":237,"t":"Publiez bien haut la grande nouvelle:","s":[[0,["Publiez bien haut la grande nouvelle:","Le ciel est ouvert à tout être humain.","La route est tracée, un Guide fidèle","Vous conduira par la main."]],[1,["Le salut pour tous, le salut par grâce,","À tous est offert, à tous est donné.","Oh! venez, pécheurs, venez, le temps passe.","Et vous serez pardonnés."]],[0,["Publiez bien haut la grande nouvelle:","Le sang de Jésus a tout effacé.","Où que vous soyez, c’est vous qu’il appelle,","Vous qui L’avez offensé."]],[0,["Publiez bien haut la grande nouvelle:","Au loin comme au près, faites-la courir,","Partout où se trouve une âme rebelle,","Un pécheur à secourir."]]]},{"n":238,"t":"Reçois favorablement,","s":[[0,["Reçois favorablement,","Les paroles de ma bouche,","Et les sentiments de mon cœur","Oh! Seigneur","Oh! Seigneur (bis)","Mon Rocher (bis)","Oh! Seigneur (bis)","Mon Guide, (bis)"]]]},{"n":239,"t":"Ô Christ, éternel Rocher,","s":[[0,["Ô Christ, éternel Rocher,","Je viens en Toi me cacher!","De Ton cœur percé coulèrent","L’eau, le Sang qui régénèrent:","Que par ce flot rédempteur","Du péché je sois vainqueur!"]],[0,["Tous les travaux de mes mains","Pour Te plaire seraient vains,","Lors même qu’en ma détresse,","Mes pleurs couleraient sans cesse,","Ils ne sauraient me laver:","Toi seul peux et veux sauver!"]],[0,["Seigneur, je n’apporte rien,","Ta Croix seule est mon soutien.","Je viens à Toi sans ressource;","Souillé, je viens à la source","Ouverte pour les pécheurs:","Ah! Rends-moi pur, ou je meurs!"]],[0,["Tant que je respire encor;","Quand pour moi viendra la mort;","Lorsque je devrai paraître","Devant mon Juge et mon Maître,","Ô Christ, éternel Rocher,","Je veux en Toi me cacher!"]]]},{"n":240,"t":"Que devient mon enfant ce soir?","s":[[0,["Que devient mon enfant ce soir?","Il suit une sombre voie,","Lui qui faisait tout mon espoir","Et ma couronne de joie."]],[1,["Cherchez mon enfant ce soir!","Cherchez mon enfant ce soir!","Mon cœur est plein, je veux le revoir.","Cherchez mon enfant ce soir!"]],[0,["Tout jeune encor, je crois le voir,","Lorsque, fervent et sincère,","Il disait à Dieu chaque soir","Son enfantine prière."]],[0,["Je le revois, plus grand, plus fort,","Lorsqu’aux jours de sa jeunesse,","Son cœur était candide encor","Et pour moi plein de tendresse."]],[0,["Oh! Qui me rendra mon enfant","Comme autrefois plein de charmes?","Je veille et pleure en l’attendant:","Cherchez le fils de mes larmes."]],[0,["Combien J’ai soif de te revoir,","Mon enfant! Combien Je t’aime!","Oh! Dans Mes bras reviens, ce soir;","Entends Mon appel suprême."]],[1,["Reviens, mon enfant, ce soir (bis)","Mon cœur est plein! Je veux te revoir.","Reviens, mon enfant, ce soir!"]]]},{"n":241,"t":"Dans le monde entier,","s":[[0,["Dans le monde entier,","Le Saint-Esprit agit.","Dans le monde entier","Comme le prophète l’a dit."]],[0,["Dans le monde entier,","Jésus Christ repend Sa gloire,","Remplissant tout l’univers,","Comme l’eau remplit les océans."]]]},{"n":242,"t":"Si tu es toujours tourmenté,","s":[[0,["Si tu es toujours tourmenté,","Si tu es toujours abattu","Si énormément tu es tenté,","Lève les yeux vers Jésus","Le Seigneur, ton Sauveur,","Assis à la droite du Père,","Intercède en ta faveur,","Pour bannir ta misère","Et te donner la paix du cœur."]],[1,["Jamais plus, tu ne chancelleras","Quand l’Espoir viendra à te manquer","Il est Celui qui ne saura","Te laisser ou t’abandonner"]],[0,["Ne pense pas un seul instant","Parce que tu as tout essayé","Que Jésus est aussi au rang","De ceux qui t’ont toujours trompé.","Détourne ton regard de ton mal","Tiens ton cœur dans le calme","Dis-Lui : « Seigneur, ça va mal »","Et tu constateras toi-même","Qu’Il est toujours le Même."]]]},{"n":243,"t":"Je veux compter sur Ta grâce","s":[[0,["Je veux compter sur Ta grâce","Seigneur pour aller plus loin","Je veux compter sur Ta face","Pour éclairer mon chemin.","O Jésus, rends Ta victoire","Toute entière sur mon cœur","Pour que je vive à Ta gloire","Et que je marche en vainqueur."]]]},{"n":244,"t":"Chaque instant de chaque jour qui passe,","s":[[0,["Chaque instant de chaque jour qui passe,","En Jésus je puis me confier ;","Cet ami que jamais rien ne lasse,","Me soutient, sait me vivifier."]],[1,["Et Son cœur si patient, si tendre","Sait pourvoir aux besoins de ma foi;","À Lui seul, j’ai appris à m’attendre","Et je sais qu’il s’occupe de moi."]],[0,["Aide-moi à n’avoir confiance,","Qu’en Toi seul, mon maître, mon Seigneur.","Tu connais toutes mes défaillances ;","Mon salut est seul en Ta faveur."]],[0,["Prends ma main, tiens-moi quand je chancelle ;","Le chemin est sombre et rocailleux.","Oh! Permets que je Te sois fidèle,","Conduis-moi jusqu’au séjour des deux."]]]},{"n":245,"t":"Sais-tu que j’ai trouvé","s":[[0,["Sais-tu que j’ai trouvé","Un magnifique trésor","Qui me vaut beaucoup plus","Que l’argent et l’or","C’est que Dieu m’aime tant","Qu’Il donna Son Fils unique","En croyant en Son Nom","J’ai le plein pardon"]],[0,["Veux-tu de ce Jésus ?","Ce magnifique Trésor.","Qui te vaut beaucoup plus","Que l’argent et l’or","C’est que Dieu t’aime tant","Qu’Il donna Son Fils unique","En croyant en Son Nom","Tu as le plein pardon"]]]},{"n":246,"t":"Pécheur, je voudrais te guérir;","s":[[0,["Pécheur, je voudrais te guérir;","J’ai vu tes larmes, ta souffrance,","Mais pour avoir la délivrance,","Il faut apprendre à M’obéir.","Voici, Je me tiens à la porte,","Je suis ton Maître et ton Sauveur;","C’est le bonheur que je t’apporte:","Ne veux-tu pas M’ouvrir ton cœur?"]],[0,["Sais-tu que Je suis né pour toi,","Que pour toi J’ai donné ma vie?","Ton cœur est-il l’hôtellerie","Sans place, même pour ton Roi?","Souvent, année après année,","Chez toi, J’ai frappé, mais en vain.","Voici le soir de la journée,","Ne veux-tu pas m’ouvrir enfin?"]],[0,["N’auras-tu pas besoin de moi.","Bientôt, dans la nuit éternelle?","Dès aujourd’hui, viens sous Mon aile,","Je serai tout, oui, tout pour toi.","Le temps rapidement t’emporte;","Pourquoi renvoyer à demain?","Trop tard, un jour, devant Ma porte,","Tu frapperas peut-être, en vain..."]],[0,["Si tu n’as pas besoin de Moi,","Écoute, obéis sans comprendre,","Jusques à quand devrai-je attendre?","Ton Seigneur a besoin de toi.","Voici, Je me tiens à ta porte.","Je suis ton Maître et ton Sauveur;","C’est le bonheur que je t’apporte;","Ne veux-tu pas m’ouvrir ton cœur?"]]]},{"n":247,"t":"Si vous saviez quel Sauveur je possède!","s":[[0,["Si vous saviez quel Sauveur je possède!","Il est l’ami le plus tendre de tous;","Pour moi devant le Père, Il intercède:","Oh! je voudrais qu’il fût aussi pour vous!"]],[1,["Mon Sauveur vous aime;","Ah! Cherchez en Lui","Votre ami suprême","Votre seul appui!"]],[0,["Si vous saviez la paix douce et profonde","Que le Sauveur en mon âme apporta!","Pour cette paix, que peut donner le monde","Elle jaillit pour vous de Golgotha."]],[0,["Si vous saviez quelle douce espérance","Le Dieu de paix fait rayonner des cieux!","Combien Sa voix sait calmer la souffrance","Et Son regard rendre le cœur joyeux!"]],[0,["Quand vous saurez combien Jésus vous aime","Quand vous saurez combien Son joug est doux,","Ne gardez pas ce trésor pour vous-même,","Mais avec moi dites autour de vous:"]]]},{"n":248,"t":"Apporte sur le Calvaire","s":[[0,["Apporte sur le Calvaire","Tes pesants fardeaux,","Là, tu trouveras, mon frère,","Le repos."]],[0,["C’est Moi, c’est Moi qui console!","Quelle est cette voix?","D’où viens-tu, douce parole?","De la croix!"]],[0,["Regarde Ma main percée,","Mon côté sanglant,","Pour toi, pauvre âme angoissée,","Cœur tremblant!"]],[0,["Voilant Mes splendeurs divines","Sous l’horrible affront,","Pour toi saignent les épines","Sur Mou front!"]],[0,["Ah! Quand même, pour te suivre,","Il faille souffrir,","Pour toi, Sauveur, je veux vivre","Et mourir!"]],[0,["Car Tu soutiendras ma tête","Dans les grandes eaux,","M’ouvrant, après la tempête,","Le repos!"]]]},{"n":249,"t":"Tout l’or, tout l’argent de ce monde","s":[[0,["Tout l’or, tout l’argent de ce monde","Ne pourront me rendre heureux.","Tous les biens d’ici-bas réunis","Ne pourront me rendre heureux.","La paix, la joie sont en Jésus","Lui seul est tout mon bonheur.","Sans Lui ma vie n’a aucun sens.","Lui seul est tout mon trésor."]]]},{"n":250,"t":"Homme dans ta jeunesse","s":[[0,["Homme dans ta jeunesse","Tu compteras beaucoup d’amis.","Quand viendra le jour,","De ton départ ils te fuiront.","Prépare-toi une bourse au ciel","Où sera éternellement ton siège","Sois moins vaniteux,","Un jour viendra où tu mourras."]]]},{"n":251,"t":"Souviens-toi du Calvaire,","s":[[0,["Souviens-toi du Calvaire,","De l’angoisse à la croix,","Du combat solitaire,","Qu’Il a livré pour toi."]],[1,["Cède, cède ton cœur à ton Sauveur,","Cède, cède, ton cœur à ton Sauveur."]],[0,["Souviens-toi des épines.","Blessant son noble front,","Des compassions divines","Supportant chaque affront."]],[0,["Pense à Son agonie,","Pour toi, pauvre pécheur;","Sa tendresse infinie","Devrait briser ton cœur."]],[0,["Crois, oh! Crois à Sa grâce,","Ne désespère plus;","Jésus a pris ta place,","Tous par Lui sont reçus."]],[0,["Enlève ma misère,","Enlève mon péché...","Toute douleur amère,","Et tout fardeau caché!"]]]},{"n":252,"t":"Viens au Père qui t’appelle,","s":[[0,["Viens au Père qui t’appelle,","Oh! Reviens à la maison!","Voici l’heure est solennelle,","Où Dieu t’offre Son pardon."]],[1,["Aujourd’hui viens à Lui!","Ah! Pourquoi tarderais-tu?","Aujourd’hui, viens à Lui!","Viens, reçois Son grand salut!"]],[0,["Trop longtemps, dans la misère,","Tu vécus sans vrai bonheur!","Se peut-il que tu préfères","Fuir encor loin du Sauveur?"]],[0,["Ah! ton âme est angoissée,","En vain tu cherchas la paix;","Par Sa croix qui fut dressée,","Christ la donne, et pour jamais."]],[0,["À Jésus dis ta souffrance,","Parle-Lui de ton péché,","Mets en Lui ton espérance,","Car en Lui Dieu t’a cherché."]]]},{"n":253,"t":"Venez à Celui qui pardonne","s":[[0,["Venez à Celui qui pardonne","Aux pécheurs qui n’espéraient plus!","C’est aux plus pauvres qu’il se donne","Il peut sauver les plus perdus","Son Sang, répandu pour le monde,","Peut seul effacer et blanchir","Ce que l’océan, sous Son onde,","Ne ferait pas même pâlir!"]],[0,["Venez à Celui qui relève","Ceux qu’on vit descendre si bas","Que leur salut paraît un rêve","Dont on rît et qu’on ne croit pas.","Sur la pécheresse qui pleure","Il imprima Son sceau divin","Le brigand, à la dernière heure,","N’implora pas Sa grâce en vain."]],[0,["Venez à Celui qui console","Les inconsolables douleurs:","Venez apprendre à Son école","L’art divin de sécher les pleurs.","Comme Il a répandu des larmes,","Il peut aussi les essuyer;","Et la douleur Lui rend les armes,","Car Il a souffert le premier."]]]},{"n":254,"t":"S’il faut traverser le brûlant désert,","s":[[0,["S’il faut traverser le brûlant désert,","Dieu sait le chemin d’avance.","S’il faut traverser le brûlant désert,","Je suis plein de confiance.","Et chaque jour, de Son Amour,","J’ai la parfaite assurance.","S’il faut traverser le brûlant désert","Je suis plein de confiance."]]]},{"n":255,"t":"Jésus revient (bis)","s":[[0,["Jésus revient (bis)","Pour chercher Son Épouse","Jésus revient (bis)","Il ne tardera plus.","As-tu porté ? (bis)","Ta robe de noces ?","Il est minuit, (bis)","Le cri va retentir.","Bien-aimé frère ;","Bien-aimée sœur","T’es-tu préparé ?","La cloche sonne (bis)","Pour le rassemblement","Seigneur, aide nous à nous préparer","Pour aller à Ta rencontre dans les airs."]]]},{"n":256,"t":"Je lève les yeux vers les montagnes","s":[[0,["Je lève les yeux vers les montagnes","D’où me viendra le secours.","Le secours me vient de l’Éternel,","Qui a fait les cieux et la terre.","Je bénirai Jésus (bis)","Je bénirai de tout mon cœur","Je bénirai de tout mon cœur Jésus.","Alléluia ! Mon Dieu est bon (ter)","Il est bon pour moi."]]]},{"n":257,"t":"Dans vos tourments, vos tentations,","s":[[0,["Dans vos tourments, vos tentations,","Où trouverez-vous un asile sûr ?","Ne doutez plus mais croyez et","Venez à Jésus source de vie.","Oh! Hâtez-vous ne craignez pas","Croyez seulement.","Votre foi vous fera triompher.","Oh! Ne doutez plus, ne doutez plus","Mais croyez et venez","A Jésus source de vie."]]]},{"n":258,"t":"Tel que je suis, sans rien à moi,","s":[[0,["Tel que je suis, sans rien à moi,","Sinon Ton Sang versé pour moi","Et Ta voix qui m’appelle à Toi,","Agneau de Dieu, je viens, je viens!"]],[0,["Tel que je suis, bien vacillant,","En proie au doute à chaque instant,","Lutte au dehors, crainte au-dedans,","Agneau de Dieu, je viens, je viens!"]],[0,["Tel que je suis. Ton Cœur est prêt","À prendre le mien tel qu’il est,","Pour tout changer, Sauveur parfait!","Agneau de Dieu, je viens, je viens!"]],[0,["Tel que je suis. Ton grand Amour","A tout pardonné sans retour.","Je veux être à Toi dès ce jour;","Agneau de Dieu, je viens, je viens!"]]]},{"n":259,"t":"Miséricorde insondable!","s":[[0,["Miséricorde insondable!","Dieu peut-Il tout pardonner?","Absoudre un si grand coupable,","Et mes péchés oublier?"]],[1,["Jésus, je viens! Je viens à Toi!","Tel que je suis, je viens à Toi!","Jésus, je viens! Je viens à Toi!","Tel que je suis, prends-moi."]],[0,["Longtemps j’ai, loin de Sa face,","Provoqué Son saint courroux,","Fermé mon cœur à Sa grâce,","Blessé le Sien devant tous."]],[0,["Ô Jésus! à Toi, je cède,","Je veux être libéré;","De tout péché qui m’obsède","Être à jamais délivré."]],[0,["Alléluia! plus de doute,","Mon fardeau m’est enlevé;","Pour le ciel je suis en route,","Heureux pour l’éternité."]]]},{"n":260,"t":"Tel que je suis, pécheur rebelle,","s":[[0,["Tel que je suis, pécheur rebelle,","Au nom du Sang versé pour moi,","Au nom de Ta voix qui m’appelle,","Jésus, je viens à Toi!"]],[0,["Tel que je suis, dans ma souillure,","Ne cherchant nul remède en moi,","Ton Sang lave mon âme impure:","Jésus, je viens à Toi!"]],[0,["Tel que je suis, avec mes luttes,","Mes craintes, ma timide foi,","Avec mes doutes et mes chutes,","Jésus, je viens à Toi!"]],[0,["Tel que je suis, je me réclame","De Ta promesse, par la foi;","Au ciel Tu recevras mon âme:","Jésus, je viens à Toi!"]],[0,["Tel que je suis, Ton sacrifice","À ma place accomplit la loi;","Justifié par Ta justice,","Jésus, je viens à Toi!"]],[0,["Tel que je suis, Dieu me convie,","Ô mon Sauveur, pour être à Toi,","A Toi dans la mort, dans la vie.","Jésus, je viens à Toi!"]]]},{"n":261,"t":"Agneau de Dieu,","s":[[0,["Agneau de Dieu,","Messager de la grâce,","Je veux entendre Ta voix,","Le langage de la croix:","Pour toi Je fus livré,","Méprisé, maltraité,","Battu, meurtri, blessé,","Pour ton iniquité."]],[0,["Agneau de Dieu,","Messager de la grâce,","J’ai péché, je viens à Toi,","Je T’invoque, réponds-moi!","Pour toi Je fus brisé,","D’épines couronné,","De tous abandonné,","Frappé pour ton péché."]],[0,["Agneau de Dieu,","Messager de la grâce,","Oh! fais passer sur mon cœur","Tout Ton Sang, divin Sauveur!","Mon côté fut percé,","Et Mon sang fut versé;","Dans ce Sang, ton passé,","Pécheur, est effacé."]],[0,["Agneau de Dieu,","Messager de la grâce,","Je me confie et je crois;","Ton pardon, je le reçois!","Sur l’enfant racheté","Qui fait Ma volonté,","Je mets Ma sainteté,","Ma divine beauté."]]]},{"n":262,"t":"Mon âme soupire après Toi","s":[[0,["Mon âme soupire après Toi","Et mon esprit en moi Te cherche","Tu es le refuge de mon âme","Et je dis : « Je suis à Toi »"]],[1,["Tu es mon bouclier, ma force","Le Roc sur qui j’ai fondé ma vie","Toi seul es le désir de mon âme","Et je dis : « Je suis à Toi »"]],[0,["Mon âme soupire après Toi","Et mon esprit, en moi Te cherche","Toi seul es le désir de mon cœur","Et je vis pour T’adorer."]],[1,["Tu es mon bouclier, ma force","Le Roc sur qui j’ai fondé ma vie","Toi seul es le désir de mon cœur","Et je vis pour T’adorer."]]]},{"n":263,"t":"Redites-moi l’histoire","s":[[0,["Redites-moi l’histoire","De l’amour de Jésus;","Parlez-moi de la gloire","Qu’Il promet aux élus.","J’ai besoin qu’on m’instruise,","Car je suis ignorant,","Qu’à Christ on me conduise","Comme un petit enfant."]],[1,["Redites-moi l’histoire, (ter)","De l’amour de Jésus!"]],[0,["Redites-moi l’histoire","De la crèche à la croix.","Éveillez ma mémoire,","Oublieuse parfois.","Cette histoire si belle,","Dites-la simplement;","Elle est toujours nouvelle;","Répétez-la souvent."]],[0,["Redites-moi l’histoire","De mon Divin Sauveur;","C’est Lui dont la victoire","Affranchit le pécheur,","Ce glorieux message,","Oh! Redites-le-moi,","Lorsque je perds courage,","Lorsque faiblit ma foi."]],[0,["Redites-moi F histoire.","Quand le monde trompeur","Me vend sa vaine gloire","Au prix de mon bonheur.","Et quand, loin de la terre,","Je prendrai mon essor,","En fermant la paupière,","Que je l'entende encor!"]]]},{"n":264,"t":"Cherchez d’abord le royaume des cieux","s":[[0,["Cherchez d’abord le royaume des cieux","Et sa justice.","Et toutes choses vous seront données en plus,","Alléluia, Alléluia !"]],[0,["L’homme ne vivra pas de pain seulement,","Mais de toute Parole","Qui sortira de la bouche de Dieu","Alléluia, alléluia!"]]]},{"n":265,"t":"Viens à Jésus, viens à Jésus (bis)","s":[[0,["Viens à Jésus, viens à Jésus (bis)","Viens à Jésus, viens à Lui aujourd’hui (bis)"]],[0,["Oui me voici, oui me voici (bis)","Oui me voici pour faire Ta volonté (bis)"]],[0,["Gloire à Jésus, gloire à Jésus, (bis)","Gloire à Jésus, qui mourut sur la croix (bis)"]],[0,["Alléluia! Alléluia! (bis)","Alléluia! Alléluia! Amen, (bis)"]]]},{"n":266,"t":"Tu peux naître de nouveau,","s":[[0,["Tu peux naître de nouveau,","Tu peux tout recommencer.","Balayer ta vie passée.","Et repartir à zéro (bis)","Avec Jésus pour berger.","Tu peux être pardonné","De tous tes péchés passés.","Car Jésus a tout payé","Tu peux recevoir la paix (bis)","Source de la vérité"]]]},{"n":267,"t":"Quand les montagnes s’éloigneraient ;","s":[[0,["Quand les montagnes s’éloigneraient ;","Quand les collines chancelleraient","Quand les montagnes s’éloigneraient ;","Dieu fera tout comme Il promet."]],[0,["Mon amour, oui, mon amour","Ne s’éloignera point de toi"]],[0,["Quand les montagnes s’éloigneraient ;","Quand les collines chancelleraient","Quand les montagnes s’éloigneraient,","Dieu fera tout comme Il promet."]]]},{"n":268,"t":"À travers la porte que Dieu","s":[[0,["À travers la porte que Dieu","Pour nous laisse entr’ouverte,","La gloire auguste du saint lieu,","À ma vue est offerte."]],[1,["Amour insondable à la foi!","La porte est ouverte pour moi!","Pour moi! pour moi!...","Est ouverte pour moi!..."]],[0,["La Porte est ouverte à celui","Qui le salut réclame,","Qui cherche en Jésus son appui,","Et la paix de son âme"]],[0,["Riche et pauvre, grand et petit,","D’un pôle à l’autre pôle,","Pour tous les humains retentit","La divine Parole Marchons amis!"]],[0,["Le Roi des rois","Au ciel nous garde un trône.","Ici-bas nous portons la croix,","Mais là-haut la couronne"]]]},{"n":269,"t":"Je l’ai trouvé, je l’ai trouvé,","s":[[0,["Je l’ai trouvé, je l’ai trouvé,","Le bonheur ineffable!","Je suis sauvé, je suis sauvé,","O joie inexprimable!","Tous mes péchés sont effacés;","Le sang de Christ me lave","Les jours des larmes sont passés:","Je ne suis plus esclave!"]],[0,["Oh! Quel bonheur! Oh! Quel bonheur","D’avoir Jésus pour Maître!","O mon Sauveur, mon seul Sauveur! À Toi seul","je veux être!","Tu vins briser, puissant Vainqueur,","Du mal la tyrannie. Affranchissant mon pauvre","cœur Et me donnant la vie!"]],[0,["Dans Ton amour, Tu m’as cherché, Errant bien","loin du Père!","Tu m’as sauvé de mon péché, Tu fis de moi Ton","frère:","Et maintenant, et pour jamais, Sous Ton joug","je me plie;","Je ne puis vivre désormais,","Jésus, que de Ta vie!"]],[0,["Ah! Laissez-moi chanter mon Roi; Oui, qu’à","genoux, je chante!","Jésus n’est-Il pas tout pour moi? Gloire à Sa","croix sanglante!","Sans se lasser, jour après jour, Il m’aime, Il","m’aime encore... Comment répondre à tant","d’amour? Je crois, j’aime et j’adore!"]]]},{"n":270,"t":"Je ne sais pourquoi, dans Sa grâce,","s":[[0,["Je ne sais pourquoi, dans Sa grâce,","Jésus m’a tant aimé,","Pourquoi par Son sang H efface","Ma dette, mon péché."]],[1,["Mais, je sais, qu'en Lui j'ai la vie,","Il m'a sauvé dans Son amour;","Et gardé par Sa main meurtrie,","J'attends l'heure de Son retour."]],[0,["Je ne sais comment la lumière","Éclaire tout mon cœur,","Comment je compris ma misère","Et reçus mon Sauveur!"]],[0,["Je ne sais quelle est la mesure","De joie et de douleur","Que pour moi, faible créature,","Réserve mon Sauveur."]],[0,["Je ne sais quand de la victoire","L’heure enfin sonnera,","Quand l’Agneau, l’Époux, dans Sa gloire","Avec Lui me prendra."]]]},{"n":271,"t":"Jésus, du fardeau de la loi,","s":[[0,["Jésus, du fardeau de la loi,","Par Toi mon âme est libérée;","Pour toujours elle est délivrée","De ce qui causait Son effroi."]],[1,["Libre en regardant au Calvaire,","Libre par Ta mort salutaire,","Libre, car j'entendis Ta voix,","Libre par le sang de Ta croix!"]],[0,["O bonheur! il est éternel,","Le salut que Jésus me donne!","Et Son amour qui me pardonne","M’ouvrira la porte du ciel!"]],[0,["Dieu m’aime, je suis son enfant;","En Sa fidélité j’espère;","Dans tous les combats de la terre","Il veut me rendre triomphant"]]]},{"n":272,"t":"Si tu confesses tes péchés, (ter)","s":[[0,["Si tu confesses tes péchés, (ter)","Je te pardonnerai."]],[0,["Le sang de Christ peut rendre pur, (ter)","Le cœur le plus mauvais."]],[0,["Je garderai ton cœur en paix, (ter)","En Moi confie-toi."]],[0,["Dans ta faiblesse mon enfant, (ter)","Ma grâce te suffit."]],[0,["Et si tu passes par le feu, (ter)","Avec toi Je serai."]]]},{"n":273,"t":"Je suis scellé pour la gloire,","s":[[0,["Je suis scellé pour la gloire,","J’avance vers mon Pays;","Écoutez tous mon histoire","Et l’Amour de Jésus-Christ:"]],[1,["Jésus, mon Ami suprême,","Sur moi veille, Il l'a promis;","J'aime Jésus; Jésus m'aime","Comme un berger sa brebis."]],[0,["J’étais mort dans ma misère,","Sans Dieu, sans espoir, sans foi;","Un jour j’appris, ô mystère,","Que Jésus est mort pour moi."]],[0,["Son Amour, que rien n’arrête,","Brisa mon cœur endurci;","Maintenant ce cœur souhaite","D’en guider d’autres vers Lui."]],[0,["J’ai passé par mainte épreuve","Depuis que je suis à Lui,","Mais en tout j’ai vu la preuve","De Son amour infini."]],[0,["Maintenant, Sauveur fidèle,","Remplis-moi de Ton amour;","Qu’animé d’un nouveau zèle,","Je te suive chaque jour."]]]},{"n":274,"t":"Vous êtes enfants de Dieu","s":[[0,["Vous êtes enfants de Dieu","Soyez doux, aimables,","Et plein d’amour les uns pour les autres","Si le diable utilisait quelqu’un","Parmi vous comme ennemi","Priez pour lui.","Contentez-vous de prier, de prier","Si c’est un élu, il sera sauvé","Autrement il s’en ira Soyons unis."]]]},{"n":275,"t":"Libéré! Libéré!","s":[[0,["Libéré! Libéré!","Jésus-Christ m’a libéré,","J’étais enchaîné, Il m’a libéré.","J’étais lié, Il m’a délié."]],[0,["Libéré, libéré!","Racheté! Racheté!","Jésus-Christ m’a racheté.","J’étais un esclave, Il m’a racheté.","J’étais condamné, Il m’a racheté.","Racheté, racheté!"]],[0,["Pardonné! Pardonné!","Jésus-Christ m’a pardonné.","J’étais un pécheur, Il m’a pardonné.","J’étais un coupable, Il m’a pardonné.","Pardonné, pardonné!"]],[0,["Relevé! Relevé!","Jésus-Christ m’a relevé.","J’étais tombé, Il m’a relevé.","J’étais humilié, Il m’a relevé.","Relevé, relevé!"]]]},{"n":276,"t":"Jésus, par Ton Sang précieux,","s":[[0,["Jésus, par Ton Sang précieux,","Enlève mon iniquité!","Regarde-moi du haut des cieux,","Dis-moi que Tu m’as pardonné...","J’ai longtemps erré, cœur rebelle,","Mais j’entends Ta voix qui m’appelle,","Au pied de Ta croix, maintenant,","Tout confus, brisé, je me rends."]],[1,["Blanc, plus blanc que neige,","Blanc, plus blanc que neige,","Lavé dans le Sang de l’Agneau,","Je serai plus blanc que la neige !"]],[0,["Oh! Le fardeau de mon péché,","Dieu très saint, est trop grand pour moi!","Je veux en être délivré,","À cette heure, oh! Révèle-Toi!","Jésus, viens, sois ma délivrance.","Seul Tu peux calmer ma souffrance!","Au pied de Ta croix, maintenant,","Tout confus, brisé, je me rends."]],[1,["Blanc, plus blanc que neige,","Blanc, plus blanc que neige,","Lavé dans le Sang de l’Agneau,","Je serai plus blanc que la neige !"]],[0,["Oh! Jésus, Ton Sang précieux","A lavé mon iniquité,","Oui, Tu m’as répondu des cieux,","Ton amour m’a tout pardonné.","Je Te contemple et je puis croire","Qu’en Toi j’ai complète victoire...","Au pied de Ta croix, maintenant,","Je me relève, triomphant!"]],[1,["Blanc, plus blanc que neige,","Blanc, plus blanc que neige,","Lavé dans le sang de l’Agneau,","Mon cœur est plus blanc que la neige!"]]]},{"n":277,"t":"N’ayons pas peur","s":[[0,["N’ayons pas peur","Dieu prendra soin de nous dans la clarté","Dans l’ombre, notre Appui","Tendrement garde","En veillant sur les Siens","Il ne nous abandonnera pas seul","Dieu prendra soin de nous jusqu’à la fin","Oh quel amour ! Quel Père rédempteur !","À chaque appel Jésus répondra","Croyons en Lui","Il prendra soin de nous"]]]},{"n":278,"t":"Attention à la vie","s":[[0,["Attention à la vie","Attention à ce que tu fais","Quand tu te réjouis","Fais attention!","Sinon pourquoi","Le Seigneur ton Dieu","Te trouvera-t-il insensé","Que toutes tes voies Soient réglées."]],[1,["Alléluia! Amen! (bis)","Alléluia!","Quand tu pries chrétien","Que tout soit réglé."]]]},{"n":279,"t":"Source féconde,","s":[[0,["Source féconde,","Salut du monde,","Le Sang de Christ est répandu.","Ce divin Frère,","Sur le Calvaire,","Est mort pour l'homme perdu."]],[1,["Oui, je puis croire,","Oui, je veux croire","Que Jésus-Christ est mort pour moi!","Sa mort sanglante","Et triomphante","Me rend libre par la foi."]],[0,["En Jésus joie!","Il est la voie","Qui nous mène toujours au but.","Jésus pardonne,","Il n’est personne","Qu’Il repousse du Salut."]],[0,["Âme flétrie!","Jésus convie","Les méchants, les plus dissolus,","Sa grâce immense","Donne assurance","Au cœur qui croit en Jésus."]],[0,["Jour mémorable","Pour le coupable!","Sur la croix, au vil malfaiteur,","Jésus pardonne!","Jésus lui donne","Le Ciel, l’éternel bonheur!"]],[0,["Du Christ la fête","Est toujours prête,","Le festin de noce est pour tous!","Entrez sans crainte,","De la voix sainte","Écoutez l’appel si doux!"]]]},{"n":280,"t":"Longtemps j’ai cherché","s":[[0,["Longtemps j’ai cherché","La route de la gloire","J’ai prié pour qu’il","Éclaire mon chemin","Je m’assieds un instant","Me reposer un peu","C’est alors qu’en moi","Une voix me dit:"]],[1,["Tu dois marcher encore","Oui marcher encore","Marcher dans la lumière du Seigneur","Tu arriveras au ciel","Si tu marches droit","Marche dans la lumière du Seigneur"]]]},{"n":281,"t":"Si tu veux le bonheur, le vrai bonheur,","s":[[0,["Si tu veux le bonheur, le vrai bonheur,","Laisses entrer Jésus dans ton cœur","Tes péchés Il efface. Il te fera la grâce","De transformer ton être entier","Pour régner sur ton cœur.","Si tu veux le bonheur, le vrai bonheur,","Laisse entrer Jésus dans ton cœur."]],[0,["Si tu veux la paix, parfaite paix.","Viens à Jésus prince de paix","Jésus, Jésus, pardonne","Et c’est Lui seul qui donne","Sa grande paix, parfaite paix","Et pour l’éternité","Oui, si tu veux la paix, parfaite paix","Viens à Jésus, Prince de paix."]],[0,["Si tu veux la joie, divine joie","Viens à Jésus source de joie","Il chasse la tristesse","Il remplit d’allégresse","Alors ton cœur, ton pauvre cœur","Resplendit de bonheur","(Oui) si tu veux la joie, divine joie","Viens à Jésus source de joie."]]]},{"n":282,"t":"Regardez là-bas, la croix du calvaire.","s":[[0,["Regardez là-bas, la croix du calvaire.","Où le crucifié mourut pour moi.","Accomplissant le don de Sa vie.","Une vie que le Père lui confia."]],[0,["Oui, il y a une place sur la croix","Où tous recevront un bon accueil.","Il y a une place pour tous ceux qui croient,","Et la rédemption pour ceux qui croient."]]]},{"n":283,"t":"Je combattrai jusqu’au soir de ma vie.","s":[[0,["Je combattrai jusqu’au soir de ma vie.","Et j’entrerai dans la maison du Père.","Je combattrai jusqu’au soir de ma vie.","Pour déposer les armes aux pieds du Maître.","L’ennemi se déchaîne ;","Mais les yeux sur mon Capitaine","Je combattrai vaillamment pour Jésus","L’ennemi se déchaîne ;","Mais les yeux sur mon Capitaine","Mon ancre est sûre, j’arriverai au Port,"]]]},{"n":284,"t":"Unissons nos cœurs et nos voix à Dieu","s":[[0,["Unissons nos cœurs et nos voix à Dieu","Pour célébrer Jésus le Rois des cieux.","Disons donc avec l’apôtre Paul :","Je suis ce que je suis par la foi.","Sauvé du péché par la grâce,","Et si je vis, ce n’est point moi ;","C’est le Fils de Dieu, c’est le Prince de paix","C’est le Saint des saints qui vit en moi."]]]},{"n":285,"t":"Sous Christ le Roc","s":[[0,["Sous Christ le Roc","Nous nous cachons.","Abris pendant les ouragans,","Viens à notre aide.","Abris pendant les ouragans.","Jésus, Roc éternel Tu vis à jamais","Vis à jamais (bis) Jésus,","Roc éternel Tu vis à jamais","Abris pendant les ouragans"]]]},{"n":286,"t":"Bientôt le Seigneur va juger ce monde.","s":[[0,["Bientôt le Seigneur va juger ce monde.","Seras-tu parmi les élus ?","Sans cela viens à ton Sauveur Jésus,","Pour avoir la vie éternelle.","Mon oreille avait entendu parler de Toi.","Mais maintenant mon Sauveur","Mes yeux T’ont vu,","Gloire à Toi ô! Fils de David."]]]},{"n":287,"t":"Brève est toute vie, comme celle d’une rose","s":[[0,["Brève est toute vie, comme celle d’une rose","Qui ne dure que l’instant d’un matin.","Les journées s’écoulent rapide","Et voici déjà la mort!","Et c’est l’heure du grand départ,","Soit présent, sois présent!","A l’appel de Jésus-Christ","Sois présent!","Si tu restes encore pécheur,","La porte sera fermée!","Et tu seras en retard","Sois présent!"]]]},{"n":288,"t":"Revêtez-vous d’entrailles de miséricorde,","s":[[0,["Revêtez-vous d’entrailles de miséricorde,","De bonté, d’humilité,","De douceur, de patience.","Supportez-vous les uns les autres.","Et si l’un a sujet de se plaindre de l’autre,","De même que le Seigneur vous a pardonné,","Vous aussi pardonnez-vous les uns les autres","Vous aussi pardonnez-vous les uns les autres."]]]},{"n":289,"t":"C’est mon joyeux service","s":[[0,["C’est mon joyeux service","D’offrir à Jésus-Christ,","En vivant sacrifice,","Mon corps et mon esprit."]],[1,["Accepte mon offrande,","Bien-aimé Fils de Dieu!","Et que sur moi descende","La flamme du saint lieu!"]],[0,["J’abandonne ma vie,","Sans regret ni frayeur,","À Ta grâce infinie,","O mon Libérateur!"]],[0,["Qu’un feu nouveau s’allume","Par Ton amour en moi,","Et dans mon cœur consume","Ce qui n’est pas à Toi!"]],[0,["Viens, Jésus! Sois mon maître;","Par Ton Sang racheté,","À Toi seul je veux être","Et pour l’éternité."]]]},{"n":290,"t":"Mon corps, mon cœur, mon âme","s":[[0,["Mon corps, mon cœur, mon âme","Ne m’appartiennent plus;","Ton amour les réclame:","Ils sont à Toi, Jésus!"]],[1,["Reçois mon sacrifice,","Il est sur Ton autel!","Esprit, Esprit, descends,","J’attends le feu du ciel."]],[0,["En Toi, je me confie,","Je m’abandonne à Toi;","Ton Sang me purifie","Et Ta grâce est ma Loi."]],[0,["Consacre mon offrande,","Mets Ton sceau sur mon cœur!","Le sceau que je demande","C’est Ton Esprit, Seigneur."]]]},{"n":291,"t":"Cet après-midi, tout rempli de joie","s":[[1,["Cet après-midi, tout rempli de joie","Nous vous exprimons tout notre bonheur","De vous voir unis, sous le regard de Dieu","Chers bien aimés, dans les liens du mariage"]],[0,["Abraham! Abraham!","Écoute! Écoute!","Que-dans la vie,","Tous les jours ne sont pas pareils","La sœur Sara a ses faiblesses","Prends donc soin de l’aimer toujours (bis)"]],[0,["Sara! Sara!","Écoute! Écoute!","Que dans la vie,","Tous les jours ne sont pas pareils","Le bien aimé a ses faiblesses","Soumets toi donc à lui toujours (bis)"]]]},{"n":292,"t":"Entre Tes mains j’abandonne","s":[[0,["Entre Tes mains j’abandonne","Tout ce que j’appelle mien.","Oh! ne permets à personne,","Seigneur, d’en reprendre rien!"]],[1,["Oui, prends tout, Seigneur!","Oui, prends tout, Seigneur!","Entre Tes mains j’abandonne","Tout avec bonheur."]],[0,["Je n’ai pas peur de Te suivre","Sur le chemin de la croix.","C’est pour Toi que je veux vivre,","Je connais, j’aime Ta voix."]],[1,["Oui, prends tout, Seigneur!","Oui, prends tout, Seigneur!","Sans rien garder, je Te livre","Tout avec bonheur."]],[0,["Tu connais mieux que moi-même","Tous les besoins de mon cœur,","Et, pour mon bonheur suprême,","Tu peux me rendre vainqueur."]],[1,["Oui, prends tout, Seigneur!","Oui, prends tout, Seigneur!","Je ne vis plus pour moi-même,","Mais pour mon Sauveur."]],[0,["Prends mon corps et prends mon âme;","Que tout en moi soit à Toi","Que par Ta divine flamme","Tout mal soit détruit en moi!"]],[1,["Oui, prends tout, Seigneur!","Oui, prends tout, Seigneur!","Prends mon corps et prends mon âme;","Règne sur mon cœur"]]]},{"n":293,"t":"Au pied de la croix sanglante,","s":[[0,["Au pied de la croix sanglante,","Où Tu t’es donné pour moi,","Mon âme émue et tremblante,","Ô Jésus se livre à Toi."]],[1,["Le parfait bonheur, le parfait bonheur,","C’est de mettre","Tout mon être","À Tes pieds, Seigneur!"]],[0,["Me voici pour Ton service,","Je ne garde rien pour moi,","Sur l’autel du sacrifice","Je me place par la foi."]],[0,["Prends, Seigneur, ma vie entière,","Mets sur moi Ton divin sceau;","Fais d’un fils de la poussière,","Un enfant du Dieu très-haut."]],[0,["À la gloire, aux biens du monde,","Je renonce pour jamais;","Que le Saint-Esprit m’inonde","De Ta joie et de Ta paix!"]],[0,["Si ma faiblesse est bien grande,","Ta force est plus grande encor,","O Jésus, qu’elle me rende","Fidèle jusqu’à la mort!"]],[0,["Ô félicité suprême!","Ta grâce est mon bouclier.","Et je T’appartiens, je T’aime,","Toi qui m’aimas le premier»"]]]},{"n":294,"t":"Que tout genou fléchisse","s":[[0,["Que tout genou fléchisse","Devant Ta Majesté.","Et qu’aujourd’hui je puisse","Lâcher ma volonté!"]],[0,["Oui, devant Toi je plie,","Je me courbe, ô mon Roi,","Je pleure et m’humilie,","Et c’est un don de Toi!"]],[0,["Que tout ce qui s’élève","En moi soit abaissé!","Que mon cœur, de Ton glaive,","S’il le faut, soit percé!"]],[0,["Mourir, mais c’est renaître","Et vivre désormais.","Oh! Courbe tout mon être","À Tes pieds pour jamais!"]]]},{"n":295,"t":"A Jésus je m’abandonne;","s":[[0,["A Jésus je m’abandonne;","Ce qu’Il me dit, je le crois,","Et je prends ce qu’H me donne,","La couronne avec la croix."]],[1,["Compter sur Lui d’heure en heure,","Tant que dure le combat;","Que l’on vive ou que l’on meure.","Compter sur Lui, tout est là;","Que l’on vive ou que l’on meure,","Compter sur Lui, tout est là."]],[0,["Et si l’ennemi se montre,","Mon cœur n’en est point troublé;","Avec Christ à sa rencontre","Je puis aller sans trembler."]],[0,["Suis-je en paix? Vers la lumière","Mon chant s’élève, attendri,","Pour se changer en prière","Si l’horizon s’assombrit."]],[0,["Qu’on m’approuve ou qu’on me blâme,","Et demain comme aujourd’hui,","Je ne veux, quoi qu’on réclame,","Jamais compter que sur Lui!"]]]},{"n":296,"t":"Les bontés de l’Éternel","s":[[0,["Les bontés de l’Éternel","Ne sont pas épuisées.","Ses compassions","Ne sont pas à leurs termes.","Elles se renouvellent chaque matin (bis)"]],[0,["L’Éternel a de la bonté","Pour qui espère en Lui ;","Pour l’âme qui le cherche.","Il est bon d’attendre en silence,","Le secours de l’Éternel.","Il est bon pour l’homme,","De porter le joug dans sa jeunesse."]],[0,["Le Seigneur ne rejette pas à","Toujours lorsqu’il afflige,","Il a compassion selon","Sa miséricorde, car ce n’est pas","Volontiers qu’il humilie","Et qu’Il afflige","Les enfants, les petits-fils des hommes."]]]},{"n":297,"t":"Je veux monter sur la montagne.","s":[[1,["Je veux monter sur la montagne.","C’est là que Von rencontre Dieu.","C’est là que la joie nous inonde.","Et que pour nous s’ouvrent les deux.","Je veux laisser les joies du monde,","Et me tenir plus près de Dieu.","Je veux monter sur la montagne,","C’est là que l’on est heureux."]],[0,["Si le chemin est rocailleux,","Si les cailloux me blessent un peu,","Le Saint-Esprit me guidera,","Et Jésus me consolera."]],[0,["Sur ce chemin, Jésus monta,","Et mon Sauveur me précéda,","Avec Lui je veux m’élever","Jusque sur les plus hauts sommets"]]]},{"n":298,"t":"Notre nouvelle patrie","s":[[0,["Notre nouvelle patrie","C’est le royaume des cieux.","Dans les cieux! Dans les cieux!","Dans les cieux! Ma patrie est dans les cieux","J’irai là-bas dans ma nouvelle patrie."]],[0,["Haïssez-moi sur la terre (bis)","Ce n’est rien ! Ce n’est rien !","Ce n’est rien ! Ma patrie est dans les cieux","J’irai là-bas dans ma nouvelle patrie."]]]},{"n":299,"t":"Pourquoi gémir ? (4x)","s":[[0,["Pourquoi gémir ? (4x)","Bientôt cesseront les pleurs."]],[0,["Pourquoi gémir ? (4x)","Bientôt finiront les larmes."]],[0,["Prenez courage! (4x)","Luttez encore un peu de temps."]],[0,["Prenez courage! (4x)","Veillez encore un petit moment."]]]},{"n":300,"t":"Bien loin de cette terre, nous irons là-haut","s":[[0,["Bien loin de cette terre, nous irons là-haut","Où règne l’Agneau.","Bien loin de cette terre","Nous régnerons avec l’Agneau là-haut.","Si tu vas dans ce beau pays,","Dis aux amis que je viens aussi.","Bien loin de cette terre,","Nous régnerons avec l’Agneau là-haut."]]]},{"n":301,"t":"Il est Médiateur pour moi !","s":[[0,["Il est Médiateur pour moi !","Il est Médiateur pour moi !","Jésus ! Jésus !","Il est Médiateur pour moi !"]],[0,["Il est Intercesseur pour moi !","Il est Intercesseur pour moi !","Jésus ! Jésus !","Il est Intercesseur pour moi !"]],[0,["Il est Avocat pour moi !","Il est Avocat pour moi !","Jésus ! Jésus !","Il est Avocat pour moi !"]]]},{"n":302,"t":"Jusqu’à la mort, nous Te serons fidèles;","s":[[0,["Jusqu’à la mort, nous Te serons fidèles;","Jusqu’à la mort, Tu seras notre Roi;","Sous Ton drapeau, Jésus, Tu nous appelle;","Nous y mourrons en luttant avec foi!"]],[1,["Jusqu’à la mort! C’est notre cri de guerre.","Le libre cri d’un peuple racheté.","Jusqu’à la mort, nous aurons pour Bannière","Ta Croix sanglante, ô Christ réssuscité!"]],[0,["Pour toi, Jésus, on est heureux de vivre;","Tous les chemins avec toi semblent doux.","Agneau de Dieu, qui ne voudrait Te suivre","Jusqu’à la mort, Toi qui mourrus pour nous?"]],[0,["Mais, ô Sauveur! Tu sais notre faiblesse;","Nous tomberons sûrement en chemin","Si tu ne viens accomplir Ta promesse,","Jusqu’à la mort nous tenir par la main."]],[0,["Jusqu’à la mort, soumis à Ta puissance,","Nous voulons vivre et mourrir sous Tes lois,","Toi qui pour nous poussas l’obéissance","Jusqu’à la mort, et la mort de la Croix."]],[0,["Que Ton Esprit nous guide et nous anime!","Et que Sa flamme, embrasant tous nos coeurs,","Nous devenions par Toi, sainte victime,","Sur la mort même, un peuple vainqueur!"]]]},{"n":303,"t":"Avant d’entrer dans le bercail du grand Berger,","s":[[0,["Avant d’entrer dans le bercail du grand Berger,","Il y aura une épreuve de sang.","Le Sang déterminera que","Nous sommes enfants de Dieu.","Tout autre sang ne servira à rien."]],[0,["Veux-tu aller au ciel, ô toi mon frère ?","Viens appliquer le Sang sur ton cœur.","Le Sang déterminera que","Tu es enfant de Dieu.","Tout autre sang ne servira à rien."]]]},{"n":304,"t":"Ô jour béni, jour de victoire,","s":[[0,["Ô jour béni, jour de victoire,","Que je ne saurais oublier !","J’ai vu, j’ai vu le Roi de gloire","Apparaissant sur mon sentier !"]],[1,["Sa beauté, Sa gloire infinie","De tous les côtés m’entourait,","Son regard qui porte la vie","Sur ma pauvre âme s’abaissait."]],[0,["Son manteau couvrait ma misère,","Ses bras me serraient sur Son cœur :","Il me portait dans Sa lumière,","Loin du péché, de la douleur."]],[1,["De Sa Main essuyant mes larmes,","Il me parlait de Son amour :","« Viens mon enfant, sois sans alarmes,","Je te prends à Moi sans retour. »"]],[0,["Et je suis dans cette retraite","Dont je ne sortirai jamais ;","Et je goûte une paix parfaite,","Où ma foi s’abreuve à longs traits."]],[1,["Non, tout ceci n’est point un rêve,","Mais la grande réalité :","C’est un jour nouveau qui se lève","Qui doit durer l’éternité !"]],[0,["En avant donc avec courage,","Avec espoir avec bonheur !","Je me consacre sans partage","À mon Dieu, mon Roi, mon Sauveur."]],[1,["Il dit à mon âme ravie :","Ne t’occupe plus que de Moi,","Et Je dirigerai ta vie","Et Je m’occuperai de toi."]],[0,["Il a saisi mes mains tremblantes ;","J’ai dit « amen » à ce contrat !","Il étend Ses mains bénissantes,","C’est en effet Lui qui combat."]],[1,["Et les yeux fermés, je m’avance","Tranquille, sur le droit chemin ;","J’entonne un chant de délivrance ;","Il peut tout, car je ne suis rien !"]]]},{"n":305,"t":"Toujours Ta divine présence","s":[[0,["Toujours Ta divine présence","Jette un rayon sur mon chemin ;","Et le cœur joyeux, je m’avance :","Je n’ai pas peur du lendemain."]],[1,["Où Tu voudras, je veux Te suivre","Agneau de Dieu, conduis mes pas.","Vivre sans Toi ce n’est pas vivre","Je ne puis être où Tu n’es pas."]],[0,["Oh ! Que jamais rien ne me voile","Ton doux regard, bien-aimé Roi !","Dans le danger, brillante Etoile,","Garde mes yeux fixés sur Toi,"]],[0,["Auprès de Toi, la vie est belle,","C’est le bonheur, la liberté,","C’est une jeunesse éternelle,","C’est le ciel, la félicité!"]]]},{"n":306,"t":"Mon cœur est rempli de joie,","s":[[0,["Mon cœur est rempli de joie,","Car Jésus est tout pour moi.","Il m’a sauvé! Dans Son amour!","Il m’a sauvé dans Son amour","Pour être à Lui tous les jours."]],[0,["Je ne mourrai point la seconde mort,","Ma vie est cachée en Jésus."]],[0,["Il m’a donné la vie ibis)","Ce qu’aucun homme ne peut faire,","Il l’a fait pour moi"]],[0,["Alléluia! (bis)","Ce qu’aucun homme ne peut faire,","Il l’a fait pour moi."]]]},{"n":307,"t":"Qu’il fait bon à Ton service,","s":[[0,["Qu’il fait bon à Ton service,","Jésus mon Sauveur!","Qu’il est doux le sacrifice","Que T’offre mon cœur!"]],[1,["Prends, ô Jésus, prends ma vie,","Elle est toute à Toi!","Et dans Ta grâce infinie,","Du mal garde-moi!"]],[0,["Mon désir, mon vœu suprême,","C’est la sainteté!...","Rien je ne veux et je n’aime","Que Ta volonté!"]],[0,["Comme l’ange au vol rapide","Je veux Te servir,","Les yeux fixés sur mon Guide,","Toujours obéir!"]],[0,["Travail, douleur et souffrance,","Non, je ne crains rien!","Toi, Jésus, mon Espérance,","Voilà mon seul bien!"]],[0,["Ensemble donc vers la gloire,","Marchons en avant!","Chantant l’hymne de victoire,","Toujours triomphant!"]]]},{"n":308,"t":"Au pied de la sainte croix,","s":[[0,["Au pied de la sainte croix,","Jaillit la fontaine","Du salut que je reçois,","Grâce souveraine."]],[1,["Sainte Croix, sainte croix","Par toi, j’ai la vie;","C’est dans le Sang de la croix","Que je me confie."]],[0,["Seigneur, le Sang de Ta croix","Mes péchés, efface,","Tu me dis, je le crois:","\"Du mal, plus de trace\"."]],[0,["Prosterné devant Ta croix","Sur le mont Calvaire,","De Jésus, je fais mon choix,","En Lui seul j’espère."]],[0,["M’asseoir au pied de Ta croix","Est mon doux partage,","C’est là que j’entends Ta voix","Qui me dit : courage!"]],[0,["Jusqu’au bout, la sainte croix","Sera mon seul thème,","Car près d’elle j’entrevois","Au loin le ciel même."]]]},{"n":309,"t":"Abandonne ta vie,","s":[[0,["Abandonne ta vie,","Tes craintes et tes vœux","A la grâce infinie","Du Souverain des cieux.","Lui qui trace la route","Aux mondes comme aux vents,","Conduira sans nul doute","Les pas de Ses enfants."]],[0,["Qu’Il soit ton espérance","Aux bons, aux mauvais jours;","Qu’Il soit, dans la souffrance,","Ton unique recours.","Dis-Lui toutes tes peines,","Remets-Lui tes douleurs;","Il a brisé tes chaînes,","Il séchera tes pleurs."]],[0,["Espère, âme angoissée,","Espère en ton Sauveur!","Il connaît ta pensée,","Il a lu dans ton cœur.","Il est l’amour suprême,","Il est le vrai chemin;","Viens à Lui, car Il t’aime,","Viens! Il te tend la main."]],[0,["À Ta voix qui m’appelle,","Je répondrai, Seigneur.","Je veux, humble et fidèle,","Te consacrer mon cœur.","Pour moi plus de tristesse,","Je vivrai par la foi,","En célébrant sans cesse","Le bonheur d’être à Toi."]]]},{"n":310,"t":"Déchirez vos cœurs","s":[[0,["Déchirez vos cœurs","Et non Vos humiliants vêtements","Pécheurs nettoyez vos cœurs","Revenez à l’Éternel.","Vous dont l’âme est partagée","Sanctifiez-vous, dit le Seigneur","Venez, venez à Moi","Car je suis doux et humble de cœur."]]]},{"n":311,"t":"Venez à Jésus pour être sauvé","s":[[0,["Venez à Jésus pour être sauvé","Sauvé, sauvé pour toujours","Il n’y a dans le ciel, sur la terre","Aucun autre Nom qui ait été donné","Seul le nom de Jésus","Pour être sauvé","Sauvé, sauvé pour toujours."]]]},{"n":312,"t":"Ah! Donne à mon âme","s":[[0,["Ah! Donne à mon âme","Plus de sainteté...","Plus d’ardente flamme,","De sérénité,","Plus de confiance","Pour rester debout;","Plus de patience","Pour supporter tout."]],[0,["Fais que je contemple","Sans cesse l’Agneau;","Son vivant exemple,","Sa croix, Son tombeau;","Sa grâce fidèle,","Son immense amour,","Sa gloire éternelle,","Son prochain retour."]],[0,["Jésus, à Tes larmes","Je veux compatir;","De toutes Tes armes","Viens me revêtir:","Par plus de prière,","De zèle et de foi,","Que dans la lumière","Je marche avec Toi!"]],[0,["Donne, à Ton service,","Un cœur plus joyeux,","Prompt au sacrifice,","Toujours sous Tes yeux,","Qui chante et qui tremble,","Humble en sa ferveur;","Un cœur qui ressemble","Au Tien, mon Sauveur!"]]]},{"n":313,"t":"À Tes pieds, ô divin Maître,","s":[[0,["À Tes pieds, ô divin Maître,","Je me place avec bonheur!","En T’adorant, je veux être","Ton disciple, ô mon Sauveur!","Parle! J’ai soif de T’entendre,","Parle! Je n’ai qu’un désir:","Que Ta voix puissante et tendre","A mon cœur se fasse ouïr."]],[0,["Faites place, ô voix humaines,","À la voix de mon Sauveur!","Pensées vains et choses vaines,","Éloignez-vous de mon cœur!","Tous les bruits, faites silence!","Toi, mon Maître, parie-moi!","Recueillie en Ta présence,","Mon âme n’entend que Toi."]],[0,["Parle-moi, témoin fidèle!","Découvre-moi le trésor","De Ta sagesse éternelle;","Parle, ô Maître! Parle encor.","Ta Parole, c’est la vie,","C’est la lumière et la paix;","À Ton École bénie","Je veux rester à jamais."]],[0,["Parle! Et pour que je comprenne","Ton enseignement divin,","Dans Ta grâce souveraine,","Instruis-moi par l’Esprit-Saint.","Parie et pour que j’obéisse","À Tes ordres aussitôt,","Forme-moi pour Ton service,","Pour Te suivre, saint Agneau!"]]]},{"n":314,"t":"Nous mourrons, mais pour renaître;","s":[[0,["Nous mourrons, mais pour renaître;","La mort n’est qu’un doux sommeil,","Bientôt Jésus va paraître:","Ce sera le grand réveil!","Des profondeurs de l’abîme,","De la tombe, noir séjour,","De la plaine et de la cime","Tous se lèveront un jour!"]],[0,["Tu pleures, ô tendre mère;","Tu vis ton enfant mourir,","Ta douce fleur éphémère","Un souffle a su la flétrir...","Mais si ta douleur est vive,","Crois, espère au Dieu d’amour:","Ta fleur vit, Il la cultive,","Il veut te la rendre un jour!"]],[0,["Nous mourrons, mais pour renaître,","Et, quittant le froid tombeau,","Nous saluerons notre Maître","Au seuil d’un monde nouveau,","La mort, délaissant sa proie,","Fuira devant Son retour,","Et de l’éternelle joie,","Pour nous brillera le jour!"]]]},{"n":315,"t":"C’est dans la paix que tu dois vivre,","s":[[0,["C’est dans la paix que tu dois vivre,","Enfant de Dieu, disciple du Sauveur;","Par Son Esprit, ton âme doit le suivre","Sur le sentier de la douceur.","Si contre toi s’élève quelque offense,","Si l’on te hait, si l’on veut t’opprimer,","Ferme ton cœur à la vengeance:","Comme ton Dieu, tu dois aimer."]],[0,["Bien loin de toi que toute haine,","Que tout dépit soit toujours repoussé;","Souffre en repos et l’insulte et la peine,","Et, sans orgueil, sois abaissé.","Oui, pour Jésus, pour ce Roi débonnaire,","Reçois le coup le plus humiliant;","Bois jusqu’au

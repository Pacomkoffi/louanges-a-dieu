t":"Attendris donc mon cœur,","s":[[0,["Attendris donc mon cœur,","Révèle-moi, Seigneur,","Ta grâce et Ta pureté;","Que je puisse plier","Devant Ta volonté,","Glorifier Ton doux Nom, Jésus."]]]},{"n":867,"t":"Aie foi en Dieu, (bis)","s":[[0,["Aie foi en Dieu, (bis)","Aie foi en Dieu pour le réveil;","Oui, aie foi en Dieu pour te sauver,"]]]},{"n":868,"t":"Quand Jésus suivit le chemin de la croix","s":[[0,["Quand Jésus suivit le chemin de la croix","C’était pour moi (bis)","Pour me délivrer de mon horrible sort","Jésus mourut pour moi.","Pour toi"]]]},{"n":869,"t":"O Dieu d’Abraham,","s":[[0,["O Dieu d’Abraham,","Nous voulons","Un réveil authentique.","O Jésus accorde nous","Un réveil authentique."]]]},{"n":870,"t":"Son Nom est Jésus, Jésus.","s":[[0,["Son Nom est Jésus, Jésus.","Il vient pour te consoler.","Il guérit les cœurs brisés,","Soulage les opprimés,","Il est toujours capable de délivrer."]]]},{"n":871,"t":"Si je pleure, c’est que ma chair","s":[[0,["Si je pleure, c’est que ma chair","Est tellement insuffisante","Pour me rendre agréable à mon Dieu.","Hosanna ! Hosanna ! (bis)","Voici, je puiserai de l’eau","Avec joie aux sources du salut","Car l’Éternel est ma délivrance Hosanna!"]]]},{"n":872,"t":"Avant Son retour,","s":[[0,["Avant Son retour,","Nous Le glorifions.","C’est Jésus qui est le Roi.","Que tu veuilles oui ou non,","C’est Lui qui régnera;","C’est Jésus qui est le Roi!"]]]},{"n":873,"t":"Merveilleux Amour,","s":[[0,["Merveilleux Amour,","Amour de Dieu pour moi,","Merveilleux amour,","De Jésus sur la croix,","Vaste autant que les océans,","Profond comme les mers,","Haut plus haut que l’azur des cieux","Est Son Amour."]]]},{"n":874,"t":"Si l’or dans cet âge","s":[[0,["Si l’or dans cet âge","N’est pas mon partage,","Là-haut dans la gloire,","J’ai une maison.","Christ, l’Agneau du père","Mourant au calvaire,","De mon âme noire","A eu compassion."]],[0,["Au-delà du ciel (bis)","J’ai une maison","Douce, douce, maison","Au-delà du ciel"]]]},{"n":875,"t":"Beau Nom, merveilleux Nom,","s":[[0,["Beau Nom, merveilleux Nom,","Jésus! Jésus! Jésus!","Beau Nom, merveilleux Nom,","Précieux Nom de Jésus."]]]},{"n":876,"t":"Nous marchons tous joyeux,","s":[[0,["Nous marchons tous joyeux,","Au pays de vie.","Et au pays du bonheur ;","Au Royaume d’Amour.","Vous qui marchez encore,","Sans Dieu dans la vie,","O dites : voulez-vous","Y venir dès ce jour ?","Voulez-vous, y venir ?","Voulez-vous y venir dès ce jour ?","Voulez-vous, y venir ?","Venez tous en ce lieu plein d’amour."]]]},{"n":877,"t":"Béni soit le Nom (ter)","s":[[0,["Béni soit le Nom (ter)","De Jésus!, Alléluia! Alléluia!","Béni soit le Nom de Jésus."]]]},{"n":878,"t":"Bénissons le Seigneur notre Dieu,","s":[[0,["Bénissons le Seigneur notre Dieu,","Il reviendra pour nous chercher.","Il reviendra, Il reviendra,","Il reviendra pour nous chercher."]]]},{"n":879,"t":"Boire aux sources des eaux de la Vie,","s":[[0,["Boire aux sources des eaux de la Vie,","Oui, je suis joyeux,","Pour toujours heureux!","Boire aux sources des eaux de la vie,","Oh, c’est merveilleux, c’est prodigieux!"]]]},{"n":880,"t":"Car c’est la joie, la joie,","s":[[0,["Car c’est la joie, la joie,","Qui remplit tout mon cœur (ter)","Car c’est la joie, la joie,","Qui remplit tout mon cœur,","Oh, gloire à mon Sauveur!"]]]},{"n":881,"t":"Car Dieu m’a tant aimé,","s":[[0,["Car Dieu m’a tant aimé,","Qu’Il a donné Son Fils","Pour mourir sur la Croix,","Me sauver du péché.","Un jour, Christ reviendra,","Pour mon cœur quelle joie,","Merveilleux jour ce sera!"]]]},{"n":882,"t":"Dieu ne ment pas,","s":[[0,["Dieu ne ment pas,","Sa Parole sera accomplie","Il ne ment jamais","Car Il n’est pas un homme."]]]},{"n":883,"t":"Que Tu es Saint,","s":[[1,["Que Tu es Saint,","Le Saint, Le Saint, Le Saint !","Que Tu es Saint","Le Dieu Tout-Puissant !"]],[0,["Que nous chantons","Comme les êtres-vivants","Que Tu es Saint","Le Dieu Tout-Puissant."]],[0,["Tu es le Saint,","Tu nous as rachetés","Que Tu es Saint,","Le Saint, le Dieu de paix."]],[0,["Tu es le Saint,","L’Alpha et l’Omega","Que Tu es Saint","Dans les cieux et sur la terre."]],[0,["Que Tu es Saint","Personne ne l’est comme Toi","Que Tu es Saint,","Le Dieu de Sa Parole."]],[0,["Tu ne changes pas","Oh ! Dieu le Saint de gloire","Que Tu es Saint,","Nous chantons Seigneur."]],[0,["Que Tu es Saint","Le Dieu, Le digne de gloire","Que Tu es saint,","Tu nous as appelés."]],[0,["Tes louanges","Nous Te chantons Seigneur","C’est Ta gloire,","Oh le Saint Tout-Puissant"]]]},{"n":884,"t":"Regardez les oiseaux du ciel,","s":[[0,["Regardez les oiseaux du ciel,","Ils ne sèment ni ne moissonnent,","Mais notre Seigneur les nourrit,","Ne valez-vous pas beaucoup mieux qu’eux?"]],[1,["Considère Sa Parole,","Considère Ses promesses","Garde-les dans ta vie","Tu verras c’est merveilleux."]],[0,["Les cheveux de vos têtes","Sont comptés dit le Guide,","Ne soyez pas en soucis,","Car Il connaît tous vos malheurs."]],[0,["Que d’orages, de tempêtes,","Pour Jésus je m’engage,","Si tout le monde m’abandonne,","Je marcherai seul avec Mon Roi."]]]},{"n":885,"t":"Bientôt l ’heure sonnera,","s":[[0,["Bientôt l ’heure sonnera,","Pour moi de rendre compte.","A cet instant suprême de la vie,"]],[0,["Que pourrai-je dire à mon Père.","Si ma vie n’est que débauches,","Corruptions, iniquités,","Il est temps de la changer","Bien avant ce grand jour."]]]},{"n":886,"t":"La victoire se trouve en Jésus, Alléluia!","s":[[0,["La victoire se trouve en Jésus, Alléluia!","Venez louons le Seigneur, Alléluia!"]],[0,["La puissance se trouve en Jésus, Alléluia!","Venez louons le Seigneur, Alléluia!"]],[0,["Le pouvoir se trouve en Jésus, Alléluia!","Venez louons le Seigneur, Alléluia!"]],[0,["Lajoie se trouve en Jésus, Alléluia!","Venez louons le Seigneur, Alléluia!"]],[0,["La vie se trouve en Jésus Alléluia!","Venez louons le Seigneur, Alléluia!"]]]},{"n":887,"t":"Je connais un Guide infaillible","s":[[0,["Je connais un Guide infaillible","Qui, constamment, veille sur moi;","Sur Ses pas je poursuis, paisible,","La sainte course de la foi."]],[1,["Conduit par Toi, céleste Guide,","Je me dirige vers les Cieux;","Et mon sentier, sous Ton égide,","Devient toujours plus radieux."]],[0,["Parfois ma route est bien obscure,","Sans un seul rayon lumineux,","Mais quand mon pauvre cœur murmure,","Mon Guide me soutient des Cieux."]],[0,["Quand au-dehors Satan m'assaille,","Quand au-dedans tout est bien noir,","Mon Guide, au fort de la bataille,","Me dit : « Mets en Moi ton espoir! »"]],[0,["Ainsi, tout au long de la route,","Hier, aujourd'hui, jusqu'à la fin,","Près du Guide, je ne redoute","Ni pleurs, ni chute, ni chagrin."]]]},{"n":888,"t":"Jésus a dit : « Venez à moi! »","s":[[0,["Jésus a dit : « Venez à moi! »","Cœurs travaillés et chargés","Acceptez mon joug par la foi,","Vous serez soulagés."]],[0,["Je suis allé tel que j ’étais","Las, souffrant malheureux.","Et j ’ai trouvé Sa douce paix,","Il m ’a rendu joyeux."]],[0,["Jésus a dit : « Encore venez »","A la source des eaux.","Quiconque a soif, venez puisez!","Buvez de mes ruisseaux,","J’ai répondu, je suis allé ;"]],[0,["Librement, j’en ai bu","Et mon cœur s’est désaltéré,","Et maintenant, je vis."]],[0,["Jésus a dit : « Enfin vous tous","Vers moi, tournez vos yeux »","Mon jour s’élèvera sur vous,","Serein et radieux.","Et j’ai regardé vers Jésus","L’étoile du matin,","Dès lors, je ne tâtonne plus","Il luit sur mon chemin."]]]},{"n":889,"t":"Est-il possible aujourd'hui de vivre la sainteté ?","s":[[0,["Est-il possible aujourd'hui de vivre la sainteté ?","C’est possible ! C’est possible !","Dans ce monde de souillures où l’iniquité s’accroit","C’est possible ! C’est possible !"]],[1,["C’est possible !","Tout est possible","Alléluia ! Plus de doute.","En Jésus, tout est possible.","Si tu crois sans hésiter,","Tu verras la gloire de Dieu."]],[0,["Est-il possible aujourd'hui d’être rempli de l’Esprit?","C’est possible ! C’est possible !","Dieu pourra t’Il donner à celui qui le demande?","C’est possible ! C’est possible !"]],[0,["Est-il possible aujourd'hui de vivre le vrai Amour?","C’est possible ! C’est possible !","L’Amour qui supporte tout, qui pardonne et"]],[1,["[qui croit tout ?"]],[0,["C’est possible ! C’est possible !"]],[0,["Est-il possible aujourd'hui de courir à Golgotha?","C’est possible ! C’est possible !","Guérir de toutes maladies et trouver le plein"]],[1,["[pardon?"]],[0,["C’est possible ! C’est possible !"]],[0,["Est-il possible aujourd'hui d ’entrer dans le vrai"]],[1,["[repos ?"]],[0,["C’est possible ! C’est possible !","Alors que la promesse d’y entrer subsiste"]],[1,["[encore ?"]],[0,["C’est possible ! C’est possible !"]]]},{"n":890,"t":"Notre Dieu ne change pas","s":[[0,["Notre Dieu ne change pas","C’est vrai ! Il est le même !","Il est le même pour toujours !","Jésus-Christ reste le même !"]],[0,["Il est l’Alpha et l’Oméga !","C’est vrai ! Il est le même !","Il est le même pour toujours !","Jésus-Christ reste le même !"]],[0,["Il est le premier et le dernier !","C’est vrai ! Il est le même !","Il est le même pour toujours !","Jésus-Christ reste le même !"]],[0,["C’est pourquoi je veux Le chanter","C’est vrai ! Il est le même !","Il est le même pour toujours !","Jésus-Christ reste le même !"]],[0,["C’est pourquoi je veux l’acclamer","C’est vrai ! Il est le même !","Il est le même pour toujours !","Jésus-Christ reste le même !"]]]},{"n":891,"t":"J’étais derrière la porte","s":[[0,["J’étais derrière la porte","Pauvre enfant fatigué","Dans mon cœur affligé","Soufflait une forte tempête.","Mon âme affligée","Craignit qu’il fût trop tard.","Mais malgré mes frayeurs","Je faisais mes prières","Dehors derrière la porte."]]]},{"n":892,"t":"Dans mon cœur chante une mélodie,","s":[[0,["Dans mon cœur chante une mélodie,","Douce mélodie, sublime harmonie.","Dans mon cœur chante une mélodie,","À la gloire du Sauveur."]],[0,["Jésus, Jésus, Jésus","O ce Nom si doux,","Le beau Nom de Jésus,","Je veux le dire à genoux."]]]},{"n":893,"t":"Je sais c'était le Sang,","s":[[0,["Je sais c'était le Sang,","Je sais c'était le Sang pour moi;","Lorsque j'étais perdu, à la croix Il mourut,","Je sais c'était le Sang pour moi."]]]},{"n":894,"t":"Amen!","s":[[0,["Amen!","Amen!","Amen!","Amen, Amen!"]],[0,["Allez-vous L'aimer? Amen!","Allez-vous Le louer? Amen!","Allez-vous L'adorer? Amen!","Amen, Amen!"]],[0,["Allez-vous L'aimer? Amen!","Le servirez-vous? Amen!","Croyez-vous en Lui? Amen!","Amen! Amen!"]],[0,["La Bible est vraie. Amen!","J'ai la foi en Elle. Amen!","C'est la Parole de Dieu. Amen!","Amen! Amen!"]]]},{"n":895,"t":"Jésus a une table où","s":[[0,["Jésus a une table où","Les saints de Dieu sont nourris,","Il invite Son peuple élu; «Viens dîner»;","Il nourrit avec Sa manne,","Pourvoit à tous nos besoins;","C'est bon de souper avec Lui tout le temps!"]],[1,["«Viens dîner», le Maître appelle: «viens dîner»","Tu peux fêter à Sa table tout le temps;","Lui qui a nourri la foule et changea de l’eau","[en vin,","Il appelle l'affamé: «Viens dîner»."]],[0,["Les disciples débarquèrent,","Obéissant ainsi à Christ,","Car le Maître les appela : «Viens dîner»;","Là, ils trouvèrent leur désir :","Pain et poisson sur le feu;","Il satisfait les affamés tout le temps."]],[0,["Bientôt, l'Agneau prend l'Epouse","Pour toujours à Ses côtés,","Et tous les hôtes du Ciel vont s'assembler;","Ce sera une vue glorieuse,","Tous les saints vêtus de blanc;","Avec Jésus ils vont fêter pour toujours."]]]},{"n":896,"t":"Doucement, tendrement, Jésus appelle,","s":[[0,["Doucement, tendrement, Jésus appelle,","Nous appelle, vous et moi ;","Patiemment Jésus attend le rebelle,","Il nous attend, vous et moi !"]],[1,["Venez, venez à moi !","Travaillés, chargés, venez à moi.","Doucement, tendrement Jésus appelle,","Venez ! Oh ! venez à moi."]],[0,["N ’hésitons plus puisque le Sauveur plaide,","Plaide pour vous et pour moi ;","Par des soupirs l’Esprit Saint intercède,","Et c’est pour vous et pour moi !"]],[0,["Le monde, hélas! n’est qu’une ombre qui passe","Passe pour vous et pour moi ;","Gloire à Jésus ! au ciel est une place,","Prête pour vous et pour moi !"]],[0,["Au vrai bonheur, Jésus Christ nous convie,","Bonheur pour vous et pour moi ;","Il nous l ’acquit quand il donna sa vie,","Sa vie pour vous et moi !"]]]},{"n":897,"t":"À celui qui nous a lavés,","s":[[0,["À celui qui nous a lavés,","Qui nous a tant aimés,","Par son sang nous a rachetés,","Soit gloire, gloire, gloire,","Louanges à jamais !"]],[0,["Chantons le cantique nouveau","À l'honneur de l'Agneau,","Qui sortit vainqueur du tombeau,","Oui, gloire, gloire, gloire,","Louanges à jamais !"]],[0,["Adorons le triomphateur,","Jésus notre Sauveur,","Sur tous ses ennemis vainqueur,","Oui, gloire, gloire, gloire,","Louanges à jamais !"]],[0,["Du ciel bientôt il reviendra,","Et tout oeil le verra,","Le monde entier l'adorera,","Oui, gloire, gloire, gloire,","Louanges à jamais !"]]]},{"n":898,"t":"Nous nous sentons si bien","s":[[0,["Nous nous sentons si bien","En parlant du bon vieux Chemin,","Nous nous sentons si bien","En parlant du Seigneur;","Continuons, continuons","A parler du bon vieux Chemin.","Continuons, continuons","A parler du Seigneur."]],[0,["Le diable n ’aime pas cela :","Parler de ce bon vieux Chemin,","Le diable n ’aime pas cela :","Parler du Seigneur;","(Ainsi) continuons, continuons","A parler du bon vieux Chemin,","Continuons, continuons","A parler du Seigneur"]]]},{"n":899,"t":"Au matin de résurrection,","s":[[0,["Au matin de résurrection,","La trompette de Dieu sonnera,","Nous vivrons, (Alléluia!), nous vivons!","Les saints viendront se réjouissant,","Aucune larme ne sera versée,","Nous vivrons, (Alléluia!), nous vivrons."]],[1,["Nous vivrons, (Alléluia!)","Nous vivrons! (Amen!)","Nous vivrons, (Alléluia!)","Au matin de résurrection,","Les liens de la mort sont brisés,","Nous vivrons, (Alléluia!), nous vivrons."]],[0,["Au matin de résurrection,","Oh! quelle rencontre ce sera!","Nous vivrons, (Alléluia!), nous vivrons!","Et lorsque nous verrons nos pères,","Nos mères et tous nos bien-aimés,","Nous vivrons, (Alléluia!), nous vivrons."]],[0,["Au matin de résurrection,","Oh! quelle pensée bénie pour moi !","Nous vivrons, (Alléluia!), nous vivrons!","Je verrai mon Seigneur béni,","Qui mourut librement pour moi,","Nous vivrons, (Alléluia!), nous vivrons"]],[0,["Au matin de résurrection,","Nous Le rencontrerons dans l ’air,","Nous vivrons, (Alléluia!), nous vivrons!","Etre enlevés dans la gloire,","Vers notre demeure pure et belle,","Nous vivrons, (Alléluia!), nous vivrons."]]]},{"n":900,"t":"Nous sommes au Seigneur","s":[[0,["Nous sommes au Seigneur","Et non point à nous même.","Pour la vie et la mort","Nous sommes au Seigneur.","C'est pour l'éternité,","Jésus, que Tu nous aime","Ta croix nous a rendu","La paix et le bonheur."]],[0,["Nous sommes au Seigneur.","Ah ! vivons pour Sa gloire.","Et mourons au péché,","Saints héritiers du ciel.","Saisissons chaque jour","Les fruits de Sa victoire,","Et reposons en paix","Dans Son sein paternel."]],[0,["Nous sommes au Seigneur.","Que nos âmes Te louent,","Que nos lèvres aussi","Bénissent Ton amour.","Ô Jésus, mes tiédeurs","Souvent Te désavouent;","Je voudrais être à Toi,","Mais à Toi sans retour."]],[0,["Nous sommes au Seigneur !","Dans la sombre vallée,","Du dernier ennemi","Jésus me rend vainqueur;","La face de mon Dieu","Ne peut m'être voilée,","Car pour l'éternité","Nous sommes au Seigneur."]]]},{"n":901,"t":"J’ai décidé de suivre Jésus (ter)","s":[[0,["J’ai décidé de suivre Jésus (ter)","Oui, sans détour et pour toujours."]],[0,["La Croix devant moi, le monde derrière moi (ter)","Oui, sans détour et pour toujours."]],[0,["Fini le monde, maintenant c ’est Jésus (ter)","Oui, sans détour et pour toujours."]],[0,["Et si je suis seul à suivre Jésus (ter)","Je Le suivrai, je Le suivrai."]]]},{"n":902,"t":"Jérusalem, Jérusalem !","s":[[0,["Jérusalem, Jérusalem !","Qui tues les prophètes","Et qui lapides ceux qui te sont envoyés !","Combien de fois ai-je voulu","Rassembler tes enfants","Comme une poule rassemble ses poussins","Sous ses ailes.","Et vous ne l’avez pas voulu ! (bis)"]]]},{"n":903,"t":"La nature parle d'un créateur.","s":[[0,["La nature parle d'un créateur.","Et le vent murmure Sa grandeur,","Mais si on me parle d'un Sauveur","Qu'est-ce donc pour moi ?","Il y a longtemps en Galilée","On me dit qu'un Sauveur nous est né.","S'il est venu pour nous racheter,","Qu'est-ce donc pour moi ?"]],[0,["Puis un jour je Le vis face à face.","Je goûtai la douceur de Sa grâce.","Alors je compris qu'il n'était pas un être"]],[1,["[artificiel,"]],[0,["Un Dieu loin dans le ciel, non !","Maintenant Il vit tout près de moi.","Chaque jour à chaque heure, Il est là.","Qui sur le chemin guide mes pas.","Il est tout pour moi.","Oui, Il est tout pour moi."]]]},{"n":904,"t":"Dieu dût aimer un pécheur tel que moi,","s":[[0,["Dieu dût aimer un pécheur tel que moi,","Il a changé ma tristesse en joie","Il n'eût de repos qu'il m'ait ramené,","Quel est ce merveilleux amour !"]],[1,["Oh! quel merveilleux amour,","Oh! quel merveilleux amour,","Que Dieu aimât un pécheur tel que moi,","Quel est ce merveilleux amour !"]],[0,["Et Christ s'est donné librement pour moi,","Cela coûta Sa mort sur le Calvaire,","La langue humaine n'a pas de noble thème,","Comme cet amour qui me sauva."]],[0,["Pour un perdu condamné comme moi,","Le Père pourvut et le Sauveur mourut,","C'est le rachat pour un esclave indigne","Qui, longtemps, méprisa la grâce."]],[0,["Et maintenant, en Son coeur je suis fils,","Me dit que je ne suis plus serviteur;","Les vagabondages du monde sont finis,","Ses bras sont largement ouverts."]]]},{"n":905,"t":"Oh ! Gloire à Toi, divin Sauveur","s":[[0,["Oh ! Gloire à Toi, divin Sauveur","Reviens, nous T ’attendons","Toi qui nous as ainsi aimés","Reviens, nous T ’attendons"]],[1,["Reviens Seigneur vers Tes enfants","Nous T ’attendons les cœurs brisés","Le monde a touché à sa fin","Reviens, nous T ’attendons"]],[0,["Toi qui abandonnas le trône","Reviens, nous T’attendons","Tu Te fis homme pour nous","sauver Reviens, nous T’attendons","Par Ton sang, Tu nous rachetas","Reviens, nous T’attendons","Par Tes meurtrissures, oh ! Seigneur","Reviens, nous T’attendons"]],[0,["Bientôt tout est fini, Seigneur","Reviens, nous T’attendons","Nous Te louons, puissant vainqueur","Reviens, nous T’attendons."]]]},{"n":906,"t":"Es-tu lassé, rempli de tristesse ?","s":[[0,["Es-tu lassé, rempli de tristesse ?","Dis tout à Jésus ! Dis tout à Jésus !","Son cœur est ouvert à ta voix sans cesse.","Oh ! Dis tout à Jésus !"]],[1,["Dis tout à Jésus ! Oh ! Dis-Lui tout !","Combien Son accueil est doux.","Il peut comprendre, Il aime à t'entendre","Dis-Lui simplement tout !"]],[0,["Il voit tes yeux rougis par les larmes :","Dis tout à Jésus ! Dis tout à Jésus !","Il connaît ton cœur, Il sait tes alarmes.","Oh ! Dis tout à Jésus !"]],[0,["Si ton passé surgit comme une ombre :","Dis tout à Jésus ! Dis tout à Jésus !","Il peut effacer tes péchés sans nombre.","Oh ! Dis tout à Jésus !"]],[0,["Et pour demain ce que tu redoutes :","Dis tout à Jésus ! Dis tout à Jésus !","Il est près de toi le long de la route.","Oh ! Dis tout à Jésus !"]]]},{"n":907,"t":"Seigneur, ce que mon cœur réclame,","s":[[0,["Seigneur, ce que mon cœur réclame,","C’est le feu. (x3)","Que sur moi descende la flamme","De Ton feu. (x3)","Ainsi que dans la chambre haute,","Qu'une nouvelle Pentecôte","Fasse de nous de vrais apôtres,","Pleins de feu! (x3)"]],[0,["Le seul secret de la victoire,","C’est le feu! (x3)","Nous voulons refléter Ta gloire","Par le feu! (x3)","Dieu Tout-Puissant, Toi qui nous aimes,","Viens nous affranchir de nous-mêmes.","Remplis-nous d’un amour suprême,","Par le feu! (x3)"]],[0,["Nous voulons porter l’espérance,","Par le feu! (x3)","Et proclamer la délivrance,","Par le feu! (x3)","Ton règne vienne sur la terre,","Ta volonté soit faite, ô Père.","Exauce enfin notre prière,","Par le feu! (x3)"]]]},{"n":908,"t":"Debout pour la sainte guerre !","s":[[0,["Debout pour la sainte guerre !","Le mal est grand encor;","Plus d’un ami, plus d’un frère","Suit un chemin de mort."]],[1,["En avant ! tous en avant !","Notre Chef est tout-puissant.","Nos armes sont la prière,","L'amour persévérant."]],[0,["Debout pour la sainte guerre !","Ranimons notre ardeur.","Avec la Croix pour bannière,","Qui ne serait vainqueur ?"]],[1,["En avant ! tous en avant !","Notre Chef est tout-puissant.","Nos armes sont la prière,","L'amour persévérant."]],[0,["Debout pour la sainte guerre !","Soyons unis et forts !","Qu’une charité sincère","Préside à nos efforts."]],[1,["En avant ! tous en avant !","Notre Chef est tout-puissant.","Nos armes sont la prière,","L'amour persévérant."]],[0,["Ô Dieu ! pour la sainte guerre","Revêts-nous tous en Christ","Des armes de la lumière,","Des dons de Ton Esprit."]],[1,["En avant ! tous en avant !","Notre Chef est tout-puissant.","Nos armes sont la prière,","L'amour persévérant."]]]},{"n":909,"t":"Ne m ’oublie pas, ô doux Sauveur","s":[[0,["Ne m ’oublie pas, ô doux Sauveur","Ecoute ma voix !","Quand Tu répondras aux autres","Ne m ’oublie pas !"]],[0,["Sauveur, Sauveur !","Ecoute ma voix:","Quand les autres, Tu appelles","Ne m ’oublie pas !"]],[0,["Qu’au Trône de miséricorde","Je trouve la paix,","Contrit profondément à genoux","Ôte mon incrédulité."]],[0,["Je me confie en Ton mérite","Pour chercher Ta Face.","Daigne guérir mon esprit brisé,","Sauve-moi par Ta grâce."]],[0,["Toi la source de mon confort","Plus que vie pour moi,","Qu’ai-je comme Toi sur la terre ?","Qui au ciel sans Toi ?"]]]},{"n":910,"t":"Comme un fleuve immense","s":[[0,["Comme un fleuve immense","Est la paix de Dieu.","Parfaite elle avance","Vainqueur en tout lieu ;","Parfaite elle augmente","Constamment son cours ;","Parfaite sa pente","S'abaisse toujours."]],[1,["Fondés sur Dieu même,","Nos cœurs à jamais","Ont pour bien suprême","Sa parfaite paix."]],[0,["Sous Ta main meurtrie,","Se brise, ô mon Roi !","Toute arme ennemie","Forgée contre moi !"]],[0,["Rien ne peut me nuire","Ni troubler mon cœur,","Tu veux me conduire,","Tu seras Vainqueur."]],[0,["Tu traces ma voie.","J'y marche avec foi ;","L'épreuve et la joie","Me viennent de Toi !","Cadran de nos vies,","Marque, chaque jour,","Les heures bénies","Du Soleil d'amour !"]],[0,["Océan de gloire,","Paix de mon Sauveur !","Gage de victoire !","Trésor de bonheur !","Ta grâce infinie,","Coulant nuit et jour,","Inonde ma vie","De vagues d'amour !"]],[1,["Selon Ta promesse,","O Jésus, mon Roi !","Je trouve sans cesse","Paix parfaite en Toi."]]]},{"n":911,"t":"Un chrétien je croyais être","s":[[0,["Un chrétien je croyais être","Mais j'ignorais le bonheur","Que Jésus, mon divin Maître","Vient apporter dans un cœur"]],[0,["Oh ! La paix que Jésus donne","Je ne la connaissais pas","Tout sur mon chemin rayonne","Depuis qu'il conduit mes pas !"]],[0,["Sa puissance souveraine","Maintenant règne sur moi","Du péché brise la chaîne","Me rend vainqueur par la foi."]],[0,["Et, tranquillement, j'avance","M'appuyant sur mon Sauveur","Son adorable présence","Me donne le vrai bonheur !"]]]},{"n":912,"t":"Il va venir, le Seigneur que j'adore","s":[[0,["Il va venir, le Seigneur que j'adore","Bientôt Sa voix retentira du Ciel.","A mes regards l'horizon se colore","Des purs rayons du soleil étemel."]],[0,["Gloire à Toi seul, Seigneur Jésus,","Gloire à jamais, gloire à Ton Nom !","De Ton beau Ciel, je ne sortirai plus","Et pour toujours, j'exalterai Ton Nom."]],[0,["Qu'autour de moi s'élève la tempête,","Je suis en paix car Tu veilles sur moi ;","Je puis, ô mon Sauveur, lever la tête,","Tu vas venir me prendre auprès de Toi."]],[0,["Maison du Père, où Ton amour m'appelle,","Sainte Cité, demeure des élus,","Les lieux qu'éclaire une gloire étemelle,","Me sont ouverts par Toi-même, ô Jésus !"]],[0,["Bonheur ineffable ! Quand dans Ta gloire,","Aux yeux des rachetés Tu paraîtras,","Jésus, avec le cri de la victoire","Près de Toi, pour toujours Tu me prendras."]]]},{"n":913,"t":"Ami de Jésus, ô quelle joie !","s":[[0,["Ami de Jésus, ô quelle joie !","Pour un ignoble comme moi,","D'avoir toujours un tel Ami","Pour me conduire au Ciel."]],[1,["Ami de Jésus,","Communion divine","O quelle bénie, douce communion","Jésus est bien mon Ami"]],[0,["Ami quand d'autres amitiés","Cessent ou me déçoivent,","Ami qui me donne joie et paix","Ami quand vient l'Ennemi."]],[0,["Un ami dans la maladie","Et quand approche la mort,","Ami quand je passe la vallée","Il m'aide et m'encourage."]],[0,["Ami quand ma courte vie s'arrête","Ami quand passe la paix,","Ami, à avoir au seuil du Ciel","Ami, enfin chez moi."]]]},{"n":914,"t":"Jésus, divin modèle","s":[[0,["Jésus, divin modèle","De douceur et de paix,","Ta divine voix m’appelle","A marcher, désormais,","Dans ce sentier de grâce,","De support, de bonté,","Où Tu laissas la trace","De Ton humilité."]],[0,["Tu passas sur la terre,","Dans l ’ineffable amour,","Que toute Ta carrière","A montré chaque jour.","Tu nous dis : « Je vous aime,","Nul n ’aime comme Moi,","amis, faites de même,","Car l’amour est Ma loi. »"]],[0,["Que mon esprit se range","A cette loi d’amour,","Pour vivre à Ta louange,","D ’un cœur droit sans détour.","Comme Toi, charitable,","Patient, humble et doux,","Saint, pur, irréprochable,","Faisant du bien à tous."]]]},{"n":915,"t":"Portant Sa croix, Il monte","s":[[0,["Portant Sa croix, Il monte","Le sinistre coteau ;","Dans l ’opprobre et la honte,","Muet comme un agneau.","Ce Sauveur débonnaire,","Pour le pécheur mortel,","Va trouver au calvaire,","La mort d’un criminel."]],[0,["Sur cette croix sanglante,","Sous le divin courroux,","Regarde, âme tremblante,","L’Agneau souffrant pour nous.","Il porte sur Sa tête","Nos péchés odieux ;","Il veut payer ta dette,","Pour t ’introduire aux Cieux","Oh ! Charité profonde !","Insondable grandeur !","Le Créateur du monde","Veut être ton Sauveur.","Ainsi, plus de détresse,","Jésus est ton recours !","Il est ta forteresse !","Il t ’aime pour toujours."]]]},{"n":916,"t":"Si riche, si profond","s":[[0,["Si riche, si profond","Insondable,","C'est l'Amour divin","L'Amour rédempteur."]],[1,["Pour moi, pour moi","Indigne sauvé par grâce","Pour moi, pour moi","L'Amour rédempteur"]],[0,["Immuable, incomparable,","Inexprimable,","C'est l'Amour divin","L'Amour rédempteur."]],[0,["Comme c'est beau, comme c'est doux,","De fredonner,","Cet Amour divin","L'Amour rédempteur."]]]},{"n":917,"t":"Je suis du nombre","s":[[0,["Je suis du nombre","de ceux qui sont vêtus de blanc."]],[0,["Du nombre de gens,","Lavés dans le sang de l’Agneau.","Je suis du nombre de ceux-là."]],[0,["Jean a vu ces gens-là,","lavés dans le sang de l’agneau.","Jean les vit tous vêtus de blanc."]],[0,["J’aime la vieille manière de prêcher, chanter,"]],[1,["[prier ;"]],[0,["J ’aime la vieille manière."]],[0,["Et moi je loue, je loue mon Sauveur","partout où je vais (x3)","Car il y a joie dans mon âme !"]]]},{"n":918,"t":"Qu'est-ce qui peut être plus merveilleux","s":[[0,["Qu'est-ce qui peut être plus merveilleux","Qu’est ce qui peut être plus béni","Que de consacrer notre vie","Au seigneur dans la foi ?"]],[1,["Oui j'aime (bis)","Oui j'aime mon Sauveur","Son Nom (bis)","Son Nom est doux pour moi"]],[0,["Nous sommes dans Sa présence","Vivons toujours ainsi","Nous voyons notre Seigneur","Et sommes heureux de cœur"]],[0,["Nous n'avons qu'une idée","De ce qui va arriver","Alors nous verrons de nos yeux","Ce que nous avons cru"]]]},{"n":919,"t":"À Celui qui nous aime","s":[[0,["À Celui qui nous aime","Qui nous a délivrés","De nos péchés","Par Son sang","Et qui a fait","De nous un Royaume,","Des sacrificateurs","Pour Dieu, Son Père."]],[0,["À Lui soient la Gloire","Et la Puissance","À Lui soient la Gloire","Et la Puissance","Aux siècles des siècles !","Amen !"]]]},{"n":920,"t":"Forts d’avoir prié ensemble","s":[[0,["Forts d’avoir prié ensemble","Et d’être unis,","Forts du Christ qui nous rassemble,","Et qui nous a tout dit.","Notre tâche ici commence,","Il faut que partout","On découvre, la présence","Du Dieu qui vit avec nous."]],[1,["Allons dire à tous nos frères,","Il est un Sauveur.","Le Christ a sauvé la terre","Et nous conduit au bonheur."]],[0,["Nous apportons nos misères,","Notre blessure","Gloire à Lui, gloire à Son Père,","Qui nous a aimés.","Durant toute la semaine,","Nous serons plus forts.","Si nous croyons sur la terre,","Il soutiendra nos efforts."]],[0,["Nourris à la même table,","Du même pain","Chez nous le plus misérable","Peut apaiser sa faim.","Entre nous, non plus de classes,","Riches ou petits.","Le Christ est de notre race,","Veut nous donner Son Amour."]],[0,["Jésus mort sur le calvaire, ressuscité","Est remonté vers le Père,","Et pour l’éternité.","Un jour, Il viendra nous prendre,","Peut-être aujourd’hui.","Tous ceux qui sauront l’attendre,","Triompheront avec Lui."]]]},{"n":921,"t":"Il est un Nom,","s":[[0,["Il est un Nom,","Un Nom béni et Saint,","Un Nom divin","Que nul n ’implore en vain.","De ce Nom vient","Le Salut des humains :","Le Nom de Jésus, précieux Jésus."]],[1,["Glorieux Nom (x3)","Le Nom de Jésus, précieux Jésus."]],[0,["Il est un Nom,","Qui guérit, qui console","Si doux, si beau","Qui pardonne et qui sauve","Si merveilleux","Puissant par sa parole","Le Nom de Jésus, précieux Jésus","Il est un Nom,","Qui signifie Espoir","Qui rend heureux,","Chassant le désespoir","En ce Nom Saint,","Dieu peut nous recevoir","Le Nom de Jésus, précieux Jésus.","Il est un Nom,","Le seul qui fut donné","Nom par lequel,","Je puis être sauvé","De tous les Noms","C’est le plus élevé","Le Nom de Jésus, précieux Jésus."]]]},{"n":922,"t":"Connais-tu de Dieu, le don merveilleux","s":[[0,["Connais-tu de Dieu, le don merveilleux","De Jésus notre grand Sauveur,","Et le Saint-Esprit, ce don glorieux.","C ’est la vie et le bonheur."]],[0,["Si tu savais comme Il t ’aime","Sans tarder, tu viendrais à Lui,","Tu viendrais à l ’heure même,","Tu viendrais dès aujourd’hui."]],[0,["Connais-tu le prix du sang précieux","Qui coula sur le mont Calvaire ?","Et de tes péchés, sans doute nombreux,","As-tu donc le pardon, mon frère ?"]],[0,["Et de ton salut, es-tu bien certain","Que Jésus t ’a sauvé par grâce ?","T’en vas-tu joyeux, le long du chemin,","Connaissant du Sang l ’efficace ?"]],[0,["Si de maladie, ton corps est souffrant,","Crois à Jésus toujours le même;","Ce grand médecin si compatissant,","Peut guérir jusqu’aux maux extrême."]]]},{"n":923,"t":"Où cherchez-vous le bonheur ?","s":[[0,["Où cherchez-vous le bonheur ?","Dans ce monde où tout passe ?","Avez-vous en votre cœur","Pour Jésus une place ?","A votre porte, Il se tient;","Sans se lasser, Il revient.","Pour Jésus, votre Sauveur,","N ’avez-vous point de place ?"]],[1,["N ’avez-vous point de place ? (bis)","Pour Jésus, votre Sauveur,","N ’avez-vous point de place."]],[0,["S’il a souffert, c’est pour vous,","Oh ! Merveilleuse grâce !","Lorsqu’il luttait à genoux,","Dieu Lui voilant Sa face.","Ah ! De Sa sublime croix,","N ’entendez-vous pas la voix","Qui vous dit : Pauvre pécheur,","N ’as-tu donc point de place ?"]],[0,["Si le monde a votre cœur,","Croyez-vous donc qu’il fasse","Jusqu’au bout votre bonheur ?","Vous savez que tout passe.","Oh ! Pendant qu’il en est temps,","Écoutez les doux accents","De la voix du grand Vainqueur,","Et faites-Lui donc place !"]]]},{"n":924,"t":"Oh ! Croyez que Dieu vous donne","s":[[0,["Oh ! Croyez que Dieu vous donne","Tout ce qu’il promet.","Un Sauveur qui vous pardonne,","Un Sauveur parfait.","Un Sauveur plein de puissance","Sur la terre et dans les deux,","Un Sauveur dont la présence","Seule rend heureux."]],[0,["Ce Sauveur vous fera vivre","Comme Il a vécu ;","Vous pourrez partout Le suivre","Sans être vaincu.","Jusqu’au bout dans la mêlée","Son bras vous protégera,","Et dans la sombre vallée,","Il vous conduira."]],[0,["Oh ! Jésus, dis-leur Toi-même","Que Ta forte main","Fait passer celui qui T ’aime","Par un sûr chemin,","Que Tu veux de toute chute","Préserver Ton faible enfant,","Pour qu’il sorte de la lutte","Pur et triomphant."]],[0,["Oui, Seigneur, malgré l’orage","Et malgré la nuit,","Nous voulons prendre courage,","Forts de Ton appui.","Et joyeux, pleins d’assurance,","Nous avancer vers le ciel,","En saluant à l’avance,","Le jour étemel."]]]},{"n":925,"t":"Le Seigneur m'aime, bonheur suprême,","s":[[0,["Le Seigneur m'aime, bonheur suprême,","le Seigneur m'aime, Il est amour !","Je redirai toujours : le Seigneur m'aime","Le Seigneur m'aime, Il est amour !"]],[0,["Dans la misère la plus amère,","dans la misère, j'étais plongé.","Je redirai toujours : le Seigneur m'aime","Le Seigneur m'aime, Il est amour !"]],[0,["Dans la souffrance sans espérance,","dans la souffrance, je gémissais.","Je redirai toujours : le Seigneur m'aime","Le Seigneur m'aime, Il est amour !"]],[0,["Dieu, dans Sa grâce prit à ma place,","Dieu dans Sa grâce, prit Son cher Fils.","Je redirai toujours : le Seigneur m'aime","Le Seigneur m'aime, Il est amour !"]],[0,["En sacrifice, à la justice,","En sacrifice, Il vint s'offrir.","Je redirai toujours : le Seigneur m'aime","Le Seigneur m'aime, Il est amour !"]],[0,["Il purifie toute ma vie,","Il purifie avec Son sang.","Je redirai toujours : le Seigneur m'aime","Le Seigneur m'aime, Il est amour !"]],[0,["A Toi la gloire et la victoire,","A Toi la gloire, Agneau de Dieu !","Je redirai toujours : le Seigneur m'aime","Le Seigneur m'aime, Il est amour !"]]]},{"n":926,"t":"Aussi longtemps","s":[[0,["Aussi longtemps","Qu’étranger sur la terre","Je foulerai","Les sentiers douloureux,","Fais qu’en tout temps,","A tout bien je préfère","Ce que Tu veux,","Seigneur ! Ce que Tu veux !"]],[0,["Oui, qu’en tout temps,","Sous la croix la plus dure","Aux jours mauvais","Comme aux jours radieux,","Je puisse dire,","Éloignant tout murmure :","Comme Tu veux,","Seigneur ! Comme Tu veux !"]],[0,["Je ne demande,","Ô mon Dieu ! Qu’une chose :","Sois mon trésor,","Mon appui précieux ;","Pour tout le reste,","Ordonne, fais, dispose","Comme Tu veux,","Seigneur ! Comme Tu veux !"]],[0,["Établis donc","Sur mon cœur Ton empire;","Règne si bien","Et par de si doux nœuds,","Que rien jamais","Ne m ’empêche de dire :","Comme Tu veux,","Seigneur ! Comme Tu veux !"]]]},{"n":927,"t":"Jésus quitta le trône de Son Père","s":[[0,["Jésus quitta le trône de Son Père","Et descendit ici-bas sur la terre","Il accepta, la crèche pour berceau","Lui, Roi des rois, Le Fils de Dieu Très-Haut."]],[1,["Oh ! Oui, c 'est vrai !","Je sais que c ’est vrai !","Il est écrit, cela suffit,","Que Jésus m'aime !","Oh ! Bonheur suprême !","La Bible me le dit !"]],[0,["En tous lieux portant la délivrance,","Faisant le bien, guérissant la souffrance,","Il pardonnait au pécheur repentant,","Il bénissait jusqu’au petit enfant."]],[0,["Il fut cloué sur la Croix méprisable,","Lui, Juste et Saint, mourut pour moi coupable,","Pour me sauver, Son sang fut répandu;","C’est pourquoi j ’aime le Seigneur Jésus !"]],[0,["Plus que vainqueur ; Il sortit de la tombe.","Gloire à l’Agneau Divin, Sauveur du monde !","Il règne au Ciel, intercède pour moi,","Et viens bientôt me chercher, je le crois."]]]},{"n":928,"t":"Nous chantons","s":[[0,["Nous chantons","A Jésus l’Agneau","Et nous Lui rendons","Notre adoration","Lui qu’un jour","A subi la Croix","Quelle rançon d’amour","Le prix de Son sang,","Un jour au pied de Son Trône","Nos couronnes, nous jetterons","En acclamant Sa personne","Glorifiant son Nom."]],[1,["Retentiront Les alléluias","Et un cantique nouveau","Nous revêtirons la robe blanche","Au jour de Noces de l ’Agneau"]],[0,["Des pêcheurs","Oui, des vases de terre,","A tiré l’Agneau","Son Epouse parfaite.","C’est alors","Que là dans le Ciel","A Lui s ’uniront","Tous les rachetés.","Et nous boirons de la vigne,","Le vin nouveau du Seigneur","Nous les convives indignes,","C ’est la grâce de l’Agneau."]]]},{"n":929,"t":"Quand je m ’appuierai","s":[[0,["Quand je m ’appuierai","Sur un homme","Il faillira un jour."]],[1,["Sur Toi Jésus, j e m'appuie","Tu es mon Dieu, l ’ancre de mon âme","En Toi Jésus, en sécurité pour l'éternité"]],[0,["Quand je m ’appuierai","Sur ma richesse","Elle s’évanouira un jour."]],[0,["Quand je m ’appuierai","Sur ma jeunesse","Elle se corrompra un jour."]],[0,["Quand je m’appuierai","Sur la connaissance","Elle disparaîtra un jour."]],[0,["Quand je m ’appuierai","Sur la science","Elle s’évanouira un jour."]]]},{"n":930,"t":"Hosanna ! Béni soit le Roc,","s":[[0,["Hosanna ! Béni soit le Roc,","Béni soit le Rocher de mon salut !","Hosanna ! Béni soit le Roc,","Béni soit le Rocher de mon salut."]],[0,["Glorifions le Seigneur ensemble,","Car Il est digne de louange.","Glorifions le Seigneur ensemble,","Car Il est digne de louange."]],[0,["Gloire à Son Nom, Gloire à Son Nom.","Il vit et règne éternellement.","Gloire à Son Nom, gloire à Son Nom.","Il vit et règne éternellement."]],[0,["Jéhovah Jiré est Son Nom","Car Il pourvoit à mes besoins.","Jéhovah Jiré est Son Nom","Car Il pourvoit à mes besoins."]],[0,["Jéhovah Rapha est Son Nom","Car Il guérit mes maladies.","Jéhovah Rapha est Son Nom","Car Il guérit mes maladies."]],[0,["Jéhovah Shalom est Son Nom","Car Il me dorme de Sa paix.","Jéhovah Shalom est Son Nom","Car Il me dorme de Sa paix."]],[0,["Jéhovah Nissi est Son Nom","Car l ’Etemel est ma bannière","Jéhovah Nissi est Son Nom","Car l’Etemel est ma bannière"]],[0,["Jéhovah Shamma est Son Nom","Car Il est ici avec nous.","Jéhovah Shamma est Son Nom","Car Il est ici avec nous."]]]},{"n":931,"t":"Mon Sauveur m ’aime,","s":[[0,["Mon Sauveur m ’aime,","Quel ferme appui pour ma foi.","L’Amour suprême","Descend vers moi !","Dieu vint sur la terre","Vivre en Homme de douleur ;","Voyant ma misère,","Il m ’ouvre Son cœur."]],[1,["Jésus ! Jésus !","Qui peut sonder Ton amour ?","Jésus ! Jésus !","Je T ’aime en retour."]],[0,["Mon Sauveur m ’aime","Malgré mon indignité,","Toujours le même,","Plein de pitié !","Il voit ma souffrance,","Il enlève mon souci ;","Son amour immense","Est mon sûr abri."]],[0,["Mon Sauveur m’aime","Comme un joyau précieux","Du diadème","Qu’Il porte aux cieux.","Sa vie étemelle,","Il la partage avec moi ;","Sa gloire immortelle,","Il offre à ma foi."]]]},{"n":932,"t":"Notre Chef et Maître,","s":[[0,["Notre Chef et Maître,","C ’est le Roi des rois;","Portant ferme Sa bannière,","Sans craintes ni doutes,","Soldats de la Croix,","Avançons dans la lumière."]],[1,["En avant ! En avant !","Pour Jésus-Christ, le Roi des rois","Nous Le couronnons et marchons","Sous la bannière de la Croix !"]],[0,["Que l’ennemi vienne,","Comme l’ouragan,","Déployons notre bannière","Sous Sa garde sainte.","Jamais de Satan","Notre âme n’est prisonnière."]],[0,["Sur mer et sur terre,","Qu’à tout être humain","Soit annoncé l’Evangile !","La sainte bannière","De l’Agneau divin","Plantons dans l’arène hostile"]],[0,["Et le jour de gloire","Bientôt paraîtra !","L’aube, nous la voyons luire,","Où, sous la bannière","De la croix, vaincra","Du Christ, l’étemel empire."]]]},{"n":933,"t":"Pèlerin sur cette terre,","s":[[0,["Pèlerin sur cette terre,","Je m ’avance vers le Ciel,","Vers le pays de lumière,","Séjour étemel !","Ici d’ennemis sans nombre","Je me vois environné,","Ma route souvent est sombre,","Mais je suis aimé."]],[0,["Aimé du plus tendre Père","Qui m ’a conduit en chemin,","Et dirigé ma carrière","Par Sa sûre main.","Pendant l ’épreuve et l ’orage,","Dans l’angoisse et dans la douleur,","Sa voix me dit : « prends courage,","Je suis ton Sauveur ! »","Travailler pour un tel Maître,","Le servir en L’attendant,","Apprendre à Le mieux connaître","En Le contemplant !","Quel bonheur incomparable,","Et qu’il est heureux mon sort !","Oui, mon Sauveur adorable","Me conduit au port !"]],[0,["Le port, c’est le doux rivage","Où cesseront tous nos pleurs,","Où de Jésus Christ l ’image","Ravira nos cœurs.","Qu’importe donc la souffrance,","Jésus vient ! Levons les yeux !","Bien près est la délivrance,","Ils s’ouvrent, les Cieux !"]]]},{"n":934,"t":"Il y a un jour qui vient,","s":[[0,["Il y a un jour qui vient,","Où les maux ne seront plus,","Ni les nuages dans le ciel,","Plus de larmes à jamais.","Tout est paix et pour toujours","Sur l’autre rive pavée d’or","Oh quel jour, glorieux jour ce sera !"]],[1,["Oh quel jour ce sera,","Quand mon Jésus, je verrai,","Et je vois de face","Celui qui m’a sauvé par Sa grâce.","Quand Il me prend par la main","Me conduit à la terre promise","Oh quel jour, glorieux jour ce sera !"]],[0,["Il n’y aura ni chagrin,","Ni fardeau à porter,","Non plus la maladie,","Douleur et séparation.","Pour toujours, je serai","Avec Celui qui est mort pour moi.","Oh quel jour, glorieux jour ce sera"]]]},{"n":935,"t":"Il me conduit, douce pensée !","s":[[0,["Il me conduit, douce pensée !","Repos pour mon âme lassée !","En tous lieux, Son regard me suit","Et par la main, Christ me conduit."]],[1,["Il me conduit, Il me conduit !","Désormais pour Lui, je veux vivre ;","Brebis fidèle, je veux suivre","Le bon Berger qui me conduit."]],[0,["Jésus sur moi veille sans cesse,","Dans la joie et dans la tristesse,","Dans le jour comme dans la nuit,","Pas à pas, Sa main me conduit."]],[0,["Comme un rempart, Il me protège ;","Il me préserve de tout piège,","Loin de moi, l’ennemi s’enfuit","Quand par la main, Christ me conduit."]],[0,["Quand mon heure aura sonné,","Mon œuvre ici-bas terminée,","Je dirai dans la sombre nuit :","Je ne crains point, Il me conduit."]]]}];</script>

async function awake(on){
 if(window.AndroidApp&&AndroidApp.keepAwake){try{AndroidApp.keepAwake(!!on)}catch(e){}return}

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=t=>t.replace(/[\s,;:.]+$/,'');
// Normalisation : sans accents, sans ponctuation, « œ » = « oe » ; garde la correspondance avec le texte d'origine
function N(s){let o='',ix=[];for(let i=0;i<s.length;i++){let c=s[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();if(c==='œ')c='oe';else if(c==='æ')c='ae';if(!/^[a-z0-9]+$/.test(c))c=' ';for(const ch of c){o+=ch;ix.push(i)}}return{o,ix}}
const nz=s=>N(s).o.replace(/ +/g,' ').trim();
const norm=nz;
let qPhrase='';
function marks(o,w,pre){const r=[];let i=-1;while((i=o.indexOf(w,i+1))>=0){if((i===0||o[i-1]===' ')&&(pre||i+w.length===o.length||o[i+w.length]===' '))r.push([i,i+w.length])}return r}
function hl(text,words,phraseOnly){
 if(!words||!words.length)return esc(text);
 const {o,ix}=N(text),on=new Array(text.length).fill(false);
 const oc=o.replace(/ +/g,' ');let rs=[];
 // expression complète d'abord (espaces multiples tolérés), sinon mot à mot
 if(words.length>1&&qPhrase){const re=new RegExp('(^| )'+qPhrase.split(' ').map(x=>x.replace(/[^a-z0-9]/g,'')).join(' +'),'g');let m;while((m=re.exec(o))){const s=m.index+m[1].length;rs.push([s,s+m[0].length-m[1].length]);if(re.lastIndex===m.index)re.lastIndex++}}
 if(!rs.length&&!phraseOnly)words.forEach((w,k)=>{if(w&&(words.length===1||w.length>2))rs.push(...marks(o,w,k===words.length-1))});
 for(const[s,e]of rs)for(let k=s;k<e;k++)on[ix[k]]=true;
 let r='',m=false;for(let i=0;i<text.length;i++){if(on[i]!==m){r+=on[i]?'<mark>':'</mark>';m=on[i]}r+=esc(text[i])}return r+(m?'</mark>':'');
}
function isMob(){return window.innerWidth<=900}

let qWords=[];
// Moteur de recherche : numéro, titre, puis paroles (expression exacte, puis tous les mots, puis résultats approchants)
// Tous les mots doivent être entiers, sauf le dernier qui peut être en cours de frappe.
function search(raw,src){
 const q=nz(raw);qWords=[];qPhrase='';
 if(!q)return{rows:src.map(h=>({h})),mode:'all'};
 if(/^\d+$/.test(q)){
  const ex=src.filter(h=>String(h.n)===q),pre=src.filter(h=>String(h.n).startsWith(q)&&String(h.n)!==q);
  return{rows:[...ex,...pre].map(h=>({h})),mode:'num'};
 }
 const words=q.split(' '),last=words.length-1;qWords=words;qPhrase=q;
 const sp=' '+q,has=(t,w,k)=>t.includes(' '+w+(k===last?'':' '));
 const inLine=x=>words.reduce((c,w,k)=>c+(has(x,w,k)?1:0),0);
 let rows=[];
 for(const h of src){
  let s=0,l=null;
  if(h.tn.includes(sp))s=h.tn.startsWith(sp)?1000:950;
  else{
   const li=h.ln.findIndex(x=>x.includes(sp));
   if(li>=0){s=800;l=h.lines[li]}
   else if(h.fn.includes(sp)){s=700}
   else if(words.length>1&&words.every((w,k)=>has(h.fn,w,k)))s=500;
   if(s&&!l){let bi=0,bc=-1;h.ln.forEach((x,i)=>{const c=inLine(x);if(c>bc){bc=c;bi=i}});l=h.lines[bi];if(s===500)s+=bc===words.length?100:bc*5}
  }
  if(s)rows.push({h,s,l});
 }
 let approx=false;
 if(!rows.length){
  const big=words.filter(w=>w.length>2);
  if(big.length>=2){
   const need=Math.max(2,Math.ceil(big.length*.6)),hb=(t,w)=>t.includes(' '+w);
   for(const h of src){const c=big.filter(w=>hb(h.fn,w)).length;if(c>=need){let bi=0,bc=-1;h.ln.forEach((x,i)=>{const k=big.filter(w=>hb(x,w)).length;if(k>bc){bc=k;bi=i}});rows.push({h,s:100+c*10+bc,l:h.lines[bi]})}}
   approx=rows.length>0;if(approx){qWords=big;qPhrase=''}
  }
 }
 rows.sort((a,b)=>b.s-a.s||a.h.n-b.h.n);
 return{rows,mode:approx?'approx':'text'};
}
const plural=n=>n+(n>1?' cantiques':' cantique');

}

  :`<li class="empty">${tab==='fav'&&!raw?'Aucun favori pour le moment.<br>Touchez l’étoile d’un cantique pour l’ajouter.':tab==='rec'&&!raw?'Les cantiques ouverts apparaîtront ici.':'Aucun cantique ne correspond à « '+esc(raw)+' ».<br>Essayez avec moins de mots ou d’autres mots du cantique.'}</li>`;

 if(isMob()&&!store.get('lad-swipe',false)){store.set('lad-swipe',true);setTimeout(()=>toast('Astuce : glissez à gauche ou à droite pour changer de cantique'),700)}
 if(p)$('pv').onclick=()=>show(p.n);if(nx)$('nx').onclick=()=>show(nx.n);

 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(/macintosh/i.test(ua)&&'ontouchend' in document),android=/android/i.test(ua);
 let dismissed=false;try{dismissed=localStorage.getItem('lad-inst-x')==='1'}catch(e){}
 let deferred=null;
 const share='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
 function showBanner(html,withBtn){if(standalone||dismissed)return;if(html)txt.innerHTML=html;go.hidden=!withBtn;inst.hidden=false}
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showBanner('<b>Installer l’application</b>Sur votre écran d’accueil, utilisable sans internet.',true)});
 go.onclick=async()=>{if(!deferred)return;deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')inst.hidden=true};
 document.getElementById('instX').onclick=()=>{inst.hidden=true;try{localStorage.setItem('lad-inst-x','1')}catch(e){}};
 window.addEventListener('appinstalled',()=>{inst.hidden=true;const t=document.getElementById('toast');t.textContent='Application installée sur votre écran d’accueil';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500)});
 if(!standalone){
  if(ios)showBanner('<b>Installer sur iPhone</b>Touchez '+share+' <b style="display:inline">Partager</b>, puis « Sur l’écran d’accueil ».',false);
  else if(android)setTimeout(()=>{if(!deferred)showBanner('<b>Installer l’application</b>Menu ⋮ puis « Installer l’application ».',false)},4000);
 }
 if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script><!--/PWA-JS-->

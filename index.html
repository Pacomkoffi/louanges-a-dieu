0,["On est bien à la maison","Quand règne l’amour","La joie est dans chaque cœur","Quand règne l’amour.","C’est la paix la bonne humeur,","Le véritable bonheur»","Le temps passe avec douceur","Quand règne l’amour."]],[1,["O foyer, chaque jour","Le temps passe avec douceur","Quand règne l’amour."]],[0,["Vers Dieu s’élève un doux chant","Quand règne l’amour","Point de mots rudes et méchants ;","Quand règne l’amour.","Partout sur notre chemin","Fleurissent roses et jasmins.","La terre est un beau jardin,","Quand règne l’amour."]],[0,["Le ciel sourit, bienveillant","Quand règne l’amour","Chacun se montre accueillant","Quand règne l’amour.","Plus gaiement chante l’oiseau","Et murmure le ruisseau","L’azur du ciel est plus beau","Quand règne l’amour."]],[0,["Jésus! Tout entier, prend moi","Pour que chaque jour","Notre foyer soit par Toi","Grand dans l’amour.","Tu me mettras à l’abri","De tout mal, de tout souci.","Par Toi, je serai béni","Jésus, Roi d’amour."]]]},{"n":428,"t":"Il m’appelle, Il m’appelle","s":[[0,["Il m’appelle, Il m’appelle","J’entends Sa voix mais je ne réponds pas.","Il insiste, Il insiste,","Mais je remets tout temps à plus tard.","Je regarde tous mes bijoux","Et pendant ce temps Il patiente.","Je regarde mes somptueuses robes","Que j’ai bien du mal à quitter,"]],[1,["Les choses de ce monde m’attirent,","Pourtant je sais là n’est point mon salut","Seigneur, donne-moi la force","De tout quitter de tout abandonner","Là n’est point mon salut."]],[0,["Il m’appelle, Il m’appelle","Je sais que c’est Lui mon Sauveur.","Je sais qu’il viendra enlever Son épouse","Puis juger les vivants et les morts.","Je veux Le suivre dans la lumière","Mais l’ennemi me retient captif","Dans les ténèbres où je me trouve","J’aperçois déjà la lumière."]],[0,["Il m’appelle, Il m’appelle","Je lui dis Seigneur Tu me connais","Sans Ton aide je ne peux rien.","A Toi de me délivrer Seigneur.","L’ennemi est plus fort que moi,","Mais je sais que Tu es plus fort que lui.","Viens ôter les chaînes qui me retiennent","Et m’empêche de venir vers Toi."]]]},{"n":429,"t":"J’ai longtemps erré sans guide,","s":[[0,["J’ai longtemps erré sans guide,","Altéré de vrai bonheur","Mais hélas! Mon cœur avide","Ne trouvait que la douleur."]],[1,["Où sera la main puissante","Qui pourra par son effort","M’arrêter sur cette pente","Où déjà, je vois la mort"]],[0,["Un sauveur, Jésus Lui-même","Eu pitié de mon effroi","Il me dit «Pécheur, Je t’aime","J’ai versé Mon sang pour toi»"]],[1,["O Jésus, Ta main puissante","M’a sauvé de mon tombeau","Et Tu combles mon attente","Par le don d’un cœur nouveau."]],[0,["J’ai saisi cette assurance","Ce pardon qu’ll m’apportait","J’ai livré sans résistance","Tout mon cœur, Il le voulait."]],[1,["O Jésus, Ta main puissante","M’a sauvé de mon tombeau","Et Tu combles mon attente","Par le don d’un cœur nouveau."]],[0,["Dans mon cœur pur et guéri","J’ai reçu le Saint Esprit","Et ce sceau divin m’affirme","Que je suis à Jésus-Christ."]],[1,["Ô Jésus, Ta main puissante","M'a sauvé de mon tombeau","Et tu combles mon attente","Par le don d’un cœur nouveau."]],[0,["Maintenant de joie en joie","Mon Sauveur me fait marcher","Car la paix que Christ m’envoie","Nul ne peut me l’arracher."]],[1,["A ce Jésus qui me donne","Et Sa paix et Son amour","A Jésus, je m’abandonne","Désormais et sans retour."]]]},{"n":430,"t":"Tu payas mon salut","s":[[0,["Tu payas mon salut","Par Ton grand sacrifice","O Seigneur quel mystère d’amour","Désormais par Ton saint","Et glorieux service","Ton racheté se donne en retour"]],[1,["Je viens à Ton autel","Offrande volontaire","Librement, je veux servir mon Roi","Je ne veux désormais","Que Ta gloire, ô mon Père","Ne vivre que par Toi et pour Toi."]],[0,["Prends tout ce que je suis","Prends mon cœur et mon âme,","Que tout mon être Te soit livré.","Contrôlé par l’Esprit","Animé de Ta flamme","Et de Ta parole, pénétrée."]],[0,["Seigneur de jour en jour","Transforme à Ton image","Ton enfant, Ton heureux racheté","Devant moi n’est qu’un but :","Jusqu’au bout du voyage,","Connaître et faire Ta volonté"]],[0,["Ton Nom seul ô Jésus","Sera ma délivrance","Et Tes biens sont pour moi les meilleurs.","Bientôt je Te verrai","Glorieuse espérance","Après les combats et les douleurs."]]]},{"n":431,"t":"Repentez-vous de vos péchés","s":[[0,["Repentez-vous de vos péchés","Et revenez au Seigneur Jésus.","C’est pour nous tous qu’il a tant souffert","C’est pour nous tous que Son Sang a coulé."]],[1,["Venez, venez à Jésus.","Il vous attend avec des bras ouverts","Bientôt, l’unique porte sera fermée","Il ne restera plus que la colère."]],[0,["Souvenez-vous de ce grand cri","De douleur qui jadis a retenti","Sur la croix du calvaire à Golgotha","Lorsqu’il donna Sa vie pour nos péchés."]],[0,["Et maintenant Il vous invite","À venir a Lui pour être sauvés","C’est un salut gratuit qu’il vous offre","Pourquoi rejeter un si grand appel ?"]]]},{"n":432,"t":"Voir mon Sauveur face à face,","s":[[0,["Voir mon Sauveur face à face,","Voir Jésus dans Sa beauté,","Ô joie! Ô suprême grâce!","Ô bonheur! Félicité!"]],[1,["Oui, dans Ta magnificence","Je Te verrai, divin Roi!","Pour toujours en Ta présence","Je serai semblable à Toi!"]],[0,["Ta gloire est encore voilée,","Ah! D’un voile ensanglanté!...","Bientôt sera révélée","Ton ineffable beauté!"]],[0,["Oh! Quels transports d’allégresse,","Quand Tes yeux baissés sur moi,","Me diront avec tendresse:","«Je mourus aussi pour toi!»"]]]},{"n":433,"t":"Pour moi chrétien, la terre est un exil;","s":[[0,["Pour moi chrétien, la terre est un exil;","Mais tout est bien, mais tout est bien.","Il faut marcher de péril en péril;","Mais tout est bien, mais tout est bien."]],[1,["Pourquoi les pleurs, la terreur ou l’ennui?","Christ est à moi demain comme aujourd’hui","Au Ciel bientôt, je serai tout à Lui.","Oui, tout est bien, oui, tout est bien."]],[0,["Larmes, travail, deuil, tristesse ici-bas;","Mais tout est bien, mais tout est bien.","De Canaan, j’approche à chaque pas;","Oui, tout est bien, oui, tout est bien."]],[1,["En vain le monde et son charme trompeur","Dans ses liens veut retenir mon cœur;","J’avance en paix, les yeux sur mon Sauveur","Oui, tout est bien, oui, tout est bien."]],[0,["Encore un jour, et j’atteindrai le but;","Oui, tout est bien, oui, tout est bien.","Et je verrai le Pays du Salut;","Oui, tout est bien, oui, tout est bien."]],[1,["Encore un jour, le inonde va passer.","O pèlerin, marche sans te lasser;","Bientôt en Dieu, tu vas te reposer.","Oui, tout est bien, oui, tout est bien."]]]},{"n":434,"t":"Oh! Quel beau jour, où, devant Ta face,","s":[[0,["Oh! Quel beau jour, où, devant Ta face,","Tous Tes rachetés apparaîtront,","En célébrant Ta gloire et Ta grâce!","De leurs chants les deux retentiront."]],[1,["Nombreux comme le sable des plages!(bis)","Oh! Que ce sera beau,","Lorsque nous irons là-haut,","Aussi nombreux que le sable des plages!"]],[0,["Je la vois, cette armée innombrable,","Ses rangs reflétant l’éclat des deux,","Tressaillant d’un bonheur ineffable,","Sur le seuil du séjour radieux."]],[0,["De Son trône éclatant de lumière,","J’entends la douce voix du Seigneur:","«Venez, vous bien-aimés de Mon Père,","La couronne est à chaque vainqueur»."]],[0,["Puis au sein du vaste océan d’anges,","Nos cohortes déversent leurs flots;","L’univers tremble au son des louanges;","Plus de combats, de pleurs, de sanglots!"]]]},{"n":435,"t":"Au Ciel est la Maison du Père,","s":[[0,["Au Ciel est la Maison du Père,","Etincelante de beauté.","Tout en Elle est gloire et lumière,","Ineffable félicité."]],[1,["Vers le Ciel, vers le Ciel","Nous marchons vers le Ciel,","C’est au Ciel, c’est au Ciel","Qu’est notre héritage éternel."]],[0,["Là le bonheur est sans mélange,","Là le péché ne règne plus;","C’est l’amour et c’est la louange,","C’est la présence de Jésus."]],[0,["Dans nos fatigues sur la terre,","Dans nos combats et nos douleurs,","C’est toi, douce Maison du Père,","Que cherchent nos yeux et nos cœurs."]],[0,["Jours de peine ou jours d’allégresse,","Douce brise ou vents orageux,","Poussez-nous, poussez-nous sans cesse","Vers notre demeure des cieux."]]]},{"n":436,"t":"Connais-tu cette Cité,","s":[[0,["Connais-tu cette Cité,","La Cité céleste?","Dans ses murs, tout est clarté,","Plus d’ombre funeste.","Pèlerins et voyageurs,","Ici-bas dans les douleurs,","Toujours, ce trésor nous reste,","La Cité céleste."]],[0,["Connais-tu cette Cité,","La Cité bénie?","Où tout est félicité,","Sublime harmonie.","L’Agneau seul est son soleil","Et son éclat sans pareil,","Illumine et vivifie","La Cité bénie."]],[0,["D’or, de perles, et d’azur","Est notre patrie!","Connais-tu le fleuve pur","L’arbre de la Vie?","Plus de fardeaux à jamais,","Pour les élus, tout est paix!","De Dieu, la Cité chérie,","C’est notre patrie."]],[0,["O Salem, repos si doux,","Mon cœur te désire!","Après son Chef, son Epoux,","L’Église soupire!","Être toujours devant Toi,","Mon Seigneur! Mon divin Roi,","Pour Te chanter et Te dire:","Mon cœur Te désire."]]]},{"n":437,"t":"Pourquoi crains-tu mon âme","s":[[0,["Pourquoi crains-tu mon âme","Au fort de la souffrance","Le Seigneur n’est-Il pas","Ton appui, ton assurance ?","Élève en haut les yeux,","Il est ta délivrance ;","Il ne te laisse pas","Mon âme ne craint rien."]],[0,["Il te faille affronter","Tourments, combats, épreuves","Passer par le creuset","Où l’on affûte l’or","Entrer dans la fournaise","Ou traverser les fleuves,","Il reste mon Sauveur,","Mon guide, mon Trésor"]],[0,["Non, je ne craindrai rien","Ni Satan, ni le monde","Ne peuvent me ravir","Des bras du bon Berger.","Là, je savoure en paix","Sa charité profonde ;","Là, je suis toujours","À l’abri du danger."]]]},{"n":438,"t":"Rien ne satisfait","s":[[0,["Rien ne satisfait","Ni le monde ni l’argent","Si Jésus est oublié.","Tout château s’écroule","Et tout vase humain se fend","Sans Jésus à nos côtés."]],[1,["Au prix de trente pièces","Judas L’a livré","Juste au prix d’un esclave","Ils L’ont évalué.","Mais à ce Jésus même,","Mon cœur j’ai donné,","Qui me montre Son immense","Amour prenant mon péché."]],[0,["Il vient ici-bas","Pour le pécheur et perdu,","Qui dans Sa céleste gloire","Servant un si grand Amour","Comment ai-je pu","Venir à Jésus plus tard."]],[0,["Moi, Seigneur Jésus","Je T’avais aussi vendu","Pour tous les biens de ce monde","Mais pour celui-là même","O Seigneur, Tu mourus","Dans une agonie immonde."]]]},{"n":439,"t":"Seigneur, donne-moi des ailes","s":[[0,["Seigneur, donne-moi des ailes","Pour m’élever par la foi","Jusqu’aux rives éternelles,","Où je vivrai près de Toi,"]],[1,["C’est là-haut qu’est ma Patrie.","Là-haut, là-haut, je trouve mon Sauveur!","Ensemble aux sources de la vie","Abreuvons tous notre cœur."]],[0,["Loin du monde et de ses charmes,","Du péché, de la douleur,","Loin des pleurs et des alarmes,","Je veux m’élever, Seigneur."]],[1,["C’est là-haut qu’est ma Patrie.","Là-haut, là-haut, je trouve mon Sauveur!","Ensemble aux sources de la vie","Abreuvons tous notre cœur."]],[0,["Fais-moi des ailes de flamme","Pour porter en ces bas lieux","Ton salut aux pauvres âmes","Qui périssent loin des deux."]],[1,["Mais là-haut, j’ai ma patrie.","Là-haut, là-haut, je trouve mon Sauveur!","Ensemble aux sources de la vie","Abreuvons tous notre cœur."]]]},{"n":440,"t":"Sainte Sion, ô patrie éternelle!","s":[[0,["Sainte Sion, ô patrie éternelle!","Palais sacré qu’habite le grand Roi!","Où doit sans fin régner l’âme fidèle.","Quoi de plus doux que de penser à toi!"]],[0,["Dans tes parvis, tout est joie, allégresse,","Chants de triomphe, ineffables plaisirs;","Là, plus de deuil, plus de maux, de tristesse ;","Là, plus d’ennuis, de langueurs, de soupirs"]],[0,["Tes habitants ne craignent plus l’orage;","Ils sont au port, ils y sont pour jamais.","Leur ciel est pur, il n’a plus de nuage;","Dieu, dans leur cœur, fait demeurer la paix."]],[0,["Pour les élus, il n’est plus d’inconstance;","Tout est soumis aux lois d’un saint Amour;","Sur eux, le mal a perdu sa puissance:","C’est Dieu qui règne en cet heureux séjour."]],[0,["O mon Sauveur, qui par Ton sacrifice,","À Ton enfant ouvris ces nouveaux cieux.","Tu m’as couvert de Ta sainte justice:","Vers Ta Sion, j’élève en paix mes vœux."]]]},{"n":441,"t":"Reviens, reviens","s":[[0,["Reviens, reviens","Tu dissipes tes biens","Sur la terre étrangère","Loin des yeux de ton Père","O pauvre enfant perdu","Reviens, ô reviens.","Viens, viens, ô reviens."]],[0,["Reviens, reviens","Enfant parmi les siens,","Une joyeuse fête","En ton honneur s’apprête","O pauvre enfant perdu","Reviens, ô reviens","Viens, viens, ô reviens"]]]},{"n":442,"t":"Tentés, éprouvés, nous nous demandons","s":[[0,["Tentés, éprouvés, nous nous demandons","Pourquoi il en est toujours ainsi,","Tandis qu’il y en a d’autres autour de nous","Qui font le mal et ne s’inquiètent pas"]],[1,["Plus tard, nous saurons de quoi il s’agit.","Plus tard, nous comprendrons pourquoi.","Réjouis-toi mon frère, vis dans la lumière,","Bientôt nous comprendrons tout cela."]],[0,["Quand la mort vient frapper nos bien-aimés","Solitude et tristesse s’amènent.","Nous nous étonnons de ce que les hommes","Prospèrent même s’ils sont méchants."]],[0,["«Sois fidèle jusqu’à la mort» dit Jésus,","«Travaille encore un peu et patiente»","Ce chemin de larmes aura disparu","Quand nous franchirons la belle porte."]],[0,["Lorsque Jésus viendra dans Sa gloire,","Lorsqu’Il paraîtra sur la nuée,","Alors nous irons dans ce beau palais.","Bientôt nous saisirons tout cela."]]]},{"n":443,"t":"Consolez vos cœurs qui pleurent,","s":[[0,["Consolez vos cœurs qui pleurent,","Car en Jésus, tous ceux qui meurent","Dès à présent sont bienheureux.","L’Esprit de Dieu nous l’affirme;","Dépouillés de leur corps infirme,","Ils nous attendent dans les Cieux."]],[0,["Après tous leurs travaux,","Ils goûtent le repos, Alléluia!","De leurs combats, ils ont le prix","Et leurs œuvres les ont suivis."]],[0,["Là, plus de deuil ni d’alarmes,","Plus de fatigues, plus de larmes,","Pour eux, a cessé la douleur.","A la source de la Vie","Qui jamais ne sera tarie,","Ils puisent la paix, le bonheur.","Bientôt le jour luira","Où notre cœur dira: Alléluia!","Par Toi, Jésus, sauvés, bénis,","Avec eux, nous serons unis!"]],[0,["Au ciel avec les saints anges,","Nous célébrerons Tes louanges,","O Père, et celles de l’Agneau;","Il est notre délivrance,","Il nous a donné l’espérance,","Et nous triomphons du tombeau.","Pour nous, plus de terreur,","Nous avons un Sauveur, Alléluia!","C’est par Sa croix que dans les Cieux","Nous entrerons victorieux."]]]},{"n":444,"t":"Sais-tu pourquoi tu es malheureux ?","s":[[0,["Sais-tu pourquoi tu es malheureux ?","Sais-tu pourquoi tu n’es pas heureux ?","Car tu n’as pas Jésus dans ta vie,","Ce Sauveur veut venir aujourd’hui."]],[1,["Il te suffit (bis)","D’ouvrir ton cœur","Pour recevoir ce bon Sauveur."]],[0,["Sais-tu pourquoi tu n’as pas la paix ?","Sais-tu pourquoi tu n’es pas si gai ?","Il y a quelqu’un qui comble le vide","Du cœur humain qui vagabonde."]]]},{"n":445,"t":"Non, ce n’est pas mourir","s":[[0,["Non, ce n’est pas mourir","Que d’aller vers son Dieu","Et que de dire adieu à cette sombre terre,","Pour entrer au séjour de la pure lumière."]],[0,["Non, ce n’est pas mourir","Que de monter au Ciel","Au repos éternel,","À la gloire ineffable,","Après tous les combats d’un monde périssable!"]],[0,["Non, ce n’est pas mourir","Que d’adorer Jésus","Au milieu des élus","Célébrant Sa victoire,","Et d’être couronné d’allégresse et de gloire"]],[0,["Non, ce n’est pas mourir!","Trésors de vérité","D’amour, de sainteté,","O, sources de la vie!","Vous jaillirez sans fin pour mon âme ravie."]]]},{"n":446,"t":"Qui sont ces gens au radieux visage","s":[[0,["Qui sont ces gens au radieux visage","Que, par-delà les flots tumultueux,","Je vois là-bas sur le rivage","S’assembler pour monter aux cieux?"]],[1,["Des palmes à la main et couronnés de gloire.","Ils vont chantant le cantique nouveau:","«Heureux qui par la foi remporta la victoire,","Lavé dans le sang de l’Agneau!»"]],[0,["Ce sont des rois, jadis pauvres esclaves,","Dont Jésus-Christ a fait tomber les fers.","Libres enfin de leurs entraves,","Ils vont régner sur l’univers."]],[0,["Aux jours mauvais, aux heures solennelles,","Pendant l’épreuve ou la tentation,","Toujours ils restèrent fidèles","À leur noble vocation."]],[0,["Qu’ils sont heureux! L’épreuve est terminée","Du triste mal, ils ne souffriront plus,","Et désormais leur destinée","C’est de régner avec Jésus!"]]]},{"n":447,"t":"Dors, bien-aimé(e), ton œuvre est terminée","s":[[0,["Dors, bien-aimé(e), ton œuvre est terminée","Voici pour toi le soir de la journée.","Du grand repos l’heure est enfin sonnée,","À Dieu, mon frère (ma sœur), à Dieu."]],[0,["Si nous t’aimons, Christ t’aime davantage,","Il t’a conduit dans ton pèlerinage,","Il te soutient dans le sombre passage,","À Dieu, mon frère (ma sœur), à Dieu."]],[0,["Âme fidèle, entre dans la patrie","D’où la souffrance est à jamais bannie,","Bois à longs traits au fleuve de la Vie,","À Dieu, mon frère (ma sœur), à Dieu."]],[0,["Sublime espoir! Jésus-Christ va paraître,","Pour saluer le retour de ton Maître,","Ton corps, bientôt, glorieux va renaître,","À Dieu, mon frère (ma sœur), à Dieu."]]]},{"n":448,"t":"Dans ma vie, dans ma vie,","s":[[0,["Dans ma vie, dans ma vie,","Je veux servir Jésus, dans ma vie."]],[0,["Dans mon cœur, dans mon cœur,","Je veux aimer Jésus, dans mon cœur."]],[0,["De ma bouche, de ma bouche,","De mes mains, de mes mains,","Je veux toucher Jésus, de mes mains.","De mes pieds, de mes pieds,","Je veux suivre Jésus, de mes yeux."]]]},{"n":449,"t":"Alléluia oh! (ter) ? Jésus m’a sauvé.","s":[[0,["Alléluia oh! (ter) ? Jésus m’a sauvé.","Jésus m’aime, je le sais.","Il m’a cherché et m’a trouvé.","Mon Sauveur m’a racheté.","Il m’a donné le salut.","Alléluia!","Alléluia oh! (ter) ? Jésus m’a sauvé."]]]},{"n":450,"t":"Ce Sauveur merveilleux","s":[[0,["Ce Sauveur merveilleux","L’ami tant désiré","De mon cœur altéré.","Il n’est pas de bonheur","Qu’en ce divin Sauveur","Aussi je ne veux plus","Que le Nom de Jésus."]],[1,["Nom si beau, si pur,","Nom si merveilleux,","Son éclat remplit les deux."]],[0,["Que sont l’or et l’argent,","Quel plus beau présent","Que sont tous les honneurs","Si l’on devient trompeur","Dans l’immense univers.","Rien n’est plus cher,","Rien n’apaise mon cœur","Que Jésus est mon Sauveur."]],[0,["Les discours du prochain,","Les assauts du malin","Ne sauraient m’ébranler.","Christ est mon bouclier.","Il est mon Chef, mon Roi","Et je puis dans la foi","Du monde et de l’erreur,","Être plus que vainqueur."]]]},{"n":451,"t":"On ne peut servir deux maîtres","s":[[1,["On ne peut servir deux maîtres","Sans que l’un d’eux soit trompé,","Un jour, il faut bien l’admettre,","Un jour il faut décider."]],[0,["Décider qui tu veux suivre,","A qui tu veux t’attacher,","Celui pour qui tu veux vivre","A qui tu veux tout donner."]],[0,["Le monde t’offre ses richesses,","Et Jésus t’offre Sa paix.","Oh! Donne-lui ta jeunesse,","C’est Lui, la vraie liberté."]]]},{"n":452,"t":"N’est-ce pas au grand Dieu de tous,","s":[[0,["N’est-ce pas au grand Dieu de tous,","Maître puissant","Mais pourtant plein d’amour","Envers tous Ses enfants,","Que nous devons le chant","Gracieux des oiseaux,","Et que tout au printemps","Nous semble vraiment beau"]],[1,["Souvent, en regardant la nature fleurir","Quand revient le printemps","Et que les enfants qui rient","Se passent en mon esprit","Des pensées et des mots","Qui, de bonheur, me font","Le chanter aussitôt."]],[0,["Il est le Créateur","De toute la nature :","Du ruisseau dans les bois","Qui doucement murmure","Et des fleurs qu’au bord","Du courant, déçues se meurent.","Il a créé la terre et","Tout ce qui respire."]],[0,["S’Il a créé les hommes","Pour régner sur ce monde","Qu’Il a si bien rangé","Pour que la joie abonde,","C’est afin qu’ils soient","Libre de voir qu’Il est grand.","Mais eux ont préféré","De joie, être gourmands."]],[0,["Mais c’est un Dieu d’amour","Et parce qu’il a aimé","La créature et l’homme","Qu’Il avait façonné,","Il lui a tout donné,","Afin qu’il puisse aussi","En Le voyant si grand","Lui dire \"mon Dieu, merci\"."]],[0,["Et si Jésus un jour","Est mort sur une croix,","Et puis, s’il a porté","Nos fardeaux sur le bois,","C’est afin que nous,","Hommes, retrouvions la vraie vie.","Croyez-vous qu’avec Lui","C’est la joie dans la vie."]]]},{"n":453,"t":"Il y a une fontaine remplie du sang","s":[[0,["Il y a une fontaine remplie du sang","Tiré des veines d’Emmanuel","Les pécheurs plongés dans ce flot","Perdent toutes souillures."]],[0,["Le voleur mourant s’est réjoui","De voir cette fontaine.","Et là aussi, puis-je comme lui","Laver tous mes péchés."]],[0,["L’Agneau mourant, Son sang précieux","Ne perdra pas Sa vie","Jusqu’à ce que l’Eglise rachetée","Soit sauvée à jamais."]],[0,["Par la foi, j’ai vu ce courant","Que Tes blessures ravitaillent.","L’amour divin est mon seul thème","Le sera pour toujours."]],[0,["Puis dans un chant noble et doux","Je chanterai Ta puissance","Lorsque ma langue bourdonnante","Sera dans le tombeau."]]]},{"n":454,"t":"Le combat mes frères","s":[[1,["Le combat mes frères","Le combat s’aggrave","Demeurons en Jésus-Christ","Il vaincra pour nous"]],[0,["Tu diras à mes frères","Que le combat s’aggrave","Demeurons en Jésus-Christ","Il vaincra pour nous"]],[0,["Tu diras à mes sœurs","Que la lutte s’achève","Demeurons en Jésus-Christ","Il vaincra pour nous"]],[0,["Tu diras aux chrétiens","Qu’ils vivent la Parole","Qu’ils s’attachent à Jésus-Christ","Il vaincra pour eux"]],[0,["Avertis l’Eglise","Qu’elle combatte le bon combat","Demeurons en Jésus-Christ","Il vaincra pour nous"]]]},{"n":455,"t":"Le temps s’enfuit, l’heure passe,","s":[[0,["Le temps s’enfuit, l’heure passe,","Le jour fait place à la nuit;","Tout disparaît et s’efface,","Tout meurt et s’évanouit;","Oh! Ne perdons pas courage,","Disons-nous que, chaque jour,","Nous approchons du rivage.","Divin séjour!"]],[0,["Puisque le Seigneur de gloire","Est venu nous secourir,","Puisqu’il nous suffit de croire","Pour qu’il veuille nous guérir,","Confions-nous en Sa grâce;","À tous Il dit: «Viens et crois!","Je suis mort à votre place,","Mort sur la croix!»"]],[0,["Encore un peu de souffrance,","De combats et de travaux,","Puis viendra la délivrance","Et l’heureux jour du repos.","Je veux, ô mon tendre Père,","Vivre pour Toi désormais","Jusqu’au bout de ma carrière...","Oui, pour jamais!"]]]},{"n":456,"t":"Dieu soit avec toi jusqu’au revoir!","s":[[0,["Dieu soit avec toi jusqu’au revoir!","Âme fidèle et soumise,","Qu’Il te garde et te conduise","Jusqu’au grand repos du soir!"]],[1,["Au revoir, au revoir!","Dieu t’accompagne jusqu’au soir!","Au revoir, au revoir!","Dieu soit avec toi jusqu’au revoir!"]],[0,["Dieu soit avec toi jusqu’au revoir!","Abrite-toi sous Son aile;","Qu’en ton cœur» Il renouvelle","La foi, l’amour et l’espoir!"]],[0,["Dieu soit avec toi jusqu’au revoir!","Si des périls te menacent,","Ses bras éternels t’enlacent.","Contre eux, qui peut prévaloir?"]],[0,["Dieu soit avec toi jusqu’au revoir!","Bientôt Jésus va paraître:","Dans Sa gloire, notre Maître","Bientôt va nous recevoir!"]]]},{"n":457,"t":"Jésus soit avec vous à jamais!","s":[[0,["Jésus soit avec vous à jamais!","Vous guidant avec sagesse,","Vous entourent de tendresse","Vous remplissant toujours de Sa paix."]],[1,["Oh! Joyeuse et sainte espérance,","Pour ceux qui s’aiment en Jésus:","Nous nous verrons en Sa présence","Quand la mort, le deuil, ne seront plus."]],[0,["Avec vous au milieu du danger,","À l’heure de la détresse,","Qu’Il soit votre forteresse,","Qu’Il soit toujours votre bon Berger!"]],[0,["Avec vous quand votre ciel est bleu,","Comme au jour de la tempête,","Que Son cœur soit la retraite","Où vous trouverez la paix de Dieu!"]],[0,["Enfin, dans le dernier des combats,","Pour échanger cette terre","Contre la maison du Père,","Que Jésus vous porte dans Ses bras!..."]]]},{"n":458,"t":"Seigneur Jésus, céleste Frère","s":[[0,["Seigneur Jésus, céleste Frère","Bénis-nous en ce jour,","Toi qui descendis sur la terre","Pour montrer Ton amour,","Sur ces époux, fais pour toujours","Rayonner Ta lumière","Et qu’elle éclaire le chemin","Devant les pèlerins."]],[0,["Ils ont en Toi leur espérance,","Jésus parfait Sauveur.","Sois leur gardien, leur délivrance,","Leur puissant protecteur.","Répands sur eux le vrai bonheur","Par Ta sainte présence,","Seigneur, exauce maintenant","Les vœux de Tes enfants."]]]},{"n":459,"t":"Comme un phare sur la plage,","s":[[0,["Comme un phare sur la plage,","Perçant l’ombre de la nuit,","L’Amour de Dieu, dans l’orage,","Cherche l’homme et le conduit,"]],[1,["Ô Sauveur! Que Ta lumière","Resplendisse sur les flots,","Et, vers le ciel, qu’elle éclaire","Et sauve les matelots."]],[0,["Nulle étoile n’étincelle","Pour vous guider, ô nochers!","Qui gardera la nacelle","Des écueils et des rochers?"]],[0,["Dans la nuit qui m’environne,","De Ton amour, ô Jésus!","Que par moi, l’éclat rayonne","Aux yeux des marins perdus!"]]]},{"n":460,"t":"Si un ange venait m’annoncer","s":[[0,["Si un ange venait m’annoncer","Un autre Jésus-Christ","Que celui qui fut cloué","Je lui dirai: arrière de moi!"]],[1,["Oui, moi je sais en qui j’ai cru","Car Lui, je L’ai connu","Il est toujours avec moi","Tout au long du chemin étroit."]],[0,["Si, dans un premier assaut","Il venait de nouveau","Pour vouloir troubler ma paix,","Par la foi, je me défendrai."]],[0,["Et quand même il essaierait","Par tous ses vains discours","De faire naître en moi le doute","Oh! Jésus, je T’invoquerai,"]]]},{"n":461,"t":"J’avais fui la bergerie","s":[[0,["J’avais fui la bergerie","Et mon pasteur bienveillant","Je suivais dans ma folie","Le chemin long et bruyant","Mais abattue et meurtrie","Aux épines du chemin","Mon âme mourait flétrie","Comme une fleur au matin"]],[0,["Brebis affolée, errante","J’avais perdu tout bonheur.","Jésus vint tout sanglant","Il me pressa sur son cœur."]],[0,["Désormais si je veux vivre","Ici-bas ô mon Sauveur,","C’est pour T’aimer et Te suivre","A Jésus divin pasteur"]],[0,["Et si ton cœur s’agite,","Il bât dans le doute,","Et si ton âme palpite","Au seul espoir d’un sauveur,","N’attend plus, Christ est le même","Aujourd’hui comme autrefois.","Espère en Lui car Il t’aime","Il l’a montré sur la croix."]]]},{"n":462,"t":"Je devance les veilles,","s":[[0,["Je devance les veilles,","J’ouvre les yeux,","Pour lire Ta Parole","Je devance l’aurore,","Et je crie","J’espère en Tes promesses"]],[0,["C’est par la foi","Et par la persévérance","Que nous hériterons les promesses.","Conservons jusqu’à la fin cette espérance","Ayons du zèle,","Non de la paresse."]]]},{"n":463,"t":"La lutte suprême nous appelle tous,","s":[[0,["La lutte suprême nous appelle tous,","Et Jésus Lui-même marche devant nous.","Que Sa vue enflamme tous Ses combattants","Et soutienne l’âme des plus hésitants."]],[0,["Du Christ la bannière","Se déploie au vent,","Pour la sainte guerre,","Soldats, en avant!"]],[0,["L’ennemi redoute le nom seul du Roi;","Il fuit en déroute au cri de la foi.","Acclamons ensemble Jésus, d’un seul cœur","Et que l’enfer tremble à ce nom vainqueur."]],[0,["Nous suivons la trace des saints d’autrefois","Par la même grâce, sous les mêmes lois,","Vivant de miracles l’Église de Dieu,","De tous les obstacles triomphe en tout lieu."]],[0,["Que les ans s’écoulent, que de toutes parts","À grand bruit s’écroulent trônes et remparts","Notre citadelle ferme contre tout,","L’Église fidèle restera debout!"]],[0,["En avant, Jeunesse! Que ta noble ardeur","Jamais ne connaisse ni honte, ni peur!","Ton Chef invincible marche devant toi,","Et tout est possible aux hommes de foi."]],[0,["Reçois, Chef suprême, Monarque éternel,","D’un peuple qui t’aime le vœu solennel.","Gloire, amour, hommage au Ressuscité,","Qu’il soit d’âge en âge, partout exalté!"]]]},{"n":464,"t":"Marchons avec joie dans le bon chemin,","s":[[0,["Marchons avec joie dans le bon chemin,","Dans l’étroite voie du bonheur sans fin.","Laissons en arrière les biens d’ici-bas;","Prions notre Père de guider nos pas.","Comptant sur Sa grâce, remplis de Sa paix","Que rien n’embarrasse nos pas désormais."]],[0,["Si rude est la route, glissant le sentier,","Le Seigneur écoute qui Le sait prier.","Il est la lumière, le libérateur","Du cœur qui n’espère qu’en son Dieu Sauveur.","Sa toute-puissance défend le croyant;","Son amour immense sauve Son enfant."]],[0,["Et quand sonne l’heure de quitter ces lieux","Il a pour demeure le palais des deux!","Vêtements de gloire, d’immortalité,","Palmes de victoire pour l’éternité!","Voilà ce que donne le Seigneur Jésus!","Voilà la couronne de tous les élus."]]]},{"n":465,"t":"Venez au Sauveur qui vous aime,","s":[[0,["Venez au Sauveur qui vous aime,","Venez, Il a brisé vos fers;","Il veut vous recevoir Lui-même,","Ses bras vous sont ouverts."]],[1,["Oh! Quel beau jour, Sauveur fidèle,","Quand, nous appuyant sur Ton bras,","Dans la demeure paternelle","Nous porterons nos pas!"]],[0,["Venez, pécheurs, Il vous appelle,","Le bonheur est dans Son Amour,","Ah! Donnez-Lui ce cœur rebelle,","Donnez-le sans retour."]],[0,["Le temps s’enfuit, l’heure s’écoule,","Qui sait si nous vivrons demain?","Jésus est ici dans la foule;","Ah! Saisissez Sa main!"]]]},{"n":466,"t":"J’ai connu Jésus, ô jour merveilleux!","s":[[0,["J’ai connu Jésus, ô jour merveilleux!","Jour à ne pas oublier","Je marchais sur un chemin ténébreux","C’est Jésus qui m’a sauvé!","Oh! Quel amour! Quelle grâce infinie!","Il m’a vu dans ma détresse","Mon Maître, mon Seigneur et mon Ami!","Il m’a rempli de Son allégresse."]],[1,["L’Amour de Jésus m’a rempli de joie","Alléluia!","Lorsqué je L’ai rencontré à la Croix","Alléluia!","Il m’a tout pardonné","M’a lavé de mon péché","L’Amour de Jésus m’a rempli de joie","Alléluia!"]],[0,["Né de nouveau, j’ai reçu Son Esprit","Je suis un enfant de Dieu!","Déjà, je connais l’éternelle vie.","Mon chemin est lumineux!","Je me repenti de mes péchés","J’ai reçu Jésus en moi","Je n’ai point honte de le confesser","Oh! Quel privilège et quelle joie!"]],[0,["Jusqu’au jour où je serai dans le Ciel","Sa Parole est mon appui","Le Seigneur Jésus est toujours fidèle","Et le Salut en Lui","Vous qui chercher la route de la vie","Jésus est la Vérité!","Ecoutez Sa Voix, oh! Venez à Lui!","Pour toujours, vous serez libérez!"]]]},{"n":467,"t":"David n’avait rien que sa fronde","s":[[0,["David n’avait rien que sa fronde","Pour lutter contre le géant;","Mais au fond de son cœur d’enfant","Habitait une foi profonde.","Il savait bien que l’Éternel","Combattrait avec lui pour sauver Israël!"]],[0,["Il avançait ferme et tranquille","Contre le Philistin puissant,","Qui, l’œil hautain et méprisant,","Riait de son air juvénile,","Et se moquait de l’Eternel,","Qui choisissait David pour sauver Israël!"]],[0,["Mais sans trembler, d’une main sûre,","L’enfant, que son Dieu dirigeait,","Fit au colosse, d’un seul jet,","Une inguérissable blessure.","Et c’est ainsi que l’Eternel,","Selon Son bon plaisir, délivrait Israël!"]],[0,["Comme David, tu nous appelles","A de grands combats, ô Seigneur!","Pour en sortir à Ton honneur,","Comme David, rends-nous fidèles,","Et l’on verra que l’Eternel","Se tient auprès de nous, comme auprès d’Israël."]],[0,["Et si le mal nous environne,","Et s’il devient plus fort que nous,","Nous T’implorerons à genoux,","Toi qui ne rejettes personne!","Et, répondant à notre appel,","Tu lutteras pour nous, ô Sauveur-Éternel!"]]]},{"n":468,"t":"Bon Sauveur, berger fidèle,","s":[[0,["Bon Sauveur, berger fidèle,","Conduis-nous par Ton amour;","Et, de Ta main paternelle,","Nourris-nous au jour le jour."]],[1,["Béni sois-tu, tendre Maître,","Jésus, nous sommes à Toi,","A Toi seul nous voulons être,","Béni sois-tu, notre Roi!"]],[0,["Dans Tes riches pâturages,","Apprends-nous à Te chercher;","Que sous Tes divins ombrages","Nous sachions toujours marcher."]],[0,["Toi qui nous reçus par grâce,","Bien que faibles et pécheurs,","Par Ta puissance efficace","Purifie encore nos cœurs."]],[0,["Enfants, nous voulons Te plaire,","T’obéir, garder Ta loi.","Oh! Pour cela daigne faire","Que nous vivions par la foi!"]],[0,["Bon Sauveur, berger fidèle,","Pour que nous suivions Tes pas,","Remplis-nous d’un nouveau zèle","Et porte-nous dans Tes bras."]]]},{"n":469,"t":"Dans le désert aride,","s":[[0,["Dans le désert aride,","Perdu loin du Sauveur,","Je marchai, l’âme avide","De joie et de bonheur,","Quand de Christ, l’Amour resplendit","Illuminant ma sombre nuit."]],[1,["Amour qui m’enchaîne,","Me presse et m’entraîne.","Amour qui me sauve de la mort,","Me soutient, me garde et me rend fort."]],[0,["Guéri par les blessures","De l’homme de douleur,","Lavé de mes souillures,","Par le sang rédempteur,","Je redirai ce grand Amour","Qui m’enveloppe nuit et jour."]],[0,["Cet Amour ineffable,","Qui le racontera","Si ce n’est ce coupable","Que Jésus libéra.","Je chanterai ce grand Amour,","Oui, jusqu’à la fin de mes jours."]]]},{"n":470,"t":"Ne pleurez pas sur Moi, femmes","s":[[0,["Ne pleurez pas sur Moi, femmes","Pleurez sur vous et sur vos enfants","Car voici des jours viendront","Où l’on dira","Heureuses les stériles et les entrailles","Qui n’ont jamais enfanté","Et les mamelles","Qui n’allaitent point."]]]},{"n":471,"t":"Il est un brillant paradis,","s":[[0,["Il est un brillant paradis,","Où le céleste Père","Recueille et garde réunis","Ses saints dans la lumière."]],[1,["Vers cet asile glorieux","Élevons un regard pieux;","Bientôt, près de Jésus aux deux,","Nous serons pour toujours heureux.","Quoi! Pour toujours heureux?","Oui, pour toujours heureux!","Quoi! Pour toujours heureux?","Oui, pour toujours heureux!","Bientôt, près de Jésus aux deux,","Nous serons pour toujours heureux."]],[0,["Là-haut, sont allés avant nous","Tant de cœurs pleins de zèle,","Dont, au céleste rendez-vous","L’amitié nous appelle."]],[0,["Là-haut, la plus faible lueur","Du jour qui les inonde","Ferait pâlir et la splendeur","Et le bonheur du monde."]],[0,["Veillons! Que du divin amour","Notre âme soit nourrie,","Pour nous retrouver tous un jour","Dans la sainte Patrie."]]]},{"n":472,"t":"Jésus me demande d’être","s":[[0,["Jésus me demande d’être","Un rayon de soleil,","Qui gaiement fasse connaître","Son amour sans pareil."]],[1,["Un rayon de joie,","Un doux rayon de soleil,","Que Jésus envoie!","Oh! Quel bonheur sans pareil!"]],[0,["Jésus me demande d’être","Un rayon bienfaisant,","Comme un reflet de ce Maître","Aimable et complaisant."]],[0,["Oui, Seigneur, donne-moi d’être","Comme un rayon d’espoir,","Paraissant à la fenêtre","Quand le ciel est tout noir."]],[0,["Oh! Que m’oubliant moi-même,","Je ne m’efforce plus","Que d’être pour ceux que j’aime,","Un reflet de Jésus."]],[0,["Que partout mon gai sourire","Et ma joyeuse humeur","Soit un baume à qui soupire","Et réjouisse un cœur!"]],[0,["Que Jésus m’emploie","Et qu’il me rende pareil","Aux rayons de joie,","Aux doux rayons du soleil!"]]]},{"n":473,"t":"Un chrétien je voudrais être","s":[[1,["Un chrétien je voudrais être","À l'image de Ton Nom","Je voudrais chaque jour","Ressembler à celui","Dont je suis la voie"]],[0,["Quand tous les jours","Comment suivre Tes sentiers","C’est en observant Tes paroles","Ouvre mes yeux","Pour contempler Tes merveilles","Bénis sois-Tu oh, Eternel."]],[0,["Dans mon cœur","Je conserve Ta Parole","Afin de ne pas pécher contre Toi.","Merci Seigneur","De m’enseigner Ta volonté,","Et de Tes instructions."]]]},{"n":474,"t":"Eglise de Laodicée","s":[[1,["Eglise de Laodicée","As-tu ouvert les yeux","Pour voir la main","Puissante de Dieu","Dieu restitue Sa Parole","Il ramène Son Épouse."]],[0,["Entendez-vous","La voix du 7ème ange","Dieu restitue Sa Parole","Il ramène Son Épouse."]],[0,["Voyez ce qu’Elle","Est en train de faire","Dieu restitue Sa Parole","Il ramène Son Épouse."]],[0,["Voyez la Parole de Dieu","Est restaurée","Dieu restitue Sa Parole","Il ramène Son Épouse."]],[0,["Voyez les promesses de Dieu","Qui s’accomplissent.","Dieu restitue Sa Parole","Il ramène Son Épouse."]],[0,["Les années qu’ont dévorées","La sauterelle, et le gazam","Dieu restitue Sa Parole","Il ramène Son Épouse."]],[0,["Les années qu’ont dévorées","Le jélek et le hasil.","Dieu restitue Sa Parole","Il ramène Son Épouse,"]],[0,["L’épouse de Dieu","Est une vierge pure.","Dieu restitue Sa Parole","Il ramène Son Épouse."]]]},{"n":475,"t":"Tout joyeux bénissons le Seigneur,","s":[[0,["Tout joyeux bénissons le Seigneur,","Chantons et célébrons Ses louanges,","Adorons avec foi le Sauveur,","Nous joignant aux célestes phalanges."]],[1,["Gloire à Dieu, gloire à Dieu!","Que ce chant retentisse en tout lieu!","Gloire à Dieu, gloire à Dieu!","Que ce chant retentisse en tout lieu!"]],[0,["Dieu, dans Son incomparable Amour,","Du ciel envoya Son Fils unique,","Et la terre et les cieux, dans ce jour,","S’unissent pour chanter ce cantique:"]],[0,["Le châtiment qui produit la paix,","Jésus-Christ l’a subi pour mon âme;","Il voulut expier nos forfaits,","En mourant, Lui, sur le bois infâme."]],[0,["Nous voulons en retour, bon Sauveur,","T’aimer par-dessus tout autre chose;","Forme Ton Amour dans notre cœur,","Et puis, de chacun de nous, dispose!"]]]},{"n":476,"t":"Je suis petit, mais que m’importe?","s":[[0,["Je suis petit, mais que m’importe?","Du bon Berger, je suis l’agneau.","Je puis donc entrer par la porte","Qui mène au ciel tout Son troupeau."]],[1,["Ah! que je mette, (bis)","O bon Sauveur!","Sous ta houlette, (bis)","Mon jeune cœur!"]],[0,["Je suis petit, mais à mon âge,","Jésus, tu fus tout comme moi;","Si donc Ton Esprit me rend sage,","Alors je serai comme Toi."]],[0,["Je suis petit, mais si ma vie","Est aussi chétive ici-bas,","Jésus, la tienne est infinie,","Et d’elle, Tu m’enrichiras,"]]]},{"n":477,"t":"Mon frère si tu me vois","s":[[1,["Mon frère si tu me vois","Chantant le Nom de Jésus","Approches-toi de moi.","Ma sœur si tu me vois","Chantant le Nom de Jésus","Approches-toi de moi."]],[0,["Viens à la croix, âme perdue","Viens à la croix, brebis sans berger","Et tu verras une main tendue","Une main tendue pour te sauver."]],[0,["Viens à la croix, âme perdue","Viens à la croix, pécheur repentant","Et tu verras une main tendue","Une main tendue pour te racheter."]],[0,["Viens à la croix, toi qui a des soucis,","Viens à la croix, toi qui es délaissé.","Et tu verras comment Christ est bon","Et tu sauras qu’il est ton ami."]]]},{"n":478,"t":"Quand gronde la tempête","s":[[0,["Quand gronde la tempête","Sur l’onde sans limite","Mon cœur est tourmenté","Redoute l’ouragan","Seigneur, viens à mon aide (bis)","Ma barque est si petite","Si grand est l’océan."]],[0,["Seigneur, à Ta parole","Soudain l’effroi me quitte","Le flot tumultueux","S’apaise en un instant.","Seigneur, sois ma boussole (bis)","Ma barque est si petite","Si grand est l’océan."]],[0,["La barque a fait silence","L’étoile au ciel palpite,","L’étoile de la paix","Scintille au firmament.","Joyeux mon chant s’élance (bis)","Ma barque est si petite","Et Toi Seigneur, si grand."]]]},{"n":479,"t":"Deux mains pour servir le Maître,","s":[[0,["Deux mains pour servir le Maître,","Deux pieds pour aller partout","Dire à tous: nous voulons être","Au bon Sauveur humble et doux."]],[1,["Seigneur, prends toute ma vie,","Mon cœur et ma volonté;","Que jamais je ne T'oublie,","Dieu de grâce et de bonté!"]],[0,["Deux oreilles pour entendre","Le vrai message du ciel;","La mémoire pour apprendre","Les leçons de l’Éternel."]],[0,["Deux yeux pour lire le Livre","Qu’il faut aimer toujours plus;","C’est le pain qui nous fait vivre,","Qui nous rend forts en Jésus."]],[0,["Un cœur pour être le trône,","Où doit régner le Seigneur,","Une vie qui se donne","Tout entière au Créateur."]]]},{"n":480,"t":"Nous sommes un dans un lien d’amour (bis)","s":[[0,["Nous sommes un dans un lien d’amour (bis)","Notre esprit est uni","Avec l’Esprit de Dieu","Nous sommes un dans un lien d’amour"]],[0,["Maintenant, chantons tous ensemble","Et que Son amour se répande","Tenons-nous par la main","Et levons-le très haut","Nous serons dans un lien d’amour."]]]},{"n":481,"t":"Un pas, le Sauveur","s":[[0,["Un pas, le Sauveur","Est ici qui t’invite","À te jeter dans Ses bras.","Un salut parfait","Est à qui le mérite,","Tu n’as qu’à faire qu’un pas."]],[1,["Un seul pas (bis)","Et Jésus te recevra","Un seul pas Jette toi dans Ses bras","Ceux qu’Il affranchit","Sont entièrement libres","Tu n’as qu’à faire un pas."]],[0,["C’est Lui? c’est Lui seul","Qui peut briser les chaînes","Les esclaves de Satan.","Des larmes à Ses pieds","Ne sont jamais vaines","Jésus pardonne à l’instant."]],[0,["Pense aux pas nombreux","Qu’Il fit à ta rencontre","Il marcha jusqu’au départ","Et pour te livrer à l’Amour","Qu’Il te montre","Il ne te reste qu’un pas"]]]},{"n":482,"t":"Oh! Que Ta main paternelle","s":[[0,["Oh! Que Ta main paternelle","Me bénisse à mon coucher!","Et que ce soit sous Ton aile","Que je dorme, ô mon Berger! (bis)"]],[0,["Veuille effacer par Ta grâce","Les péchés que j’ai commis,","Et que Ton Esprit me fasse","Obéissant et soumis! (bis)"]],[0,["Fais reposer sous Ta garde","Mes amis et mes parents,","Et que Ton œil les regarde,","De Ton Ciel, petits et grands! (bis)"]],[0,["Que Ta faveur se déploie","Pour consoler l’affligé;","Donne au pauvre un peu de joie,","Au malade, la santé! (bis)"]],[0,["Seigneur! J’ai fait ma prière;","Sous Ton aile, je m’endors,","Heureux de savoir qu’un Père","Plein d’amour veille au dehors. (bis)"]]]},{"n":483,"t":"Dieu est bon Alléluia!","s":[[1,["Dieu est bon Alléluia!","Il est bon alléluia!","Dieu est bon Alléluia!","Il est vraiment bon Alléluia!"]],[0,["J’étais perdu. Alléluia!","Il m’a cherché. Alléluia!","Il m’a trouvé. Alléluia!","Oh! Il est bon. Alléluia!"]],[0,["J’étais tombé. Alléluia!","Dans le péché. Alléluia!","Il m’a relevé. Alléluia!","Mon Dieu est bon"]],[0,["J’étais esclave; Alléluia!","De mon passé; Alléluia!","Il est venu; Alléluia!","Il m’a libéré; Alléluia!"]],[0,["Oh! Toi mon frère (sœur); Alléluia!","Dis-moi un peu;","Ce qu’il a fait; Alléluia!","Pour toi aussi. Alléluia!"]]]},{"n":484,"t":"Le seul Sauveur, c’est Jésus.","s":[[0,["Le seul Sauveur, c’est Jésus.","Je ne veux plus que Jésus,","Tous mes désirs, Il les satisfait :","Quand vient l’épreuve, Il me garde en paix","Le seul Sauveur, c’est Jésus,","Dans les jours d’adversité, de douleur :","Regarde à Jésus, ton Sauveur."]]]},{"n":485,"t":"Sur une colline lointaine","s":[[0,["Sur une colline lointaine","Se tenait une vieille Croix","Emblème de souffrance et de honte.","Et j’aime cette vieille Croix","Où le très Cher mourut","Pour un monde de pécheurs perdus."]],[1,["Ainsi j’aimerais cette vieille Croix","Jusqu’à ce que je dépose les armes","Je vais m’attacher à la vieille Croix","Et la changer avec une couronne."]],[0,["Oh! De cette vieille Croix","Teintée de sang divin,","Une merveilleuse beauté je vois.","Car ce Jésus mourut","Pour me pardonner","Et pour me sanctifier."]]]},{"n":486,"t":"O Roi des rois nous Te louons.","s":[[0,["O Roi des rois nous Te louons.","Nous chantons. Hosanna!","A la gloire de Ton Nom."]],[0,["Nous Te louons, nous T’adorons","Et nous Te bénissons.","Alléluia!"]],[0,["O Roi des rois nous Te louons.","Nous chantons. Hosanna!","A la gloire de Ton Nom."]]]},{"n":487,"t":"Quand sur l’ordre du Seigneur.","s":[[0,["Quand sur l’ordre du Seigneur.","Bientôt les tombes s’ouvriront.","Et pour nous, le grand matin s’élèvera.","Les élus se retrouveront,","Et le grand appel enfin retentira.","Quand là-haut! Dans le ciel même,","Ce fera l’appel suprême,","Par Jésus que mon cœur aime,","Je le sais, gloire de Dieu, je serai là."]]]},{"n":488,"t":"Les jours de noces arrivent, apprête-toi.","s":[[0,["Les jours de noces arrivent, apprête-toi.","Les jours de noces arrivent, apprête-toi.","Sois fidèle! Afin que tes vêtements soient propres"]],[0,["Quand les élus seront rassemblés,","Jésus passera.","Et celui qui n’est pas vêtu,","Oui! Jésus le mettra dehors."]]]},{"n":489,"t":"Annonce-moi l’allégresse et la joie","s":[[1,["Annonce-moi l’allégresse et la joie","Et les os que Tu as brisés se réjouiront.","Détourne Ton regard de mes péchés,","Efface toutes mes iniquités","Oh Dieu, crée en moi un cœur pur,","Et les os que Tu as brisés se réjouiront."]],[0,["Ne me rejette pas loin de Ta face,","Ne me retire pas Ton Esprit Saint.","Rends-moi la joie de mon salut,","Renouvelle en moi un esprit disposé","Et qu’un bon esprit me soutienne","Ne me retire pas Ton Esprit Saint."]],[0,["J’enseignerai Tes voies aux pécheurs","Et les pécheurs viendront à Toi.","Ohî Dieu, délivre-moi du sang versé;","Ma langue célébrera Ta miséricorde,","Seigneur, ouvre mes lèvres et ma bouche","Et les pécheurs viendront à Toi."]]]},{"n":490,"t":"Que Dieu vous bénisse","s":[[1,["Que Dieu vous bénisse","Et des enfants dans la fidélité","Que Dieu vous bénisse","Prospérité dans toutes vos entreprises"]],[0,["Et l’Eternel Dieu dit;","Il n’est pas bon que","L’homme soit seul","Je lui ferai une aide semblable"]],[0,["Alors l’Éternel Dieu","Fit tomber un profond","Sommeil sur l’homme","Et il prit une de ses côtes"]],[0,["Cette fois, celle-ci est os de mes os","Et chair de ma chair","Ainsi, tu seras appelé femme","Car tu as été prise de l’homme"]],[0,["C’est pourquoi il dit:","Isaac, tu quitteras papa et maman","Pour t’attacher à Rebecca","Pour être une seule chair."]]]},{"n":491,"t":"Jésus, je ne louerai que Ton Saint Nom","s":[[0,["Jésus, je ne louerai que Ton Saint Nom","Tous les jours de ma vie.","Ta puissance a convaincu","Les forces du mal","Pour que Ton Nom soit glorifié","Je ne louerai que Ton Saint Nom","Tous les jours de ma vie."]]]},{"n":492,"t":"Je sais que mon Dieu est vivant","s":[[0,["Je sais que mon Dieu est vivant","Par Son Nom, je triompherai","Je le sais de tout mon cœur","Avec Lui, j’ai la victoire"]],[0,["La tempête soufflera, Satan rugira","Mais Sa présence me rassure","Je le sais de tout mon cœur","Avec Lui, j’ai la victoire"]]]},{"n":493,"t":"Envoie la puissance sur Ton peuple","s":[[0,["Envoie la puissance sur Ton peuple","La puissance d’autrefois","Ouvre les écluses, envoie la puissance","Sur tous ceux qui sont à Toi."]],[0,["Envoie sur chacun des langues de feu","Brûle en nous le péché","Purifie nos âmes, mets en nous Ta flamme","Et baptise-nous de feu."]]]},{"n":494,"t":"Qu’est-ce que j’aurai ? (ter)","s":[[0,["Qu’est-ce que j’aurai ? (ter)","Si j’ai toutes les choses du monde","Si j’ai tous les trésors du monde","Et je perds mon âme :","Qu’est-ce que j’aurai ?"]],[0,["Je sais que j’aurai, (ter)","Si je L’aime de tout mon cœur","Si je L’aime de tout mon cœur","J’irai dans la gloire.","C’est ce que j’aurai."]]]},{"n":495,"t":"J’entrerai dans Ses portes avec reconnaissance","s":[[0,["J’entrerai dans Ses portes avec reconnaissance","Dans Ses parvis avec des louanges.","Je dirais : c’est la journée que l’Eternel a faite","Je chanterai car Il me rend heureux."]],[0,["Il me rend heureux, H me rend heureux.","Je chanterai car Il me rend heureux.","Il me rend heureux, Il me rend heureux.","Je chanterai car Il me rend heureux."]]]},{"n":496,"t":"Je sais que Christ est mort pour moi.","s":[[0,["Je sais que Christ est mort pour moi.","Je le sais, je le sais.","Mon Sauveur est mort pour moi (bis)","C’est si merveilleux","Car Christ est mort pour moi.","Je le sais, je le sais."]]]},{"n":497,"t":"Merci Seigneur pour Ta lumière ;","s":[[0,["Merci Seigneur pour Ta lumière ;","Merci pour tous les clairs matins.","Merci d’accorder ma prière,","D’être mon soutien."]],[0,["Merci Seigneur pour tous mes frères;","Merci de les avoir donnés.","Merci car si l’amour s’altère,","Tu veux pardonner."]],[0,["Merci Seigneur pour toute joie;","Merci pour les divers travaux.","Merci car quand soudain je ploie,","Tu prends mes fardeaux"]],[0,["Merci Seigneur pour la vieillesse;","Merci pour les petits enfants.","Merci pour toutes Tes promesses,","Pour Tes soins constants."]],[0,["Merci Seigneur pour Ta parole;","Merci par Elle Tu m’instruis,","Merci car Elle est ma boussole,","Elle me conduit."]],[0,["Merci, Seigneur pour Ta présence,","Merci pour Ton parfait salut.","Merci des dons que Tu dispenses","A tous Tes élus","Merci, Seigneur, pour Ta puissance,","Merci de nous donner l’Esprit,","Merci pour Ton amour immense","Qui partout nous suit."]]]},{"n":498,"t":"Vers le Seigneur,","s":[[0,["Vers le Seigneur,","Rocher de notre salut,","Venez, chantons avec allégresse.","Allons devant Lui avec des louanges.","Faisons retentir des cantiques en Son honneur","Car l’Éternel est le grand Dieu des cieux.","Il est un grand Roi.","Au-dessus de tous les dieux.","Il tient dans Sa main","Les profondeurs de la terre.","Et tous les sommets","Des montagnes sont à Lui.","La mer est à Lui, c’est Lui qui l’a fait.","La terre aussi, Ses mains l’ont formée."]]]},{"n":499,"t":"À la fin de mon voyage","s":[[0,["À la fin de mon voyage","Je serai couronné (ter)","À la fin de mon voyage,","Je serai couronné","Dans la Cité de Dieu","Quel bonheur! (4x)","A la fin de mon voyage,","Je serai couronné","Dans la Cité de Dieu."]]]},{"n":500,"t":"Plus jamais, plus jamais","s":[[0,["Plus jamais, plus jamais","Dieu n’y pense plus jamais.","Les péchés qu’Il pardonne","O quelle grâce ! Non,","Il ne S’en souvient plus jamais.","Plus jamais, plus jamais","Dieu n’y pense plus jamais.","Les péchés qu’il pardonne","Dieu ne S’en souvient plus, jamais, jamais"]]]},{"n":501,"t":"Les démons tremblent à Sa vue,","s":[[0,["Les démons tremblent à Sa vue,","Car ils ne peuvent tenir.","Les démons tremblent à Sa vue","Car ils ne peuvent résister.","Ta parole les dénonce ;","Ta lumière les dévoile ;","Ton Saint Esprit les discerne ;","Ta puissance les ébranle."]]]},{"n":502,"t":"Non, jamais je ne saurais dire,","s":[[0,["Non, jamais je ne saurais dire,","De mon Sauveur, l’immense amour ;","Mais je veux pourtant vous redire","Que mon cœur L’aime sans retour.","Poussé par Son amour sublime,","Oh ! Mystère éternel,","Il est mort pour laver mon crime,","Et me conduire au ciel !"]],[1,["Amour divin, grâce infinie,","Jésus m’a pardonné !","Paix, gloire, amour ; bonheur et vie :","Jésus m’a tout donné !"]],[0,["Ici-bas tout finit, tout passe,","Famille, amis, bonheur, printemps ;","Mais dans Son amour et Sa grâce,","Jésus dans Son beau ciel m’attend.","Et ce Sauveur, toujours le même,","Hier, aujourd’hui, demain,","Du haut de la gloire suprême,","Me conduit par la main !"]],[0,["Désirant laver la souillure,","Jésus, de Son côté percé,","Laisse jaillir une onde pure","Qui passe et tout est effacé !","Viens donc à la source bénie,","Oui, viens pauvre pécheur ;","Et là, bois à longs traits la Vie,","La grâce et le bonheur !"]]]},{"n":503,"t":"Il prit du pain, le rompit en disant :","s":[[0,["Il prit du pain, le rompit en disant :","Ceci est Mon corps brisé pour vous tous.","Prenant la coupe, symbole de l’alliance,","Le sang versé pour nous.","Prenez et mangez","Au nom du divin Sauveur,","Prenez et buvez","Car ceci est le sang de l’alliance."]]]},{"n":504,"t":"Cœurs troublés, Il est ressuscité","s":[[0,["Cœurs troublés, Il est ressuscité","Jésus-Christ est ressuscité.","Il nous a précédés là-haut","Préparer une place pour nous.","Attends, attends humblement","Attends et persévère toujours.","Attends, attends, Il reviendra bientôt."]]]},{"n":505,"t":"Suis-je un vrai soldat de la croix ?","s":[[0,["Suis-je un vrai soldat de la croix ?","Serviteur de l’Agneau ?","Pourrais-je supporter Sa cause,","Et prononcer Son Nom ?","Ce beau Nom! Ce précieux Nom!","De Celui qui est mort pour moi.","Par grâce, j’ai reçu la couronne","Quelque soit ma foi."]]]},{"n":506,"t":"Mes parents sont contre moi","s":[[0,["Mes parents sont contre moi","Parce que je marche avec Jésus,","Je marche avec Jésus (bis)","Mes parents sont contre moi","Parce que je marche avec Jésus.","Chaque jour, je marche avec Jésus. Alléluia!","Je marche avec Jésus (ter) Alléluia!","Je marche avec Jésus.","Chaque jour, je marche avec Jésus."]]]},{"n":507,"t":"Seigneur, à quel autre","s":[[0,["Seigneur, à quel autre","Irions-nous qu’à Toi","Tu as les paroles de la vie éternelle!","Et nous, nous avons cru,","Et nous avons connu","Que Tu es le Christ, le Fils du Dieu vivant."]]]},{"n":508,"t":"Son amour est si grand pour moi,","s":[[0,["Son amour est si grand pour moi,","Oui, pour moi! (bis)","Son amour est si grand pour moi,","Oui, pour moi! (bis)","Il me garde dans mes alarmes,","Me revêt de Ses armes.","Son amour est si grand pour moi,","Oui, pour moi! (bis)"]]]},{"n":509,"t":"Remplis-moi, Seigneur,","s":[[0,["Remplis-moi, Seigneur,","De Ton Saint-Esprit.","Remplis-moi, tous les jours de ma vie.","Je veux voir Ta gloire se manifester!","Remplis-moi, chaque jour de Ton amour."]]]},{"n":510,"t":"Gloire, gloire, gloire à l’Agneau (bis)","s":[[0,["Gloire, gloire, gloire à l’Agneau (bis)","Car Il est glorieux et digne de régner,","L’Agneau est souverain.","Nous élevons la voix pour L’adorer.","L’Agneau est souverain."]]]},{"n":511,"t":"Proclamez-le au monde entier:","s":[[0,["Proclamez-le au monde entier:","Dieu nous aime!","Du ciel, Jésus fut envoyé:","Dieu nous aime!","Lui qui mourut à Golgotha,","Le jour de Pâques ressuscita.","Nous sommes sauvés, alléluia!","Dieu nous aime! (ter)","Proclamez-le au monde entier:","Dieu nous aime!"]]]},{"n":512,"t":"J’ai bâti sur le rocher.","s":[[0,["J’ai bâti sur le rocher.","Et quand viendra la tempête,","Ma maison résistera ;","Ma maison est en Jésus Christ.","La pluie et le vent souffleront","Satan se déchaînera","Mais ma maison est en Jésus","Je n’aurai jamais, jamais peur."]]]},{"n":513,"t":"Tous ceux qui se confient en l’Eternel","s":[[0,["Tous ceux qui se confient en l’Eternel","Sont toujours comme la montagne de Sion","Cette montagne ne chancelle jamais","Elle est toujours affermie.","Je veux appartenir","À l’Éternel, le Dieu des armées","Jésus le Roi des rois","Me dirigera de jour en jour."]]]},{"n":514,"t":"Jésus, Toi que mon cœur aime,","s":[[0,["Jésus, Toi que mon cœur aime,","Jésus, mon tendre Ami.","Tenant toujours dans Ta main ma main,","Même dans la sombre nuit,","Portant mes plus lourds fardeaux","Même les plus petits.","C’est Toi, Jésus, qui sera toujours mon Ami."]]]},{"n":515,"t":"Je sais qu’un jour,","s":[[0,["Je sais qu’un jour,","Mes yeux verront Jésus,","Je sais qu’un jour,","Mes yeux verront Jésus,","Si je marche jusqu’au bout,","Par la foi et malgré tout,","Je sais qu’un jour,","Mes yeux verront Jésus."]],[0,["Je sais que mon Dieu","Va m’ouvrir une porte","Je sais que mon Dieu","Va m’ouvrir une porte","Si je me détourne de mes péchés,","Et si je vis bien et me sanctifie.","Je sais que mon Dieu","Va m’ouvrir une porte."]]]},{"n":516,"t":"Somlandela, somlandela eJesu.","s":[[0,["Somlandela, somlandela eJesu.","Somlandela, yonke indawo.","Somlandela, somlandela eJesu.","Lapho eya khona, somlandela."]],[0,["Je Te suivrai, je Te suivrai Jésus,","Je Te suivrai, là où Tu iras.","Je Te suivrai, je Te suivrai Jésus.","Là où Tu iras, je Te suivrai."]],[0,["I will follow, I will follow Jesus.","I will follow, wherever He goes.","I will follow, I will follow Jesus.","Wherever He goes, I will follow."]]]},{"n":517,"t":"Oh! Dieu crée en moi un cœur pur.","s":[[0,["Oh! Dieu crée en moi un cœur pur.","Oh! Dieu crée en moi un cœur pur.","Renouvelle en moi un esprit bien disposé.","Oh! Dieu crée en moi un cœur pur."]]]},{"n":518,"t":"O Toi qui donnes la vie,","s":[[0,["O Toi qui donnes la vie,","A Tes pieds je veux m’asseoir,","Comme s’asseyait Marie","À l’heure douce du soir,","Comme s’asseyait Marie","A l’heure douce du soir."]],[0,["Mon être entier Te réclame;","Tout n’est que faiblesse en moi,","Viens Te pencher sur mon âme,","Elle a tant besoin de Toi!","Viens Te pencher sur mon âme,","Elle a tant besoin de Toi!"]],[0,["Maître, à Tes pieds, je m’incline,","Je T’appartiens sans retour,","Verse en moi Ta paix divine,","Répands en moi Ton amour!","Verse en moi Ta paix divine,","Répands en moi Ton amour!"]]]},{"n":519,"t":"Christ est la paix recherchée de mon âme.","s":[[0,["Christ est la paix recherchée de mon âme.","Oh! Seigneur, soutiens ma foi.","Prend-moi Seigneur dans mon état.","Dieu de Jacob, soutiens ma foi."]]]},{"n":520,"t":"Oh le Sang de Jésus!","s":[[0,["Oh le Sang de Jésus!","Précieux Sang de Jésus!","Oh le Sang de Jésus!","Qui rend plus blanc que neige","Bientôt, très bientôt!","Nus allons voir le Seigneur.","Alléluia! Alléluia!","Nous allons voir le Seigneur"]],[0,["Là-haut plus de pleurs.","Nous allons voir le Seigneur","Alléluia! Alléluia!","Nous allons voir le Seigneur"]],[0,["Oui si nous L’aimons,","Gardons ses commandements.","Alléluia!Alléluia!","Oui nous T’aimons Seigneur"]],[0,["La vie éternelle,","C’est que nous Te connaissons,","Alléluia!alléluia!","Toi, le Seul vrai Seigneur."]]]},{"n":521,"t":"Ton Dieu te donnera la victoire","s":[[0,["Ton Dieu te donnera la victoire","Te donnera la victoire (bis)","Ton Dieu te donnera la victoire.","Si tu tiens l’épée ferme dans ta main."]]]},{"n":522,"t":"J’ai choisi Jésus-Christ parmi mes amis (bis)","s":[[0,["J’ai choisi Jésus-Christ parmi mes amis (bis)","Il m’indiquera bien ce qu’il faudra faire.","Même s’il faut que je périsse dans Sa folie,","Je le voudrai."]],[0,["Seigneur Jésus (bis)","Il m’indiquera bien ce qu’il faudra faire.","Même s’il faut que je périsse dans Sa folie,","Je le voudrai."]]]},{"n":523,"t":"Quand je me souviens de l’amour de Jésus.","s":[[0,["Quand je me souviens de l’amour de Jésus.","Quand je me souviens! Alléluia!","Quand je me souviens de l’amour de Jésus.","Quand je me souviens."]]]},{"n":524,"t":"Le pain de vie!","s":[[0,["Le pain de vie!","Jésus est le pain de vie.","Le pain de vie","De l’eau de vie!","Jésus est de l’eau de vie.","De l’eau de vie."]],[0,["Celui qui en mange","N’aura plus faim.","Celui qui en boit","N’aura plus soif."]]]},{"n":525,"t":"Oui nous faisons","s":[[0,["Oui nous faisons","Partie de la famille de Dieu,","Les héritiers du Père.","Nous partageons, nos joies,","Nos peines et nos fardeaux.","Nous sommes frères et sœurs."]]]},{"n":526,"t":"Il n’y a point de condamnation","s":[[0,["Il n’y a point de condamnation","Pour ceux qui sont en Jésus-Christ.","La loi de l’Esprit de Vie m’a sauvé","De la loi du péché.","Il n’y a point de condamnation","Pour ceux qui sont en Jésus-Christ.","La loi de l’Esprit de Vie m’a sauvé","De la loi du péché."]]]},{"n":527,"t":"L’Eternel est mon berger,","s":[[0,["L’Eternel est mon berger,","Je Le suivrai partout.","Je Le suivrai pas à pas,","Ma main dans Sa main.","Quand même l’ennemi gronde,","Je serai sans peur.","Je vivrai sans crainte","Car Il est mon bouclier."]]]},{"n":528,"t":"Pourquoi Seigneur m’a tu cherché ?","s":[[0,["Pourquoi Seigneur m’a tu cherché ?","Pourquoi ne m’as-tu pas laissé ?","Dans ma misère, ma pauvreté ?","Pourquoi ? Oh! Oui pourquoi ?"]],[0,["Tu es venu vers moi","En me tendant les mains.","Tu m’as dit : « viens, suis Moi.","Suis-Moi et ne crains rien. »"]]]},{"n":529,"t":"Loué soit Dieu !","s":[[0,["Loué soit Dieu !","Le Seigneur, le puissant Roi de gloire.","Mon âme, il faut","L'acclamer par un chant de victoire.","Réveille-toi.","Viens au-devant de ton Roi.","Pour célébrer sa mémoire."]],[0,["Loué soit Dieu !","Le Créateur le souverain Maître.","A tous il donne","Le mouvement, la vie et l'être.","Tout ce qu'il fait","Est agréable et parfait.","Ah ! sache le reconnaître."]],[0,["Loué soit Dieu !","Sa bonté chaque jour se révèle,","Il t'a donné","La santé, t'a gardé sous Son aile,","Ses tendres soins","Pourvoient à tous tes besoins.","Vois combien Il est fidèle."]],[0,["Loué soit Dieu !","Pour Sa miséricorde insondable.","Qui se répand","Sur le pécheur le plus misérable.","Ah ! souviens-toi","De ce que Jésus, ton Roi,","A souffert, pour toi, coupable."]],[0,["Loué soit Dieu !","Que les anges lui rendent hommage,","Que Sa louange","Sur terre en tout lieu se propage.","Qu'à l'unisson","Tout en moi chante Son Nom.","Alléluia d'âge en âge !"]]]},{"n":530,"t":"C’est Toi, Jésus, Pain de Vie,","s":[[0,["C’est Toi, Jésus, Pain de Vie,","Qui me nourris jour par jour,","Manne céleste et bénie,","C’est Ton merveilleux amour.","Pain de Vie, Pain de Vie, Pain de Vie,","Don du ciel toujours nouveau,","Tu me nourris, Pain d’En-Haut!"]],[0,["C’est encore Toi, Source vive,","Le secours du pèlerin.","Il puise, il boit, et ravive","Son cœur le long du chemin.","Source vive, Source vive, Source vive.","Don du ciel toujours nouveau,","Tu jaillis sur moi d’En-Haut!"]],[0,["Ames toujours altérées,","Qui cherchez de fraîches eaux,","Aux citernes crevassées","Préférez les clairs ruisseaux!","O rosées, O rosées, Ô rosées.","Don du ciel toujours nouveau,","Descendez sur nous d’En-Haut!"]],[0,["A Ton Amour je me fie,","Que me faudrait-il de plus?","Rien, non, rien ne rassasie","Ici-bas, que Toi, Jésus.","Pain de Vie, Pain de Vie, Pain de Vie.","Don du ciel toujours nouveau,","Je Te bénis, Pain d’En-Haut!"]]]},{"n":531,"t":"O Toi, dont les bienfaits","s":[[0,["O Toi, dont les bienfaits","Ne tarissent jamais,","O Dieu de paix,","Pour louer Tes présents,","S’unissent Tes enfants.","Écoute leurs accents","Reconnaissants."]],[0,["Pour combler Tes faveurs,","O Dieu, rends-nous meilleurs,","Change nos cœurs.","Nous voulons Te bénir,","Nous voulons Te servir","Et mettre à T’obéir","Notre plaisir."]],[0,["Ainsi conduits par Toi,","Vivant selon Ta loi,","Ô notre Roi,","Vers le ciel radieux,","Séjour des bienheureux,","Nous marcherons joyeux,","Toujours joyeux."]]]},{"n":532,"t":"C’est aujourd’hui jour du salut!","s":[[0,["C’est aujourd’hui jour du salut!","Alléluia!","Toute ma dette Il a payé!","Alléluia!","Je puis marcher le front levé","Car Christ m’a racheté","Mon cœur T’exalte ô Jésus","Tu m’as donné Ton salut"]]]},{"n":533,"t":"Le nom de Jésus est si doux!","s":[[0,["Le nom de Jésus est si doux!","De Dieu désarmant le courroux,","Il nous appelle au rendez-vous,","Précieux nom de Jésus!"]],[1,["Jésus! Béni soit Ton nom!.","Jésus! Oh! Merveilleux don!","Jésus! Suprême rançon,","Sois adoré pour toujours."]],[0,["J’aime ce nom dans le chagrin,","Il me soutient sur le chemin,","Sa musique est un son divin,","Précieux nom de Jésus!"]],[0,["J’aime le nom de mon Sauveur,","Car Lui seul connaît tout mon cœur,","Lui seul me rend plus que vainqueur:","Précieux nom de Jésus!"]],[0,["Et si parfois j’ai succombé,","Si dans le mal je suis tombé,","Son nom puissant m’a relevé:","Précieux nom de Jésus!"]],[0,["Et lorsqu’avec Lui je serai,","Et lorsqu’enfin je Le verrai,","Alors sans fin je redirai:","Précieux nom de Jésus!"]]]},{"n":534,"t":"Notre espoir dans le combat","s":[[0,["Notre espoir dans le combat","C’est Jésus le Roi des rois.","Connaissant notre Avocat","Le Rocher de votre foi.","La victoire est possible,","Si nous marchons par le Christ","Ainsi psalmodient les anges.","Alléluia! Amen!"]]]},{"n":535,"t":"Ce vieux monde","s":[[0,["Ce vieux monde","Ne peut rien sur moi","Car bientôt, je m’en irai","Je suis déjà consacré","Et je porte mon habit de noces."]]]},{"n":536,"t":"D’un cœur joyeux,","s":[[0,["D’un cœur joyeux,","Allons prendre part","Au festin que Dieu nous prépare.","Heureux celui qui mange de Son Corps,","Et boit Son Sang, il vivra de Dieu","Car le Seigneur nous invite","À partager Sa vie dès ici-bas."]]]},{"n":537,"t":"Demeurez fermes et saints (bis)","s":[[0,["Demeurez fermes et saints (bis)","Dans la voie du Seigneur.","Le temps est proche","Demeurez fermes et saints.","L’ennemi nous poursuit,","Persévérons toujours.","La couronne vient après","C’est un combat;","Demeurez fermes et saints."]]]},{"n":538,"t":"Jésus est mon sauveur (6x)","s":[[0,["Jésus est mon sauveur (6x)","Je Lui donne tout mon cœur."]],[0,["Il m’a donné Sa Vie (6x)","Je Lui donne tout mon cœur."]],[0,["Il a vaincu Satan (6x)","Je Lui donne tout mon cœur."]],[0,["Alléluia! (6x)","Je Lui donne tout mon cœur."]]]},{"n":539,"t":"Oh! Seigneur,","s":[[0,["Oh! Seigneur,","Je Te livre mon cœur et toute ma vie.","Mets en moi toute Ta pureté et Ton Saint-Esprit.","Que dois-je faire pour Toi ?","Oh! Seigneur,","Je Te livre mon cœur et toute ma vie."]]]},{"n":540,"t":"Magnifiez avec moi,","s":[[0,["Magnifiez avec moi,","Le Seigneur Tout Puissant.","Exaltons ensemble Son Nom très saint.","Glorifions sans cesse Ses biens faits.","L’Eternel notre Dieu","Est attentif à nos cris."]]]},{"n":541,"t":"Notre Seigneur vient bientôt","s":[[0,["Notre Seigneur vient bientôt","Frères et sœurs apprêtons-nous,","Rendez-vous dans les airs.","Rendez-vous dans les airs (bis)","Notre Seigneur vient sur les nuées","Bientôt, rendez-vous dans les airs."]]]},{"n":542,"t":"L’ennemi fait rage,","s":[[0,["L’ennemi fait rage,","J’entends ses pas comme un bruit d’orage","J’entends ses clameurs,","Quand Satan se déchaîne.","Mais ce flot déchaîné plie à mes pieds;","Ma couronne est prête, Tu m’as racheté","Ma couronne est prête, Tu m’as racheté"]]]},{"n":543,"t":"Un jour Jésus demanda à Pierre,","s":[[0,["Un jour Jésus demanda à Pierre,","Pierre as-tu mon amour ?","Pierre lui répondit en disant,","Seigneur ne sais-tu pas que je T’aime ?","Oh! Je T’aime,","Fils de Dieu, oui je T’aime.","Je T’aime jusqu’à la mort."]]]},{"n":544,"t":"Satan, dans mes moments d’épreuves","s":[[0,["Satan, dans mes moments d’épreuves","Tu croyais que je te servirai.","Non, non! Jamais Satan, je te servirai.","Entre nous c’est fini","Autant que la miséricorde de Dieu","Durera toujours, je chanterai à jamais,","A la gloire de mon Dieu."]]]},{"n":545,"t":"O Mon Dieu","s":[[0,["O Mon Dieu","Donne-moi la sagesse de Salomon","Afin de pouvoir mieux Te servir.","Donne-moi la foi de Ton serviteur","Pour ne pas être victime de Satan.","Chez qui vais-je trouver cette grâce infinie?","Seigneur, élève toi-même ton Esprit."]]]},{"n":546,"t":"Esprit Saint consolateur (ter)","s":[[0,["Esprit Saint consolateur (ter)","Viens diriger nos pas.","Esprit Saint, Saint, Saint (bis)","Esprit Saint, Saint","Sois le Dieu des Armées.","Nous Te glorifions Eternel;","C’est la vie et la paix pour les Hommes.","Vous chrétiens, bénissez-Le!","Vous païens, bénissez-Le!","Unissez-vous tous dans l’amour,","Unissez-vous tous dans le Seigneur"]]]},{"n":547,"t":"Bénis-moi oh! Seigneur bénis-moi","s":[[0,["Bénis-moi oh! Seigneur bénis-moi","Bénis-moi oh! Mon Dieu bénis-moi.","Le matin quand je me lève","Toi seul connais mes besoins.","Bénis-moi oh! Mon Dieu bénis-moi."]],[0,["Bénis-moi oh! Seigneur bénis-moi","Bénis-moi oh! Mon Dieu bénis-moi.","Ce soir nous sommes là","Toi seul connais nos besoins.","Bénis-nous oh! Mon Dieu bénis-nous."]]]},{"n":548,"t":"La foi vient se reposer","s":[[0,["La foi vient se reposer","Sur le rocher éternel","Qui est la Parole","N’en ajoutez pas","N’en retranchez pas","Si nous marchons","Dans cette vérité","Dieu est ténu de nous bénir."]]]},{"n":549,"t":"Quand je vois le ciel, œuvre de Tes doigts,","s":[[0,["Quand je vois le ciel, œuvre de Tes doigts,","La lune et les étoiles que Tu créas;","Quand je vois le ciel, œuvre de Tes doigts,","La lune et les étoiles que Tu créas :","Qu’est donc l’homme, ô Éternel ?","Qu’est donc l’homme, ô Éternel ?","Qu’est donc l’homme, ô Éternel,","Que Tu prennes garde à lui ?"]]]},{"n":550,"t":"Entends-tu le cri ?","s":[[0,["Entends-tu le cri ?","Le cri solennel","De la fin des temps."]],[0,["Il n’y a plus d’autres appels","C’est bien là le dernier","Nous sommes à la fin."]],[0,["Mon frère où seras-tu ?","Ma sœur où seras-tu ?","Pour l’éternité."]]]},{"n":551,"t":"Quand je sombrais dans la boue du péché","s":[[0,["Quand je sombrais dans la boue du péché","Christ m’a délivré.","Je m’enlisais par la mort enlacé,","Il m’a délivré.","Et quand vaincu, j’étais désespéré,","Il m’a délivré.","Quel merveilleux Sauveur que j’ai trouvé,","Il m’a délivré."]]]},{"n":552,"t":"Nous T’adorons, nous T’aimons.","s":[[0,["Nous T’adorons, nous T’aimons.","Tendre Père.","Glorifie Ton Nom sur la terre","Glorifie Ton Nom (bis)","Glorifie Ton Nom sur la terre."]],[0,["Nous T’adorons, nous T’aimons","Tendre Père.","Glorifie Ton Nom dans nos cœurs","Glorifie Ton Nom (bis)","Glorifie Ton Nom dans nos cœurs."]]]},{"n":553,"t":"Je T’ai suivi sur le Calvaire,","s":[[0,["Je T’ai suivi sur le Calvaire,","Agneau de Dieu, meurtri pour moi;","Dans Tes douleurs Tu fus mon frère,","Par Tes douleurs je suis à Toi."]],[0,["Je veux rester sur le Calvaire,","Ô Rédempteur, mon divin Roi!","J’y suis courbé sous ma misère,","Mais Ton pardon descend sur moi."]],[0,["Je T’adore sur le Calvaire,","Jésus, qui T’es donné pour moi,","Et, prosterné dans la poussière,","Moi-même je me donne à Toi."]]]},{"n":554,"t":"Parce qu’Il vit","s":[[0,["Parce qu’Il vit","Je n’ai rien n’à craindre.","Mes lendemains sont assurés","Entre Ses mains, Il tient ma vie","Pour ce temps et l’éternité","Je sais qu’il vit (bis)"]]]},{"n":555,"t":"Alléluia! Alléluia! Alléluia!","s":[[0,["Alléluia! Alléluia! Alléluia!","Dans Sa divine humanité,","Le Seigneur est ressuscité;","La lutte est enfin terminée,","Alléluia!"]],[0,["Alléluia! Alléluia! Alléluia!","Dès l’aube du troisième jour","Il sort du ténébreux séjour;","Y laissant la mort enchaînée,","Alléluia!"]],[0,["Alléluia! Alléluia! Alléluia!","Il paraît! Nos deuils sont finis,","Nos cœurs pardonnes et bénis,","Retrouvent enfin l’espérance;","Alléluia!"]],[0,["Alléluia! Alléluia! Alléluia!","Ah! Puisque grâce à Lui, la mort","Sera pour nous l’entrée au port,","Chantons l’hymne de délivrance!","Alléluia!"]]]},{"n":556,"t":"Le chemin du calvaire","s":[[0,["Le chemin du calvaire","N’est pas un lieu de loisir","Tous ceux qui l’ont suivi","Ont librement pu choisir.","Pour porter l’heureux bois","Et supporter de souffrir","C’est un grand sacrifice.","Que nous devons consentir"]],[1,["C’est mon choix (bis)","Suivre la voie du Seigneur","A la croix (bis)","Où tout était accompli","Je me tiens agrippé","Comme un enfant à sa mère"]],[0,["Il n’y a pas de soldat","Qui se soucie de sa vie.","Privation, sacrifice","C’est ça la vie du chrétien","Nous marchons sur les pas","Ensanglantés de Jésus.","Poursuivons Ses empreintes","Sur le sable du temps."]],[0,["A genoux, humblement","Sur le rocher de Sa vie","Tous les saints avant moi","Ont bien fait leur confession.","Moi aussi, je consens","A suivre ma vocation","Je choisis de souffrir","Pour l’amour de mon Sauveur."]]]},{"n":557,"t":"Que Ton Nom soit à jamais glorifié","s":[[0,["Que Ton Nom soit à jamais glorifié","Honneur et gloire te soient rendus.","Tu es le Dieu, le Dieu des armées","Ta compassion est infinie, au siècle."]]]},{"n":558,"t":"Enlevé, enlevé, enlevé","s":[[0,["Enlevé, enlevé, enlevé","Tout le fardeau du péché m’est enlevé","J’étais mort dans mes péchés","Jésus m’a ressuscité","Enlevé, enlevé, enlevé","Tout le fardeau du péché m’est enlevé."]]]},{"n":559,"t":"Ouvrez-vous, portes du tombeau!","s":[[0,["Ouvrez-vous, portes du tombeau!","Jésus paraît. Oh! qu’il est beau!","Il revit, ô merveille!","Le péché, l’enfer et la mort","En vain ont uni leur effort:","Mon Rédempteur s’éveille!"]],[1,["Il vit! Il vit!","Je sais que mon Rédempteur vit.","Il vit! Il vit!","Je sais que mon Rédempteur vit!"]],[0,["Voyez Ses mains, Ses pieds percés","Et les stigmates qu’ont laissés","Le fouet, le fer, l’épine!","C’est pour moi qu’il a tant souffert!","Il m’a délivré de l’enfer,","O charité divine!"]],[0,["Je n’ai plus rien à redouter...","De mon Sauveur puis-je douter?","Sa promesse est formelle.","Au tombeau mon corps descendra.","Mais Christ le ressuscitera","Pour la vie éternelle!"]],[0,["Toi qui, bien loin de ce Sauveur,","Cherchonss en vain la paix, le bonheur,","Entends, Sa voix t’appelle.","Ton âme, Il veut vivifier,","Pour te donner la liberté","Et la gloire éternelle!"]]]},{"n":560,"t":"Dieu créa l’homme","s":[[0,["Dieu créa l’homme","Dans le jardin d’Eden","Et lui donna tous les pouvoirs.","Dieu dit qu’il n’est pas bon que","L’homme soit seul.","Alors Il prit une partie","De l’homme et créa la femme","Pour l’aider dans sa tâche","C’est pourquoi l’homme","Quittera son père et sa mère","Et s’attachera à sa femme","C’est pourquoi l’homme","S’attachera à sa femme","Et deviendront une seule chaire."]]]},{"n":561,"t":"Ceux qui se confient en l’Eternel","s":[[0,["Ceux qui se confient en l’Eternel","Sont comme la montagne de Sion","Elle ne chancelle point","Elle est affermie pour toujours.","Des montagnes entourent Jérusalem","Ainsi l’Éternel entoure Son peuple."]]]},{"n":562,"t":"Le fou sur le sable a bâti sa maison (ter)","s":[[0,["Le fou sur le sable a bâti sa maison (ter)","Et la tempête arriva.","Le vent souffla et la pluie tomba (ter)","Et la maison s’écroula.","Le sage sur le roc a bâti sa maison (ter)","Et la tempête arriva.","Le vent souffla et la pluie tomba (ter)","Et la maison résista."]]]},{"n":563,"t":"Sonne la trompette aux captifs","s":[[0,["Sonne la trompette aux captifs","Partout dans le pays.","C’est le Seigneur qui attire","Il vous attire à Lui","Je ne vous ai pas délaissé","Alors ne craignez plus","Car c’est l’année du jubilé","Oui, c’est l’année du jubilé","Quand les boiteux marchent","Les aveugles voient","Et le Seigneur","Libèrent tous les captifs","Oui, c’est l’année du jubilé"]]]},{"n":564,"t":"J’étais sans aucune consolation","s":[[0,["J’étais sans aucune consolation","Tu m’as rempli de Ton Saint Esprit","J’étais sans aucune consolation","Tu m’as rempli et Tu m’as béni"]],[0,["Comment ne pourrais-je Te loué","Pour tout ce que Tu as fait pour moi","Tu as toujours été mon secours","Chaque fois que l’ennemi me combat"]]]},{"n":565,"t":"La mort a été engloutie","s":[[0,["La mort a été engloutie","Oh! Mort où est ta victoire ?","Oh! Mort où est ton aiguillon ?","L’aiguillon de la mort c’est le péché.","Et la puissance du péché c’est la loi.","Jésus-Christ a vaincu la mort, c’est la vie."]]]},{"n":566,"t":"Va sans arrêt,","s":[[0,["Va sans arrêt,","Jusqu’au bout du chemin.","Même si le chemin","Est sombre et rocailleux,","N’aie pas de crainte","Jésus est avec toi."]]]},{"n":567,"t":"O Jésus, tu nous appelles","s":[[0,["O Jésus, tu nous appelles","A former un même corps;","Tu veux que, saints et fidèles,","Nous unissions nos efforts.","Fais que rien ne nous divise,","Nous, ton peuple racheté,","Et qu’à jamais Ton Eglise","Demeure dans l’unité!"]],[0,["Enrôlés dès la jeunesse","Sous la croix du Rédempteur,","Nous voulons l’aimer sans cesse,","Le servir d’un même cœur.","Et si notre foi vacille,","Ranimons-la chaque jour,","A l’autel où toujours brille","La flamme de Son amour."]],[0,["«De l’amour dont je vous aime,","Aimez-vous, nous dit Jésus;","Aimez! c’est l’ordre suprême","Que je laisse à mes élus. »","Aimons donc, aimons encore,","Sans compter et chaque jour;","Ô Toi que notre âme adore,","Mets en nos cœurs Ton amour!"]],[0,["Oui, Jésus, répands la vie","Dans les membres de Ton Corps;","Sur notre union chérie","Viens répandre Tes trésors;","Allume en nous, tendre Maître,","Un amour toujours nouveau;","Alors tous pourront connaître","Que nous sommes Ton troupeau."]]]},{"n":568,"t":"Oh! Joie infinie,","s":[[0,["Oh! Joie infinie,","J’appartiens à mon Sauveur,","Qui me dit avec douceur :","Pour purifier ton cœur,","J’ai donné Ma vie.","C’est pour moi, Seigneur Jésus,","Sur la croix que Tu mourus.","Et mes péchés ne sont plus.","Oh! Joie infinie."]]]},{"n":569,"t":"Si mon peuple s’humilie","s":[[0,["Si mon peuple s’humilie","Se repent en cherchant Ma face","Se détourne de sa voie impure","Son péché, J’effacerai","Son pays, Je guérirai."]]]},{"n":570,"t":"Aux cailloux du torrent,","s":[[0,["Aux cailloux du torrent,","Jette tous tes biens.","Et le Dieu Tout-Puissant","T’offrira les siens.","Sa présence vaut mieux","Que tous les trésors ;","Et le Roi des cieux","Te sera plus que beaucoup d’or."]]]},{"n":571,"t":"Souffle sur mon âme, (bis)","s":[[0,["Souffle sur mon âme, (bis)","Doux Esprit ;","Souffle sur mon âme"]],[0,["Mon repos est total","Quand je suis à Tes pieds","Doux Esprit","Souffle sur mon âme"]]]},{"n":572,"t":"C’est Jésus Christ qui donne la victoire","s":[[0,["C’est Jésus Christ qui donne la victoire","Alléluia! Alléluia! Alléluia, Amen"]],[0,["C’est l’Agneau de Dieu qui ôte le péché.","Alléluia! Alléluia! Alléluia! Amen"]],[0,["C’est l’Esprit Saint qui console les cœurs.","Alléluia! Alléluia! Alléluia Amen"]]]},{"n":573,"t":"Oh! Magnifie ton Dieu,","s":[[0,["Oh! Magnifie ton Dieu,","Car Il est digne de louange","Hosanna!","Bénis le Rocher,","Le Dieu de ton salut","Triomphe et règne."]]]},{"n":574,"t":"Le véritable Roi, c’est Jésus","s":[[0,["Le véritable Roi, c’est Jésus","Il est Roi, Il est Roi des rois","Sa Majesté est sur Son épaule,","Son Nom est un Nom merveilleux","Père Eternel, Conseiller et Prince de paix.","Il est Roi, Il est Roi des rois."]]]},{"n":575,"t":"Prends ma main, ô Seigneur","s":[[0,["Prends ma main, ô Seigneur","Et conduis-moi.","Tu connais le chemin,","Les ruses du malin.","Soutiens-moi par la main","Et conduis-moi."]]]},{"n":576,"t":"Mon âme bénis l’Eternel!","s":[[0,["Mon âme bénis l’Eternel!","Tout mon être magnifie Son nom","Car la mort n’a pas pu le retenir.","Même dans le tombeau,","Jésus est Seigneur."]]]},{"n":577,"t":"Hier, aujourd’hui, pour jamais","s":[[0,["Hier, aujourd’hui, pour jamais","Jésus ne change pas.","Tout se flétrit ici-bas,","Jésus ne change pas.","Béni soit Son nom (bis)","Tout se flétrit ici-bas,","Lui ne change pas."]]]},{"n":578,"t":"Fleuves d’eau vive, (bis)","s":[[0,["Fleuves d’eau vive, (bis)","Venez inonder mon âme assoiffée,","Jésus est mort pour que je vive.","Alléluia! Il m’a sauvé."]],[0,["Fleuves d’eau vive, (bis)","Oui, vous inondez mon âme assoiffée,","Jésus est mort, et j’ai la Vie","Alléluia! Je suis sauvé."]]]},{"n":579,"t":"Esprit Saint du Dieu vivant,","s":[[0,["Esprit Saint du Dieu vivant,","Viens et demeure en moi;","Esprit Saint du Dieu vivant,","Viens, ô viens à moi.","Brise-moi, remplis-moi!","Conduis-moi, transforme-moi!","Esprit Saint du Dieu vivant,","Viens et demeure en moi."]]]},{"n":580,"t":"Dieu nous donne en Christ","s":[[0,["Dieu nous donne en Christ","Un salut joyeux,","Un salut qui chante, Alléluia!","Ce salut joyeux qui chante, Alléluia!","Dans l’amour de Dieu,","Que c’est merveilleux!","Ce salut joyeux qui chante, Alléluia!","Sais-tu qu’il est aussi pour toi?"]]]},{"n":581,"t":"De la croix la grâce coule,","s":[[0,["De la croix la grâce coule,","Comme un fleuve constamment.","Oh ! venez, venez en foule ;","Un plein pardon vous attend,","Oh ! venez, venez en foule ;","Un plein pardon vous attend."]],[0,["Oui, pour tous la grâce abonde,","A tous le ciel est ouvert,","Pour tous les pécheurs du monde","Le Rédempteur a souffert","Pour tous les pécheurs du monde,","Le Rédempteur a souffert.","Crois à sa miséricorde","Qui dure éternellement.","Pour toi, la grâce déborde,","A cette heure, à ce moment,","Pour toi, la grâce déborde,","A cette heure, à ce moment."]]]},{"n":582,"t":"Crois seulement, (bis)","s":[[0,["Crois seulement, (bis)","Tout est possible à celui qui croit.","Crois seulement, (bis)","Tout est possible, crois seulement.","Jésus est là, (bis)","Tout est possible, Jésus est là.","Jésus est là, (bis)","Tout est possible, Jésus est là."]]]},{"n":583,"t":"C’est le Roi des rois qui ne change pas,","s":[[0,["C’est le Roi des rois qui ne change pas,","L’Etoile brillante du matin,","Le Prince de paix, la Vie et la Vérité,","Et je sais que je suis Sien.","Il est mon Sauveur, et mon Guide,","Secours dans toutes mes détresses.","Il est l’Alpha et l’Oméga,","Le Commencement et la Fin.","C’est à Lui que j’appartiens."]]]},{"n":584,"t":"Car Dieu aima le monde","s":[[0,["Car Dieu aima le monde","Donnant Son Fils unique","Pour mourir sur la Croix","Et pour me libérer.","Un jour, Il reviendra,","Quelle gloire ce sera!","Merveilleux amour pour moi!"]]]},{"n":585,"t":"Reviens à ton Père,","s":[[0,["Reviens à ton Père,","Enfant égaré!","Dis-Lui ta misère,","Dis-Lui: «j’ai péché».","Toujours Il pardonne","A qui se repent.","Pour toi l’heure sonne,","C’est toi qu’Il attend"]],[0,["Reviens à ton Père,","Ses biens sont pour toi.","Entends Sa prière,","Reviens sans effroi!","Sa main s’est tendue","Vers toi maintenant;","Sa voix bien connue","Dit:

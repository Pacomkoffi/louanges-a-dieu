fond la coupe amère:","Comme ton Dieu, sois patient."]],[0,["Ne sais-tu pas quelle est Sa grâce,","Que de péchés Son amour t’a remis?","Qu’ainsi jamais ton support ne se lasse","Envers tes plus grands ennemis.","S’ils sont cruels, si leurs haines s’attisent,","De ta bonté rouvre-leur le trésor;","S’ils sont hautains, s’ils te méprisent,","Comme ton Dieu pardonne encor."]],[0,["Ce n’est pas toi que hait le monde,","C’est ton Sauveur qu’ils ne connaissent pas","Ah! Plains-les donc, leur misère est profonde","Contre Dieu se lèvent leurs bras.","Tends-leur la main au bord du précipice,","S’ils sont tombés, cours et sois leur soutien,","Et, pour punir leur injustice,","Comme ton Dieu, fais-leur du bien."]]]},{"n":316,"t":"Dépêchons nous amis, il est grand temps,","s":[[0,["Dépêchons nous amis, il est grand temps,","L’unique bateau viendra bientôt.","Il va embarquer ceux qui sont prêts,","Tandis que les autres resteront.","La détresse sera sans précédent ;","Ce sera de grands jours de frayeurs","Pendant qu’il est temps, amis venez,","Pour aller à la rencontre du Seigneur."]]]},{"n":317,"t":"Jésus, Ta sainte présence","s":[[0,["Jésus, Ta sainte présence","Est la source du bonheur.","Dans la joie et la souffrance","Elle est le repos du cœur."]],[1,["Fais briller sur moi Ta face,","O Jésus, Agneau de Dieu!","À Tes pieds c'est là ma place,","Près de Toi mon ciel est bleu."]],[0,["Sur celui qui te contemple","Descend un rayon divin;","Tu fais de son cœur Ton Temple,","Ton doigt pointe son chemin."]],[0,["Ah! que mon âme ravie","Te rencontre, ô mon Sauveur!","Car Ton regard c’est la vie,","C’est la richesse du cœur!"]],[0,["Il faut aussi Ta présence","Pour Ton service, ô Jésus!","Car elle est une puissance","Pour relever les perdus!"]],[0,["Quand, dans l’étendue immense,","O Jésus, tu paraîtras,","C’est encore par Ta présence","Que Tu nous attireras!"]]]},{"n":318,"t":"Seigneur, ce que je réclame,","s":[[0,["Seigneur, ce que je réclame,","C’est ce riche don d’amour!","Que cette céleste flamme","En moi brûle nuit et jour!","Cet amour, si fort, si tendre,","Amour qui supporte tout,","Qui ne veut pas se défendre,","Prêt à souffrir jusqu’au bout."]],[0,["Pour les autres il s’oublie,","Il ne peut être envieux,","Tout éloge l’humilie,","Jamais il n’est orgueilleux.","Cet amour peut vaincre et fondre","Les cœurs méchants, durs, glacés;","Ils ne peuvent rien répondre,","L’amour les a terrassés."]],[0,["Devant la vaste souffrance","Qui s’étend de jour en jour,","Il faut un remède immense,","Il faut un immense amour.","Que jusqu’à la mort fidèle,","Priant, luttant en tout lieu,","Ma vie entière révèle","L’amour sublime de Dieu."]]]},{"n":319,"t":"Seul refuge de mon âme,","s":[[0,["Seul refuge de mon âme,","Je veux m’appuyer sur Toi;","La paix que mon cœur réclame","Est à Tes pieds, ô mon Roi!"]],[1,["Jésus, Sauveur, que je T’aime,","O Toi qui mourus pour moi,","Et qui veux dans le ciel même,","Qu’un jour je règne avec Toi!"]],[0,["Sur Ta croix, Victime sainte,","Mon péché fut expié;","Plus d’angoisse, plus de crainte:","Ton Sang m’a purifié."]],[0,["Il n’est aucune autre chose","Qui puisse apaiser mon cœur;","Eu Toi seul je me repose,","En Toi, mon puissant Sauveur."]],[0,["À Toi Jésus, j’abandonne","Mon cœur, mon âme et mes jours,","Qu’en moi Ton amour rayonne!","Je veux Te servir toujours."]]]},{"n":320,"t":"Mon Sauveur, je voudrais être","s":[[0,["Mon Sauveur, je voudrais être","Une fleur de Tes parvis;","Briller pour Toi seul, ô Maître,","Puisque par Toi seul, je vis;","Dans le silence répandre","Le parfum de Ton Amour;","Dans la nuit obscure attendre","L’aurore de Ton Retour."]],[0,["Mon Sauveur, je voudrais être,","Sur le sentier ténébreux,","Un faible reflet, ô Maître,","De Ton éclat radieux;","Luire sur la sombre route","Du cœur perdu loin de Toi;","Dissiper la nuit du doute","Par la clarté de la Foi."]],[0,["Mon Sauveur, je voudrais être,","Comme un écho de Ta voix","Pour proclamer, ô doux Maître,","Le mystère de Ta croix;","Pour parler de délivrance","A ceux qu’assaille la mort,","Pour consoler la souffrance","Et montrer à tous le port."]]]},{"n":321,"t":"Renonce à tous tes biens.","s":[[0,["Renonce à tous tes biens.","Comment ferai-je, Éternel Dieu,","Pour renoncer à tous mes biens ?"]],[0,["Prends ma main et conduis-moi,","Transforme tout mon être.","Apprends-moi comment Te servir,","Éloigne-moi de toutes tentations."]]]},{"n":322,"t":"Je chante de tout mon cœur : Alléluia!","s":[[0,["Je chante de tout mon cœur : Alléluia!","Gloire soit à Toi, ô Seigneur","Qui m’a sauvé."]],[0,["Jésus m’a sauvé - Alléluia!","Gloire à Son Nom - Alléluia!","J’ai la victoire!","Alléluia! Je suis sauvé.","La joie est dans mon cœur.","Je chante : Alléluia!"]]]},{"n":323,"t":"Seigneur, à ton regard de flamme","s":[[0,["Seigneur, à ton regard de flamme","Rien n'est couvert, rien n'est caché ;","Qu'il pénètre au fond de notre âme,","Et qu'il juge en nous le péché,","Qu'il juge le péché !"]],[0,["Sonde nos cœurs et nos pensées,","Nos plus intimes souvenirs,","Nos œuvres présentes, passées ;","Sonde nos plus secrets désirs,","Nos plus secrets désirs."]],[0,["Qu'à la lumière tout paraisse","Pour que tout soit purifié,","Et qu'en nous ton Esprit ne laisse","Rien qui ne soit sanctifié,","Vraiment sanctifié."]],[0,["Alors, brûlants d'un nouveau zèle,","Seigneur, nous pourrons t'obéir.","Oh ! Que la vie est grande et belle","Pour ceux qui veulent te servir,","Qui veulent te servir !"]]]},{"n":324,"t":"Dieu de tendresse,","s":[[0,["Dieu de tendresse,","Dispensateur de tout bien.","Toi qui sans cesse","Nous rend joyeux et sereins."]],[1,["Apprend-nous à T’aimer (bis)","Sans jamais nous lasser.","Reçois ces présents","De nos cœurs reconnaissants."]]]},{"n":325,"t":"Le chemin du Christ est le salut ;","s":[[0,["Le chemin du Christ est le salut ;","Hâtez-vous, bien-aimés du Seigneur.","Cette voie est étroite et pénible ;","Confiez-vous au bon Sauveur Jésus."]],[0,["Et si l’ennemi vous fait rage,","Jamais ne cherchez la vengeance.","La couronne est si belle et si douce,","Qu’elle change vos cris et vos pleurs en joie."]]]},{"n":326,"t":"Je n’ai que Jésus, pour me relever","s":[[0,["Je n’ai que Jésus, pour me relever","Je n’ai que Jésus, pour me guérir","Je n’ai que Jésus, comme espérance","De Sa puissance, Il me remplit."]],[0,["Je n’ai que Jésus, je n’ai que Lui.","Pour me diriger, pour me garder","Et dans mes luttes, Il me soutient","Je n’ai que Jésus, je n’ai que Lui."]]]},{"n":327,"t":"Aujourd’hui, chantons en chœur,","s":[[0,["Aujourd’hui, chantons en chœur,","Jésus notre bon Sauveur.","Dans Son grand Amour,","Nouveau chaque jour,","Il nous conduit vers le ciel.","Oh, le meilleur des amis,","Toujours, Il nous l’a promis,","Veille sur nos pas.","Ne nous lassons pas,","Son Amour est éternel."]]]},{"n":328,"t":"Un jour Jésus-Christ vint habiter mon cœur","s":[[0,["Un jour Jésus-Christ vint habiter mon cœur","Oh! Bonheur, parfait bonheur.","Il chassa la nuit, essuya tous mes pleurs","Oh! Quel heureux jour!","Et maintenant, c’est en chantant","Que je suis le chemin du salut","Un jour Jésus-Christ vint habiter mon cœur","Oh! Quel heureux jour!"]]]},{"n":329,"t":"Vivre en Jésus Christ, dans Son amour","s":[[0,["Vivre en Jésus Christ, dans Son amour","Chanter partout Son saint Nom ;","Le faire connaître à tous les hommes","C’est là le seul désir de mon cœur."]],[1,["Chantez Son Nom, Son Nom, Son Nom","Louez Son Nom, Son Nom, Son Nom","Célébrez tous le Nom du Sauveur"]],[0,["Marchant sur le chemin, ou au travail","Dans tous les lieux où je me trouve ;","Je veux le méditer seul dans mon cœur","Car Il est le seul Trésor que mon âme cherche."]],[0,["Être le joyau de Sa couronne !","Faire briller Sa beauté divine ;","Et être Son bien-aimé qui régnera","Avec Lui dans Sa céleste gloire."]]]},{"n":330,"t":"Souffle sur moi Seigneur,","s":[[0,["Souffle sur moi Seigneur,","Remplis-moi de Ta vie.","Pour que je marche dans Tes voies","Les yeux fixés sur Toi"]],[0,["Ne m’abandonne pas,","Ne T’éloigne pas de moi.","Ne soit pas insensible à mes larmes,","Oh! Père viens à mon secours."]]]},{"n":331,"t":"Roc séculaire, frappé pour moi","s":[[0,["Roc séculaire, frappé pour moi","Sur le Calvaire, je viens à Toi.","Tu sais mes chutes, ô mon Sauveur!","Tu vois mes luttes et ma douleur"]],[1,["Roc séculaire frappé pour moi","Sur le Calvaire, je viens à Toi"]],[0,["Oh! Purifie, lave, Seigneur,","Et sanctifie mon pauvre cœur.","Ma main tremblante ne T’offre rien;","Ta croix sanglante est mon seul bien"]],[0,["Dans la détresse, sois mon Berger,","Ma forteresse dans le danger.","Et qu’à toute heure, que chaque jour","Mon cœur demeure en Ton Amour."]]]},{"n":332,"t":"Mon Sauveur souffrit sur la croix,","s":[[0,["Mon Sauveur souffrit sur la croix,","Gloire à l’Agneau de Dieu!","Oh! Viens Le louer avec moi;","Gloire à l’Agneau de Dieu!"]],[1,["L’Agneau! L’Agneau!","L’Agneau de Dieu","J’aime l’écho de Son saint Nom;","Ce Nom brillera sur mon front","Gloire à l’Agneau!"]],[0,["Je veux dire à chaque pécheur,","Gloire à l’Agneau de Dieu!","Qu’enfin j’ai trouvé mon Sauveur,","Gloire à l’Agneau de Dieu!"]],[0,["Oui, je veux chanter plein de foi,","Gloire à l’Agneau de Dieu!","Que mon sauveur est mort pour moi","Gloire à l’Agneau de Dieu!"]],[0,["Du monde je fais l’abandon","Gloire à l’Agneau de Dieu!","De mes péchés, j’ai le pardon","Gloire à l’Agneau de Dieu!"]],[0,["Parmi les sauvés, j’ai mon nom","Gloire à l’Agneau de Dieu!","Mon cœur est lavé dans Son Sang","Gloire à l’Agneau de Dieu!"]]]},{"n":333,"t":"Avec allégresse","s":[[0,["Avec allégresse","Marcher vers le ciel,","Regarder sans cesse","Notre Emmanuel;","Puiser foi nouvelle","Dans ce doux regard,","De l’âme fidèle,","C’est la sûre part."]],[1,["Frères, frères,","Les cœurs en haut!","Jésus nous appelle,","Il viendra bientôt.","Jésus nous appelle,","Il viendra bientôt."]],[0,["Là, tout est lumière,","Paix et sainteté;","Là, plus de misère,","Tout est charité!","Sur ce doux rivage","Ont cessé les pleurs;","Jésus, Ton image","Est dans tous les cœurs."]],[0,["Amis, bon courage!","L’étoile qui luit","Dissipe l’orage","Et la sombre nuit.","Veillons sur notre âme,","Jésus vient bientôt!","Lui seul nous réclame:","Tous les cœurs en haut!"]],[1,["Frères, frères,","Le ciel est près!","Jésus, Roi de gloire,","Y règne à jamais!","Jésus, Roi de gloire,","Y règne à jamais!"]]]},{"n":334,"t":"Je suis heureux car Jésus m’a sauvé.","s":[[0,["Je suis heureux car Jésus m’a sauvé.","Dans Son amour H m’a pardonné.","Voilà pourquoi je me mets à chanter.","Je suis heureux car Jésus m’a sauvé."]],[0,["Oui j’aime, j’aime l’Homme de Galilée.","Oui j’aime, j’aime l’Homme de Galilée.","Mes péchés effacés, mes fardeaux enlevés ;","Oui j’aime, j’aime l’Homme de Galilée."]]]},{"n":335,"t":"Avançons-nous joyeux, toujours joyeux,","s":[[0,["Avançons-nous joyeux, toujours joyeux,","Vers le pays des esprits bienheureux,","Vers la demeure où Jésus pour nous prie,","Marchons joyeux, c’est là notre patrie","Avançons-nous joyeux, toujours joyeux,","Vers le pays des esprits bienheureux","Des chants d’amour retentissent aux deux.","Quels doux concerts! Harpes des bienheureux","Nous entendrons votre sainte harmonie","Quand nous aurons atteint notre patrie","Avançons-nous joyeux, toujours joyeux,","Vers le pays des esprits bienheureux"]],[0,["Ton aiguillon, ô mort, tu ne l’as plus!","Tombeau, déjà nous ne te craignons plus;","Sur Toi Jésus remporta la victoire;","Il nous ouvrit le chemin de la gloire","Lui-même dit: Accourez tous joyeux","Vers le pays des esprits bienheureux"]],[0,["Heureux bientôt dans un monde nouveau,","Nous prendrons place au banquet de l’Agneau","Là, plus de cris, plus de deuil, plus de larmes,","Plus de péchés, de douleurs ni d’alarmes","Là, nous serons joyeux, toujours joyeux.","C’est le pays des esprits bienheureux!"]]]},{"n":336,"t":"Mon cœur joyeux, plein d’espérance,","s":[[0,["Mon cœur joyeux, plein d’espérance,","S’élève à Toi, mon Rédempteur!","Daigne écouter avec clémence","Un pauvre humain faible et pécheur.","En Toi seul est ma confiance,","En Toi seul est tout mon bonheur."]],[0,["C’est vers Ton ciel que, dans ma course","Je vois aboutir tous mes pas;","De Ton Esprit la vive source","Me rafraîchit quand je suis las;","Et, dans le danger, ma ressource","Est dans la force de Ton bras."]],[0,["Le jour, je marche à Ta lumière;","La nuit, je repose en Ton sein;","Dès le matin, à ma prière,","Tu viens éclairer mon chemin,","Et chaque soir, ô mon bon Père,","Tu prépares mon lendemain."]],[0,["Je vois ainsi venir le terme","De mon voyage en ces bas lieux,","Et j’ai l’attente vive et ferme","Du saint héritage des cieux:","Sur moi si la tombe se ferme,","J’en sortirai victorieux."]]]},{"n":337,"t":"Christ nous précédant,","s":[[0,["Christ nous précédant,","Marchons en avant,","Sur le chemin de la vie.","Sa voix sainte nous convie","À Le suivre enfin","Au séjour divin."]],[0,["Luttes et labeurs,","Périls ou douleurs,","Pourront traverser ma route;","Mais je veux, quoi qu’il en coûte,","Porter ferme et haut","Ton divin drapeau.","Le bonheur s’enfuit,","Le deuil me poursuit,","Il me faut souffrir moi-même,","Où pleurer pour ceux que j’aime;","Mais j’ai dans mon cœur","Un Consolateur."]],[0,["Fort de Ton secours,","J’avance toujours.","Soutiens mon faible courage,","Achève en moi Ton ouvrage,","Et que par la foi","Je sois tout à Toi."]]]},{"n":338,"t":"J’ai l’assurance de mon salut ;","s":[[0,["J’ai l’assurance de mon salut ;","Par la présence du Seigneur Jésus.","Son sang m’a lavé, m’a racheté,","Et l’Esprit Saint m’a régénéré."]],[1,["C’est mon histoire,","C’est là mon chant","Louer mon Sauveur","À chaque instant"]],[0,["Je veux obéir à mon Sauveur,","Dans mon cœur, sentir la paix de Son Cœur","Veiller et prier, l’attendre un jour,","Me laisser lier par Son Amour."]]]},{"n":339,"t":"Je dois voyager au monde","s":[[0,["Je dois voyager au monde","Comme un esquif sur les eaux,","Et la tempête qui gronde","Déjà fait mugir les flots."]],[1,["Christ est ma vie,","Il est mon Roi.","Toujours Il prie","Notre Père pour moi."]],[0,["Il m’a donné la boussole","Qui, sans erreur, pointe au port:","C'est Sa vivante Parole;","Avec elle, point de mort!","Si le vent m’est favorable,","Si mon ciel est clair et pur,","Ce pilote charitable","Me dit: veille! Rien n’est sûr!"]],[0,["Et si vient le sombre orage,","Si tout semble menaçant,","Mon pilote m’encourage","Son regard tout-puissant."]],[0,["Je ne crains donc ni naufrage,","Ni pirate, ni récif;","J’ai déjà reçu le gage","Du salut de mon esquif"]]]},{"n":340,"t":"Sans attendre,","s":[[0,["Sans attendre,","Je veux tendre","Au bonheur promis;","Qui s’élance, qui s’avance,","Obtiendra le prix."]],[1,["De mon Dieu je suis l’enfant,","Et c’est Lui qui me défend.","Donc en route!","Point de doute,","Le but est si grand!"]],[0,["Près du trône,","La couronne","Attend le vainqueur.","Nulle trêve!","Qu’on se lève!","A dit le Seigneur"]],[1,["D’obéir, soyons heureux;","Point de tièdes, de peureux!","Qui se lasse perd sa place","Au banquet des deux."]],[0,["D’un pas ferme,","Jusqu’au terme","Il faut s’avancer!","Dieu m’observe,","Qu’Il préserve","Mon pied de glisser!"]],[1,["Que ce monde et ses attraits","Ne me séduisent jamais!","Si sa haine se déchaîne,","Que je sois en paix !"]],[0,["Dieu de grâce,","Que Ta face","Luise en mon chemin!","Père tendre,","Viens me prendre","Par Ta forte main!"]],[1,["Toute puissance est à Toi,","Subviens à ma faible foi:","Ma victoire, c’est Ta gloire,","O mon Dieu, mon Roi"]]]},{"n":341,"t":"Suivez, suivez l’Agneau","s":[[0,["Suivez, suivez l’Agneau","Jusqu’au soir de la vie","Vers un gras pâturage","Il mène Son troupeau","Au bonheur des élus","Sa grâce vous convie;","Suivez toujours,","Suivez toujours l’Agneau!"]],[0,["Suivez-Le sans frayeur,","Au jour de la tristesse;","Déposez dans Son sein","Votre pesant fardeau;","Suivez-Le dans la paix,","Au jour de l’allégresse;","Suivez toujours,","Suivez toujours l’Agneau!"]],[0,["Mais suivez-le partout.","Le Berger qui vous mène","Vous aime, et ne saurait","Égarer Son troupeau.","Oui, le joug du Seigneur","Est une douce chaîne.","Suivez toujours,","Suivez toujours l’Agneau!"]],[0,["Suivez-Le sans broncher;","Le chemin solitaire","Doit vous conduire un jour","Au céleste repos,","Mais pour Le suivre au Ciel,","Suivez-Le sur la terre.","Suivez toujours,","Suivez toujours l’Agneau !"]]]},{"n":342,"t":"Veille au matin, quand un ciel sans nuage","s":[[0,["Veille au matin, quand un ciel sans nuage","Semble annoncer un jour calme et serein,","C’est dans ton cœur que peut gronder l’orage","Qui fait tomber le pèlerin."]],[1,["Veille au matin, veille le soir,","Veille et prie toujours."]],[0,["Veille à midi, quand les bruits de la terre","Font oublier le céleste séjour;","Trouve un instant pour être solitaire","Dans la prière et dans l’amour."]],[0,["Veille le soir, quand se fait le silence;","Pense aux bienfaits de ton céleste Ami;","Cherche avec soin Sa divine présence,","Verse en Son cœur tout ton souci."]],[0,["Veille toujours, en tous lieux, à toute heure","Car l’ennemi te guette à chaque instant,","Pour se glisser dans la sainte demeure","Où doit régner le Tout-Puissant."]]]},{"n":343,"t":"Lutte quand l’Esprit de grâce","s":[[0,["Lutte quand l’Esprit de grâce","T’attire et te convertit;","Que ton cœur se débarrasse","De tout secret interdit!","Ne reste pas en chemin!","Cœur qui doute n’obtient rien:","Lutte bien, lutte bien!"]],[0,["Lutte pour brûler de zèle,","Pour que le premier amour","T’arrache au monde infidèle,","T’en détache sans retour.","Ne t’accorde aucun répit;","Persévère jour et nuit:","Lutte bien, lutte bien!"]],[0,["Lorsque la perle est gagnée,","Ne crois pas que, désormais,","La lutte soit terminée,","Le mal détruit pour jamais.","Défie-toi de ton cœur;","Ne regarde qu’au Sauveur!","Veille bien, veille bien !"]],[0,["Un cœur fidèle et sincère,","Aime Christ, hait le péché,","Pleure et combat sur la terre,","A soif de l’éternité.","Soldats de Christ, lutte encor!","Dans le ciel est ton trésor:","Lutte bien, lutte bien!"]]]},{"n":344,"t":"Mon seul appui, c’est l’ami céleste","s":[[0,["Mon seul appui, c’est l’ami céleste","Jésus seul! Jésus seul!","Les ans s’en vont, cet Ami me reste,","Jésus seul! Jésus seul!"]],[1,["Cet Ami connaît mes alarmes.","Son amour guérit ma douleur ;","Sa main essuie toutes mes larmes,","Doux sauveur! Doux sauveur!"]],[0,["Tout mon désir, c’est de Le connaître,","Jésus seul! Jésus seul!","Et que Sa paix remplisse mon être,","Jésus seul! Jésus seul!"]],[0,["Dans le danger toujours Il me garde,","Jésus seul! Jésus seul!","Dans mes soucis, à Lui je regarde.","Jésus seul! Jésus seul!"]],[0,["Je Le suivrai, cet Ami, ce Guide,","Jésus seul! Jésus seul!","À travers ce grand désert aride","Jésus seul! Jésus seul!"]],[0,["Merci, Seigneur de ce don suprême,","Jésus seul! Jésus seul!","Il m’appartient, je Le sers, je L’aime,","Jésus seul! Jésus seul!"]]]},{"n":345,"t":"Dès que l’aube dépose","s":[[0,["Dès que l’aube dépose","Ses perles sur les fleurs,","Dès que s’ouvre la rose","Aux brillantes couleurs,","Dès que l’ombre s’efface","Devant le jour qui luit,","A l’œuvre, le temps passe!","À l’œuvre avant la nuit!"]],[0,["Quand le soleil inonde","Et remplit le ciel bleu,","Illuminant le monde","De ses rayons de feu,","À l’œuvre sans relâche,","À l’œuvre, le jour fuit!","Si pénible est la tâche,","Bientôt viendra la nuit!"]],[0,["À cette heure indécise,","Où le jour disparaît,","Où murmure la brise","À travers la forêt,","Quand le couchant se dore","Et que s’éteint le bruit,","Frères, à l’œuvre encore,","Voici, voici la nuit!"]]]},{"n":346,"t":"Écoutez l’appel du Berger!","s":[[0,["Écoutez l’appel du Berger!","Il sait Ses brebis en danger;","Il les appelle avec amour,","Espérant toujours leur retour."]],[1,["Cherchons-les! Cherchons-les!","Savons-nous le prix d’une âme?","Cherchons-les! Cherchons-les!","Le Bon Berger les réclame."]],[0,["Mourant de froid, de soif, de faim,","Les brebis appellent en vain.","Jésus nous veut pour les sauver:","Qui va L’aider à les trouver?"]],[0,["Ne peut-il pas compter sur nous?","Ne voulons-nous pas aller tous","Dire à tous ceux qui sont perdus","Que nous les voulons pour Jésus?"]]]},{"n":347,"t":"La voix de Christ nous appelle;","s":[[0,["La voix de Christ nous appelle;","Il est temps de s’éveiller:","«La moisson est vaste et belle!","Qui veut pour moi travailler?»","C’est ton Sauveur, ô mon frère,","Dont l’appel s’adresse à toi.","Réponds-Lui, d’un cœur sincère:","«Me voici, Maître, prends-moi!»"]],[0,["Sans franchir les mers bruyantes,","Tu peux annoncer Jésus.","Que d’âmes insouciantes,","De cœurs souffrants et perdus!","Autour de nous l’œuvre est grande,","Mais petite est notre foi.","À Jésus qui nous commande","Répondons: «Maître, aide-moi!»","Si d’un sublime langage","Tu n’as pas reçu le don,","Tu peux rendre témoignage","Qu’en Jésus est le pardon;","À ton frère tu peux dire","Ce que Christ a fait pour toi.","Pour que Lui-même t’inspire,","Dis-Lui: «Maître, enseigne-moi!»"]],[0,["Mais que nul ne nous entende","Dire encore: «Je ne puis rien!»","Lorsque Jésus nous commande.","De faire et d’aimer le bien.","Poursuivons l’œuvre bénie","Avec zèle, amour et foi,","Puis, notre tâche finie,","Nous dirons: «Maître, prends-moi!»"]]]},{"n":348,"t":"Oh! Prends mon âme, prends-la Seigneur","s":[[0,["Oh! Prends mon âme, prends-la Seigneur","Et que Ta flamme brûle en mon cœur.","Que tout mon être vibre pour Toi,","Sois seul mon Maître, mon Divin Roi"]],[0,["Source de vie, de paix, d’amour","Vers Toi je crie la nuit, le jour.","Entends ma plainte, sois mon soutien.","Calme ma crainte, Toi mon seul bien."]],[0,["Du mal perfide, oh garde moi,","Viens, sois mon Guide, Chef de ma foi.","Quand la nuit voile tout à mes yeux","Sois mon étoile, brille des cieux."]],[0,["Voici l’aurore d’un jour nouveau","Le ciel se dore de feux plus beaux.","Jésus s’apprête, pourquoi gémir ?","Levons nos têtes, Il va venir."]]]},{"n":349,"t":"Semons dès que brille l’aurore,","s":[[0,["Semons dès que brille l’aurore,","Semons dès que le soleil luit,","Pendant le jour semons encore,","Semons avant la sombre nuit...","Semons!","Dieu seul peut faire éclore;","De Lui seul, attendons le fruit."]],[1,["Ah! Répandons la divine semence,","Dans le succès comme dans le mépris.","Le jour se lève et la moisson s’avance,","Et Dieu, là-haut, nous réserve le prix."]],[0,["Semons sur le bord de la route,","Semons sur le terrain pierreux;","Semons dans le cœur où le doute","Semble étouffer la voix des cieux.","Semons!","Et, si l’on nous écoute,","Parlons du Sauveur glorieux."]],[0,["Semons lorsque, dans sa tristesse,","Notre cœur murmure: «À quoi bon?»","Répétons à tous la promesse","Et l’Évangile du pardon.","Semons!","Bientôt, douce allégresse,","Luira le jour de la moisson."]]]},{"n":350,"t":"Travaillons et luttons!","s":[[0,["Travaillons et luttons!","Nous sommes au Seigneur,","Suivons l’étroit sentier","Qui conduit à la vie!","Jésus marche avec nous,","Avançons sans frayeur,","Il nous garde et Son bras","Toujours nous fortifie."]],[1,["Travaillons et luttons,","Travaillons et luttons,","Soyons prêts et prions,","Bientôt le Maître va venir!"]],[0,["Travaillons et luttons!","Que les cœurs affligés,","Les perdus loin de Dieu","Retrouvent l’espérance!","Vers la croix, dirigeons","Leurs regards angoissés,","Pressons-les d’accepter","Jésus, leur délivrance."]],[0,["Travaillons et luttons!","Il nous appelle tous,","Le champ nous est ouvert","Et la moisson est grande!","Pour servir notre Chef,","Ne pensons plus à nous,","En avant vers le but!","Le Maître le demande."]],[0,["Travaillons et luttons!","Sans jamais nous lasser,","De notre Rédempteur,","Élevons la bannière.","Fidèles jusqu’au bout,","Sachons persévérer,","Le repos nous attend","Dans la pleine lumière!"]]]},{"n":351,"t":"J’aime l’Éternel","s":[[0,["J’aime l’Éternel","Car Il entend ma voix","Il a penché vers moi Son oreille","Et je Le chanterai toute ma vie"]],[0,["Comment rendrai-je à l’Éternel","Ses bienfaits envers moi (bis)","Comment rendrai-je à l’Éternel","Ses bienfaits envers moi (bis)"]],[0,["Je veux aimer comme Il m’a aimé","Donner ma vie pour mes frères","Je veux marcher comme Il a marché","Vivre dans Sa lumière"]]]},{"n":352,"t":"Torrents d’amour et de grâce,","s":[[0,["Torrents d’amour et de grâce,","Amour du Sauveur en croix!","A ce grand fleuve qui passe,","Je m’abandonne et je crois."]],[1,["Je crois à Ton sacrifice,","O Jésus, Agneau de Dieu,","Et couvert par Ta justice,","J’entrerai dans le saint lieu"]],[0,["Ah! Que partout se répande","Ce fleuve à la grande voix;","Que tout l’univers entende","L’appel qui vient de la croix!"]],[0,["Que toute âme condamnée","Pour qui Tu versas ton sang,","Soit au Père ramenée","Par Ton amour tout-puissant."]]]},{"n":353,"t":"Ils étaient cent vingt fidèles","s":[[0,["Ils étaient cent vingt fidèles","Tous d’un même accord,","Persévérant avec zèle","Priant le Dieu fort."]],[1,["Seigneur, doux Maître,","C’est Toi qui bénis,","Aujourd’hui, remplis mon être,","De Ton Saint-Esprit."]],[0,["Soudain, sur la chambre haute,","Le feu descendit.","En langues de Pentecôte,","Gages de l’Esprit!"]],[0,["Embrasés d’un nouveau zèle,","Ils vont proclamer,","Les splendeurs surnaturelles","Du Ressuscité."]],[0,["Et bientôt, trois milliers d’âmes","S’offrent au Seigneur.","Que l’Esprit Saint nous enflamme","Des mêmes ferveurs."]],[0,["La glorieuse promesse","S’accomplit toujours.","Viens Esprit de hardiesse,","De force et d’amour."]]]},{"n":354,"t":"Je sens Ta main dessus de moi,","s":[[0,["Je sens Ta main dessus de moi,","Mon Sauveur et mon Dieu.","Et pas à pas, je Te suivrai,","Partout où Tu iras,"]],[1,["Je sais en qui j’espère,","Par qui je suis béni.","Tu es la racine de mon âme,","Je marche avec Toi."]],[0,["Seigneur, mon Dieu délivre-moi,","De tous les liens du diable.","Et remplis-moi de Ton Amour,","Fais-moi vivre pour Toi."]],[0,["Seigneur, Toi seul peux me donner,","Tout ce dont j’ai besoin.","Apprends- moi à compter sur Toi,","Tous les jours de ma vie."]]]},{"n":355,"t":"Le diable rugira toujours,","s":[[0,["Le diable rugira toujours,","Il nous créera des problèmes,","Mais il est impuissant","Car Christ est vivant"]],[1,["Alléluia, alléluia,","Alléluia Jésus est vivant (bis)"]],[0,["Le monde fut détruit pour toujours,","Jésus mit la mort sous Ses pieds.","Du combat de la vie,","Il sortit vainqueur."]]]},{"n":356,"t":"Grâce infinie de notre Dieu,","s":[[0,["Grâce infinie de notre Dieu,","Qui un jour m’a sauvé.","J’allais errant de lieu en lieu,","Quand Il m’a retrouvé."]],[0,["Dans mes épreuves et mes labeurs,","Suffisante est Sa grâce.","Je peux compter sur Sa faveur,","À chaque heure qui passe."]],[0,["Dans le calme ou dans l’orage,","La joie ou la douleur,","À toute heure et à tout âge","Je regarde au Sauveur."]],[0,["Bientôt ce monde passera,","Avec ses vanités,","Le Fils de Dieu me conduira,","Dans Sa félicité."]],[0,["Quand nous aurons pendant mille ans,","Célébré Ses louanges,","Nous pourrons comme au commencement,","Lui offrir nos hommages."]]]},{"n":357,"t":"Qu’ils sont beaux sur les montagnes","s":[[0,["Qu’ils sont beaux sur les montagnes","Les pieds de Tes serviteurs,","Qui parcourent les campagnes,","Prêchant la grâce aux pécheurs!","O délicieuse vie","D’un serviteur de Jésus,","Qui pour son Maître s’oublie,","En annonçant Ses vertus!"]],[0,["Libre de toute autre chaîne,","Le chrétien qui sert son Dieu,","Dans la souffrance et la peine","Suit son Modèle en tout lieu.","Il faut qu’en vivante offrande","Il s’offre pour son Sauveur:","C’est là ce que Dieu demande","D’un fidèle serviteur."]],[0,["Ainsi, témoins de la grâce,","Répétez l’appel divin;","Allez, et de place en place,","Conviez au grand festin","Non les âmes indomptables,","Les mondains remplis d’orgueil,","Mais les pécheurs misérables","Qui sur leurs maux mènent deuil."]],[0,["Au cœur accablé de peines","Qui tremble au seul nom de mort,","Au captif chargé de chaînes","Qui n’attend qu’un triste sort,","Dites que Dieu, dans Sa grâce,","Donna Son Fils au pécheur,","Et que Sa mort efficace","Nous mérita Sa faveur."]]]},{"n":358,"t":"En rêve où j’allais près du lac m’asseoir,","s":[[0,["En rêve où j’allais près du lac m’asseoir,","Où la rive était isolée.","A l’heure où descend la fraîcheur du soir,","Des montagnes de Galilée.","Et là, je voyais parfois l’Étranger","Familier de la solitude.","Ami du pécheur et du péager,","Entouré de la multitude."]],[1,["Je Le suis Je L’écoute et je L’aime;","Mais comment Lui prouver mon amour.","Seulement par le don de moi-même.","M’engageant à Le servir toujours."]],[0,["Alors au matin, j’ai voulu savoir","Ce que dit de Lui l’écriture.","C’est là qu’on L’entend, là qu’on peut Le voir","Se donnant à nous sans mesure.","Il vit et Il meurt en portant nos maux,","Il rachète une race vile.","Récits émouvants, merveilleux tableau.","Quel Sauveur et quel Evangile ?"]],[0,["Je L’ai trouvé toujours pareil,","Dans le fond de ma conscience.","Sagesse, lumière, secours, conseil,","Il m’instruit dans Sa connaissance.","Sa voix, Son regard, Son pouvoir, Son cœur","Tout en Lui me surprend, m’attire.","Qu’Il juge et je suis tout saisi de peur","Qu’Il pardonne et j’ai Son sourire."]],[0,["Dès lors, Il n’est plus l’Étranger lointain,","Entrevu dans la solitude.","Un rêve, un espoir, l’idéal humain.","Mais la Vie et la certitude.","Jésus, Fils de Dieu qui mourut en croix","A Tes yeux, que ma foi s’écrie !","Quiconque T’a vu, se repent et croit,","A déjà l’éternelle Vie."]]]},{"n":359,"t":"Debout, sainte cohorte,","s":[[0,["Debout, sainte cohorte,","Soldats du Roi des rois!","Tenez d’une main forte","L’étendard de la croix.","Au sentier de la gloire","Jésus-Christ nous conduit;","De victoire en victoire","Il mène qui Le suit."]],[0,["Debout! Le clairon sonne:","Debout! Vaillants soldats!","L’immortelle couronne","Est le prix des combats.","Si l’ennemi fait rage,","Soyez fermes et forts;","Redoublez de courage","S’il redouble d’efforts."]],[0,["Debout pour la bataille!","Partez, n’hésitez plus;","Pour que nul ne défaille,","Regardez à Jésus.","De l’armure invincible,","Soldats, revêtez-vous!","Le triomphe est possible","Pour qui lutte à genoux."]],[0,["Debout, debout encore!","Luttez jusqu’au matin.","Déjà brille l’aurore","À l’horizon lointain."]],[0,["Bientôt, jetant nos armes","Aux pieds du Roi des rois","Les chants après les larmes,","Le trône après la croix."]]]},{"n":360,"t":"Je sais en qui j’espère,","s":[[0,["Je sais en qui j’espère,","Je sais en qui je crois.","Étranger sur la terre,","Je marche par la foi.","Je sais ce qui demeure,","Quand le funèbre glas","Appelle d’heure en heure;","Les sages d’ici-bas."]],[0,["Je sais ce qui ne cesse,","Ce qui ne trompe pas","Et quelle forteresse","Dieu m’offre dans Ses bras.","Je crois à la Parole","Que rien n’effacera","Tout fuit et tout s’envole,","Elle est, et restera."]],[0,["Je sais à quel bon Maître","J’ai remis mon destin.","Et pourquoi je puis être","Tranquille pour demain ?","Dieu règne sur la terre,","Il règne dans les cieux","Il est profond mystère","Et mon Père et mon Dieu."]],[0,["Par un dur sacrifice,","Il assure ma paix","Du jour de l’injustice,","Me sauva pour jamais.","Sur la croix d’infamie,","Christ fut cloué pour moi.","Sa mort sera ma vie,","Je le sais, je le crois."]],[0,["Je sais en qui je demeure","Et m’est un sûr appui","Je sais une demeure,","Un éternel abri","Vers la sombre vallée,","Je marche sans frayeur","Pour l’âme rachetée,","Il est un sûr bonheur."]]]},{"n":361,"t":"Seigneur, tiens ma main (bis)","s":[[1,["Seigneur, tiens ma main (bis)","O Sauveur incomparable","Toujours, tiens ma main"]],[0,["Quand je craindrai sur la route","Seigneur, tiens ma main","Quand m’assaillira le doute","Seigneur, tiens ma main"]],[0,["Quand le péché m’environne","Seigneur, tiens ma main","La victoire, Tu la donnes","Seigneur, tiens ma main"]],[0,["Dans la nuit d’épreuve amère","Seigneur, tiens ma main","Conduis-moi vers la lumière","Seigneur, tiens ma main"]],[0,["Je verrai Ta main meurtrie","Pour toujours là-haut.","Dans la céleste Patrie","O divin Agneau."]]]},{"n":362,"t":"Sépares-toi des œuvres des ténèbres","s":[[0,["Sépares-toi des œuvres des ténèbres","Si ton âme a été libérée.","Sépares-toi des œuvres des ténèbres","Si ton âme a été libérée.","Sépares-toi des œuvres des ténèbres (bis)"]],[0,["Dieu te conduira dans Sa parole.","Si ton âme a été libérée.","Dieu te conduira dans Sa parole.","Si ton âme a été libérée.","Dieu te conduira dans Sa parole (bis)"]],[0,["Loue l’Éternel avec joie,","Si ton âme a été libérée.","Loue l’Éternel avec joie,","Si ton âme a été libérée.","Loue l’Éternel avec joie (bis)"]],[0,["Prie l’Éternel avec foi,","Si ton âme a été libérée.","Prie l’Éternel avec foi,","Si ton âme a été libérée.","Prie l’Éternel avec foi (bis)"]],[0,["Jésus reviendra te chercher.","Si ton âme a été libérée,","Jésus reviendra te chercher.","Si ton âme a été libérée,","Jésus reviendra te chercher (bis)"]],[0,["Alors, tu seras enlevé","Si ton âme a été libérée","Alors, tu seras enlevé","Si ton âme a été libérée","Alors, tu seras enlevé (bis)"]]]},{"n":363,"t":"La paix! La paix! Jésus m’a libéré.","s":[[0,["La paix! La paix! Jésus m’a libéré.","C’est en Lui que j’ai trouvé la paix.","Ô Christ m’a libéré."]],[0,["La vie! La vie! Jésus m’a libéré.","C’est en Lui que j’ai trouvé la vie.","Ô Christ m’a libéré."]],[0,["La joie! Lajoie! Jésus m’a libéré.","C’est en Lui que j’ai trouvé la joie.","Ô Christ m’a libéré."]],[0,["L’Amour, l’Amour! Jésus m’a libéré.","C’est en Lui que j’ai trouvé l’Amour.","Ô Christ m’a libéré."]]]},{"n":364,"t":"Sentinelle vigilante,","s":[[0,["Sentinelle vigilante,","Qu’en est-il donc de la nuit?","Dis à l’âme somnolente","Que déjà, le matin luit!"]],[1,["La nuit passe, le matin du grand jour luit!","Sentinelle, sois au poste jour et nuit,","Sentinelle, sois au poste jour et nuit."]],[0,["Les gardes sur la muraille","Nous l’ont dit, entendez-vous?","Au loin gronde la bataille,","Tout est sombre autour de nous."]],[0,["Point de repos, de relâche,","Rachetés de l’Éternel.","Travaillez à votre tâche,","Car Jésus revient du Ciel!"]]]},{"n":365,"t":"Le signal de la victoire","s":[[0,["Le signal de la victoire","Déjà brille aux cieux;","La couronne de la gloire","Paraît à nos yeux."]],[1,["Je viens, combattez encore!","Dit Jésus à tous.","Oui, mon Sauveur, je T’implore,","Je lutte à genoux."]],[0,["Que l’ennemi, plein de rage,","Redouble ses coups,","Nous ne perdons point courage:","Christ est avec nous."]],[0,["Suivons, amis, la bannière","Du Sauveur en croix,","Et que notre armée entière,","Se range à Sa voix."]],[0,["Rude et longue est la mêlée:","Voici le secours!","Dans nos mains, prenons l’épée","Qui vainquit toujours!"]]]},{"n":366,"t":"Nous aurons la joie ;","s":[[0,["Nous aurons la joie ;","Dans ce beau pays de gloire.","Au Nom de Jésus."]],[1,["Notre Sauveur nous l’a promis.","Si notre adoration finit bien.","Nous serons dans ce beau pays.","A la gloire de Jésus."]]]},{"n":367,"t":"Je me confie en Toi.","s":[[0,["Je me confie en Toi.","Daigne me rapprocher de Toi.","Accorde-moi Ta sagesse.","O mon Dieu, aies pitié de moi.","Accorde-moi Ton Esprit Saint.","O mon Dieu, aie pitié de moi."]]]},{"n":368,"t":"La maladie vient et tout va bien.","s":[[0,["La maladie vient et tout va bien.","La mort vient aussi et tout va bien.","Les problèmes dans ma vie, tout va bien.","Tout va bien : dit la femme de Sunem."]]]},{"n":369,"t":"Le Seigneur est avec nous (bis)","s":[[0,["Le Seigneur est avec nous (bis)","Le Seigneur est avec nous en ce lieu.","Alléluia! Alléluia!","Alléluia! Gloire à Dieu (bis)"]],[0,["Soyons vraiment dans la joie (bis)","Soyons vraiment dans la joie.","Alléluia! Alléluia!","Alléluia! Gloire à Dieu (bis)"]]]},{"n":370,"t":"A de nouveaux combats,","s":[[0,["A de nouveaux combats,","Jésus, Tu nous appelles,","Et nous voici, fidèles,","Prêts à suivre Tes pas.","Conduis-nous aux combats:","Nous sommes Tes soldats."]],[1,["Arme nos bras, arme nos cœurs,","Et nous serons plus que vainqueurs,","Et nous serons plus que vainqueurs;","Arme nos bras, arme nos cœurs."]],[0,["Arme-nous, ô Seigneur!","De foi, de hardiesse,","De force, de sagesse,","D’amour et de ferveur;","Embrase-nous, Seigneur,","D’une invincible ardeur."]],[0,["Nous tiendrons ferme et haut","La croix, notre bannière,","Pour vaincre l’adversaire","Par le sang de l’Agneau.","Oui, nous tiendrons bien haut","Ta croix, notre drapeau."]],[0,["Luttons, prions, souffrons!","Nous aurons la victoire;","La couronne de gloire","Un jour ceindra nos fronts.","Luttons, prions, souffrons,","Bientôt, nous régnerons!"]]]},{"n":371,"t":"Ils viennent de l’Est, de l’Ouest ;","s":[[0,["Ils viennent de l’Est, de l’Ouest ;","Ils viennent des lointains pays","A la fête du Roi, manger à Sa table.","Oh, quels pèlerins bénis !","Contemplant Son saint Visage","Brillant d’éclats divins ;","Participant de Sa gloire","Comme joyaux de Sa Couronne."]],[1,["Je suis si heureux depuis","Que Jésus m’a libéré.","Il n’y a pas longtemps, j’étais si chargé,","Son joug est très doux pour moi.","Mon âme était plus que nuit","Mais tout s’est envolé.","Maintenant, je crie victoire","Car Jésus m’a libéré."]],[0,["Je regarde le Trône blanc","Devant se tiennent les sauvés.","Maintenant plus de larmes,","Ni chagrins connus","Ni mort dans cette Cité.","Mon Sauveur m’a précédé","Prépare une place pour moi","Bientôt, nous serons ensemble","Là-haut pour l’éternité."]],[0,["Les portails de ce Lieu saint","Restent ouverts jour et nuit,","Regarde au Seigneur","Qui donne plus de grâce,","Dont l’amour a préparé","Une place dans Ses belles demeures","Qu’Il réserva pour moi !","Pour préparer les noces,","Obéis à cet appel."]],[0,["O Jésus revient bientôt","Alors, nos peines sont finies.","Si notre Seigneur","Venait maintenant","Pour ceux qui sont sans péchés,","Seriez-vous alors dans la joie","Ou le chagrin, la peine ?","Quand Il viendra dans Sa gloire","Nous Le rencontrerons là-haut."]]]},{"n":372,"t":"Sous le firmament,","s":[[0,["Sous le firmament,","Tout n’est que changement,","Tout passe!","Et quoique l’homme fasse,","Ses jours s’en vont fuyant.","Plus vite qu’un torrent","Tout passe!"]],[0,["Jeunesse et beauté,","Plaisir, force et santé.","Tout passe!","Tout se flétrit, s’efface,","Rien ne résiste au temps.","Comme une fleur des champs,","Tout passe!"]],[0,["C’est la vérité,","À part l’Éternité,","Tout passe!","Faisons valoir la grâce,","Le temps est précieux,","Tandis que sous nos yeux,","Tout passe!"]],[0,["Comme un vaisseau","Qui glisse au loin sur l’eau,","Tout passe!","Il n’en est plus de traces","Ainsi vont les honneurs,","Les biens et les grandeurs,","Tout passe!"]],[0,["Heureux, le vivant","Qui va toujours pensant.","Tout passe!","Rien n’est plus efficace","Pour supporter nos maux.","Que ces deux simples mots.","Tout passe!"]]]},{"n":373,"t":"Mort avec Christ d’une mort volontaire,","s":[[0,["Mort avec Christ d’une mort volontaire,","Je vis au ciel déjà sur cette terre","En attendant Son glorieux retour,","Je suis gardé par Lui de jour en jour."]],[1,["Jour après jour, gardé par Ton amour,","Jour après jour à T abri de Ton aile","C’est le repos et la vie éternelle !","Je T’appartiens Sauveur; pour toujours."]],[0,["Il n’est douleur que Son cœur ne partage,","Il n’est fardeaux dont Il ne me soulage,","Il n’est de pleurs qu’il ne daigne tarir,","Il n’est de maux qu’il ne puisse guérir."]],[0,["A mes soupirs s’incline Son oreille,","Lorsque je dors, près de moi Son cœur veille","Quand, pour toujours mes yeux se fermeront","Ses bras puissants au ciel me porteront."]]]},{"n":374,"t":"Plus que vainqueur! Telle est notre devise;","s":[[0,["Plus que vainqueur! Telle est notre devise;","Plus que vainqueurs, bien que persécutés;","Car la victoire à la foi fut acquise","Par le Sauveur qui nous a rachetés."]],[0,["Suivons le Christ jusque sur le Calvaire;","Ayons toujours Sa mort devant les yeux:","Si nous souffrons avec Lui sur la terre,","Nous régnerons avec Lui dans les cieux."]],[0,["Osons braver les injures du monde,","Pour confesser le beau nom de Jésus.","Que sur Lui seul, tout notre espoir se fonde","Et notre espoir ne sera pas confus."]],[0,["Amis, croyons au pouvoir invisible","Que le Sauveur a caché dans Sa Croix;","Saisissons-la comme une arme invincible,","Pour triompher au nom du Roi des rois."]]]},{"n":375,"t":"Entends-tu le chant joyeux ?","s":[[0,["Entends-tu le chant joyeux ?","Jésus sauve aujourd’hui!","Il retentit en tous lieux :","Jésus sauve aujourd’hui!","C’est un cri de délivrance,","Un cantique d’espérance","Qui remplit l’espace immense","Jésus sauve aujourd’hui!"]],[0,["Partout, élevez la voix :","Jésus sauve aujourd’hui!","Vaillant héraut de la croix,","Jésus sauve aujourd’hui!","À parler, Jésus t’appelle,","Répands au loin la nouvelle,","En connais-tu de plus belle ?","Jésus sauve aujourd’hui!"]],[0,["Répétez au pécheur contrit :","Jésus sauve aujourd’hui","Ceux que le mal asservit,","Jésus sauve aujourd’hui!","Va jusqu’à l’île lointaine,","Briser du captif la chaîne,","Redire au cœur dans la peine:","Jésus sauve aujourd’hui!"]],[0,["Jusqu’aux confins des déserts,","Jésus sauve aujourd’hui!","Jusque par de-là les mers,","Jésus sauve aujourd’hui!","Que d’un pôle à l’autre pôle,","Coure la sainte Parole","Qui relève, instruit, console","Jésus sauve aujourd’hui!"]]]},{"n":376,"t":"Si le monde te reprend","s":[[0,["Si le monde te reprend","Et ton or et ton argent,","Si la pauvreté vient assombrit ton cœur,","Souviens-toi que Dieu, là-haut,","Prend soin des petits oiseaux.","Abandonne tes fardeaux à ton Sauveur."]],[1,["Laisses-les, laisses-les","Laisses tes fardeaux aux pieds de ton Sauveur","Si tu crois sans défaillir Il saura te secourir","Abandonne tes fardeaux à ton Sauveur."]],[0,["Si ton pauvre corps brisé","A perdu force et santé,","Si tu pleures et tu gémis sous la douleur,","Jésus sait, Il veut bénir","Jésus sauve, Il peut guérir ;","Abandonne tes fardeaux à ton Sauveur."]],[0,["Sous les coups de l’ennemi,","Ton courage a-t-il faibli ?","Et ta foi sombre peut-être sous la peur ?","Souviens-toi que Dieu, ton Père","Aime exaucer les prières.","Abandonne tes fardeaux à ton Sauveur."]],[0,["Et si ta jeunesse un jour,","T’abandonne sans retour,","Si tu vas, courbé par l’âge et sans vigueur,","Jusqu’au bout, Jésus fidèle,","Te gardera sous Son aile.","Abandonne tes fardeaux à ton Sauveur."]]]},{"n":377,"t":"Pour porter le glaive et courir au feu","s":[[0,["Pour porter le glaive et courir au feu","Pour lutter sans trêve, le Seigneur te veut","La mêlée est forte, les répits sont brefs,","Mais la grâce porte qui veut plaire au Chef."]],[1,["La trompette appelle pour le saint combat","Lève-toi fidèle et n’hésite pas."]],[0,["Suis de près le Guide, suis-Le pas à pas.","Car sous Son égide, la victoire est là.","En foulant Ses traces, teintes de Son Sang","Marche avec audace en Son Nom puissant."]],[0,["En première ligne, sois présent toujours.","Ton sauveur est digne d’un pareil amour.","Brise tes attaches, coupe enfin les ponts.","Sors du rang des lâches et t’élance au front."]],[0,["Sur la terre entière et sous tous les deux,","Notre cri de guerre doit sonner joyeux.","Dieu ne veut personne qui soit prêt à fuir.","Il tend la couronne à qui sait souffrir."]]]},{"n":378,"t":"J’errais dans le péché quand Jésus m’a sauvé,","s":[[0,["J’errais dans le péché quand Jésus m’a sauvé,","Dans le courant des vives Eaux,","L’âme toute meurtrie, je retrouve la Vie","À la source des vives Eaux."]],[1,["Vivant auprès des vives Eaux,","Loin du péché, loin de tous maux,","Jésus est ma lumière,","Je vis sous Sa bannière,","Toujours, auprès des vives Eaux."]],[0,["À mon côté, Jésus, que désirer de plus ?","Je suis auprès des vives Eaux.","Christ est mon espérance, joyeux en Sa présence.","Je suis au sein des vives Eaux."]],[0,["Mes combats vont finir, le repos va venir.","Bientôt au sein des vives Eaux.","Dans la céleste armée, ma place est préparée","Près des ruisseaux des vives Eaux."]]]},{"n":379,"t":"Maître, entends-tu la tempête","s":[[0,["Maître, entends-tu la tempête","Et ses terribles accents?","Parle, Seigneur, et l’arrête;","Sauve, sauve Tes enfants!","Mais aucun bruit ne l’éveille;","Il dort et nous périssons.","À nos cris, prête l’oreille,","Sauve-nous, nous T’en prions!"]],[1,["Il parle aux flots en démence:","Paix vous soit!","La mer, les vents font silence;","Paix vous soit! Paix vous soit!","Il est notre délivrance;","Paix vous soit!"]],[0,["Maître, mon cœur qui chancelle","Traverse les grandes eaux,","Et l’orage, à ma nacelle,","Livre de rudes assauts.","Oh! Qui verra ma détresse?","D’où me viendra le secours?","À Toi, Seigneur, je m’adresse,","C’est à Toi que j’ai recours."]],[0,["Maître, l’onde est apaisée,","Le doute a quitté mon cœur,","Et mon âme consolée","A retrouvé son Sauveur.","Oh! Prends dans Ta main ma vie,","Jusques au jour de ma mort!","En Toi seul, je me confie;","Tu me conduiras au port,"]]]},{"n":380,"t":"Jésus, Ami de mon âme,","s":[[0,["Jésus, Ami de mon âme,","Sauve-moi des grandes eaux!","C’est Toi seul que je réclame,","En Toi, j’ai le vrai repos."]],[1,["Ta puissance est efficace,","Ton amour est infini;","En Toi seul, j’ai toute grâce,","Tu seras mon ferme appui."]],[0,["Ton nom seul est saint et juste,","Je ne suis qu’iniquité;","En toi, Rédempteur auguste,","Tout est grâce et sainteté."]],[0,["Garde, ô Jésus, ma nacelle,","Viens la guider vers le port;","Puis, dans Ton amour fidèle,","Reçois mon âme à la mort."]]]},{"n":381,"t":"Cœurs fatigués et lassés du péché","s":[[0,["Cœurs fatigués et lassés du péché","Assez souffert! Assez cherché!","Je puis donner la paix et le repos","Me charger de vos fardeaux."]],[1,["Venez à Lui, venez à Lui","Venez à Jésus","Venez à Jésus aujourd’hui"]],[0,["Vous tous, pécheurs condamnés par la loi","Venez à Moi! Venez à Moi!","Vous recevez en vos cœurs dès ce jour","Le pardon du Dieu d’amour."]],[0,["Vous qui souffrez, par le mal asservis,","Soyez par Moi tous affranchis.","Oh! Venez tous, travaillés et chargés","Et vous serez soulagés."]]]},{"n":382,"t":"A la croix où mourut mon Sauveur","s":[[0,["A la croix où mourut mon Sauveur","Je suis venu, brisé de douleur;","Là, Son Sang purifia mon cœur,","À Son Nom la gloire! (ter)","Là, Son sang purifia mon cœur,","À Son Nom la gloire!"]],[0,["Quelle merveille! H vint me sauver ;","Quand de Sa Croix, je me fus chargé,","En moi Jésus vint pour demeurer,","À Son Nom la gloire! (ter)","En moi Jésus vint pour demeurer","A Son Nom la gloire"]],[0,["Oh! Fontaine effaçant le péché,","Donnant la vie au cœur desséché!","Là, Jésus me retient attaché,","À Son Nom la gloire! (ter)","Là, Jésus me retient attaché,","À Son Nom la gloire!"]],[0,["Pauvre âme, viens aux pieds du Sauveur","À la source ouverte à tout pécheur :","Viens t'y plonger, trouver le bonheur.","À Son Nom la gloire!","À Son Nom la gloire! (bis)","Viens t’y plonger, trouver le bonheur,","A Son Nom la gloire!"]]]},{"n":383,"t":"Rien ne peut sauver mon âme,","s":[[0,["Rien ne peut sauver mon âme,","Rien que le sang de Jésus!","Pour elle, je ne réclame,","Rien que le sang de Jésus!"]],[1,["Précieux sang de l’Agneau","Qui me donne un cœur nouveau;","Rien d’autre; je ne veux plus,","Rien que le sang de Jésus!"]],[0,["Pour mon pardon, je ne vois,","Rien que le sang de Jésus!","Pour mon salut, je ne crois,","Rien que le sang de Jésus!"]],[0,["Je ne veux pour ma justice,","Rien que le sang de Jésus!","Qui me rendra Dieu propice ?","Rien que le Sang de Jésus,"]],[0,["Mon Dieu, je ne Te présente,","Rien que le sang de Jésus!","Rien ici ne me contente,","Rien que le sang de Jésus!"]],[0,["Je n’ai pour toute espérance,","Rien que le sang de Jésus!","Pour appui, pour confiance,","Rien que le sang de Jésus!"]]]},{"n":384,"t":"Non, nous ne saurions nous taire","s":[[0,["Non, nous ne saurions nous taire","Devant tant de cœurs souffrants.","Resteriez-vous sans rien faire ?","Fuirez-vous encore nos rangs ?"]],[1,["Sous la Croix, rien n’est pénible","En avant, frères, debout!","Par la foi, tout est possible","Et la couronne est au bout."]],[0,["En tous lieux pleins d’espérance,","Traçons un sillon d’amour.","Semons avec confiance,","Nous moissonnerons un jour."]],[0,["Au monde sans repentance","Prêchons Jésus mort pour tous.","Pourquoi tant d’insouciance ?","Il en est temps, levons nous."]],[0,["Laissons là notre paresse,","Et l’Amour triomphera.","Oui, malgré notre faiblesse,","La vérité prévaudra."]]]},{"n":385,"t":"Une nacelle en silence","s":[[0,["Une nacelle en silence","Vogue sur un lac d’azur;","Tout doucement, elle avance","Sous un ciel tranquille et pur;","Mais soudain, le vent s’élève,","Chassant un nuage noir,","Et les vagues qu’il soulève","Font trembler, car c’est le soir."]],[0,["Grande est alors la détresse","Des voyageurs éperdus;","Grande est aussi leur faiblesse,","Leur foi ne les soutient plus.","Mais, il en est Un qui veille","Sur eux tous, bien qu’endormi;","Ah! Faudra-t-il qu’on L’éveille?","N’est-il plus leur tendre Ami?"]],[0,["Maître, es-tu donc insensible?","Tu le vois, nous périssons!","Tout miracle T’est possible,","Sauve-nous, nous T’en prions!","D’eux aussitôt Il S’approche,","Puis, Il dit au vent: Tais-toi!","Et tendrement leur reproche","D’avoir eu si peu de foi."]],[0,["Ainsi souvent, dans la vie,","L’orage assombrit nos cœurs,","Bien que pour nous Jésus prie,","Prêt à calmer nos terreurs.","Comptons mieux sur Sa tendresse,","Son cœur ne saurait changer:","De Sa brebis en détresse","Il est toujours le Berger."]]]},{"n":386,"t":"Trop souvent je murmure,","s":[[0,["Trop souvent je murmure,","Quand la route est obscure:","Oh! Ma foi faiblira! (bis)","Et pourtant la promesse","Est là pour ma faiblesse:","L’Eternel pourvoira! (bis)"]],[0,["Si mon impatience","Demande avec instance","D’où le secours viendra, (bis)","Par Ta parole sainte","Tu réponds à ma plainte:","L’Éternel pourvoira! (bis)"]],[0,["Je ne veux plus me plaindre;","Je ne veux plus rien craindre;","Contre moi qui sera? (bis)","En avant et courage!","Jusqu’au bout du voyage","L’Éternel pourvoira! (bis)"]]]},{"n":387,"t":"Ne crains rien, Je t’aime!","s":[[0,["Ne crains rien, Je t’aime!","Je suis avec toi!","Promesse suprême,","Qui soutient ma foi.","La sombre vallée","N’a plus de terreur,","L’âme consolée,","Je marche avec mon Sauveur."]],[1,["Non, jamais tout seul, (bis)","Jésus mon Sauveur me garde,","Jamais ne me laisse seul.","Non, jamais tout seul, (bis)","Jésus mon Sauveur me garde,","Je ne suis jamais tout seul."]],[0,["L’aube matinière","Ne luit qu’aux beaux jours,","Jésus, ma lumière,","M’éclaire toujours!","Quand je perds de vue","L’astre radieux,","À travers la nue,","Jésus me montre les deux!"]],[0,["Les dangers accourent,","Subtils, inconnus:","De près, ils m’entourent,","Plus près est Jésus,","Qui dans le voyage,","Me redit: C’est Moi!","Ne crains rien: courage!","Je suis toujours avec toi!"]]]},{"n":388,"t":"Berger, la nuit descend déjà,","s":[[0,["Berger, la nuit descend déjà,","Tu cours un péril extrême…","« Les quatre-vingt-dix-neuf sont là…","Il me manque, dit-Il, la centième! »"]],[1,["Le beau jour, heureux jour,","Où Dieu cherchant des pécheurs perdus","M’a trouvé, m’a sauvé!","Ah! Ce fut un heureux jour!"]],[0,["Pourquoi vas-tu partout cherchant,","Qu’as-tu donc, femme éplorée","“J’ai là dix pièces d’argents,","Mais dit-elle, l’une est égarée”"]],[0,["O père, Tu l’attends en vain,","L’enfant qui tarde à paraître","“Je l’aperçois dans le lointain","Oui c’est Lui! Je peux le connaître!”"]],[0,["C’est moi la centième brebis;","J’étais la drachme perdue;","J’étais l’enfant loin du logis,","Dont le Père attendait la venue."]]]},{"n":389,"t":"Viens âme qui pleure,","s":[[0,["Viens âme qui pleure,","Viens à ton Sauveur;","Dans les tristes heures,","Dis-Lui ta douleur...","Dis tout bas ta plainte","Au Seigneur Jésus...","Parle-Lui sans crainte,","Et ne pleure plus."]],[0,["Dis tout à ce Frère,","À ce tendre Ami,","Ton épreuve amère,","Ton deuil, ton souci.","Il aime, Il console","Les cœurs abattus;","Crois à Sa Parole,","Et ne pleure plus!"]],[0,["Dis à d’autres âmes","Ployant sous le faix,","Que tu les réclames","Pour le Dieu de paix.","Calme leurs alarmes,","Montre-leur Jésus;","Va sécher leurs larmes,","Et ne pleure plus!"]]]},{"n":390,"t":"Car Ta bonté vaut mieux que la vie (bis)","s":[[0,["Car Ta bonté vaut mieux que la vie (bis)","Mes lèvres célèbrent Tes louanges","Car Ta bonté vaut mieux que la vie."]],[0,["Je chanterai, Seigneur en Ton nom (bis)","Mes lèvres célèbrent Tes louanges","Car Ta bonté vaut mieux que la vie."]],[0,["Je lèverai mes mains en Ton Nom (bis)","Mes lèvres célèbrent Tes louanges","Car Ta bonté vaut mieux que la vie."]],[0,["Prend soin de moi car je T’appartiens (bis)","Mes lèvres célèbrent Tes louanges","Car Ta bonté vaut mieux que la vie."]],[0,["Je Te bénirai toute ma vie (bis)","Mes lèvres célèbrent Tes louanges","Car Ta bonté vaut mieux que la vie."]]]},{"n":391,"t":"Sur le mont du calvaire,","s":[[0,["Sur le mont du calvaire,","Il était une Croix.","Où Jésus souffrit tant de douleurs","Et c’est là qu’il mourut ;","Sur cet infâme de bois,","Pour sauver le plus vil des pécheurs."]],[1,["Cette Croix, cette Croix","Me sera toujours chère.","Elle est gloire et victoire pour moi,","Et par elle, oui par elle,","Dans la maison du Père","La couronne est offerte à ma foi."]],[0,["Cette Croix ou Jésus","Du monde est rejeté.","À pour moi, le plus grand des attraits.","C’est là que, saint Agneau!","Mon sauveur a porté,","Mes fardeaux, mes douleurs, mes forfaits."]],[0,["Sur la Croix, où Jésus","A versé tout Son Sang","Je contemple, ébloui Sa beauté","Sur la mort et l’enfer","Son combat triomphant","Fait de moi Son heureux racheté"]],[0,["M’appuyant avec foi","Sur la Croix de Jésus","Son opprobre, je veux le porter","Jusqu’au jour bienheureux","Où parmi les élus","Dans le Ciel, je pourrai L’exalter"]]]},{"n":392,"t":"Celui qui met en Jésus","s":[[0,["Celui qui met en Jésus","Une pleine confiance,","Jamais ne chancelle plus,","Complète est Sa délivrance"]],[1,["Par la foi, nous marcherons,","Par la foi, nous triomphons,","Par la foi, mon Rédempteur","Me rendra plus que vainqueur !"]],[0,["Dans les jours d’adversité,","Quand tu sens gronder l’orage,","Regarde en sécurité","A Christ et reprends courage!"]],[0,["Quand Satan veut te troubler,","Enlever ton espérance,","Ton passé te reprocher,","Que Christ soit ton assurance!"]],[0,["Par la foi je marcherai,","En comptant sur Ses promesses,","Par Lui je triompherai","En tout temps de mes détresses!"]]]},{"n":393,"t":"Immense grâce,","s":[[0,["Immense grâce,","O merveilleux amour!","Sur mon cœur passe,","Passe et repasse toujours.","Et comme un océan puissant","Dont les flots vont en se pressant","L’amour de Jésus m’inonde."]],[1,["Onde sur onde,","Comme un flot puissant","Ton amour m’inonde,","Comme un océan."]],[0,["Sang du calvaire","Versé pour mes forfaits ;","Flots de lumière,","Parfaite et céleste paix.","La puissante grâce de Dieu,","Comme un fleuve délicieux,","Coule aujourd’hui sur mon âme","Quand l’enfer gronde,","Cherchant à m’ébranler,","La grâce abonde ;","Je marche sans plus trembler.","De Golgotha, le flot vainqueur","Coule sans cesse sur mon cœur,","Et m’entraîne vers la gloire."]]]},{"n":394,"t":"Tout le peuple d’Israël,","s":[[0,["Tout le peuple d’Israël,","Dirigé par l’Éternel,","Vient de franchir le Jourdain.","Par un miracle divin.","Mais, un obstacle puissant","Juste au seuil de Canaan","Veut arrêter le refrain,","C’est la pierre de Jéricho."]],[1,["Jéricho! Jéricho!","Proclamez joyeux échos.","La louange fait crouler","Tous les murs les plus épais."]],[0,["Tout le peuple circoncis","Consacré sans compromis ;","Et les milices du ciel","Sont aux côtés d’Israël","Et Dieu dit à Josué :","Cette ville de péchés","Avec ses soldats, son roi","Je vais les vaincre avec toi."]],[0,["Tout le peuple obéissant","Au son du clairon puissant,","Avec l’arche a fait le tour","De ses murs en un seul jour","Et soudain Josué dit :","Cette ville poussant ces cris","L’Éternel nous a livré","Cette arrogante citée"]],[0,["Tout le peuple d’un seul cœur","Cria gloire! Au Dieu vainqueur.","Et dans un puissant fracas,","La muraille s’écroula","Et c’est la divine loi","L’obéissance et la foi","Les louanges d’un cœur pur","Font crouler les plus hauts murs,"]]]},{"n":395,"t":"Paix, paix parfaite en Jésus le Sauveur,","s":[[0,["Paix, paix parfaite en Jésus le Sauveur,","Parfaite paix, même pour moi, pécheur!"]],[0,["Paix, paix parfaite! Où sont tous mes péchés ?","Le sang de Christ les a tous effacés!"]],[0,["Paix, paix parfaite! Au fort de ma douleur","L’amour de Christ met la joie en mon cœur!"]],[0,["Paix, paix parfaite en face de la mort,","Car mon Sauveur est maître de mon sort."]],[0,["Paix, paix parfaite! En Christ, ô doux espoir","Le triste adieu se change en au revoir!"]],[0,["Paix, paix parfaite en notre Emmanuel,","Paix sur la terre et gloire dans le ciel!"]]]},{"n":396,"t":"Je suis pèlerin, étranger,","s":[[0,["Je suis pèlerin, étranger,","Errant dans ce monde pécheur.","Sur mon chemin, à la Cité,","Lorsque les saints entreront."]],[1,["Quand les Saints entreront","Lorsque les saints entreront","Seigneur, je veux être de ce nombre","Lorsque les Saints entreront."]],[0,["Je sais, je verrai le Seigneur,","Si ma vie est libérée.","Les portes du Ciel s’ouvriront","Lorsque les saints entreront."]],[0,["Assemblés autour du trône,","Et les portes seront fermées.","Je crierai : \"Gloire! Gloire!\"","Lorsque les saints entreront."]],[0,["J’attends le chariot qui viendra,","Me balancer et j’entrerai.","Dans les nuées, je monterai","Lorsque les saints entreront."]]]},{"n":397,"t":"Il est un roc séculaire,","s":[[0,["Il est un roc séculaire,","Que Dieu, pour mon cœur lassé,","Comme un abri tutélaire,","Au sein des flots a placé."]],[1,["Mon rocher, ma forteresse,","Mon asile protecteur,","Mon recours dans la détresse,","C’est Jésus, le Rédempteur!"]],[0,["À mes pieds, l’océan gronde;","Le vent siffle autour de moi...","Sur Christ, mon rocher, je fonde","Mon espérance et ma foi."]],[0,["En vain l’ouragan fait rage,","Et nulle clarté ne luit,","Paisible au sein de l’orage,","J’attends l’aube après la nuit."]],[0,["Jouet de l’onde agitée,","Cet abri, l’as-tu trouvé?","Viens, pauvre âme tourmentée,","Au rocher qui m’a sauvé!"]]]},{"n":398,"t":"Noé a bien navigué","s":[[0,["Noé a bien navigué","Sur les eaux bien des jours","Il chercha la terre ferme","De plusieurs manières","Des ennuis, il en a bien eu","Mais non pas du Ciel","Dieu lui donna Son signe","Sur les ailes d’une colombe."]],[1,["Sur les ailes d’une colombe","blanche comme neige","Dieu envoya Son amour pur","Un signe du Ciel","Sur les ailes d’une colombe blanche."]],[0,["Jésus, notre Sauveur","Vint un jour sur la terre","Né dans une étable","Dans une crèche de paille.","Ici-bas rejeté,","Mais non pas du Ciel","Dieu Lui donna Son signe","Sur les ailes d’une colombe."]],[0,["Bien qu’ayant beaucoup souffert","De bien de manières,","Je criais pour la guérison","La nuit comme le jour.","La foi ne fut pas oubliée","Par le Père du Ciel.","Dieu me donna Son signe","Sur les ailes d’une colombe."]]]},{"n":399,"t":"Un beau matin quand tout sera fini","s":[[0,["Un beau matin quand tout sera fini","Je m’envolerai","A la maison où habite mon Jésus,","Je m’envolerai"]],[1,["Je m’envolerai! Oh! Gloire!","Je m’envolerai.","À la fin, alléluia! Tout à l’heure","Je m’envolerai."]],[0,["Juste encore un peu de temps et alors","Je m’envolerai.","Dans ce pays où la joie demeure","Je m’envolerai."]]]},{"n":400,"t":"Je vis d’espérance,","s":[[0,["Je vis d’espérance,","D’amour et de foi,","Et mon chant s’élance","Vers Toi, divin Roi.","Grande est ma faiblesse,","Mon indignité;","Mais dans Ta tendresse","Tu m’as racheté."]],[1,["Oui, mon cœur chante,","Mon âme est contente.","Mon Jésus est tout mon bien,","Je ne craindrai rien!","Oui, mon cœur chante,","Mon âme est contente.","Mon Jésus est tout mon bien,","Je ne craindrai rien!"]],[0,["Oh! Quelle tendresse,","Quel immense amour!","Cet amour me presse","D’aimer à mon tour:","Aimer, c’est Te suivre","Et c’est T’obéir.","Aimer, oui, c’est vivre","Et s’épanouir."]],[0,["Que, le cœur en fête,","La nuit et le jour,","Toujours je reflète","Ton immense amour!","L’amour qui rayonne,","Te gagnant les cœurs,","Voilà la couronne","Au front des vainqueurs!"]]]},{"n":401,"t":"Saisis ma main craintive","s":[[0,["Saisis ma main craintive","Et conduis-moi;","Fais que toujours je vive","Plus près de Toi.","Sans Toi, mon tendre Père,","Pour me guider,","Je ne sais sur la terre","Comment marcher."]],[0,["Que Ta main me dispense","Joie ou douleur,","Paisible en Ta présence","Garde mon cœur;","En Toi pour toute chose,","Se confiant,","À Tes pieds, se repose","Ton faible enfant."]],[0,["Quand la nuit la plus noire","Te voilerait,","Ton bras jusqu’à la gloire","Me porterait.","Saisis ma main craintive,","Et conduis-moi:","Fais que toujours je vive","Plus près de Toi!"]]]},{"n":402,"t":"Je regarde au loin,","s":[[0,["Je regarde au loin,","Au-delà du Jourdain,","Venant m’amener à la maison","Une cohorte d’anges","Qui viennent après moi","Venant m’amener à la maison."]],[1,["Descend doux chariot,","Venant m’amener à la maison"]],[0,["Si tu entres là-bas","Avant mon arrivée,","Venant m’amener à la maison","Dis à tous nos amis","Que je viendrai aussi,","Venant m’amener à la maison."]]]},{"n":403,"t":"Laisse-moi marcher Seigneur,","s":[[0,["Laisse-moi marcher Seigneur,","Par où Tu es passé,","Chemin conduisant vers le ciel.","Partout donnant la joie,","Aux gens abandonnés,","Remplis-moi chaque jour d’amour."]],[1,["Remplis-moi chaque jour d’amour.","Comme je marche avec la colombe","Laisse-moi marcher toujours","Avec chants et sourires","Remplis-moi chaque jour d’amour."]],[0,["Garde-moi à côté","De mon Sauveur et Guide.","Ne me laisse pas dans les ténèbres","Garde-moi du courroux,","Et mon âme satisfaite,","Remplis-moi chaque jour d’amour."]],[0,["Bientôt la fin de la course,","Je ne voyagerai plus.","J’habiterai la demeure céleste.","Que je chante, Roi béni","Sur la route vers la rive;","Remplis-moi chaque jour d’amour."]]]},{"n":404,"t":"J’ai entendu parler d’un Pays lointain","s":[[0,["J’ai entendu parler d’un Pays lointain","C’est une belle maison pour l’âme","Édifiée par Jésus","Là, nous ne mourrons point,","Là-bas, nous ne vieillirons jamais."]],[1,["Jamais vieillir, jamais vieillir,","Là-bas, nous ne vieillirons jamais."]],[0,["Dans la belle Cité nous n’errerons jamais","Nous serons tout le temps","Dans la douceur.","Nous louerons le Roi","Dans les âges éternels","Dans ce pays, nous ne mourrons jamais."]],[0,["Notre tâche accomplie,","Nous serons couronnés,","Et nos troubles et nos jugements passés","Et nos peines finies,","Et nos voix mélangées","Avec ceux qui nous ont précédés."]]]},{"n":405,"t":"Ecoute, ô Ciel,","s":[[0,["Ecoute, ô Ciel,","Et tout ce que tu as,","Combien Jésus-Christ","Est riche en bontés.","Et toi, terre des hommes","Et bétail des champs,","O louez-Le car Il est bon."]],[1,["Combien Il est bon (ter)","Mon Seigneur, mon Dieu.","Combien Il est bon, alléluia","Oui, je Le louerai toujours."]],[0,["Il nous a créés","Pour la vie éternelle","Mais nous avons péché","Et avons tout perdu.","Mais dans Sa bonté,","Il Se décida","De nous ramener à la Vie."]],[0,["Et comme un Agneau,","Il vint ici-bas,","Il versa Son Sang","Pour nous racheter.","Depuis ce jour-là,","Nous pouvons crier","Oh! Mort, où est ton aiguillon ?"]],[0,["Pareil à un Aigle,","Il rôde sur nous.","Il voit nos besoins,","Nul n’est en danger.","Et à chaque tour,","Il jette ce cri.","Ne craignez rien car Je suis là."]]]},{"n":406,"t":"C’est à l’ombre de Tes ailes","s":[[0,["C’est à l’ombre de Tes ailes","Qu’est le vrai repos;","Là plus de douleurs cruelles,","Là plus d’angoisses mortelles,","Là plus d’écrasants fardeaux:","C’est le vrai repos!","Là plus d’écrasants fardeaux:","C’est le vrai repos!"]],[1,["Vrai repos, paix parfaite et bonheur,","Sous les ailes du Seigneur!","Vrai repos, paix parfaite et bonheur,","Sous les ailes du Seigneur!"]],[0,["C’est à l’ombre de Tes ailes","Qu’on trouve la paix...","Les oiseaux dans leurs nids frêles,","Sous les plumes maternelles","Ne s’épouvantent jamais:","Ils dorment en paix!","Ne s’épouvantent jamais:","Ils dorment en paix!"]],[0,["C’est à l’ombre de Tes ailes","Qu’est le vrai bonheur.","Toutes choses sont nouvelles","Et c’est la Vie Eternelle,","Que d’être près de Ton cœur!","C’est le vrai bonheur,","Que d’être près de Ton cœur,","C’est le vrai bonheur!"]]]},{"n":407,"t":"Le temps est plein de transitions,","s":[[0,["Le temps est plein de transitions,","Rien sur terre ne peut rester,","Espère en les choses éternelles Tiens","l’immuable main de Dieu."]],[1,["Tiens l’immuable main de Dieu. (bis)","Espère en les choses éternelles","Tiens l’immuable main de Dieu."]],[0,["Confie-toi en l’Eternel Dieu","Quoiqu’apportent les années.","Si tes amis t’abandonnent,","Attache-toi toujours à Lui."]],[0,["Ne convoite pas les richesses vaines","Qui pourrissent rapidement.","Cherche les trésors célestes","Qui ne passeront jamais."]],[0,["Quand s’achèvera ton voyage","Si tu étais fidèle à Dieu,","Ton âme, ravie dans la gloire,","Trouvera une belle demeure."]]]},{"n":408,"t":"O Jésus, je me repose","s":[[0,["O Jésus, je me repose","Sur ce que je sais de Toi...","Quelle merveilleuse chose:","Ton amour pour moi!","À moi, Tu T’es fait connaître,","Et Ta divine beauté","A transformé tout mon être","Pour l’éternité!"]],[1,["O Jésus, je me repose","Sur ce que je sais de Toi...","Quelle merveilleuse chose:","Tu mourus pour moi!"]],[0,["De Ta Croix, qui me révèle","L’amour qui ne peut périr,","Jaillit l’eau toujours nouvelle,","Qui ne peut tarir!","O grâce, ô flot salutaire!","Que sur Tes bords, désormais,","Mon âme se désaltère","De joie et de paix!"]],[0,["Simplement, je me confie,","En Toi, bien-aimé Sauveur,","Et ne veux, toute ma vie,","Point d’autre faveur.","Car, de toutes mes détresses,","Ton sourire me guérit,","Et de toutes Tes promesses","Ma foi se nourrit!"]],[0,["Je veux Te rester fidèle,","Pour Toi vivre et travailler;","Avec Toi, parfait Modèle,","Veiller et prier.","O Christ, image du Père,","Brille toujours à mes yeux,","Jusqu’à ce que de la terre","Je m’envole aux deux!"]]]},{"n":409,"t":"Sur Toi je me repose,","s":[[0,["Sur Toi je me repose,","O Jésus, mon Sauveur!","Faut-il donc autre chose","Pour un pauvre pécheur?","Conduit par Ta lumière,","Gardé par Ton amour,","Vers la maison du Père","Marchant de jour en jour…"]],[1,["Sur Toi je me repose,","Ô Jésus, mon Sauveur!","Faut-il donc autre chose","Pour un pauvre pécheur?"]],[0,["Ah! Ma misère est grande,","Mais Tu m’as pardonné;","Sainte et vivante offrande","Pour moi, Tu T’es donné;","Et de toute souillure,","Par le Sang de Ta croix,","Mon âme devient pure;","Tu l’as dit, je le crois!"]],[0,["Moi-même en sacrifice","Immolé désormais,","Seigneur, à Ton service","Me voici pour jamais!","Qu’importe ma faiblesse,","Puisque je T’appartiens:","Tu n’as point de richesse","Qui ne soit pour les tiens."]],[0,["Au plus fort de l’orage,","Tu Te tiens près de moi,","Ranimant mon courage","Et soutenant ma foi;","C’est dans Ton cœur qui m’aime","Que Tu sais me cacher;","En vain, Satan lui-même","Voudrait m’en arracher..."]],[0,["En Toi, j’ai la victoire,","La paix, la liberté;","À Toi, je rendrai gloire","Durant l’éternité.","Si du bonheur qui passe","La source doit tarir,","C’est assez de Ta grâce","Pour vivre et pour mourir."]]]},{"n":410,"t":"Loin, le plus loin","s":[[1,["Loin, le plus loin","Au loin, le plus loin","Je veux toujours me tenir éloigné","De mon noir passé."]],[0,["Oh chrétien, voudrais-tu retourner","Où Seigneur ?","Dans la boue où Je t’ai retiré!","Oh! Non Seigneur."]],[0,["Mon ami, pourquoi ne viens-tu pas","Où Seigneur ?","Sur le mont où J’ai payé pour toi.","Oh! Quoi Seigneur!"]],[1,["J’ai pris ton rôle (bis)","Pour te sauver de l’enfer éternel","Je t’ai remplacé"]],[0,["O chrétien, te sens-tu fatigué ?","Oui Seigneur.","Viens à Moi, tu seras soulagé","Oh! Oui, Seigneur."]]]},{"n":411,"t":"Quel repos céleste, Jésus, d’être à Toi!","s":[[0,["Quel repos céleste, Jésus, d’être à Toi!","À Toi pour la mort et la vie,","Dans les jours mauvais, de chanter avec foi","Tout est bien, ma paix est infinie!"]],[1,["Quel repos, quel repos, quel repos,","Quel céleste repos!"]],[0,["Quel repos céleste! Mon fardeau n’est plus!","Libre par le sang du Calvaire,","Tous mes ennemis, Jésus les a vaincus,","Gloire et louange à Dieu notre Père!"]],[0,["Quel repos céleste! Tu conduis mes pas,","Tu me combles de Tes richesses,","Dans Ton grand amour, chaque jour Tu sauras","Déployer envers moi Tes tendresses."]],[0,["Quel repos céleste, quand enfin, Seigneur,","Auprès de Toi, j’aurai ma place,","Après les travaux, les combats, la douleur,","À jamais je pourrai voir Ta face!"]]]},{"n":412,"t":"C’est encore jour de grâce,","s":[[0,["C’est encore jour de grâce,","Pour toi, pauvre pécheur,","Saisis l’instant qui passe","Pour venir au Sauveur.","Sur la croix du calvaire,","Il porta tes péchés,","Oh! Viens à Lui mon frère","Pour être libéré."]],[1,["Sa grâce incomparable","Voudrait t’ouvrir le ciel","Et donner au coupable","Le bonheur éternel.","Viens donc à l’instant même","T’enrôler sous la Croix","De cet ami suprême","De Jésus, Roi des rois."]],[0,["Si l’ennemi te tente,","Oh! Ne l’écoute pas,","De sa voix séduisante","Refuse les appâts.","Viens plein de confiance","Te donner au Sauveur,","Tu verras Sa puissance","Régénérer ton cœur."]],[0,["Jésus qui te réclame,","T’appelle tendrement,","Il veut sauver ton âme","De l’enfer, des tourments","Échanger ta misère,","Effacer tes péchés,","Mettre en toi la lumière","D’un de Ses rachetés."]],[0,["Notre vie est très courte,","Nui ne sait si demain","Il ne prendra la route","Qui marque son destin.","Avant que l’heure sonne,","Où ce sera trop tard,","Prends le salut qu’il donne","Et Jésus pour ta part."]]]},{"n":413,"t":"Jésus parla d’un homme sage.","s":[[0,["Jésus parla d’un homme sage.","Qui pour construire sa maison,","En prévision des temps d’orage","L’a fondé sur le roc profond."]],[0,["Pluies et torrents dans leur furie","Entraînent et frappent tous les coups.","Elle est solidement bâtie","Et sur le roc résiste à tout."]],[0,["Mais la maison qui, sur le sable,","Dans l’ouragan n’a pu tenir","N’est plus que ruine, misérable.","N’est plus qu’un sombre souvenir."]],[0,["C’est sur Jésus seul que je fonde","Ma foi, mon être et mon bonheur.","Et les tempêtes de ce monde","N’ébranleront jamais mon cœur."]]]},{"n":414,"t":"Il donne plus de grâce","s":[[0,["Il donne plus de grâce","Quand les fardeaux grandissent.","Il envoie plus de grâce","Quand les labeurs augmentent.","Aux nombreuses afflictions","Il apporte plus de grâce,","Aux épreuves multipliées,","Il multiplie Sa paix."]],[1,["Son amour est infini","Sa grâce est sans mesure.","Sa puissance est sans limite","Et insondable","Car de Ses infinies richesses","En Jésus, Il donne, et donne","Il donne plus de grâce."]],[0,["Quand nos sources","D’espérance sont épuisées.","Quand nos forces défaillent,","Et que le jour décline.","Quand nous sommes","Au bout de nos peines.","Notre père nous donne","La grâce de persévérer."]]]},{"n":415,"t":"Qu’elle est douce, qu’elle est bonne,","s":[[0,["Qu’elle est douce, qu’elle est bonne,","Cette paix qui vient du Ciel!","C’est Jésus qui nous la donne,","Dans Son Amour éternel.","Au jour de Sa mort cruelle,","Ce bon Sauveur nous l’acquit,","Et dans nos cœurs, Il la scelle","Par le don de Son Esprit."]],[0,["Cette paix, rien ne la trouble,","Dangers, douleurs ni travaux.","Dans le combat qui redouble,","Elle fait notre repos.","Ah! Que notre cœur l’éprouve!","Qu’il en sente la douceur!","Que toujours il la retrouve,","Sous le regard du Sauveur"]]]},{"n":416,"t":"Déployons nos ailes,","s":[[0,["Déployons nos ailes,","Il nous faut saisir","La grâce éternelle","Avant de mourir.","Détournons la face","Des biens d’ici-bas,","Là-haut est ta place,","Frère, n’attends pas."]],[0,["Les fleuves sans guide","Courent vers la mer,","La flamme rapide","S’élève dans l’air:","Tous deux vers leur source","S’élance joyeux:","Mon cœur, prends ta course","Vers le sein de Dieu."]],[0,["Pèlerin du monde,","Qui vas en pleurant,","Quand l’orage gronde","Courage, en avant!","Regarde en la nue","Jésus triomphant,","Ton heure est venue,","Courage, Il t’attend!"]],[0,["Tu verras Sa face","Dans Son beau séjour;","Saisis donc la grâce","Pendant qu’il fait jour.","Hâte-toi, mon frère,","Car voici la nuit:","L’Esprit de lumière","Au ciel, te conduit."]]]},{"n":417,"t":"Je connais l’eau vive qui nous désaltère,","s":[[0,["Je connais l’eau vive qui nous désaltère,","Je l’ai découvert à Golgotha","Il y a d’innombrables fleuves sur la terre,","Mais, Jésus seul est source de joie."]],[1,["Jésus m’a dit :","Mets ta main dans Ma main et vient,","Toute ta vie tu seras Mon témoin.","Et quand j’ai mis ma main dans Sa forte main","J’ai reçu de Lui la puissance de l’Esprit-Saint"]],[0,["Tout autour de moi, je vois tant de souffrances","Tant de cœurs qui sont si malheureux.","Que l’Esprit me pousse à rompre mon silence","Pour crier partout la paix de Dieu."]],[0,["Et si Dieu m’entraîne jusqu’au bout du monde","Pour que Son amour soit proclamé.","Je ne compte pas sur mes forces profondes.","Mais sur cet Esprit qu’il m’a donné."]]]},{"n":418,"t":"Entendez-vous la voix du 7ème ange","s":[[1,["Entendez-vous la voix du 7ème ange","Elle appelle partout ?","Entendez-vous la voix du 7ème ange","Hâtez-vous, hâtez-vous."]],[0,["Sortez! Sortez du milieu d’elle (bis)","Mon peuple, entendez mon appel.","Sortez! Sortez au milieu d’elle."]],[0,["Dieu n’est pas trois mais Il est un, (bis)","Seigneur Jésus-Christ est Son Nom.","Dieu n’est pas trois mais Il est un."]],[0,["A celui qui veut bien Le croire ;","A celui qui veut s’humilier ;","Il révèle tout ce mystère,","A celui qui veut bien Le croire."]],[0,["Que celui qui a des oreilles, (bis)","Entende ce que l’Esprit dit (bis)"]]]},{"n":419,"t":"Frère, quand ton âme est lassée,","s":[[0,["Frère, quand ton âme est lassée,","Oh ! pense au royaume des cieux !","Élève, élève ta pensée","Vers ce séjour des bienheureux."]],[1,["Vers les cieux, (bis)","Oh ! pense au royaume des cieux.","Vers les cieux, (bis)","Oh ! pense au royaume des cieux."]],[0,["Ce royaume, c'est ta patrie,","Jésus-Christ t'en fit citoyen ;","Elle ne peut t'être ravie,","Marche donc en paix, ô chrétien."]],[0,["Là-haut s'épanouit la vie","Au sein de l'immortalité.","La justice, au bonheur unie,","Fleurit toute l'éternité."]],[0,["Quelques jours d'épreuves encore,","Et puis, traversant le tombeau,","Tu verras resplendir l'aurore","D'un jour sans fin, d'un jour nouveau."]]]},{"n":420,"t":"Dans le pays de la gloire éternelle,","s":[[0,["Dans le pays de la gloire éternelle,","Dans ce beau ciel où l’on ne souffre plus,","Te contempler, abrité sous Ton aile,","C’est le bonheur que je rêve, ô Jésus!"]],[1,["Gloire à jamais, gloire à Jésus!","Gloire à jamais, gloire à Jésus!","Auprès de Lui, je ne pécherai plus!","Oh! Gloire à jamais, gloire à Toi, Jésus!"]],[0,["Quand tu m’auras, dans Ta grâce infinie,","Fait une place au milieu des élus,","Tout mon bonheur, et ma gloire et ma vie","Sera toujours de Te louer, Jésus!"]],[0,["Mes bien-aimés partageront ma gloire,","Dans Ton ciel où l’on ne se quitte plus.","Mais, pour mon cœur, la suprême victoire","Sera d’avoir Ton sourire, ô Jésus!"]]]},{"n":421,"t":"Tout dit qu’il est merveilleux : (bis)","s":[[0,["Tout dit qu’il est merveilleux : (bis)","La terre et la mer la splendeur des deux,","Oui, tout dit qu’D est merveilleux."]],[0,["Je sais qu’il est merveilleux : (bis)","Il me sauve, Il me garde et me rend heureux,","Oui je sais qu’Il est merveilleux!"]],[0,["Oui Jésus est merveilleux! (bis)","Un jour, je dirai là-haut dans les deux,","Que mon Sauveur est merveilleux!"]]]},{"n":422,"t":"Tout est possible à celui qui croit,","s":[[0,["Tout est possible à celui qui croit,","C’est la loi de la foi.","Don merveilleux qui nous vient des deux","Que connaît le cœur droit."]],[1,["Oh! Quel riche trésor!","Un cœur qui vit ce que Dieu dit ;","Sa foi vaut plus que l’or,","Dieu l’honore et le bénit."]],[0,["Quand l’ennemi fait trembler de peur","En face du danger,","Croire au Seigneur, affermit le cœur,","La foi fait triompher."]],[0,["Dieu manifeste à celui qui croit","La force de Son bras ;","Le Tout-Puissant dit à Son enfant :","Si tu crois, tu verras."]]]},{"n":423,"t":"Vois là-bas mettre le Seigneur en croix.","s":[[0,["Vois là-bas mettre le Seigneur en croix.","Vois là-bas mettre le Seigneur en croix.","Oh! (4x) le cœur saisi d’effroi,","Je tremble, tremble, tremble.","Vois là-bas mettre le Seigneur en croix."]],[0,["Vois là-bas, clouer le Seigneur au bois.","Vois là-bas, clouer le Seigneur au bois.","Oh! (4x) le cœur saisi d’effroi,","Je tremble, tremble, tremble.","Vois là- bas, clouer le Seigneur au bois"]],[0,["Vois là-bas, de leur lance, ils L’ont percé","Vois là-bas, de leur lance, ils L’ont percé.","Oh! (4x) le cœur saisi d’effroi,","Je tremble, tremble, tremble.","Vois là-bas, de leur lance, ils L’ont percé."]],[0,["Vois là-bas, soudain s’enfuit le soleil.","Vois là-bas, soudain s’enfuit le soleil.","Oh! (4x) le cœur sais d’effroi,","Je tremble, tremble, tremble.","Vois là-bas, soudain s’enfuit le soleil"]],[0,["Vois là-bas, dans Sa tombe, ils l’ont porté.","Vois là-bas, dans Sa tombe, ils l’ont porté.","Oh! (4x) le cœur saisi d’effroi,","Je tremble, tremble, tremble.","Vois là-bas, dans Sa tombe, ils l’ont porté."]],[0,["Viens et vois, Jésus est ressuscité!","Viens et vois ton Sauveur ressuscité!","Oh! (4x) le cœur rempli de joie,","Je chante, chante, chante.","Gloire à Toi, mon Sauveur ressuscité."]]]},{"n":424,"t":"Je ne sais pas le jour où je verrais mon Roi,","s":[[0,["Je ne sais pas le jour où je verrais mon Roi,","Mais je sais qu’Il me veut dans Sa sainte demeure;","La lumière vaincra les ombres à cette heure;","Ce sera la gloire pour moi..."]],[1,["Ce sera la gloire pour moi... (bis)","La lumière vaincra les ombres à cette heure","Ce sera la gloire pour moi."]],[0,["Je ne sais quels seront les chants des bienheureux,","Les accents, les accords des hymnes angéliques,","Mais je sais que, joignant ma voix aux saints"]],[1,["[cantiques"]],[0,["Bientôt j’adorerai comme eux..."]],[1,["Bientôt j’adorerai comme eux... (bis)","Mais je sais que, joignant ma voix aux","saints cantiques,","Bientôt j’adorerai comme eux."]],[0,["Je ne sais quel sera le Palais éternel,","Mais je sais que mon âme y sera reconnue.","Un regard de Jésus sera ma bienvenue.","Pour moi, pour moi s’ouvre le Ciel..."]],[1,["Pour moi, pour moi s’ouvre le Ciel... (bis)","Un regard de Jésus sera ma bienvenue.","Pour moi, pour moi s’ouvre le Ciel."]]]},{"n":425,"t":"En mon cœur j’ai choisi","s":[[0,["En mon cœur j’ai choisi","De suivre Jésus-Christ.","En mon cœur j’ai choisi","De suivre Jésus","En mon cœur j’ai choisi","De suivre Jésus-Christ","Oui pour toujours (bis)"]],[0,["Si mes amis s’en vont","Qu’import! Moi j’irai","Si mes amis s’en vont","Qu’import! Moi j’irai","Si mes amis s’en vont","Qu’import! Moi j’irai","Oui pour toujours (bis)"]],[0,["Au monde, je dis « Non »","Joyeux, je prends ma croix","Au monde, je dis « Non »","Joyeux j’accepte la Croix","Au monde, je dis « Non »","Joyeux, je prends ma croix","Oui pour toujours"]]]},{"n":426,"t":"Avec des cris de joie","s":[[1,["Avec des cris de joie","Ma bouche Te chantera","Je lèverai les mains","Et Te célébrerai"]],[0,["Ô Dieu, Tu es mon Dieu","Mon âme Te recherche.","Et soupire après Toi","Sur la terre de péché."]],[0,["Lorsque je pense à Toi,","Esseulé sur ma couche,","Je médite sur Toi","Les veilles de la nuit."]],[0,["Je connais le bonheur","A l’ombre de Tes ailes.","Car Tu es mon secours","Ta droite me soutient."]],[0,["J’aime Te contempler","Quand dans Ton sanctuaire,","Ta gloire resplendit","Ta puissance se révèle."]]]},{"n":427,"t":"On est bien à la maison","s":[[

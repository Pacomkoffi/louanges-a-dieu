<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recueil de Cantiques LOUANGES À DIEU</title>
<meta name="theme-color" content="#5a1a2a">
<meta name="description" content="Recueil de Cantiques LOUANGES À DIEU — Centre Missionnaire du Message Évangélique de la Fin des Temps, île Boulay (Côte d’Ivoire). 934 cantiques, recherche par numéro, titre ou paroles. Fonctionne sans internet.">

<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Louanges">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/cormorant-garamond-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/cormorant-garamond-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Literata';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/literata-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Literata';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/literata-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Literata';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/literata-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}
</style>
<style>
/* VOICE: recueilli, chaleureux, d'église — un livre de chant qu'on tient en main
   IDEA: le recueil relié — couverture lie-de-vin, tranche dorée, pages blanches
   PICTURE: l'application elle-même : sommaire numéroté à gauche, page du cantique à droite
   COLOUR and TYPE: lie-de-vin #5a1a2a, or #b88a2c, page blanche ; Cormorant pour les titres, Literata pour les paroles, Figtree pour l'interface
   LAYOUT: en-tête fixe avec recherche ; deux colonnes au-delà de 900px, une seule vue à la fois sur téléphone */
:root{color-scheme:light;
--bg:#f6f2ee;--page:#ffffff;--ink:#22161a;
--mute:#76666b;--line:#e6dcd8;
--wine:#5a1a2a;--wine2:#7a2a3d;--gold:#a87a1e;--hl:#f7ecdc}
:root.nuit{color-scheme:dark;--bg:#140c0f;--page:#1e1418;--ink:#efe6e2;--mute:#a8979c;--line:#3a2a30;--wine:#3d0f1c;--wine2:#e3a2b2;--gold:#d9ad55;--hl:#3a2a18}
:root.nuit mark{background:#7a5a1a}
:root.nuit .tool button,:root.nuit .pad button{background:var(--page)}
*{box-sizing:border-box;min-width:0}
body{min-height:100vh}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--wine);color:#f8ecd9;border-bottom:3px solid var(--gold)}
.bar{max-width:1240px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px max(3vw,14px)}
.brand{display:flex;align-items:center;gap:10px;flex:none;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.brand img{width:42px;height:42px;border-radius:10px;box-shadow:0 0 0 1.5px #d9ad5599}
.brand .bt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1}
.brand small{font:500 11.5px/1 Figtree,sans-serif;letter-spacing:.06em;color:#e9c98a;margin-bottom:4px;white-space:nowrap}
.brand b{font:700 24px/1 'Cormorant Garamond',serif;letter-spacing:.05em;white-space:nowrap}
.mode{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff33;background:#ffffff14;color:#f8ecd9;cursor:pointer;display:grid;place-items:center}
.mode:hover{border-color:#d9ad55}.mode svg{width:20px;height:20px}
.scol{flex:1;max-width:620px}
.search{position:relative}
.hint{margin:7px 0 0 18px;font-size:13.5px;line-height:1.3;color:#f3dfc8;display:flex;align-items:center;gap:6px}
.hint svg{width:15px;height:15px;flex:none;color:var(--gold)}
:root .hint svg{color:#d9ad55}
.search input{width:100%;height:46px;border-radius:23px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;padding:0 44px 0 46px;font-size:16px;outline:none}
.search input::placeholder{color:#f3dfc8b0}
.search input:focus{background:#ffffff22;border-color:var(--gold);box-shadow:0 0 0 3px #d9ad5540}
.search svg{position:absolute;left:16px;top:13px;width:20px;height:20px;opacity:.8}
.sug{position:absolute;left:0;right:0;top:52px;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px #0000004d;max-height:min(70vh,560px);overflow-y:auto;z-index:20;padding:6px}
.sug[hidden]{display:none}
.si{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.si:hover,.si.act{background:var(--hl)}
.si .n{flex:none;width:38px;text-align:right;font:600 19px/1 'Cormorant Garamond',serif;color:var(--gold)}
.si .t{font-family:Literata,serif;font-size:15.5px;line-height:1.35}
.si .x{display:block;font-size:13.5px;color:var(--mute);font-style:italic;margin-top:3px}
.sh{padding:10px 12px;font-size:13px;color:var(--mute)}
.sm{width:100%;min-height:44px;border:0;border-top:1px solid var(--line);background:none;color:var(--wine2);font-weight:600;cursor:pointer;margin-top:4px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.search .clr{position:absolute;right:6px;top:5px;width:36px;height:36px;border-radius:50%;border:0;background:none;color:#f8ecd9;cursor:pointer;display:none;font-size:20px}
.search.has .clr{display:block}
.wrap{max-width:1240px;margin:auto;display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;padding:20px max(3vw,14px) 40px;align-items:start}
nav{position:sticky;top:122px;background:var(--page);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 142px);overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;cursor:pointer;font-weight:500;color:var(--mute);font-size:14px;white-space:nowrap;padding:0 6px}
.tabs button.on{background:var(--hl);color:var(--wine2)}
.scope{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.scope label{display:flex;align-items:center;gap:6px;cursor:pointer}
.scope input{width:18px;height:18px;accent-color:var(--wine2)}
.count{font-weight:600;color:var(--wine2);white-space:nowrap}
.scope .tip{margin-left:auto;font-size:12.5px}
.jump{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.jump button{border:1px solid var(--line);background:none;border-radius:7px;padding:4px 8px;font-size:13px;cursor:pointer;color:var(--mute);min-height:32px}
.jump button:hover{border-color:var(--gold);color:var(--ink)}
ul{list-style:none;margin:0;padding:4px 0;overflow-y:auto;flex:1}
li button{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:10px 16px;cursor:pointer;min-height:44px}
li button:hover{background:var(--hl)}
li button.cur{background:var(--hl);box-shadow:inset 3px 0 var(--gold)}
li .n{flex:none;width:38px;text-align:right;font:600 19px/1 'Cormorant Garamond',serif;color:var(--gold);font-variant-numeric:tabular-nums}
li .t{font-family:Literata,serif;font-size:15.5px;line-height:1.35}
li .x{display:block;font-size:13.5px;color:var(--mute);font-family:Literata,serif;font-style:italic;margin-top:3px}
mark{background:#f2d98f;color:inherit;border-radius:2px}
.empty{padding:28px 18px;color:var(--mute);text-align:center;font-size:15px}
main{background:var(--page);border:1px solid var(--line);border-radius:14px;min-height:60vh;position:relative;overflow:hidden}
main::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--wine),var(--gold),var(--wine))}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:18px clamp(16px,4vw,48px) 0}
.tool button{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--page);border-radius:10px;cursor:pointer;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.tool button:hover{border-color:var(--gold)}
.tool button:focus-visible,li button:focus-visible,.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tool .sp{flex:1}
.tool svg{width:18px;height:18px}
.back{display:none!important}
.fav.on{color:var(--gold);border-color:var(--gold)}
.fav.on svg{fill:currentColor}
article{padding:20px clamp(16px,4vw,48px) 48px;max-width:760px}
.num{font:700 clamp(64px,9vw,96px)/.9 'Cormorant Garamond',serif;color:var(--gold)}
h1{font:600 clamp(28px,3.4vw,40px)/1.1 'Cormorant Garamond',serif;margin:6px 0 4px;text-wrap:balance;color:var(--wine2)}
.ref{color:var(--mute);font-size:14px;margin-bottom:22px}
.lyr{font-family:Literata,serif;font-size:calc(18px * var(--fs,1));line-height:1.65}
.st{margin:0 0 1.3em;display:grid;grid-template-columns:2em minmax(0,1fr)}
.st .k{font:600 .9em/1.65 'Cormorant Garamond',serif;color:var(--gold)}
.st p{margin:0}
.st.r{padding:.5em 0 .5em 1em;border-left:3px solid var(--gold);background:var(--hl);border-radius:0 10px 10px 0;font-style:italic;margin-left:2em;grid-template-columns:minmax(0,1fr)}
.st.r .k{font-style:normal;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.02em;color:var(--wine2);font-weight:600}
.nav2{display:flex;gap:10px;margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
.nav2 button{flex:1;min-height:56px;border:1px solid var(--line);border-radius:12px;background:none;cursor:pointer;text-align:left;padding:8px 14px}
.nav2 button:last-child{text-align:right}
.nav2 small{display:block;color:var(--mute);font-size:13px}
.nav2 span{font-family:Literata,serif;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav2 button:disabled{opacity:.35;cursor:default}
.welcome{padding:48px clamp(16px,4vw,48px);text-align:center}
.welcome svg{width:120px;height:120px}
.welcome h2,.about h2{font:700 clamp(34px,4.2vw,46px)/1.05 'Cormorant Garamond',serif;color:var(--wine2);margin:6px 0 8px;letter-spacing:.04em}
.welcome p{color:var(--mute);max-width:440px;margin:0 auto 22px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:8px auto 10px}
.pad button{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--page);font:600 26px 'Cormorant Garamond',serif;cursor:pointer}
.pad button:hover{border-color:var(--gold)}
.pad .go{background:var(--wine);color:#f8ecd9;border-color:var(--wine)}
.disp{font:700 44px/1 'Cormorant Garamond',serif;color:var(--gold);min-height:50px;font-variant-numeric:tabular-nums}
.about{padding:48px clamp(16px,4vw,48px) 56px;text-align:center;max-width:640px;margin:auto}
.about svg{width:96px;height:96px}

.about .sub{color:var(--mute);margin:0 0 28px}
.sig{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 8px;margin:0 auto 26px}
.sig small{display:block;color:var(--mute);font-size:13px;margin-bottom:6px}
.sig .who{font:italic 600 clamp(24px,3.2vw,32px)/1.2 'Cormorant Garamond',serif;color:var(--gold);text-wrap:balance}
.sig .src{font-family:Literata,serif;margin-top:10px}
.free{display:inline-block;background:var(--wine);color:#f8ecd9;border-radius:24px;padding:10px 22px;font:600 20px/1.2 'Cormorant Garamond',serif}
.stats{display:flex;justify-content:center;gap:28px;margin-top:28px;color:var(--mute);font-size:14px}
.stats b{display:block;font:700 30px/1 'Cormorant Garamond',serif;color:var(--wine2)}
.comm{margin:26px auto 0;max-width:480px;display:grid;gap:12px;text-align:center}
.mail{font-size:14.5px;color:var(--mute);line-height:1.5;padding:12px 14px;border:1px dashed var(--line);border-radius:14px}
.mail a{color:var(--wine2);font-weight:600;display:inline-block;margin-top:2px}
.mail button{margin-top:8px;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;min-height:32px}
.lfoot{padding:22px 18px 28px;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
.lfoot b{display:block;color:var(--wine2);font:600 17px/1.25 'Cormorant Garamond',serif;margin-bottom:4px}
.lfoot a{color:var(--wine2)}
.over{font:500 13px/1 Figtree,sans-serif;letter-spacing:.08em;color:var(--gold);margin-top:14px}
.appic{width:104px;height:104px;border-radius:24px;box-shadow:0 10px 28px #5a1a2a40}
.top{position:absolute;right:14px;bottom:14px;z-index:8;display:none;align-items:center;gap:7px;min-height:46px;padding:0 18px 0 14px;border-radius:23px;border:2px solid var(--gold);background:var(--wine);color:#f8ecd9;font-weight:600;font-size:15px;box-shadow:0 8px 24px #0000004d;cursor:pointer}
.top svg{width:18px;height:18px;color:#d9ad55}
.top.on{display:inline-flex}
.top:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:900px){.top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:no-preference){.top.on{animation:pop .2s ease}@keyframes pop{from{opacity:0;transform:translateY(8px)}}}
.inst{display:flex;align-items:center;gap:12px;margin:8px;padding:12px 12px 12px 14px;border-radius:12px;background:#5a1a2a;color:#f8ecd9}
.inst[hidden]{display:none}
.inst img{width:40px;height:40px;border-radius:10px;flex:none}
.inst p{margin:0;flex:1;font-size:14px;line-height:1.35}
.inst b{display:block;font-size:15px}
.inst .go{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:0;background:#d9ad55;color:#2a1208;font-weight:600;cursor:pointer;font-size:15px}
.inst .x{flex:none;width:36px;height:36px;border:0;background:none;color:#f8ecd9;font-size:22px;cursor:pointer;opacity:.8}
.inst svg{width:16px;height:16px;vertical-align:-3px}
.toast{position:fixed;left:50%;bottom:24px;max-width:min(92vw,420px);text-align:center;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media(max-width:900px){
 li button{scroll-margin-top:190px}
 .wrap{grid-template-columns:minmax(0,1fr);padding:12px 10px 30px;gap:0}
 nav{position:static;max-height:none;border-radius:12px}
 ul{overflow:visible}
 body.reading nav{display:none}
 body:not(.reading) main{display:none}
 .back{display:inline-flex!important}
 .brand b{font-size:21px}
 .brand img{width:38px;height:38px}
 body.reading .hint{display:none}
 .tabs button{font-size:13.5px}
 .scope .tip{display:none}
}
@media(max-width:600px){.bar{flex-wrap:wrap;gap:10px}.mode{order:2;margin-left:auto;width:42px;height:42px}.scol{order:3;flex-basis:100%;max-width:none}.tool{gap:6px;padding-top:14px}.tool button{padding:0 10px}.free{font-size:18px}.hint{margin-left:14px;font-size:13px}.tool .lbl{display:none}}
@media(max-width:380px){.bar{gap:8px}.brand{gap:8px}.brand img{width:34px;height:34px}.brand b{font-size:18.5px;letter-spacing:.03em}.brand small{font-size:10.5px}.mode{width:40px;height:40px}.back span{display:none}.tool button{padding:0 9px}article{padding-top:10px}}
@media(prefers-reduced-motion:no-preference){article{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header><div class="bar">
 <button class="brand" id="home" aria-label="Accueil">
  <img src="icons/icon-192.png" alt="">
  <span class="bt"><small>Recueil de cantiques</small><b>LOUANGES À DIEU</b></span>
 </button>
 <div class="scol">
 <div class="search" id="sbox">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
  <input id="q" type="search" placeholder="Numéro, titre ou bout de paroles…" autocomplete="off" aria-label="Rechercher un cantique">
  <button class="clr" id="clr" aria-label="Effacer">×</button>
  <div class="sug" id="sug" role="listbox" hidden></div>
 </div>
  <p class="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Cherchez ici : tapez le numéro, le titre ou quelques mots d’un cantique</p>
 </div>
 <button class="mode" id="mode" aria-label="Mode nuit"></button>
</div></header>

<div class="wrap">
 <nav aria-label="Sommaire des cantiques">
  <div class="inst" id="inst" hidden>
   <img src="icons/icon-192.png" alt="">
   <p id="instTxt"><b>Installer l’application</b>Sur votre écran d’accueil, utilisable sans internet.</p>
   <button class="go" id="instGo" hidden>Installer</button>
   <button class="x" id="instX" aria-label="Masquer">×</button>
  </div>
  <div class="tabs" role="tablist">
   <button id="tAll" class="on">Tous</button><button id="tFav">Favoris</button><button id="tRec">Récents</button><button id="tAbo">Infos</button>
  </div>
  <div class="scope">
   <span class="count" id="count"></span>
   <span class="tip">Recherche dans les numéros, titres et paroles</span>
  </div>
  <div class="jump" id="jump"></div>
  <ul id="list"></ul>
  <button class="top" id="top" aria-label="Revenir en haut de la liste"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Haut de la liste</button>
 </nav>
 <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>const DATA=[{"n":1,"t":"Qu’on batte des mains! Que tous les humains,","s":[[0,["Qu’on batte des mains! Que tous les humains,","En cet heureux jour, viennent tour à tour","D’un chant solennel, louer l’Éternel.","Peuples, il vous faut craindre le Très-Haut,","Le grand Roi qui peut faire quand Il veut","Trembler à Sa voix les plus puissants rois."]],[0,["Par Son grand pouvoir, Il nous fera voir","Les peuples soumis; et nos ennemis,","Par Lui châtiés, seront sous nos pieds.","Ce Maître si doux a choisi pour nous","La meilleure part, et sous Son regard,","Israël en paix triomphe à jamais."]],[0,["Peuples, Le voici qui se montre ici.","Que pour L’honorer, que pour L’adorer,","On aille au-devant du grand Dieu vivant.","Chantez donc, chantez Ses grandes bontés;","D’un cœur plein de foi, chantez notre Roi,","Le vrai, le seul Dieu, qui règne en tout lieu."]]],"a":"Psaumes 47"},{"n":2,"t":"Quand la Bible ici-bas","s":[[0,["Quand la Bible ici-bas","Illumine nos pas,","De Sa gloire, Dieu vient nous remplir.","Quand je veux ce qu’Il veut,","En Son Nom, je le peux.","Simplement il faut croire, obéir."]],[1,["Croire, obéir","Pour que Dieu puisse ouvrir","Les écluses célestes.","Il faut croire, obéir."]],[0,["Veux-tu la liberté,","Le bonheur, la santé ?","Que ton seul but soit de Le servir.","Car l’Esprit n’est donné","Avec la joie, la paix,","Qu’à celui qui veut croire, obéir."]],[0,["Les fardeaux, les labeurs,","Le chagrin et les pleurs,","A mon bien, Dieu les fait concourir.","Ils deviendront au-Ciel","Des trésors éternels.","Simplement il faut croire, obéir."]],[0,["Nous pouvons dépasser","Nos incapacités,","Aux desseins éternels, nous ouvrir,","De nouveaux horizons,","Une vaste moisson.","Simplement il faut croire, obéir."]],[0,["À Ses ordres soumis,","Sans aucun compromis,","Alors, le Tout Puissant peut agir.","Il nous ouvre les flots,","Fait tomber Jéricho.","Simplement, il faut croire, obéir."]]]},{"n":3,"t":"Mon Dieu est si bon,","s":[[0,["Mon Dieu est si bon,","Il prend bien soin de moi","Ce Dieu si fidèle,","Sais-tu qu’Il pense à toi ?","Il voudrait t’aider","Dans tes difficultés ;","Il faut que tu viennes à Lui Tel que tu es."]],[1,["Dieu sait si bien","Ce qui te semble lourd,","Qui te fait mal,","Te trouble chaque jour.","Il connaît tes besoins,","Ta peur du lendemain.","Avec mon Dieu, tu sais,","Tout ira bien."]],[0,["Il vit à jamais,","C’est le Dieu Tout Puissant.","Il te répondra,","Viens à Lui simplement.","Quand tout semble noir,","Triste et désespéré","Sais-tu que là-haut, tu n’es pas oublié ?"]],[0,["Mon Dieu t’aidera,","Il conduira tes pas.","Si tu veux marcher,","Te plier à Sa loi,","Alors, ne crains plus,","Tu peux compter sur Lui :","Il accomplira tout ce qu’il a promis."]]]},{"n":4,"t":"Il faut, grand Dieu, que de mon cœur","s":[[0,["Il faut, grand Dieu, que de mon cœur","La sainte ardeur Te glorifie;","Qu’à Toi, des mains et de la voix,","Devant les rois je psalmodie.","J’irai T’adorer, ô mon Dieu!","En Ton saint lieu, d’un nouveau zèle;","Je chanterai Ta vérité","Et Ta bonté, toujours fidèle."]],[0,["Ton nom est célèbre à jamais","Par les effets de Tes paroles;","Quand je T’invoque, Tu m’entends;","Quand il est temps, Tu me consoles.","Tous les rois viendront à Tes pieds","Humiliés, Prier sans cesse,","Sitôt qu’ils auront une fois","Oui la voix de Ta promesse."]],[0,["Ils rempliront, par leurs concerts,","Tout l’univers de Tes louanges;","Les peuples qui les entendront","Admireront Tes faits étranges.","Ô grand Dieu qui, de Tes hauts cieux,","En ces bas lieux voit toutes choses,","Quoique Tu semblés être loin,","C’est sur Ton soin que tout repose."]],[0,["Si mon cœur, dans l’adversité,","Est agité, Ta main m’appuie.","C’est Ton bras qui sauve des mains","Des inhumains ma triste vie.","Quand je suis le plus abattu,","C’est Ta vertu qui me relève;","Ce qu’il T’a plu de commencer,","Sans se lasser, Ta main l’achève!"]]],"a":"Psaumes 138"},{"n":5,"t":"Il y a un Pays au-delà des étoiles,","s":[[0,["Il y a un Pays au-delà des étoiles,","Il y a une Cité où il n’y a point de nuit.","Si nous sommes fidèles, nous irons là bientôt","C’est la Cité où l’Agneau est la Lumière."]],[1,["Dans cette Cité où l’Agneau est la Lumière","Cette Cité où il n’y a point de nuit,","J’ai un beau Palais là-haut","Et libéré des soucis,","Je m’en irai où l’Agneau est la Lumière."]],[0,["Ici nous sommes éclairés mais nous savons","Que ce soleil qui luit sur nous maintenant","Se changera en nuage quand nous irons","A la Cité où l’Agneau est la Lumière."]],[0,["Là, il y a des fleurs à jamais et le jour","Sera un jour éternel et pas de nuit,","Nos larmes seront essuyées à jamais,","Dans cette Cité où l’Agneau est la Lumière."]],[0,["Ici nous avons toujours des déceptions,","Et nos espoirs rencontrent l’opposition,","Ici nous pleurons, là-bas sera la joie,","Dans cette Cité où l’Agneau est la Lumière."]],[0,["Que le soleil faiblisse ou qu’il y ait la nuit,","Mon cœur bienheureux n’a peur d’aucun ombrage","Car je sais que là au Ciel, j’ai une Maison,","Dans cette Cité où l’Agneau est la Lumière."]]]},{"n":6,"t":"Oui, certains chantent","s":[[0,["Oui, certains chantent","Pour chasser l’ennui de leur cœur","Et d’autres chantent","Pour apporter la joie aux leurs.","Mais moi je chante","Pour adorer mon Dieu.","C’est en mon cœur, (bis)"]],[1,["C’est en mon cœur","La mélodie d’Amour divin.","C’est en mon cœur","Car Il est mien et je suis Sien;","C’est en mon cœur","Alors je L’aime et veux chanter,","C’est en mon cœur, (bis)"]],[0,["Vous dites : comment","Jésus peut-Il tout pardonner ?","Vous dites : comment","Son sang peut-il purifier ?","Et puis, comment","Je sais qu’il m’a sauvé ?","C’est en mon cœur (bis)"]],[0,["Vous dites : comment","Puis-je toujours lire et prier ?","Comment sourire","Au milieu des difficultés ?","Et comment j’ai","La paix dans la douleur ?","C’est en mon cœur, (bis)"]],[0,["Jésus revient!","Comment ? Je ne peux l’expliquer.","Jésus revient!","Et cela, c’est pour me chercher ;","Je ne sais peut-être","Pas le prouver,","C’est en mon cœur, (bis)"]]]},{"n":7,"t":"L’Amour de Dieu de loin surpasse","s":[[0,["L’Amour de Dieu de loin surpasse","Ce qu’en peut dire un cœur humain.","Il est plus grand que les espaces,","Même en l’abîme, il nous atteint.","Pour le péché de notre monde,","Dieu nous donna Jésus.","Il nous pardonne, ô paix profonde,","Il sauve les perdus."]],[1,["L’Amour de Dieu, si fort, si tendre,","Est un Amour sans fin :","Tel est le chant que font entendre","Les anges et les saints."]],[0,["Versez de l’encre dans les ondes,","Changez le ciel en parchemin,","Tendez la plume à tout le monde","Et que chacun soit écrivain :","Vous dire tout l’Amour du Père","Ferait tarir les eaux","Et remplirait la place entière","Sur ces divins rouleaux."]],[0,["Et que le monde un jour chancelle","Avec ses trônes et ses rois,","Quand trembleront tous les rebelles,","Soudain saisis d’un grand effroi,","De Dieu, l’Amour que rien ne lasse","Pour nous encore vivra :","C’est le miracle de la grâce,","Amen ! Alléluia !"]]]},{"n":8,"t":"L’Amour de Dieu est plus grand","s":[[0,["L’Amour de Dieu est plus grand","Que langues ou plumes","Ne peuvent exprimer.","Il va au-delà de la plus haute étoile,","Il atteint le plus bas enfer,","Le coupable sentant son poids.","Dieu donne Son Fils pour vaincre","A Son enfant réconcilié","Et pardonné de son péché."]],[1,["O l’Amour de Dieu est insondable","Si riche, sans mesure et fort.","Il endurera dans l’éternité","Le chant des saints et des anges."]],[0,["Quand le temps passera, les trônes","Et les royaumes terrestres tombent","Quand les hommes ici refusent de prier","Sur les rocs, les montagnes","Appelle l’Amour de Dieu si sûr","Endurera tout sans mesure et fort","Grâce infinie, race d’Adam","Et le chant des saints et des anges."]],[0,["Si les océans étaient tous remplis","D’encre et les cieux parchemins","Si chaque tige sur la terre, une plume,","Et tout l’homme écrivain,","Décrire l’Amour de Dieu","Sécherait les océans, le rouleau","Ne peut en contenir le tout","Quoique étendu d’un bout à l’autre."]]]},{"n":9,"t":"Lorsque l’orage gronde","s":[[0,["Lorsque l’orage gronde","Et qu’au ciel, tout est noir,","Quand le roi de ce monde","Me ravit tout espoir,"]],[1,["Mon espoir est en Jésus,","Il est mon ferme appui.","Son bras m’a toujours secouru,","Je me confie en Lui."]],[0,["Lorsque Satan me tente,","Que le péché séduit,","Quand la lutte est ardente","Que le courage fuit,"]],[0,["Quand je suis en détresse,","Qu’il n’y a plus d’issue,","Quand les soucis m’oppressent,","Que tout paraît perdu,"]]]},{"n":10,"t":"L’Éternel seul est Seigneur;","s":[[0,["L’Éternel seul est Seigneur;","Seul Il est dominateur, (bis)","Sur les peuples de la terre;","Il est maître souverain (bis)","Des ouvrages que Sa main","Pour Sa gloire a voulu faire."]],[0,["Mais quel bienheureux mortel","Au saint mont de l’Éternel (bis)","Aura le droit de paraître?","Et quel homme, ô puissant Roi! (bis)","Pour demeurer avec Toi","Assez juste pourrait être?"]],[0,["C’est l’homme qui, dans son cœur,","Par Ton Esprit, ô Seigneur! (bis)","Hait du péché les souillures;","Qui, fuyant la fausseté, (bis)","Te sert en sincérité,","Levant vers Toi des mains pures."]],[0,["Ouvrez-vous, célestes lieux:","Haussez-vous portes des cieux! (bis)","Car voici le Roi de gloire,","Quel est ce Roi, ce vainqueur? (bis)","C’est Jésus, le Rédempteur","Qui revient de la victoire."]],[0,["Avec Lui, nous entrerons,","Avec Lui nous régnerons (bis)","Dans cette gloire éternelle:","Ouvrez-vous, portes des cieux, (bis)","Tressaillez, célestes lieux,","D’une allégresse nouvelle!"]]],"a":"Psaumes 24"},{"n":11,"t":"Gloire, gloire à l’Éternel!","s":[[0,["Gloire, gloire à l’Éternel!","Qu’un cantique solennel (bis)","De nos cœurs monte à Son trône.","Quand Il crée, oh! Qu’Il est grand! (bis)","Qu’Il est juste en punissant,","Qu’Il est bon quand Il pardonne!"]],[0,["Il commande... et le néant","Tressaille au premier accent (bis)","De Sa parole vivante;","Et des astres radieux (bis)","Sa main jette dans les cieux","La poussière étincelante."]],[0,["Il accuse et le pécheur,","Devant cet accusateur (bis)","Sent sa profonde misère,","Et s’écrie, en son effroi (bis)","Montagnes, tombez sur moi,","Cachez-moi de Sa colère!"]],[0,["Mais l’âme à qui le Seigneur","S’est donné pour rédempteur (bis)","Goûte une paix ineffable:","Objet d’un si grand amour (bis)","Elle se donne en retour","À ce Sauveur adorable."]],[0,["Ô Dieu! Que Tes rachetés","Toujours chantent les bontés (bis)","De Celui qui leur pardonne!","Gloire, gloire à l’Eternel! (bis)","Ce cantique solennel","Montera jusqu’à Son trône!"]]]},{"n":12,"t":"Comme un cerf altéré brame","s":[[0,["Comme un cerf altéré brame","Après le courant des eaux,","Ainsi soupire mon âme,","Seigneur, après Tes ruisseaux;","Elle a soif du Dieu vivant","Et s’écrie en Le suivant:","Ô mon Dieu, quand donc sera-ce","Que mes yeux verront Ta face?"]],[0,["Pour pain, je n’ai que mes larmes,","Et nuit et jour en tout lieu,","Lorsqu’en mes dures alarmes","On me dit: Que fait ton Dieu?","Je regrette la saison","Où j’allais en Ta maison,","Chantant avec les fidèles","Tes louanges immortelles."]],[0,["Mais quel chagrin te dévore? Mon âme,","rassure-toi:","Espère en Dieu, car encore","Il sera loué de moi.","C’est Son regard seulement Qui guérira mon","tourment: Mon Dieu, je sens que mon âme","D’un ardent désir se pâme."]],[0,["Tous les flots de Ta colère","Sur moi, Seigneur, ont passé;","Mais par Ta grâce j’espère","Qu’enfin l’orage a cessé.","Le jour, Tu me conduiras","Et la nuit, Tu me feras","Chanter, d’une âme ravie,","Ton saint Nom, Dieu de ma vie."]],[0,["Mais quel chagrin te dévore?","Mon âme, rassure-toi:","Espère en Dieu, car encore","Il sera loué de moi.","Un regard, dans Sa faveur,","Me dit qu’il est mon Sauveur;","Et c’est aussi Lui, mon âme,","Qu’en tous mes maux, je réclame."]]],"a":"Psaumes 42"},{"n":13,"t":"Comme une biche soupire après l’eau,","s":[[0,["Comme une biche soupire après l’eau,","Mon âme soupire après Toi.","Toi seul est le désir de mon cœur,","Et je vis pour T’adorer."]],[1,["Tu es mon bouclier, ma force,","Le Roc sur qui j’ai fondé ma foi.","Toi seul est le désir de mon cœur,","Et je vis pour T’adorer."]],[0,["Je Te préfère à l’or et l’argent,","Toi seul peux me satisfaire.","Toi seul est la source de ma joie,","Et je vis pour T’adorer."]],[0,["Tu es mon Frère et Tu es mon Ami,","Quoique Tu sois le Roi,","Je T’aime plus que tous!","Et plus que toutes choses, mon Confident."]]]},{"n":14,"t":"Dieu fort et grand! Tu vois toute ma vie,","s":[[0,["Dieu fort et grand! Tu vois toute ma vie,","Tu m’as connu, Tu m’as sondé des cieux:","Où puis-je fuir Ta science infinie?","Éternel Roi, Tu me suis en tous lieux.","Où puis-je fuir Ta science infinie?","Éternel Roi, Tu me suis en tous lieux."]],[0,["Soit que je marche ou bien que je m’arrête,","Voici, Seigneur! Tu Te tiens près de moi;","Et, pour parler quand ma langue s’apprête","Tout mon dessein est déjà devant Toi.","Et, pour parler quand ma langue s’apprête","Tout mon dessein est déjà devant Toi."]],[0,["Vivant ou mort, dans les cieux, sur la terre","Ceint de lumière ou ceint d’obscurité,","Partout Ta main peut me saisir, ô Père!","Partout sur moi, Ton œil est arrêté.","Partout Ta main peut me saisir, ô Père!","Partout sur moi, Ton œil est arrêté."]],[0,["Que Ta pensée est donc mystérieuse!","Je n’en saurais mesurer la hauteur;","À mes regards, Ton œuvre est merveilleuse,","Et, confondu, j’adore Ta grandeur.","À mes regards, Ton œuvre est merveilleuse,","Et, confondu, j’adore Ta grandeur."]],[0,["Connaître, ô Dieu! Ton amour, Ta puissance","Sur mon sentier voir briller Ta splendeur,","Fonder sur Toi toute mon espérance,","Sont les seuls biens que désire mon cœur.","Fonder sur Toi toute mon espérance,","Sont les seuls biens que désire mon cœur."]]],"a":"Psaume 139"},{"n":15,"t":"Un beau jour, le monde sera confondu.","s":[[0,["Un beau jour, le monde sera confondu.","On nous cherchera partout, disparus.","Car nous qui sommes sauvés","Et marchons en sainteté,","En un clin d’œil, nous serons enlevés."]],[1,["Enlevés, Enlevés !","En un clin d’œil, nous serons tous enlevés","Enlevés, Enlevés !","Auprès de Jésus, nous serons enlevés."]],[0,["La trompette du Seigneur résonnera","La voie de l’Archange retentira","Jésus viendra sur la nue","Tous ensemble à Sa vue","En un clin d’œil, nous serons enlevés."]],[0,["Nous ne devancerons pas ceux qui sont morts","Ils sortiront de leur tombe d’abord","Mais je vous dis un secret,","À vous tous qui êtes prêts :","En un clin d’œil, nous serons enlevés."]],[0,["Alors, nous revêtirons des corps nouveaux,","Immortels fils et filles du Très-Haut.","Triomphants, nous chanterons :","« Mort, où est ton aiguillon ? »","En un clin d’œil, nous serons enlevés."]]]},{"n":16,"t":"L’Éternel est mon Berger,","s":[[0,["L’Éternel est mon Berger,","Je n’aurai point de disette:","Je me laisse diriger","Par Sa fidèle houlette."]],[0,["Il me fait goûter la paix","Au milieu des prés fertiles,","Et sous Sa garde, je pais","Le long des ruisseaux tranquilles."]],[0,["C’est grâce à Son Nom divin","Qu’Il peut restaurer mon âme,","Et qu’il me guide au chemin","Du salut que je réclame."]],[0,["Je ne craindrais aucun mal","Alors qu’il me faudrait même,","Ô mort, de ton sombre val","Traverser la nuit suprême."]],[0,["Car Dieu marche près de moi","Dans cette vallée obscure;","Son bâton chasse l’effroi,","Sa houlette me rassure."]],[0,["Aux yeux de mes ennemis","Pour moi le festin s’apprête,","À flots coule un vin exquis,","L’huile parfume ma tête."]],[0,["Oui, le bonheur et la paix","M’accompagnent d’heure en heure,","Et du Seigneur, le palais","Sera toujours ma demeure."]]],"a":"Psaume 23"},{"n":17,"t":"Où est ton trésor, là sera ton cœur.","s":[[0,["Où est ton trésor, là sera ton cœur.","Tu peux te tromper de placement.","Ton avenir compte tout autant.","Prends donc le temps d’y songer une heure."]],[1,["L’argent ne suffit pas","Pour nous rendre heureux","Il faut d’autres trésors","Pour combler nos vœux.","Si tu n’as soif que d’or,","Prépare tes yeux :","Tu apprendras un jour","Qu’on n’achète pas Dieu."]],[0,["Le Christ est venu pour tout pardonner.","L’attrait de l’argent, Il peut l’ôter","Il faut savoir que pour les nantis,","C’est compliqué d’être démuni."]],[0,["Amassez-vous des trésors au Ciel.","C’est le bon conseil de l’Éternel.","Écoutez-le, il est essentiel,","C’est le destin le plus naturel."]]]},{"n":18,"t":"Je lève les yeux vers les monts que j’aime;","s":[[0,["Je lève les yeux vers les monts que j’aime;","D’où peut me venir ici le secours?","Le secours me vient de l’Éternel même,","Du Dieu qui créa les nuits et les jours."]],[0,["Pourra-t-Il souffrir que ton pied chancelle?","Ton Gardien peut-Il sommeiller jamais?","Non, Il ne dort pas, le Gardien fidèle,","Celui qui maintient Israël en paix."]],[0,["Pour toi, l’Éternel est une retraite;","Il te sert à droite et d’ombre et d’appui:","Le soleil ne peut frapper sur ta tête,","Ni la lune à l’heure où le jour a fui."]],[0,["Il te gardera de tout mal possible;","Il garde ton âme, Il garde tes jours;","Il te gardera! Rentre ou sors paisible;","L’Éternel sur toi veillera toujours."]]],"a":"Psaume 121"},{"n":19,"t":"Quel Sauveur merveilleux je possède!","s":[[0,["Quel Sauveur merveilleux je possède!","Il s’est sacrifié pour moi.","Et Sa vie innocente, Il cède,","Pour mourir sur l’infâme bois!"]],[1,["Attaché à la croix pour moi (bis)","Il a pris mon péché, Il m’a délivré.","Attaché à la croix pour moi."]],[0,["Il renonce à la gloire céleste","Pour le plan rédempteur de Dieu.","L’apparence est la plus modeste,","Oh! Quel prix pour me rendre heureux."]],[0,["Maltraité, innocent, pour ma vie,","Pour mes iniquités, brisé,","Et chargé de mes maladies,","Il mourut pour guérir, sauver."]],[0,["Le salut accompli pour Ses frères,","Le Sauveur fut reçu au Ciel.","Il revient! Ô profond mystère!","Mon bonheur sera éternel!"]]]},{"n":20,"t":"Un beau jour dans ma détresse,","s":[[0,["Un beau jour dans ma détresse,","J’appris une bonne nouvelle","Qui allait changer ma vie","Il s’agissait d’un Sauveur","Venu pour tous les pécheurs,","C’était là ma délivrance."]],[1,["On m’a tant parlé de Toi, Seigneur !","On m’a tant parlé de Toi.","J’ai décidé de Te suivre","Espérant Te voir un jour","Car on m’a tant parlé de Toi."]],[0,["Béni soit le Dieu Très-Haut","Dans Sa grande miséricorde","Nous a tous régénéré","En ressuscitant Son Fils","Jésus-Christ d’entre les morts","Pour une espérance vivante."]],[0,["Bien que nous ne L’ayons pas vu,","Quoique L’ayant entendu,","Nous L’aimons et Le croyons.","J&sus l’a dit aux disciples :","« Heureux ceux qui n’ont pas vu","Et qui ont cru à la Bonne Nouvelle »."]],[0,["Nos souffrances, Il les a portées,","Nos douleurs, Il s’est chargé,","Écrasé à cause de nos fautes.","Le châtiment qui nous donne","La paix est tombée sur Lui,","Par Ses meurtrissures nous sommes guéris."]]]},{"n":21,"t":"Au rebord du Jourdain, je me tiens","s":[[0,["Au rebord du Jourdain, je me tiens","Mes yeux se portent au loin","Vers le beau pays de Canaan","Où se trouve mon trésor."]],[1,["Je vais à la Terre promise (2x)","Oh! Qui veut venir avec moi ?","Je vais à la Terre promise."]],[0,["Sur ces larges plaines étendues","Brille un jour éternel.","Là, le Fils de Dieu règne à jamais","Et dissipe la nuit."]],[0,["Ni souffle, ni vent, ni froideur","Sur ce rivage saint."]],[0,["La mort, la peine, la maladie","N’y sont jamais senties."]],[0,["Quand j’atteindrai ce bel endroit","Être à jamais béni,","Quand je verrai la face du Père","Me reposer en Lui,"]]]},{"n":22,"t":"Prends le Nom de Jésus avec toi","s":[[0,["Prends le Nom de Jésus avec toi","Oh toi, enfant de tristesse.","Il va te procurer la joie,","Prends-Le partout où tu vas."]],[1,["Précieux Nom, Nom si doux","Espoir de la terre et joie du Ciel"]],[0,["Prends le Nom de Jésus avec toi","Comme un puissant bouclier.","Quand les tentations surviennent,","Murmure ce Nom en priant."]],[0,["Oh le précieux Nom de Jésus","Fait frémir nos âmes de joie.","Ses bras aimables nous reçoivent","Et nous chantons Ses cantiques."]],[0,["À Son Nom, nous nous inclinons","Nous prosternant à Ses pieds,","Roi des rois, Le couronnerons","Quand le voyage est fini."]]]},{"n":23,"t":"C’est encore l’ancien Saint-Esprit","s":[[0,["C’est encore l’ancien Saint-Esprit","Et Satan ne peut L’approcher","C’est pourquoi les peuples Le craignent","Mais Il est si bon pour moi."]],[1,["Donne-moi l’ancien Évangile (ter)","Il est si bon pour moi."]],[0,["Il mettra fin à tes mensonges","Il te sauvera de la mort","Il fera s’enfuir le démon","Et Il est si bon pour moi."]],[0,["Il est bon, je n’en veux d’autre","Il me fait aimer mon frère","Il met toute chose à découvert","Et Il est si bon pour moi."]],[0,["Il était si bon pour nos pères","Il fut bon pour Paul et Silas","Il fut si bon pour frère Branham","Et Il est si bon pour moi."]]]},{"n":24,"t":"Et quand l’épreuve arrive,","s":[[0,["Et quand l’épreuve arrive,","Elle travaille pour mon bien ;","J’apprends à mieux combattre","Puisque j’aime Jésus."]],[1,["Tout concourt pour mon bien","Puisque j’aime Jésus","Tout travaille pour mon bien","Puisque j’aime le Roi."]],[0,["Et quand la tentation vient,","Elle travaille pour mon bien ;","J’apprends à faire la guerre","Puisque j’aime Jésus."]],[0,["Et quand le vent me bouge,","Il travaille pour mon bien ;","J’enfonce mes racines","Puisque j’aime Jésus."]],[0,["Quand les douleurs me frappent,","Elles travaillent pour mon bien ;","Elles fortifient ma foi","Puisque j’aime Jésus."]],[0,["Et quand la mort me frappe,","Elle travaille pour mon bien ;","Je vais me reposer","Puisque j’aime Jésus."]]]},{"n":25,"t":"Que Dieu Se montre seulement,","s":[[0,["Que Dieu Se montre seulement,","Et l’on verra dans un moment","Abandonner la place;","Le camp des ennemis épars,","Épouvanté, de toutes parts","Fuira devant Sa face."]],[1,["On verra tout ce camp s’enfuir","Comme l’on voit s’évanouir","Une épaisse fumée;","Comme la cire fond au jeu,","Ainsi des méchants devant Dieu","La force est consumée."]],[0,["Réjouissez-vous devant Lui!","Il est des orphelins l’appui,","Le défenseur, le Père;","Il est des veuves le recours","Et de Son peuple, tous les jours,","Il entend la prière."]],[1,["Ce Dieu puissant, par Sa bonté,","Ramène la prospérité,","La paix et l’allégresse;","Du captif, Il brise les fers,","Du juste, dans tout l’univers,","Son œil voit la détresse"]],[0,["O Dieu! Ceux qui T’ont résisté","Viendront avec humilité","Au palais de Ta gloire,","Bénis sois-Tu, Dieu tout puissant,","Qui, des hauts cieux nous exauçant,","Nous donne la victoire!"]],[1,["L'Éternel est notre recours,","Et nous avons par Son secours","Trouvé la délivrance.","Il est le Dieu bon, le Dieu fort;","Il est, en face de la mort,","Notre seule espérance."]],[0,["Louez ce Dieu si glorieux","Qui voit sous Ses pieds les hauts cieux,","Qu’Il a formés Lui-même,","Et de qui la puissante voix","Fait trembler et peuples et rois","Par Sa force suprême."]],[1,["Soumettez-vous à l’Éternel;","Méconnaissez qu’en Israël","Sa gloire est établie,","Comme on voit luire dans les airs,","Parmi la foudre et les éclairs,","Sa puissance infinie."]]],"a":"Psaume 68"},{"n":26,"t":"Éternel, Ta fidélité","s":[[0,["Éternel, Ta fidélité","Va jusqu’aux cieux, et Ta bonté","Dépasse toute cime,","Ta justice est pareille aux monts,","Et Tes jugements sont profonds","Comme le grand abîme."]],[1,["À tous les êtres, Tu fais voir","Et Ta clémence et Ton pouvoir","La moindre créature","Aussi bien que le genre humain,","Vit sous Tes yeux et de Ta main","Reçoit sa nourriture."]],[0,["Ô Seigneur, qu’ils sont précieux","Les biens que Tu répands des cieux","Sur les âmes fidèles!","Les fils de l’homme, en leur effroi,","Ont un refuge auprès de Toi,","À l’ombre de Tes ailes."]],[1,["Ils trouvent en toute saison,","Leur nourriture en Ta maison;","Ta grâce les abreuve;","Et dans leur cœur, de jour en jour","Les délices de Ton amour","S’épanchent comme un fleuve."]],[0,["Oh! Répands sur nous Ta faveur!","En Toi seul se trouve, Seigneur,","La source de la vie.","Tu dissipes l’obscurité:","Sans Ta lumière, la clarté","À notre âme est ravie."]],[1,["Donne Ta force aux hommes droits","Qui, connaissant Tes saintes lois,","Marchent devant Ta face;","Et que, malgré Tes ennemis,","Par Ton peuple heureux et soumis","Ta volonté se fasse!"]]],"a":"Psaume 36"},{"n":27,"t":"“Invoque-moi du sein de la détresse !","s":[[0,["“Invoque-moi du sein de la détresse !","Mon bras puissant te sauvera”.","C’est Dieu qui parle,","Oh ! Crois à Sa promesse !","Bientôt ta voix L’exaltera."]],[0,["Si tout est sombre,","Oh ! Ne perds pas courage.","Ne doute pas du Dieu vivant.","Même au milieu des fureurs de l’orage","Demeure en paix, crois seulement."]],[0,["Mais n’attend pas que le mal te domine,","Que l’ennemi soit dans ton cœur.","Elle est à toi, la puissance divine ;","Saisis-la donc et sois en paix."]],[0,["Jamais, jamais, Dieu qui fit la","promesse, Ne manquera de l’accomplir.","Que Son enfant, sauvé de la détresse,","Ne manque pas de Le bénir !"]]]},{"n":28,"t":"Mon âme est contente,","s":[[0,["Mon âme est contente,","Mon cœur est content","Parce que ce que Dieu a dit","S’accomplira."]],[1,["Qui es-tu, homme, pour empêcher","Ce que Dieu veut faire en son temps ?","Lui qui a promis de nous rendre","Plus blanc que la neige","C’est sûr qu’Il le fera"]],[0,["Oh comme Il est bon","Oh comme Il est bon","Oh oui, Il est bon,","Il est bon pour moi."]],[0,["Lui qui ne ment pas,","Lui qui ne dort pas.","Ce qu’il dit,","S’accomplit toujours"]],[0,["Le Dieu d’Abraham,","Le Dieu de Jacob","Ce qu’il dit,","Il le fait toujours."]]]},{"n":29,"t":"Je vis d’une vie qui ne peut mourir","s":[[0,["Je vis d’une vie qui ne peut mourir","Car Jésus, la Vie Éternelle,","Habite dans mon cœur et le fait refleurir","En une éclosion immortelle."]],[1,["Mon cœur est heureux","Sous le regard de Dieu","En moi, le désert refleurit.","Mon cœur est heureux","Sous le regard de Dieu","Mon être entier s’épanouit"]],[0,["Pour l’homme sans Dieu, tout n’est que vanité","Mais Christ est le sens de ma vie.","La Vie Éternelle palpite en mon cœur","Et Dieu la remplit d’harmonie."]]]},{"n":30,"t":"Voyez comment toutes les prophéties","s":[[0,["Voyez comment toutes les prophéties","S’accomplissent sous nos yeux,","Annonçant la venue du Seigneur","Et bientôt s’ouvriront les cieux."]],[1,["Combien de temps pensez-vous","Nous reste encore tries frères ?","Il est plus tard que vous ne le pensez,","Oui le Seigneur revient bientôt"]],[0,["Les signes se voient dans les cieux","Sur la terre et partout","Proclamant qu’il n’y a plus de temps","Repentez-vous ou vous mourez."]],[0,["La fin de toute chose est proche,","Soyez alors sage et sobre ;","Prenez toutes les armes de Dieu,","Vivez la vie des bons chrétiens."]],[0,["Des Balaams, des Korés et Dathans","S’élèvent en ces temps ;","Reniant que le message est vrai,","Faites attention à la séduction !"]],[0,["Bientôt dans le ciel enlevés,","Nous irons à la Maison","De Celui qui nous a sauvés.","Avec Lui, nous régnerons."]]]},{"n":31,"t":"Chrétien, saches que tu n’es qu’un pèlerin ici-bas.","s":[[0,["Chrétien, saches que tu n’es qu’un pèlerin ici-bas.","Suis droit le chemin que ton Seigneur t’a tracé.","Bientôt, tu arriveras dans la Cité promise,","C’est là que tu te reposeras de tes œuvres."]],[1,["Pèlerin sur terre, voyageur ici-bas,","Le pèlerinage va sûrement à sa fin ;","Tes pleurs et tes larmes seront essuyés.","Ce sera la consolation éternelle."]],[0,["Oh, que ton espérance soit toujours vivante","Que ta lampe demeure toujours allumée ;","Ne prête pas l’oreille à ce que te dira Satan","Garde ton regard bien fixé sur ton Sauveur."]]]},{"n":32,"t":"Quand Dieu te fait passer","s":[[0,["Quand Dieu te fait passer","Au feu pour t’éprouver,","Ce n’est que pour te purifier."]],[0,["Ne t’étonne donc pas","Devant ce chemin-là.","L’obéissance s’apprend ainsi."]],[1,["Lève les yeux vers Lui, car Il t’a précédé.","Par la souffrance, Il fut accompli.","Au feu, Il est passé, glorieux fut Son sort.","Car Il obéit jusqu’à la mort"]],[0,["Reçois ce châtiment, Sois en reconnaissant,","De l’amour de Dieu, c’est le garant. Ne perds","donc pas courage,","Car le Sauveur partage","Avec toi ta peine et ta douleur."]],[0,["Fortifie en marchant","Tes genoux fléchissant,","Que tes pas soient fermes sur la voie !","Que la joie de l’espoir, Toujours te fasse voir","La couronne, le prix des vainqueurs."]],[0,["En passant par le feu,","On devient riche en Dieu,","On peut goûter la gloire des cieux. Bienheureux","est celui","Que le feu purifie","Car le royaume, il héritera."]]]},{"n":33,"t":"Bientôt Jésus va nous prendre","s":[[0,["Bientôt Jésus va nous prendre","Auprès de Lui dans le Ciel.","Il nous a dit de L’attendre","Jusqu'au jour de Son appel."]],[1,["Nous avons la victoire","Nous vivrons avec Jésus dans le Ciel.","À Toi seul la gloire !","Oh! Viens bientôt, Emmanuel."]],[0,["Péchés, travaux et souffrances","Cesseront et pour toujours,","Devant Sa sainte présence,","Nous chanterons Son amour."]],[0,["Combattons avec courage,","Attendant ce jour heureux","Et chantons malgré l’orage,","Nous sommes victorieux."]]]},{"n":34,"t":"Cet Inconnu venu de Galilée","s":[[0,["Cet Inconnu venu de Galilée","Qu’entourait hier la foule rassemblée","S’est prétendu le Fils du Dieu vivant","Qu’Il meurt en croix, la croix Son châtiment","A mort Galiléen!"]],[1,["Humble galiléen,","Que pour T’aimer Je vive.","Qu’humblement Je Te suive,","Chaque pas dans le Tien."]],[0,["Lui, le seul bon parmi les fils des hommes,","Compatissant aux faibles que nous sommes,","Né pour servir et non pour être servi.","S’est-il trouvé des gens qui L’ont suivi,","Ce bon Galiléen ?"]],[0,["Les orgueilleux, les princes et les sages","L’ont méprisé, L’ont accablé d’outrages.","Mais plus grand qu’eux dans Son humilité","Il révélait ce qu’est Sa charité,","Le doux Galiléen!"]],[0,["Nous, suivons-Le, marchons à Sa lumière","Dans nos chemins de franges de poussière","Où qu’il passât et comme nous tenté.","Saint, juste et pur toujours, Il est resté","Divin Galiléen!"]]]},{"n":35,"t":"Il est un ami suprême.","s":[[0,["Il est un ami suprême.","C’est Jésus Christ.","D’un saint amour, Il nous aime,","C’est Jésus-Christ.","Toi qui souffres solitaire,","Toi dont le cœur est meurtri."]],[1,["Viens à Lui,","Viens, ô mon frère, à Jésus-Christ"]],[0,["Il est le Sauveur fidèle","C’est Jésus-Christ.","Sa voix doucement t’appelle","C’est Jésus-Christ.","Il vida la coupe amère","Pour nous sur le bois maudit."]],[0,["Il est le Prince de Vie!","C’est Jésus-Christ.","Dont l’Esprit nous vivifie,","C’est Jésus-Christ."]],[0,["Celui que Sa main libère","Est de tout joug affranchi"]],[0,["Il est un Maître adorable","C’est Jésus-Christ","Dont le service est aimable","C’est Jésus-Christ","À Lui notre vie entière","Notre corps et notre esprit,"]],[1,["Soit à Lui,","Soit, ô mon frère, à Jésus-Christ."]]]},{"n":36,"t":"Nous Te louons Père,","s":[[0,["Nous Te louons Père,","Pour Ton précieux amour,","Pour Jésus qui mourut, et","Qui vit pour toujours."]],[1,["Alléluia ! À Toi la gloire.","Alléluia ! Amen.","Alléluia ! À Toi la gloire.","Réveille-nous encore."]],[0,["Louons le Seigneur","Pour l’Esprit de lumière","Qui montre le chemin qui","Nous conduit au Père."]],[0,["Donnons toute la gloire","A l’Agneau sacrifié","Qui lava nos souillures et","Porta nos péchés."]],[0,["Donnons toute la gloire","Au Dieu de toutes grâces","Qui conduit nos chemins et","Nous montre Sa face."]],[0,["Réveille-nous encore","Et remplis notre cœur.","Que toute notre âme reste","Enflammée, Seigneur !"]]]},{"n":37,"t":"O jour heureux, jour de bonheur,","s":[[0,["O jour heureux, jour de bonheur,","Lumière, paix, joie ineffable,","Au Fils de Dieu, saint, adorable,","À Jésus, j’ai donné mon cœur."]],[1,["Quel beau jour! Quel beau jour!","Où d’un Sauveur, j’ai su l’amour.","Oui, dans ma nouvelle Patrie,","Jésus m’attend et pour moi prie.","Quel beau jour ! Quel beau jour!","Où d’un Sauveur, j’ai su l’amour."]],[0,["Oh! Comprenez mon heureux sort,","C’est en Jésus que Dieu pardonne.","La vie éternelle, Il la donne,","Pourquoi donc te craindrais-je, ô mort ?"]],[0,["Au Ciel, des chants ont retenti,","Alléluia! Disent les anges.","Entonnons des saintes louanges","Car un pécheur s’est repenti,"]],[0,["C’en est fait, tout est accompli,","Le Fils de Dieu m’appelle « frère ».","Son Sang coula sur le calvaire.","Il est à moi, je suis à Lui."]]]},{"n":38,"t":"Avec Lui, le désert refleurit","s":[[0,["Avec Lui, le désert refleurit","Et c’est Lui qui nous comble de biens.","Avec Lui, le désert refleurit,","C’est à Lui que j’appartiens."]],[1,["Et le lieu le plus aride","Revêt Sa pure parure.","Avec Lui, le désert refleurit","C’est à Lui que j’appartiens"]],[0,["Seul, Il est porteur de tout espoir.","Par Son amour, tout est possible.","Quand dans mon cœur,","Il n’y a plus d’espoir, Il dirige, Il arrose."]],[0,["A jamais, Jésus me tient la main.","Dans la nuit pleine, je ne crains rien.","Quand le monde fait sécher ma joie,","Tout mon cœur, Il arrose."]]]},{"n":39,"t":"Quand Je verrai le sang, (ter)","s":[[1,["Quand Je verrai le sang, (ter)","Je passerai par-dessus-vous"]],[0,["Le Rédempteur est mort sur la croix","Pour le pécheur, Il paya son dû.","Aspergez votre âme avec le Sang,","Et Je passerai par-dessus vous."]],[0,["Pauvre pécheur, Jésus sauvera.","Il fera tout ce qu’il a promis.","Lavez-vous dans la fontaine ouverte,","Et Je passerai par-dessus vous."]],[0,["Le jugement vient et tous y seront,","Chacun recevra juste son dû.","Cachez-vous dans le Sang qui blanchit,","Et Je passerai par-dessus vous."]],[0,["Grande compassion, Amour divin.","Amour bienveillant, fidèle et sincère.","Trouvez paix et abri sous le Sang,","Et Je passerai par-dessus vous."]]]},{"n":40,"t":"Jésus, Jésus, Jésus, Jésus,","s":[[0,["Jésus, Jésus, Jésus, Jésus,","Seul Nom que mon cœur aime,","Je voudrais ne prononcer plus","Qu’un seul mot, ce Nom même."]],[0,["Jésus, Jésus, ce Nom si beau,","C’est celui dont les anges,","Prosternés autour de l’Agneau","Remplissent leurs louanges."]],[0,["Jésus, c’est le Nom de Celui","Qui descendit du Père,","Dont l’amour sur la croix a lui,","En qui la terre espère."]],[0,["Jésus, Jésus, Jésus, Jésus,","Bientôt mon cœur qui T’aime,","Auprès de Toi ne diras plus","Qu’un seul mot, Ton nom même."]]]},{"n":41,"t":"Laissons voir notre joie,","s":[[0,["Laissons voir notre joie,","Nous qui aimons le Seigneur.","Joignons aux chants un doux accord (bis)","Et environnons le trône, (bis)"]],[1,["Nous marchons vers Sion","Merveilleuse, merveilleuse Sion,","Nous montons tout droit vers Sion","La merveilleuse Cité de Dieu."]],[0,["Qu'ils refusent de chanter,","Ceux qui ne connaissent pas notre Dieu","Mais les enfants du Roi Céleste, (bis)","Proclameront leur joie, (bis),","La colline de Sion","Nous produit des délices sacrés,","Avant de fouler les domaines célestes (bis)","Ou marcher sur les rues d’or (bis)"]],[0,["Puissent nos chants abonder,","Et chaque larme être séchée,","Nous marcherons sur le sol d’Emmanuel","Nous marcherons sur le sol d’Emmanuel","Vers les beaux pays d’En-Haut, (bis)"]]]},{"n":42,"t":"Unis en Christ et par Sa pure grâce,","s":[[0,["Unis en Christ et par Sa pure grâce,","Que de Son Sang, la puissance efficace","Nous garde tous unis devant Sa face","Toujours unis en Lui."]],[0,["Unis en Christ, notre céleste Maître,","Pour Le servir et mieux Le connaître,","Puisque par Lui, nous pouvons toujours l’être","Soyons unis en Lui."]],[0,["Unis en Christ, unis dans la prière,","Intercédant pour Son Eglise entière,","Et surmontant toutes les barrières,","Restons unis en Lui."]],[0,["Unis en Christ, unis dans Sa victoire,","Pour publier Son royaume et Sa gloire,","Pressons ainsi le monde à y croire,","Restons unis en Christ."]],[0,["Unis en Christ, attendant Sa venue,","Voici bientôt le jour où sur la nuée","Il descendra, S’offrant à notre vue,","Pour nous prendre avec Lui."]]]},{"n":43,"t":"O Seigneur Dieu, Tu es mon tout.","s":[[0,["O Seigneur Dieu, Tu es mon tout.","Vie de ma vie, Esprit de mon esprit,","Use de miséricorde envers moi","Et remplis-moi de Ton Esprit d’amour."]],[0,["Qu’il n’y ait point de place dans mon cœur","Pour quoique ce soit, mon Seigneur.","Je ne réclame pas Tes grâces seulement","Mais Toi-même, divin Roi"]],[0,["Tu pris cette poignée de poussière","Et me créa à Ton image.","Tu m’accordas de devenir Ton enfant,","Honneur, louange et gloire à Toi."]]]},{"n":44,"t":"Ma richesse, ma gloire","s":[[0,["Ma richesse, ma gloire","Et ma félicité,","Ô Jésus, c’est de croire","Que Tu m’as racheté!","Rempli de confiance","En Toi, divin Sauveur,","Je vis dans l’espérance","Et je marche sans peur."]],[0,["Rien n’ôte les souillures,","Rien ne guérit le cœur,","Sinon les meurtrissures","Et le Sang du Sauveur.","Oui, Jésus seul nous lave","De toute iniquité,","Et procure à l’esclave","L’heureuse liberté."]],[0,["Oh! Que toute la terre","Apporte à ce Sauveur","Ses péchés, sa misère!","Il fait grâce au pécheur.","Son amour insondable","Lui fît quitter le Ciel","Pour donner au coupable","Un salut éternel."]]]},{"n":45,"t":"Quand le vol de la tempête","s":[[0,["Quand le vol de la tempête","Vient assombrir ton ciel bleu,","Au lieu de baisser la tête,","Compte les bienfaits de Dieu."]],[1,["Compte les bienfaits de Dieu,","Mets-les tous devant tes yeux,","Tu verras, en adorant,","Combien le nombre en est grand."]],[0,["Quand sur la route glissante,","Tu chancelles sous ta croix,","Pense à cette main puissante","Qui t’a béni tant de fois."]],[0,["Si tu perds dans le voyage","Plus d’un cher et doux trésor, Pense au divin","héritage","Qui Là-Haut, te reste encore."]],[0,["Bénis donc, bénis sans cesse Ce Père qui chaque","jour Répand sur toi la richesse De Son","merveilleux Amour."]]]},{"n":46,"t":"Par tous les saints glorifié,","s":[[0,["Par tous les saints glorifié,","Jésus inspire leurs louanges,","Plus belles que le chant des anges,","Gloire à l’Agneau, (bis)","Gloire à l’Agneau sacrifié!"]],[0,["C’est par Lui qu’est justifié","Tout pécheur qui demande grâce.","Prêtres et rois devant Sa face,","Chantons l’Agneau, (bis)","Chantons l’Agneau sacrifié!"]],[0,["Par le Père magnifié,","Tout l’univers Lui rend hommage.","L’Agneau régnera d’âge en âge.","Gloire à l’Agneau, (bis)","Gloire à l’Agneau sacrifié!"]],[0,["Par Son Esprit vivifié,","Je veux jusqu’à ma dernière heure,","Chanter l’Amour qui seul demeure:","Gloire à l’Agneau, (bis)","Gloire à l’Agneau sacrifié!"]],[0,["Pour nous, Il fut crucifié;","Son Sang a racheté notre âme;","C’est pourquoi notre amour L’acclame:","Gloire à l’Agneau, (bis)","Gloire à l’Agneau sacrifié!"]]]},{"n":47,"t":"A Dieu soit la gloire","s":[[0,["A Dieu soit la gloire","Par Son grand Amour,","Dans mon âme noire","S’est levé le jour","Jésus à ma place,","Mourut sur la croix,","Il m’offre Sa grâce","Et je la reçois!"]],[1,["Gloire à Dieu! (bis)","Terre, écoute Sa voix","Gloire à Dieu! (bis)","Monde, réjouis-toi!","Oh! Venez au Père,","Jésus est vainqueur","Que toute la terre","Chante en Son honneur!"]],[0,["De Jésus, la joie","Remplit notre cœur ;","Qu’importe qu’on voie","Tout notre bonheur.","Selon Sa promesse","Jésus changera","Deuil en allégresse","Quand Il reviendra."]]]},{"n":48,"t":"Que ne puis-je, ô mon Dieu,","s":[[0,["Que ne puis-je, ô mon Dieu,","Dieu de ma délivrance,","Remplir de Ta louange","Et la terre et les cieux,","Les prendre pour témoins","De ma reconnaissance","Et dire au monde entier","Combien je suis heureux."]],[0,["Heureux quand je Te parle,","Et que de ma poussière,","Je fais monter vers Toi","Mon hommage ou mon vœu,","Avec la liberté","D’un fils devant son Père,","Et le saint tremblement","D’un pécheur racheté."]],[0,["Heureux, lorsqu’assailli","Par l’ange de la chute,","Prenant la Croix pour arme","Et l’Agneau pour Sauveur,","Je triomphe à genoux,","Et sors de cette lutte,","Vainqueur, mais tout meurtri;","Tout meurtri mais vainqueur!"]],[0,["Heureux, toujours heureux!","J’ai le Dieu fort pour Père,","Pour frère, Jésus-Christ,","Pour conseil, Son Esprit.","Que peut ôter l’enfer,","Que peut donner la terre","À qui jouit du ciel","Et du Dieu trois fois saint?"]]]},{"n":49,"t":"Christ est ressuscité!","s":[[0,["Christ est ressuscité!","C’est le cri de victoire","Qui de la terre aux cieux","Franchit l’immensité.","Il couronne à jamais","Son œuvre expiatoire;","Oui, Tout est accompli!","Christ est ressuscité!"]],[0,["Supporte sans frémir","Le regard de ton Juge","En t’appuyant sur Christ,","O pécheur racheté!","Entre Ses bras vainqueurs,","Viens chercher un refuge;","Il a payé ta dette:","Il est ressuscité!"]],[0,["Ce sépulcre vaincu","Proclame avec puissance","Sa justice parfaite","Et Sa divinité;","À genoux adorons","Son éternelle essence;","Christ est le Fils unique:","Il est ressuscité!"]],[0,["Comme Lui, du tombeau","Brisant la froide pierre,","Nous nous réveillerons","Pour l’immortalité,","Et nous irons jouir,","Dans la Maison du Père,","D’un bonheur éternel:","Christ est ressuscité!"]],[0,["Qu’au Rédempteur vivant","Notre âme soit unie;","Aimant de Son amour.","Saints de Sa sainteté,","Commençons sur la terre","Une nouvelle vie,","En attendant les Cieux:","Christ est ressuscité!"]]]},{"n":50,"t":"Le grand jour s’est levé","s":[[0,["Le grand jour s’est levé","Dieu nous a visités","Voici des temps nouveaux","Chantons gloire à l’Agneau.","Nous recevons de Christ","Ce qu’il avait promis :","Le Saint Esprit est là"]],[1,["Le Saint Esprit est là (bis)","La mort a disparu","Dieu donne un plein salut","Et sur le monde entier","Le grand jour s’est levé","Le Saint Esprit est là"]],[0,["L’obscurité s’enfuit","La lumière a jailli","Chassé des cœurs troublés","Toute incrédulité","Car Christ le Roi des rois","Répand l’Esprit de foi","Le Saint Esprit est là"]],[0,["Le grand consolateur","Vient remplir tous les cœurs","L’Esprit de vérité","Nous met en liberté","Il ouvre les prisons","Répand la guérison","Le Saint Esprit est là"]],[0,["Que tous les rachetés","Chantent leur liberté","Christ a tout accompli","Il a donné l’Esprit","Voyez trembler l’enfer","Car dans tout l’univers","Le Saint Esprit est là"]]]},{"n":51,"t":"Seigneur, que n’ai-je mille voix","s":[[0,["Seigneur, que n’ai-je mille voix","Pour chanter Tes louanges (bis)","Et faire monter jusqu’aux anges","Les gloires de Ta croix! (ter)"]],[0,["Jésus, mon Seigneur et mon Dieu,","Que Ton souffle m’anime (bis)","Pour que par moi, Ton Nom sublime","Retentisse en tout lieu! (ter)"]],[0,["Doux Nom qui fait tarir nos pleurs,","Ineffable harmonie, (bis)","Tu répands la joie et la vie","Et la paix dans nos cœurs! (ter)"]],[0,["Désormais, je n’ai plus d’effroi,","Aucun mal ne m’accable; (bis)","Ton Sang rend pur le plus coupable;","Ton Sang coula pour moi! (ter)"]]]},{"n":52,"t":"Toi qui disposes de toutes choses","s":[[0,["Toi qui disposes de toutes choses","Et nous les donnes chaque jour,","Reçois, ô Père! Notre prière","De reconnaissance et d’amour."]],[0,["Le don suprême que Ta main sème,","C’est notre pardon, c’est Ta paix;","Et Ta clémence, Trésor immense,","Est le plus grand de Tes bienfaits."]],[0,["Que, par Ta grâce, l’instant qui passe","Serve à nous rapprocher de Toi!","Et qu’à chaque heure, vers Ta demeure","Nos cœurs s’élèvent par la foi!"]]]},{"n":53,"t":"Vers Toi monte notre hommage,","s":[[0,["Vers Toi monte notre hommage,","Fils de Dieu, puissant Sauveur,","Qui demeures d’âge en âge","Le refuge du pécheur."]],[1,["Loué soit Ton amour,","Loués soient à jamais","Ton nom, Jésus,","Ta gloire et Tes bienfaits"]],[0,["De Toi, vient la délivrance:","Tu payas notre rançon.","C’est en Toi qu’est l’espérance,","La paix et la guérison."]],[0,["Oh! Qu’heureux sous Ta bannière","Est le peuple racheté","Qui marche dans la lumière","Vers la céleste Cité."]],[0,["Par Ta divine Parole","Tu l’enseignes, Tu l’instruis,","Et, par l’Esprit qui console,","Sûrement, Tu le conduis."]],[0,["Bientôt, glorieuse attente!","Tu combleras tous nos vœux:","Sur la nue étincelante,","Tu viendras à nous des Cieux."]]]},{"n":54,"t":"Que Ton fidèle Amour est une grande chose,","s":[[0,["Que Ton fidèle Amour est une grande chose,","O Dieu, mon Rédempteur, mon rocher, mon gardien!","Oh! Quel puissant soutien, (bis)","Que ce bras de Ta grâce où mon cœur se repose!"]],[0,["Oui, je marche avec Toi dans mon pèlerinage.","Autrefois j’étais seul, sans guide et sans Sauveur,","Mais aujourd’hui, Seigneur, (bis)","Je poursuis avec Toi mon terrestre voyage."]],[0,["Bien-aimé Fils de Dieu! Mon cœur, plein d’allégresse,","Dans la paix de la foi, se tient sous Ton regard.","Oh! Quelle riche part (bis)","Mon âme, chaque jour, possède en Ta tendresse!"]],[0,["Ainsi moi, Ton enfant, Seigneur, devant Ta face","Je marche vers la gloire et la félicité!","El pour l’éternité, (bis)","Ton amour près de Toi me réserve une place."]]]},{"n":55,"t":"Femmes, soyez de même soumises","s":[[0,["Femmes, soyez de même soumises","A vos maris selon le Seigneur.","Imitez Sara!","Sara obéissait à Abraham","Et l’appelait seigneur!","C’est d’elle que vous êtes les filles."]],[0,["Faites tout ce qui est bien !","Pour servir d’exemples","A vos futures progénitures,","Soyez chastes et réservées!","Revêtez-vous de hautes vertus","Qui sont d’un grand prix devant Dieu."]],[0,["Vous, maris, montrez-vous sages","Dans vos rapports envers vos femmes","Et honorez-les par pur amour !","Animez-vous,","Animez-vous de joies sacrées, des pensées,","Des sentiments fraternels !"]]]},{"n":56,"t":"J’ai résolu de ne plus chercher","s":[[0,["J’ai résolu de ne plus chercher","Les vanités de ce monde.","Car vivre avec Jésus me procure","Une joie plus grande et profonde."]],[1,["Je décide de donner ma vie","A Jésus-Christ.","Conduis-moi désormais","Dans cette nouvelle vie."]],[0,["J’ai résolu de ne plus attendre","Pour fuir à Golgotha","Où m’est offerte la Vie éternelle","Par le Sang qui y coula."]],[0,["Comme moi aussi, tu peux décider","Avant qu’il ne soit trop tard.","Laisse le monde, donne-toi au Sauveur,","Prends un nouveau départ."]]]},{"n":57,"t":"J’ai trouvé Sa grâce si complète,","s":[[0,["J’ai trouvé Sa grâce si complète,","Mes besoins sont assurés.","Aux pieds de mon Jésus, c’est la fête,","Je suis vraiment libéré!"]],[1,["C’est une joie incomparable","Et pleine de gloire","Pleine de gloire, pleine de gloire;","C’est une joie incomparable,","Pleine de gloire.","Jamais la moitié n’en fut contée."]],[0,["J’ai trouvé la joie inexprimable,","La joie et la paix durable.","Je suis du péché bien délivré","Et de l’abîme sauvé."]],[0,["J’ai trouvé l’espoir si lumineux:","Vivre au Royaume des deux!","Jésus, près de moi, me rend heureux:","Voir Sa face, contempler Dieu!"]]]},{"n":58,"t":"Je me réjouis nuit et jour,","s":[[0,["Je me réjouis nuit et jour,","Comme je marche en pèlerin,","Car dans toute ma vie","Je vois la main de Dieu.","Et la raison de ma joie,","Le secret de tout cela :","Le Consolateur est avec moi."]],[1,["Il demeure, Il demeure, Alléluia !","Il demeure en moi.","Marchant sur l’étroit chemin","J’ai la joie le jour, la nuit","Le Consolateur demeure en moi."]],[0,["Je vivais dans le péché,","N’ayant point de paix en moi","Jusqu’au jour où j’ouïs","Comment Jésus mourut.","Puis je tombais à Ses Pieds,","Et une douce paix me remplit :","Le Consolateur est avec moi !"]],[0,["Il est avec moi partout","Et connaît tous mes soucis.","Je suis heureux et libre","Comme un oiseau.","Le Saint-Esprit me contrôle,","Jésus satisfait mon âme :","Le Consolateur est avec moi !"]],[0,["Plus de désir pour le monde,","Ses plaisirs ont pris des ailes ;","Il y a longtemps je les ai abandonnés :","Toute ma nuit changée en jour,","Et mes fardeaux enlevés ;","Le Consolateur est avec moi !"]]]},{"n":59,"t":"Nuit et jour je suis heureux","s":[[0,["Nuit et jour je suis heureux","En marchant avec mon Dieu,","Car Sa bonne Main dirige tous mes pas.","Il a transformé mon cœur,","M’a donné le vrai bonheur","Car le Saint-Esprit demeure en moi."]],[1,["Il demeure, Il demeure, Alléluia !","Il demeure en moi.","Marchant sur l’étroit chemin,","J’ai la joie soir et matin","Car le Saint-Esprit demeure en moi."]],[0,["Je marche selon l’Esprit","Et ce n’est plus moi qui vis","Mais c’est Christ qui,","Par Son Esprit, vit en moi.","Je suis fils du Dieu vivant","Je m’avance triomphant,","Car le Saint-Esprit demeure en moi."]],[0,["Luttant contre l’ennemi","Par les dons du Saint-Esprit","Mon seul but est de servir le Roi des rois.","Je puis travailler pour Lui","Et porter beaucoup de fruits,","Car le Saint-Esprit demeure en moi."]],[0,["Je ne sais comment prier,","Mais l’Esprit vient m’inspirer","Par Son soupir ineffable à travers moi.","Je prie avec les élus :","« Viens bientôt, Seigneur Jésus »","Car le Saint-Esprit demeure en moi."]]]},{"n":60,"t":"O enfant de Dieu, chante alléluia!","s":[[0,["O enfant de Dieu, chante alléluia!","A Jésus Christ, le Fils de Dieu.","Il est le Roi des rois,","Le Seigneur des seigneurs","Chantons « Alléluia! » au Messie."]],[0,["O saint de Dieu, lève-toi, éclaire","La lumière et viens à travers Jésus.","Il est le Prince de Paix","Le Seigneur merveilleux","Chantons : Alléluia! Au Messie."]]]},{"n":61,"t":"Oh! Quel bonheur de Le connaître,","s":[[0,["Oh! Quel bonheur de Le connaître,","L’Ami qui ne saurait changer.","De l'avoir ici-bas pour Maître","Pour défenseur et pour Berger!"]],[1,["Chantons, chantons d’un cœur joyeux","Le grand Amour du Rédempteur,","Qui vint à nous du haut des deux,","Et nous sauva du destructeur!"]],[0,["Dans la misère et l’ignorance,","Nous nous débattions sans espoir,","La mort an cœur, l’âme en souffrance,","Quand à nos yeux, Il Se fît voir."]],[0,["Il nous apporta la lumière,","La victoire et la liberté;","L’ennemi mordit la poussière,","Pour toujours, Satan fut dompté."]],[0,["Vers l’avenir, marchons sans crainte","Et sans souci du lendemain,","Pas à pas, nos pieds dans l’empreinte","De Ses pieds sur notre chemin."]]]},{"n":62,"t":"À l’Agneau sur Son trône,","s":[[0,["À l’Agneau sur Son trône,","Apportons la couronne!","Il l'a conquise sur la Croix;","Il est le Roi des rois!","Éveille-toi, mon âme!","Bénis, adore, acclame,","Avec tous les anges du ciel,","Jésus, Emmanuel!"]],[0,["À l’Agneau sur Son trône,","L’encens et la couronne!","Car Il est le Verbe incarné,","D’une vierge, Il est né.","O sagesse profonde!","Le Créateur du monde,","Pour vaincre le mal triomphant,","S’est fait petit enfant !"]],[0,["Il eut la croix pour trône,","L’épine pour couronne!","Mais le Père a glorifié Son Fils crucifié.","Au Prince de la Vie","La mort est asservie;","Hors de la tombe, Il est monté;","Christ est ressuscité!"]],[0,["À l’Agneau sur Son trône,","La palme et la couronne!","Car Il est le Prince de paix,","Il règne désormais!","Les fureurs de la guerre","S’éteindront sur la terre,","Où renaîtront, comme jadis,","Les fleurs du Paradis!"]],[0,["À l’Agneau tous les trônes,","Et toutes les couronnes!","Il est le Maître souverain,","Les temps sont en Sa main.","Rendons l’honneur suprême","A ce Dieu qui nous aime,","Et qui revient, victorieux,","Pour nous ouvrir les cieux!"]]]},{"n":63,"t":"A la porte d’un cœur, Jésus frappe ce soir,","s":[[0,["A la porte d’un cœur, Jésus frappe ce soir,","Il est déjà si tard, au dehors, tout est noir.","Si tendre et si pressant est l’appel de Sa voix:","Serait-ce la dernière fois?"]],[0,["Serait-ce la dernière fois ? (bis)","Il t’appelle mon frère, ô répond à Sa voix","Serait-ce la dernière fois ?"]],[0,["Il a toujours frappé, toujours ce fut en vain","Et ta réponse était: ‘Qu’Il attende à demain!’","Mais Il insiste encore, suppliant ‘reçois-Moi’","Serait-ce la dernière fois ?"]],[0,["Il est des seuils hélas, où Jésus ne va plus,","Des cœurs tout à jamais fermés, glacés, perdus","Pour n’avoir pas ouvert à l’appel de Sa voix","Quand c’était la dernière fois!"]]]},{"n":64,"t":"Dans les deux et sur la terre,","s":[[0,["Dans les deux et sur la terre,","Il n’est aucun nom plus doux,","Aucun que mon cœur préfère","Au nom de Christ mort pour nous."]],[1,["Quel beau Nom, quel beau Nom","Porte l’Oint de l’Éternel!","Quel beau Nom, quel beau Nom,","Que celui d’Emmanuel!"]],[0,["Quelque grand que soit un homme,","Qu’il soit prince ou qu’il soit roi,","De quelque nom qu’on le nomme,","Jésus est plus grand pour moi."]],[0,["Les séraphins, les archanges","Portent des noms glorieux,","Mais le plus beau nom des anges","Pourrait-il me rendre heureux?"]],[0,["Dans les maux, Jésus soulage,","Il guérit l’esprit froissé,","Il ranime le courage","Du cœur le plus oppressé."]]]},{"n":65,"t":"En Christ seul est mon espérance;","s":[[0,["En Christ seul est mon espérance;","Sa justice est mon assurance.","Il est devant Dieu mon appui;","Je n’en veux point d’autre que Lui."]],[1,["Jésus est ma retraite sûre,","Le Rocher en qui je m’assure."]],[0,["Tout autre asile est périssable;","Tout autre appui n’est que du sable.","Qui n’a posé ce fondement","Travaille et souffre vainement."]],[0,["Lorsque sur moi s’abat l’orage,","Sa croix ranime mon courage.","Quand tout faiblit autour de moi,","Sa présence soutient ma foi."]],[0,["Et quand la dernière tempête","Fondra, terrible, sur ma tête,","Comme Lui, vainqueur de la mort,","J’entrerai radieux au port."]]]},{"n":66,"t":"Pareil à l’ombre,","s":[[0,["Pareil à l’ombre,","Ainsi pour toi est Dieu.","À ta main droite, l’ombre","La protection des deux."]],[1,["Il est ton ombre,","Ton ombre à ta main droite,","Il est ton ombre,","Ton ombre à ta main droite,"]],[0,["Jamais faiblir,","Être toujours plus fort.","De jour en jour grandir,","Victorieux de la mort."]]]},{"n":67,"t":"Jésus, au Nom saint et doux,","s":[[0,["Jésus, au Nom saint et doux,","Qui voulus porter pour nous","Le poids du divin courroux,","Nos âmes T’implorent."]],[0,["Par Ta divine bonté,","Par Ta sainte humilité,","Par Ta tendre charité,","Nos âmes T’implorent."]],[0,["Par le jour où Tu fléchis,","Sous l’opprobre et le mépris,","Par la mort que Tu souffris,","Nos âmes T’implorent."]],[0,["Par l’heure où Gethsémané","T’a vu gémir prosterné,","Et des tiens abandonné,","Nos âmes T’implorent."]],[0,["Par la coupe de douleur.","Que Tu bus pour nous, Seigneur,","Par Ta sanglante sueur,","Nos âmes T’implorent."]],[0,["Par Ton corps qui fut percé,","Et sur la croix exposé,","Par Ton sang pour nous versé,","Nos âmes T’implorent."]],[0,["Par l’amour qui fît de Toi","Notre Maître et notre Roi,","En nous rangeant sous Ta loi,","Nos âmes T’implorent."]]]},{"n":68,"t":"Jésus-Christ est ma sagesse,","s":[[0,["Jésus-Christ est ma sagesse,","Il éclaire mon chemin,","Et je marche, en ma faiblesse,","Conduit par Sa sûre main."]],[1,["Il éclaire mon chemin, (bis)","Et je marche, en ma faiblesse,","Conduit par Sa sûre main."]],[0,["Jésus-Christ est ma justice;","Son sang a coulé pour moi;","Je trouve en Son sacrifice","Paix et pardon par la foi."]],[1,["Son sang a coulé pour moi; (bis)","Je trouve en Son sacrifice","Paix et pardon par la foi."]],[0,["Jésus-Christ me sanctifie;","Au divin Cep attaché,","Je reçois de Lui la vie","Qui m’affranchit du péché."]],[1,["A Toi, Jésus, attaché, (bis)","Je reçois de Toi la vie","Qui m’affranchit du péché."]],[0,["Jésus, en payant ma dette,","A grand prix m’a racheté,","Près de Lui, ma place est prête","Au Ciel, pour l’éternité."]],[1,["Jésus, Tu m’as racheté (bis)","Et déjà ma place est prête","Au ciel, pour l’éternité."]]]},{"n":69,"t":"Jésus est notre Ami suprême:","s":[[0,["Jésus est notre Ami suprême:","Oh! Quel amour!","Mieux qu’un tendre frère, Il nous aime;","Oh! Quel amour!","Ici parents, amis, tout passe;","Le bonheur paraît et s’efface;","Son cœur seul jamais ne se lasse...","Oh! Quel amour!"]],[0,["Il est notre vie éternelle;","Oh! Quel amour!","Célébrons Son œuvre immortelle;","Oh! Quel amour!","Par Son sang, notre âme est lavée;","Au désert, Il Pavait trouvée;","Dans Son bercail, Il l’a sauvée;","Oh! Quel amour!"]],[0,["Seigneur Jésus!","Fais-nous comprendre","Tout Ton amour!","Dans nos cœurs, oh! Daigne répandre","Tout Ton amour!","Que cet amour soit notre vie!","Qu’à jamais notre âme ravie","Savoure une joie infinie","En Ton amour!"]]]},{"n":70,"t":"Jésus, ô Nom qui surpasse","s":[[0,["Jésus, ô Nom qui surpasse","Tout nom qu’on puisse exalter!","Que jamais je ne me lasse,","Nom béni, de Te chanter!","Seule clarté qui rayonne","Sur les gloires du saint lieu,","Seul nom dont l’écho résonne","Dans le cœur même de Dieu!"]],[0,["Jésus, c’est l’Amour suprême","De Son trône descendu,","Qui ceint de Son diadème","Le front de l’homme perdu.","C’est le Roi qui S’humilie.","Pour vaincre le révolté;","C’est la divine folie,","Dans la divine bonté."]],[0,["Qui pleura sur ceux qui pleurent?","C’est Lui, l’homme méprisé!","Qui mourut pour ceux qui meurent?","C’est Lui, l’homme au cœur brisé!","De Son sang et de Ses larmes","Il arrosa Son chemin,","Et c’est par ces seules armes","Qu’il sauva le genre humain."]],[0,["Jésus, par qui Dieu pardonne,","Roi, d’épines couronné,","Que le monde T’abandonne,","A Toi, mon cœur s’est donné!","Ta mort est ma délivrance,","Je suis heureux sous Ta loi;","O Jésus, mon espérance,","Quel autre aurais-je que Toi?"]],[0,["Oh! Penche-Toi sur ma couche","Lorsque je devrai mourir,","Et, Ton doux nom sur la bouche,","Je verrai le ciel s’ouvrir...","Mais le ciel que je réclame,","C’est Ton regard, c’est Ta voix,","Qui s’abaissent sur mon âme,","Assise au pied de Ta croix!"]],[0,["Attire, ô Sauveur, attire","Sur Ton sein et dans Tes bras","Le cœur qui tremble et soupire","Parce qu’il ne Te voit pas.","Mon frère, Il t’appelle, écoute:","Il t’appelle, ne crains plus;","Suis Ses pas, et sur la route","Chante ce beau nom: Jésus!"]]]},{"n":71,"t":"La Croix reste debout,","s":[[0,["La Croix reste debout,","Alléluia! Alléluia!","Elle domine tout,","Alléluia! Alléluia!","C’est en vain que la haine","Contre Elle se déchaîne:","Lumineuse et sereine,","La Croix reste debout!"]],[1,["Alléluia! Alléluia!","Au plus fort des combats,","Alléluia! Alléluia!","La Croix ne recule pas !"]],[0,["Sur Elle, en Golgotha,","Alléluia! Alléluia!","Le Fils de Dieu monta.","Alléluia! Alléluia!","Amour incomparable!","Ce Sauveur adorable,","Pour l’homme misérable,","Mourut en Golgotha."]],[0,["Soldats du Roi des rois,","Alléluia! Alléluia!","Portons partout Sa croix!","Alléluia! Alléluia!","Car tous ceux qu’il délivre","Sous la croix, doivent vivre,","Sur la croix, doivent suivre","Jésus le Roi des rois."]]]},{"n":72,"t":"C’est dans l’Évangile qu’on trouve la vie,","s":[[0,["C’est dans l’Évangile qu’on trouve la vie,","La paix, le pardon, le bonheur.","Ouvrons notre cœur à la grâce infinie","Qui fait tant de biens aux pécheurs."]],[1,["Auprès du Seigneur-, avec Lui sur la route,","Marchons de tout cœur en chantant.","Il sauve, Il guérit puis enlève le doute.","Il vit, Il est là maintenant."]],[0,["Il montre un endroit pour jeter la souillure","Voilà, c’est ici, Golgotha,","Un lieu de folie, un endroit de rupture.","Mais crois, le pardon est bien là."]],[0,["Suivons le chemin qui plus loin nous entraîne","Au centre de la Vérité,","Pendant que l’amour de Jésus nous entraîne","Au règne de l’Éternité,"]]]},{"n":73,"t":"Si ton sentier devient dur et pénible,","s":[[0,["Si ton sentier devient dur et pénible,","Rassure-toi, Jésus est là.","Souviens-toi qu’avec Lui, tout est possible.","Son amour te conduira.","Rassure-toi, Jésus est là.","Tous tes soucis, ne les connaît-Il pas ?","Par Sa puissance invincible,","Il t’en délivrera."]],[0,["Et si Satan, dans sa rage, t’assaille,","Rassure-toi, Jésus est là.","Dans le combat, si ta force défaille,","Son bras fort te soutiendra,","Rassure-toi, Jésus est là.","Tes ennemis, ne les connait-Il pas ?","Au plus fort de la bataille, Il en triomphera."]],[0,["Et si tu souffres, triste et solitaire,","Rassure-toi, Jésus est là.","Pour toi, n’a t-Il pas gravi le calvaire ?","Son Amour te suffira."]],[0,["Rassure-toi, Jésus est là.","Tous tes soupirs, ne les connaît-Il pas ?","Il t’aime, plus doux qu’un frère, Il te consolera."]]]},{"n":74,"t":"Le Maître est là q

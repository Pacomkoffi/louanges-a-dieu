ui t’appelle;","s":[[0,["Le Maître est là qui t’appelle;","Lève-toi donc, ô pécheur!","Réponds à Sa voix fidèle;","C’est ton Dieu, c’est ton Sauveur."]],[1,["Viens à Lui, viens à Lui,","Viens à Jésus aujourd’hui!"]],[0,["Ah! Pourquoi Le faire attendre?","Depuis trop longtemps déjà","Tu refuses de L’entendre;","Ne tarde plus: Il est là."]],[0,["Il est là, t’offrant Sa grâce,","Son pardon, Sa sainteté,","Sa paix qui, jamais ne passe,","Son Ciel, Sa félicité."]],[0,["Sa main, vers toi, s’est tendue,","Son cœur s’ouvre avec amour;","Hâte-toi, brebis perdue,","Viens sans délai, sans détour."]],[0,["Le Maître est là qui t’appelle;","Mais bientôt, Il passera.","Réponds à Sa voix fidèle,","Avant qu’il ne soit plus là."]]]},{"n":75,"t":"O merveilleux Seigneur Jésus,","s":[[0,["O merveilleux Seigneur Jésus,","Tous les archanges T’ont loué,","O merveilleux Seigneur Jésus,","Le ciel, la terre T’ont chanté.","O merveilleux Seigneur Jésus,","D’amour, mon cœur a débordé,","O merveilleux Seigneur Jésus,","Depuis que Tu T’es révélé!"]],[0,["O merveilleux Seigneur Jésus,","Tu as pansé toutes mes plaies,","O merveilleux Seigneur Jésus,","Tu as guéri mon cœur brisé.","O merveilleux Seigneur Jésus,","Tous mes péchés sont effacés.","O merveilleux Seigneur Jésus,","Je ne veux plus d’autre Berger."]],[0,["O merveilleux Seigneur Jésus,","Dieu Tout-Puissant et Conseiller.","O merveilleux Seigneur Jésus,","Père Éternel, Prince de paix.","O merveilleux Seigneur Jésus,","Un Fils nous a été donné.","O merveilleux Seigneur Jésus,","C'est par Lui que je suis sauvé."]]]},{"n":76,"t":"Nous ne sommes plus esclaves:","s":[[0,["Nous ne sommes plus esclaves:","Gloire à Jésus!","Il a brisé nos entraves; gloire à Jésus!","Saisissez la délivrance","Et venez tous, vous, perdus,","Chantez pleins de confiance:","\"Gloire à Jésus! \""]],[0,["Nul ne peut briser sa chaîne","Sans le Sauveur,","Sans la grâce souveraine du Rédempteur.","Seul, Il donne la victoire,","Il délivre le pécheur.","En Christ, il suffit de croire.","Gloire au Sauveur!"]],[0,["Pour tous est la délivrance :","Gloire à Jésus!","Il n’est point de différence : gloire à Jésus","Malgré toutes vos défaites,","Vous que le mal a vaincus,","Venez tous, tels que vous êtes!","Gloire à Jésus!"]]]},{"n":77,"t":"Jésus est au milieu de nous,","s":[[0,["Jésus est au milieu de nous,","Son regard s’abaisse sur nous,","Sa douce voix, l’entendez-vous?","Je veux vous bénir tous! (bis)","Sa douce voix, l’entendez-vous?","Je veux vous bénir tous!"]],[0,["Jésus est au milieu de nous,","Son regard s’abaisse sur nous,","Sa douce voix, l’entendez-vous?","Je veux vous sauver tous! (bis)","Sa douce voix, l’entendez-vous?","Je veux vous sauver tous!"]],[0,["Jésus est au milieu de nous,","Son regard s’abaisse sur nous,","Sa douce voix, l’entendez-vous?","Oh! Je vous aime tous! (bis)","Sa douce voix, l’entendez-vous?","Oh! Je vous aime tous!"]]]},{"n":78,"t":"Quel ami fidèle et tendre","s":[[0,["Quel ami fidèle et tendre","Nous avons en Jésus-Christ,","Toujours prêt à nous entendre,","À répondre à notre cri!","Il connaît nos défaillances,","Nos chutes de chaque jour.","Sévère en Ses exigences,","Il est riche en Son amour."]],[0,["Quel ami fidèle et tendre","Nous avons en Jésus-Christ,","Toujours prêt à nous comprendre","Quand nous sommes en souci!","Disons-Lui toutes nos craintes,","Ouvrons-Lui tout notre cœur.","Bientôt, Ses paroles saintes","Nous rendront le vrai bonheur."]],[0,["Quel ami fidèle et tendre","Nous avons en Jésus-Christ,","Toujours prêt à nous défendre","Quand nous presse l’ennemi!","Il nous suit dans la mêlée,","Nous entoure de Ses bras.","Et c’est Lui qui tient l’épée","Qui décide des combats."]],[0,["Quel ami fidèle et tendre","Nous avons en Jésus-Christ,","Toujours prêt à nous apprendre","A vaincre en comptant sur Lui!","S’il nous voit vrais et sincères","A chercher la sainteté,","Il écoute nos prières","Et nous met en liberté."]],[0,["Quel Ami fidèle et tendre","Nous avons en Jésus-Christ!","Bientôt Il viendra nous prendre","Pour être au ciel avec Lui.","Suivons donc l’étroite voie","En comptant sur Son secours.","Bientôt, nous aurons la joie","De vivre avec Lui toujours!"]]]},{"n":79,"t":"Tant qu’il vit, tant qu’il règne,","s":[[0,["Tant qu’il vit, tant qu’il règne,","Mon tout puissant Ami,","Il n’est rien que mon âme craigne;","Je me sens à l’abri."]],[0,["Berger fidèle et tendre,","Il conduit Ses agneaux","Dans les prés où viennent s’épandre","Les célestes ruisseaux."]],[0,["Qu’importe la nuit sombre,","Le lion qui rugit,","Je sais que mon Berger dans l’ombre","Me regarde et me suit."]],[0,["Si ma route est glissante","Et mon pas incertain,","Je m’appuie à Sa main puissante","Et poursuis mon chemin."]],[0,["À Toi seul je regarde,","Ô Berger des brebis!","Ton cœur m’aime et Ton œil me garde:","Voilà mon paradis."]]]},{"n":80,"t":"Qui me relève dans mes chutes?","s":[[0,["Qui me relève dans mes chutes?","C’est Jésus-Christ,","Qui combat pour moi dans mes luttes?","C’est Jésus-Christ.","Jésus a parlé, je veux croire","Que je puis lutter pour Sa gloire,","Car mon bouclier, ma victoire","C’est Jésus-Christ."]],[0,["Je vais à mon Père, et ma voie","C’est Jésus-Christ;","Je suis bienheureux et ma joie","C’est Jésus-Christ.","Et si, même dans la souffrance,","Mon cœur me parle d’espérance,","C’est que j’ai mis ma confiance","En Jésus-Christ."]],[0,["Sauvé, je ne me glorifie","Qu’en Jésus-Christ;","Pour la terre et le ciel, ma vie","C’est Jésus-Christ.","Bientôt adieu, choses mortelles!","Loin de vous, je prendrai des ailes","Vers les demeures éternelles,","Vers Jésus-Christ!"]]]},{"n":81,"t":"Qui nous roulera la pierre","s":[[1,["Qui nous roulera la pierre","A Ventrée du tombeau ?","Qui nous roulera la pierre","Pour être des hommes nouveaux"]],[0,["Christ est vivant, Christ près de Dieu,","Souffle intérieur qui nous visite,","Feu de l’Esprit qui nous habite,","Christ est vivant. Alléluia! Alléluia!"]],[0,["Christ est vivant, froment de Dieu,","Prêt à germer corps de souffrance,","Dans le soleil, cris d’espérance.","Christ est vivant. Alléluia! Alléluia!"]],[0,["Christ est vivant, terre de Dieu,","Nouvel espace au cœur de l’homme,","Nouvelle alliance où Dieu se donne,","Christ est vivant. Alléluia! Alléluia!"]]]},{"n":82,"t":"Sur le chemin, va sans peur,","s":[[0,["Sur le chemin, va sans peur,","Car Jésus est devant toi,","Jésus-Christ le Rédempteur,","Oh! Suis-Le, oh! Suis-Le par la foi."]],[0,["Et si tu tombes en chemin,","Regarde à Jésus ton Roi.","Il est dans le lieu Très Saint,","Et Il prie, et Il prie pour toi."]],[0,["Maintenant, saisis la main de ton Sauveur,","Car Lui seul peut donner l’éternel bonheur","Il a donné Sa vie sur la Croix:","Oh! suis-Le, oh! suis-Le par la foi."]]]},{"n":83,"t":"Sur ces époux, Père éternel,","s":[[0,["Sur ces époux, Père éternel,","Jette en cet instant solennel,","Un regard favorable.","Protège-les dans Ta bonté,","Fais briller sur eux la clarté","De Ta face adorable.","Qu’en Toi,","Grand Roi,","Leur prière","Trouve un Père","Doux et tendre,","Toujours prêt à les entendre!"]],[0,["Ils ont imploré Ton saint Nom:","Comble, Seigneur, leur union","De Ta faveur céleste.","Sur leur maison, verse Ta paix;","Que Ta grâce, en mille bienfaits","Sur eux se manifeste!","Amen!","Amen!","Sois leur guide,","Leur égide;","Sanctifie","Chacun des jours de leur vie."]]]},{"n":84,"t":"Dans ces jours de la fin des temps,","s":[[0,["Dans ces jours de la fin des temps,","L’espérance apporte la joie,","Car bientôt, et soudainement,","Jésus va revenir, Lui le Roi des rois."]],[1,["Il vient bientôt (bis)","Nous L’attendons, pleins d’assurance.","Dam la journée, ou dans la nuit,","Voici, Jésus revient !"]],[0,["Des signes apparaissent à nos yeux,","Dans l’air, sur terre et sur les nues,","Et cela, de la part de Dieu,","Annoncent de Jésus la proche venue."]],[0,["Les morts en Christ se lèveront,","Tous d’un nouveau corps revêtus,","Car lorsque les deux s’ouvriront,","Ils verront Jésus paraissant sur les nues."]],[0,["Les vivants restés sur la terre,","En un instant seront changés,","Et ensemble dans la lumière,","Près de Jésus nous serons tous consolés !"]]]},{"n":85,"t":"Revêtons notre amure","s":[[0,["Revêtons notre amure","Et partons en vainqueur !","Oui, la victoire est sure,","En haut, en haut les cœurs !","Celui qui nous appelle","Et nous dit : en avant !","Est le Sauveur fidèle,","Le Seigneur Tout Puissant."]],[0,["Revêtons notre armure","Et luttons en vainqueur !","Le secours se mesure","Aux besoins de nos cœurs !","Plus grande est la faiblesse.","Seigneur, de Tes soldats,","Plus riche est Ta promesse","Et plus ferme est Ton bras."]],[0,["Revêtons notre armure","Et souffrons en vainqueur","De plaintes et de murmures","Sachons garder nos cœurs.","L’épreuve aura son terme,","Et dans le mauvais jour,","Le chrétien reste ferme","Dans la foi, dans l’amour."]],[0,["Revêtons notre armure","Et mourons en vainqueur !","Si la bataille est dure.","L’espoir soutient nos cœurs.","Aux rives éternelles,","Il nous montre le port.","Nous Te serons fidèles,","Seigneur, jusqu’à la mort."]]]},{"n":86,"t":"Oh! Que c’est beau:","s":[[0,["Oh! Que c’est beau:","Un monde nouveau","Nous attend là-haut,","Auprès de l’Agneau."]],[0,["Christ, notre Roi,","Sur nous régnera,","Et dans Sa douceur,","Séchera nos pleurs."]],[0,["Sous Son regard,","Ayant notre part","A la joie du Maître,","Il nous fera naître."]],[0,["Ce sera vraiment beau,","Les Noces de l’Agneau,","Quand nous serons là-haut!","Là-haut, là-haut, là-haut!"]]]},{"n":87,"t":"Pourquoi donc ces nations en tumulte","s":[[0,["Pourquoi donc ces nations en tumulte","Et ces peuples qui grondent en vain","Tous ces rois et ces princes qui luttent,","Rejetant l’Éternel et Son Oint.","Secouant les entraves divines","Ils voudraient être libres et forts.","Mais sur tout l’univers,","Sur les deux et l’enfer","Notre Dieu règne encore."]],[1,["Notre Dieu règne encore,","Jamais Son amour ne s’endort!","Le vent se déchaîne,","Et nos cœurs sont en peine,","Mais Dieu nous conduit jusqu’au port.","Notre Dieu règne encore,","Jamais Son amour ne s’endort!","Ce qu’il nous promet","Reste vrai pour jamais!","Notre Dieu règne encore."]],[0,["Dans le monde où sévit la tourmente,","Du désordre et de l’iniquité,","Que notre âme en Dieu soit confiante :","Il est l’inébranlable rocher.","La réponse au chaos de la terre","C’est le règne du Christ, l’âge d’or","Notre sécurité,","C’est Son autorité","Notre Dieu règne encore."]]]},{"n":88,"t":"La victoire est dans le Sang, Alléluia!","s":[[0,["La victoire est dans le Sang, Alléluia!","Dans le Sang de Jésus-Christ,","Mon Sauveur."]],[0,["La victoire est dans le Sang, Alléluia!","À l’Agneau la gloire,","À Lui l’honneur."]],[0,["Gloire, gloire, gloire,","Et puissance à l’Agneau!","Gloire, gloire, gloire,","À Lui, l’honneur!"]],[0,["La victoire est dans le Sang,","Alléluia!","À Jésus la gloire,","À Lui l’honneur."]]]},{"n":89,"t":"Ma foi regarde à Toi","s":[[0,["Ma foi regarde à Toi","Toi, Agneau du calvaire,","Sauveur divin,","Écoute ma prière.","Enlève mes péchés,","Que jamais, je ne m’égare loin de Toi (bis)"]],[0,["Puisse Ta grâce infinie","Fortifier mon cœur,","Mon zèle divin.","Toi qui mourus pour moi,","Que mon amour pour Toi,","Pur, chaud, inchangé soit un feu vivant, (bis)"]],[0,["Suivant ma sombre vie","Et ma désolation,","Sois mon seul Guide.","Que l’ombre se dissipe,","Essuie mes yeux fondus.","Ne laisse pas m’égarer loin de Ta face (bis)"]],[0,["Et dans ce labyrinthe","Entouré de malheur,","Oh! Sois mon guide.","Disperse mes ténèbres,","Viens essuyer mes larmes,","Que je sois à Toi dès aujourd’hui, (bis)"]]]},{"n":90,"t":"La nuit aura bientôt disparu, le jour naît.","s":[[0,["La nuit aura bientôt disparu, le jour naît.","Là-bas, à l’horizon, notre port apparaît.","Notre pilote est là pour guider notre pas,","Bientôt nous foulerons le sol de la patrie."]],[0,["Poussons au bord matelots droit au port","Ne craignons pas les vagues en furie.","Notre pilote est là pour guider notre pas,","Bientôt, nous foulerons le sol de la patrie."]],[0,["La nuit aura bientôt disparu, le jour naît.","Là-bas à l’horizon, notre port apparaît,","bientôt nos pieds seront au terme du voyage,","Matelots, penchons-nous sur nos rames et courage."]]]},{"n":91,"t":"Océan de Dieu, si immense et si profond,","s":[[0,["Océan de Dieu, si immense et si profond,","Être fibre comme Toi","Me semblerait trop bon,","Car Tes ondes de grâce","Contiennent tant de richesses.","Mais si pour tous, Tu coules,","Mais si pour tous, Tu coules,","Si pour tous, Tu coules,","C’est donc aussi pour moi!"]],[1,["Tes flots d’amour m’atteignent.","Mon cœur déjà s’y baigne,","Oh, quelle richesse infinie,","Alléluia! Merci, Jésus!"]],[0,["Mes péchés furent nombreux","Et dignes de châtiment,","Mais je me suis approché","D’un cœur repentant","De ce flot merveilleux,","Où je me suis abandonné","Afin que tout mon être","Afin que tout mon être","Afin que tout mon être ressorte purifié."]],[0,["Océan de grâce, souvent je m’élançais","Rempli du désir","D’être à nouveau renouvelé.","Mais aujourd’hui,","Je désire recevoir Ta promesse.","J’ai décidé d’attendre,","J’ai décidé d’attendre,","Décidé d’attendre,","Que Tu ne m’aies rempli."]],[0,["Dès lors, Alléluia! Le reste de mon temps","Est au Seigneur Jésus,","Consacré pleinement;","À Celui d’où est issu","Cet océan de grâce,","Et d’amour insondable,","Et d’amour insondable,","D’amour insondable,","De paix et de pardon."]]]},{"n":92,"t":"Si tu savais combien les plaisirs du monde","s":[[0,["Si tu savais combien les plaisirs du monde","Ont déchiré, brisé tant de cœurs.","Tu viendrais à Jésus dont la grâce abonde","De Son amour, tu verrais la douceur."]],[1,["Vers Jésus, lève les yeux.","Contemple Son visage merveilleux.","Et les choses de la terre pâliront peu à peu","Si tu lèves vers Jésus les yeux."]],[0,["Christ est pour moi un Sauveur admirable","Un Conseiller, un Ami merveilleux.","Son Nom béni n’a rien de comparable.","Sur cette terre comme là-haut dans les cieux."]]]},{"n":93,"t":"Kumbaya my Lord, Kumbaya (ter)","s":[[1,["Kumbaya my Lord, Kumbaya (ter)","Oh! Lord kumbaya."]],[0,["Pour sécher nos pleurs, viens bientôt,","Calmer nos douleurs, viens bientôt,","Pour notre bonheur, viens bientôt,","Oh! Seigneur, viens bientôt."]],[0,["Toi qui es la vie, viens bientôt,","L’Etoile qui brille, viens bientôt,","Que cesse la nuit, viens bientôt,","Oh! Seigneur, viens bientôt."]],[0,["Que ce jour béni sera beau,","Lorsque nous Le verrons là-haut;","Là, plus de soucis, de fardeaux,","Oh! Que ce sera beau."]]]},{"n":94,"t":"C’est par la foi que voyant l’invisible","s":[[0,["C’est par la foi que voyant l’invisible","Ils se sont levés à l’appel du Seigneur.","Rien avec Lui ne semblait impossible","Tant Sa promesse enflammait leur ardeur."]],[1,["Brûle en nos âmes, flamme sacrée.","Et nous suivrons les témoins d’autrefois,","Environnés de leur grande nuée,","Les regards sur Jésus, chef de la foi."]],[0,["C’est par la foi qu’ils fuyaient l’esclavage,","Qu’ils passaient la mer, qu’ils étaient valeureux.","Grâce au Seigneur, se frayant un passage","Vers la cité préparée pour eux."]],[0,["C’est par la foi, que dans l’ignominie,","Ils ont enduré des épreuves sans fin.","Sans obtenir ici-bas de patrie,","Mais saluant le triomphe lointain."]],[0,["Foi des héros! Qui combat sous ce signe,","Suit leurs saints exemples et partage leur sort","Eux dont le monde ne fut jamais digne,","Eux, les témoins qui nous parlent encore."]]]},{"n":95,"t":"Le Seigneur est mon Berger,","s":[[0,["Le Seigneur est mon Berger,","Je ne craindrai rien.","Toujours, Il s’occupe de moi","Près des eaux paisibles","Par tous les chemins","Le Seigneur prend bien soin de moi"]],[1,["Jésus, Tu es tout pour moi Jésus,","Tu prends soin de moi","Je vais où Tu me conduis","Seigneur, merci!"]],[0,["Il reste tout près de moi,","Il guide mes pas.","J’irai où Il me le dira","Il bénit, Il me remplit","Toujours, Il pourvoit","Le Seigneur prend bien soin de moi"]],[0,["La grâce et le bonheur","M’accompagneront","Pendant mon voyage ici-bas","Je vis dans Sa présence","C’est là ma maison","Le Seigneur prend bien soin de moi."]]]},{"n":96,"t":"Ce que j’ai, ce monde ne l’a pas!","s":[[0,["Ce que j’ai, ce monde ne l’a pas!","Mais, il ne peut pas me l’ôter.","Ce que j’ai, le monde ne l’a pas!","Mais cela me gardera."]],[0,["Ce que j’ai vaut bien d’en parler,","D’y penser, cela me fait danser.","Ce que j’ai, Jésus me l’a donné:","Rien ne peut me le retirer."]]]},{"n":97,"t":"Il vit! Il vit! (bis)","s":[[0,["Il vit! Il vit! (bis)","Jésus vit aujourd’hui:","Je sais qu’Il est tout près de moi,","Sur le chemin étroit."]],[0,["Il vit! Il vit! (bis)","Toujours, Il me conduit,","Et je puis dire par la foi:","Je sais qu’il vit en moi."]],[0,["Il vit! Il vit! (bis)","Mon Seigneur vit vraiment;","Car Il me parle et me conduit","A travers tous les tourments."]],[0,["Il vit! Il vit! (bis)","Jésus est mon Sauveur.","Vous dire comment je le sais?","C’est qu’Il vit dans mon cœur!"]]]},{"n":98,"t":"Je suis heureux, et voilà la raison:","s":[[0,["Je suis heureux, et voilà la raison:","Jésus m’a donné Son plein pardon.","Et maintenant, je chante tout le jour","De Jésus le merveilleux amour."]],[0,["Mon cœur accablé par un pesant fardeau","Par Jésus soulagé, a le vrai repos.","Et maintenant, je chante tout le jour","De Jésus le merveilleux amour."]]]},{"n":99,"t":"Ne crains point, crois seulement! (bis)","s":[[0,["Ne crains point, crois seulement! (bis)","Toutes choses sont possibles","À celui qui croit.","Regarde à ton Sauveur,","Il est toujours vainqueur!","Toutes choses sont possibles","À celui qui croit."]]]},{"n":100,"t":"Chef couvert de blessures,","s":[[0,["Chef couvert de blessures,","Meurtri par nous pécheurs,","Chef accablé d’injures,","D'opprobres, de douleurs,","Des splendeurs éternelles","Naguère environné,","C’est d’épines cruelles","Qu’on Te voit couronné!"]],[0,["C’est ainsi que Tu paies","Le prix de ma rançon.","Tes langueurs et Tes plaies,","Voilà ma guérison.","Mon âme criminelle","Est à Tes pieds, Seigneur;","Daigne jeter sur elle","Un regard de faveur."]],[0,["Au sein de ma misère,","Sauvé par Ton amour,","Pour Toi, que puis-je faire?","Que T’offrir en retour?","Ah! Du moins, Dieu suprême,","Prends à jamais mon cœur:","Qu’il Te serve et qu’il T’aime,","Plein d’une sainte ardeur."]],[0,["Pour Ta longue agonie,","Pour Ta mort sur la croix,","Je veux toute ma vie","Te louer, Roi des rois!","Ta grâce est éternelle,","Et rien jusqu’à la fin","Ne pourra, Dieu fidèle.","Me ravir de Ta main."]]]},{"n":101,"t":"N’est-Il pas merveilleux (ter)","s":[[0,["N’est-Il pas merveilleux (ter)","Notre Maître?","Invisible aux humains","Mais présent pour tous les Siens,","Oui, Jésus n’est-Il pas merveilleux?"]],[0,["Certes, Il est merveilleux (ter)","Notre Maître.","Invisible aux humains","Mais présent pour tous les Siens,","Oui, Jésus est toujours merveilleux."]]]},{"n":102,"t":"Rédempteur adorable,","s":[[0,["Rédempteur adorable,","Sur la croix attaché,","Traité comme un coupable,","Brisé pour mon péché,","Ton angoisse suprême,","Ta douleur, Ton tourment","Me disent: Vois, Je t’aime,","J’ai pris ton châtiment."]],[0,["Abandonné du Père,","Dans mon âme troublée.","Buvant la coupe amère","Pour ton iniquité,","De l’éternelle flamme,","Mon amour te sauva.»","Je mourus pour ton âme","Pécheur, à Golgotha!"]],[0,["Le sang de Mes blessures,","Ma couronne de Roi,","Toutes ces meurtrissures,","Comprends-le, c’est pour toi!","J’ai subi ta souffrance.","J’ai porte ta langueur,","Contemple en assurance","Ton grand Libérateur!"]],[0,["Ton amour me réclame,","Me voici, cher Sauveur!","Prends mon corps et mon âme","Pour prix de Ta douleur,","O oui, mon âme ravie.","Désormais ne veut plus","Que vivre de Ta vie,","À Ta gloire. ô Jésus!"]]]},{"n":103,"t":"Résistons, combattons,","s":[[0,["Résistons, combattons,","Le Seigneur est vainqueur.","Avec Lui! Triomphons","Du mal et de toute erreur.","Prenons en nos mains","Le glaive de l'Esprit:","La Sainte Parole dissipant la nuit.","Par la vérité au Nom de Jésus-Christ.","Dieu nous fait toujours triompher."]]]},{"n":104,"t":"Seigneur, dans ma souffrance,","s":[[0,["Seigneur, dans ma souffrance,","À Toi seul J'ai recours.","J’attends de Ta puissance","Un sûr et prompt secours.","C'est dans les bras d'un Père","Que je me suis jeté;","En Sa grâce, j'espère,","Car Il m'a racheté."]],[0,["Âme faible et craintive","Pourquoi donc te troubler?","Quand tu n’es plus captive.","Comment peux-tu trembler?","Laisse aux enfants du monde.","Les soucis et les pleurs;","Dieu sur qui je me fonde,","A connu mes langueurs."]],[0,["Qu'il est doux de se dire:","L’Éternel pense à moi;","Il sait quand je soupire,","Quand je sais dans l’effroi","Il recueille mes larmes.","Il veut les adoucir;","A toutes mes alarmes","Il daigne compatir."]],[0,["Oh! Viens dans ma détresse.","Me protéger, Seigneur,","Et sois ma forteresse","Au jour de la terreur.","Sois mon bien, mon partage;","Mon espoir est en Toi.","J'obtiendrai l'héritage,","Que j’attends par la foi."]]]},{"n":105,"t":"Nous sommes en route,","s":[[0,["Nous sommes en route,","Tout joyeux et chantant","Nous sommes en route.","Dieu nous attend.","Avançons toujours, regardant à Jésus,","Sauveur plein d’amour,","Jamais vaincu. Amis, venez-vous,","Venez-vous avec nous?","Jésus nous appelle tous","Au rendez-vous."]]]},{"n":106,"t":"Comme il est prévu","s":[[0,["Comme il est prévu","Il est temps que Je m’en aille","Vers mon Père et votre Dieu","Mais rassurez-vous, Je vous l'ai promis","Je vous enverrai mon Esprit Saint","Parlez de Moi (bis)","Autour de vous (bis)","Ne craignez pas les calomnies.","Ainsi, je me souviendrai de vous","Auprès de mon Père au paradis,"]]]},{"n":107,"t":"Venez, chantez tous d’un même cœur:","s":[[0,["Venez, chantez tous d’un même cœur:","Dieu nous aime!","En Lui, nous avons le bonheur,","Dieu nous aime!","Toi qui sommeilles dans le péché,","Cherche Celui qui peut sauver,","Jésus te donnera la paix,","Car Dieu t’aime! Dieu vous aime!","Dieu nous aime!","Venez, chantez tous d’un même cœur:","Dieu nous aime!"]]]},{"n":108,"t":"Nous aurons un nouveau nom,","s":[[0,["Nous aurons un nouveau nom,","Nouveau nom (bis)","Nous aurons un nouveau nom,","Dans ce beau pays.","Beau nom, nouveau nom,","Dans ce beau pays."]]]},{"n":109,"t":"Oh! Mon Dieu ne m’abandonne pas","s":[[0,["Oh! Mon Dieu ne m’abandonne pas","M’associant à mes ennemis,","Garde-moi loin de Ta colère,","Dans Ta bonté réponds-moi,","Bon Sauveur, Jésus Christ,","Aie pitié de moi.","Exauce toutes mes prières.","Oh! Mon Dieu ne m’abandonne pas !","Dans Ta bonté, réponds-moi."]]]},{"n":110,"t":"Lorsque ton chemin est sombre","s":[[0,["Lorsque ton chemin est sombre","Et que ton ciel s’obscurcit,","Il en est un qui dans l’ombre,","Te regarde et te suit,","Jésus est le seul. Ô oui ! Il est le seul","Qui comprend ta peine et brise tes chaînes.","Crois en Sa Parole ! Elle te console.","Crois, Son regard est sur toi !"]]]},{"n":111,"t":"Viens, mon âme! et contemple","s":[[0,["Viens, mon âme! et contemple","Un objet sans exemple:","Le Dieu Sauveur en croix.","On Le frappe, ou L’outrage,","On Lui crache au visage:","Il expire enfin sur le bois!"]],[0,["Dans ce profond abîme,","Dis-moi, sainte victime!","Pourquoi Tu descendis.","Toi, le Saint et le Juste,","Du bien, modèle auguste,","Quels crimes as-Tu donc commis?"]],[0,["C’est moi que la justice","Condamnait au supplice,","Moi qui devais mourir.","Les tourments, les blessures,","Les coups, les meurtrissures,","C’est moi qui devais les souffrir."]],[0,["Tu Te mets à ma place,","Et Ta croix change en grâce","Ma condamnation,","Sur Ta tête sacrée,","D’épines couronnée,","Tu portas ma confusion."]],[0,["Je Te suis redevable,","Mon Sauveur adorable!","De tout ce que je suis.","Mon âme et tout mon être","À Toi seul doivent être:","C’est le droit que Tu T’es acquis."]]]},{"n":112,"t":"Je pleure, je pleure","s":[[0,["Je pleure, je pleure","Pour mes péchés, mon Sauveur.","Oh mon Dieu, fais briller Ta lampe","Et guide-moi."]],[0,["Oh mon Dieu, répond-moi.","Répond moi ! Oh mon Dieu, répond-moi !","Mon Dieu, Tu es l’Eau de Vie.","Répond moi ! Oh mon Dieu, répond-moi !"]],[0,["Mon Dieu, Tu es le Pain de Vie.","Répond moi ! Oh mon Dieu, répond-moi !","J’ai soif de Ta justice.","Répond moi ! Oh mon Dieu, répond-moi !"]]]},{"n":113,"t":"Jésus doit-Il porter Sa croix tout seul,","s":[[0,["Jésus doit-Il porter Sa croix tout seul,","Tout seul,","Et le reste du monde vivre dans l’insouciance.","Il y a une croix pour chacun","Il y a une croix pour moi."]],[0,["Je porterai cette croix consacrée","Jusqu’à ce que la mort me libère.","Alors, j’irai dans l’enlèvement","Pour porter une couronne."]]]},{"n":114,"t":"Alléluia, gloire à Dieu : Je suis libre (bis)","s":[[0,["Alléluia, gloire à Dieu : Je suis libre (bis)","Car le Sang de l’Agneau est ma rançon.","Je suis libre, pour toujours libre,","A jamais libre."]],[0,["Alleluia, Praise the Lord, I am free (bis)","For the blood of the Lamb is my ransom.","I am free, forever free,","And ever free."]]]},{"n":115,"t":"Ton amour, Ton amour,","s":[[0,["Ton amour, Ton amour,","Voilà, Seigneur, ce qu’il faut à mon cœur.","Oui, c’est Ton amour!"]],[0,["Ton pardon, Ton pardon,","Voilà Seigneur ce qu’il faut à mon cœur.","Oui, c’est Ton pardon!"]],[0,["Ton salut, Ton salut","Voilà Seigneur ce qu’il faut à mon cœur.","Oui, c’est Ton salut!"]]]},{"n":116,"t":"C’est merveilleux (bis)","s":[[0,["C’est merveilleux (bis)","Ce que Dieu fait, (bis)","Son précieux Livre (bis)","Est toujours vrai, (bis)","Quand on y croit, (bis)","Il répondra, (bis)","C’est merveilleux ce que Dieu fait."]],[0,["Je crois que la Bible est vraie (bis)","Elle est la Parole du Seigneur,","Je La serre dans mon cœur."]],[0,["Chaque parole de la Bible est vraie,","Chaque chapitre, chaque verset.","Tout ce qui est dit, ce qui est écrit,"]],[0,["Chaque Parole de la Bible est vraie.","Tout ce qui est dit, ce qui est écrit,","Je La serre dans mon cœur."]]]},{"n":117,"t":"Tout en cherchant le blé,","s":[[0,["Tout en cherchant le blé,","La balle m’a attirée","Mais, elle n’a pas pu me nourrir.","Je suis sur mes genoux","Et mon cœur est poussé à bout.","La soif me fait lever ;","Je dois continuer à travers","Ce désert sans fruits","Vers la source qui est là.","De l’eau de vie","Jésus, remplis-moi !"]],[1,["Plus de Toi, plus de Toi","J’ai tant reçu","Mais ce qu’il me faut","C’est plus de Toi !","Rempli à déborder","Mon âme est assoiffée","Comme une terre aride !","Oh! Écoute-moi","Pour plus de Toi."]]]},{"n":118,"t":"À Toi la gloire,","s":[[0,["À Toi la gloire,","O Ressuscité!","À Toi la victoire","Pour l’Eternité!","Brillant de lumière,","L’ange est descendu,","Il roule la pierre","Du tombeau vaincu."]],[0,["À Toi la gloire,","Ô Ressuscité!","À Toi la victoire.","Pour l’Éternité!"]],[0,["Vois-Le paraître:","C’est Lui, c’est Jésus,","Ton Sauveur, ton Maître!","Oh! Ne doute plus!"]],[0,["Sois dans l’allégresse,","Peuple du Seigneur,","Et redis sans cesse","Que Christ est vainqueur."]],[0,["Craindrais-je encore?","Il vit à jamais,","Celui que j’adore,","Le Prince de paix;","Il est ma victoire,","Mon puissant soutien,","Ma vie et ma gloire:","Non, je ne crains rien."]]]},{"n":119,"t":"Brisant Ses liens funèbres, Alléluia!","s":[[0,["Brisant Ses liens funèbres, Alléluia!","Christ est sorti des ténèbres. Alléluia!","Le ciel, la terre ont chanté: Alléluia!","Jésus est ressuscité. Alléluia!"]],[0,["Les soldats, le sceau, la pierre, Alléluia!","N’ont pu Le garder en terre; Alléluia!","Et c’est pour nous qu’aujourd’hui, Alléluia!","Le ciel s’ouvre devant Lui! Alléluia!"]],[0,["Il vit, notre Roi de gloire! Alléluia!","Sépulcre, où est ta victoire? Alléluia!","Il a détruit sans effort, Alléluia!","La puissance de la mort. Alléluia!"]],[0,["Puisque Ta mort fut suivie, Alléluia!","Du triomphe de la vie, Alléluia!","Je veux, O mon divin Roi, Alléluia!","Mourir et naître avec Toi! Alléluia!"]]]},{"n":120,"t":"Pour cet immense bonheur, Alléluia !","s":[[0,["Pour cet immense bonheur, Alléluia !","Que Tu as mis dans mon cœur, Alléluia !","Je veux Te chanter, Seigneur, Alléluia !","Oui, Jésus est mon Sauveur. Alléluia !"]],[0,["Je le redirai encore, Alléluia !","Que pour moi, Jésus est mort, Alléluia !","Voilà pourquoi je L’adore, Alléluia !","I ni seul est tout mon trésor, Alléluia !"]],[0,["Que chaque jour, à chaque heure, Alléluia !","En moi, Tu aies Ta demeure. Alléluia !","Que ma vie soit une fleur, Alléluia !","Un parfum pour Toi, Seigneur, Alléluia !"]]]},{"n":121,"t":"Sois béni, sois loué","s":[[1,["Sois béni, sois loué","Le Seigneur de Moïse.","Sois béni, sois loué","Le Seigneur de Jonas,","Sois béni, sois loué","Le Seigneur d’Israël."]],[0,["Seigneur, sois béni, sois loué.","Seigneur, sois béni, sois loué.","Il a sauvé Daniel de la fosse aux lions,","Il a sauvé Schadrac, Méschac, Abed-Négo,","Il a sauvé Elie de tous ses ennemis.","Oh Seigneur, sois béni, sois loué.","Oh Seigneur, sois béni, sois loué."]]]},{"n":122,"t":"Comme Abraham et Sara","s":[[0,["Comme Abraham et Sara","Vous êtes unis.","Vous êtes appelés à former","Un foyer heureux.","Dans la présence divine","De notre Seigneur,","Vivez dans la paix,","Dans la joie."]],[0,["Vivez dans la paix.","Aimez-vous (bis)","Comme Dieu vous aime.","Pardonnez-vous (bis)","Comme le Christ l’a fait.","Dans la présence divine","De notre Seigneur,","Vivez dans la paix,","Dans la joie."]]]},{"n":123,"t":"Nous venons dans Ta maison,","s":[[0,["Nous venons dans Ta maison,","Nous nous assemblons","Pour T’adorer,","Jésus, T’adorer,","Te louer Seigneur."]],[0,["Tu nous donnes Ta justice,","Tu nous affranchis","Pour T’adorer.","Jésus, T'adorer,","Te louer Seigneur","Nous levons nos mains vers Toi,","Nous Te contemplons","Pour T’adorer.","Jésus, T’adorer,","Te louer Seigneur,"]]]},{"n":124,"t":"Il n’y a qu’un Créateur,","s":[[0,["Il n’y a qu’un Créateur,","Le Seigneur Jésus.","Il n’y a qu’un seul Dieu","Le Seigneur Jésus.","Il n’y a qu’un seul Roi,","Le Seigneur Jésus.","Il est le seul Dieu."]],[0,["Que nous Le louons!","Jésus créateur.","Que nous Le louons!","Jésus notre Dieu.","Que nous Le louons!","Jésus notre Roi.","Il est le seul Dieu."]]]},{"n":125,"t":"Je suis avec toi,","s":[[0,["Je suis avec toi,","Moi, ton Sauveur, le Fils de Dieu.","Je suis avec toi,","Dans ta souffrance et ta douleur.","Que le monde te délaisse,","Je suis toujours avec toi.","Ne crains point, (bis)","Je suis avec toi."]],[0,["Si tu aimes ton Dieu","De tout ton cœur, de toute ton âme,","Si tu aimes ton prochain","Comme toi-même, ne crains point.","Que le monde te délaisse,","Je suis toujours avec toi.","Ne crains point, (bis)","Je suis avec toi."]]]},{"n":126,"t":"Merveilleux, merveilleux,","s":[[1,["Merveilleux, merveilleux,","C’est merveilleux!","C’est merveilleux d’être en Jésus Christ."]],[0,["Il a dit d’aller partout sur la terre","Proclamer en tout Son amour."]],[0,["Pour chacun, oui chacun de mes péchés,","Il a été puni sur la croix."]],[0,["A celui qui voudrait bien L’accepter,","Jésus offre la vie éternelle."]],[0,["Il a dit qu’il reviendra sur la terre,","Nous serons enlevés dans les cieux."]],[0,["C’est la joie pour ceux qui seront sauvés.","Ils chanteront, Jésus est le Roi."]]]},{"n":127,"t":"Devant Toi Seigneur,","s":[[0,["Devant Toi Seigneur,","Je répands mon âme."]],[1,["Oh! Mon Dieu.","Je suis à Toi,","Je me confie en Toi.","Conduis-moi dans la voie","De la vérité."]],[0,["Souviens-Toi de moi","Car en Toi j’espère","Oh! Mon Dieu...."]],[0,["Montre-moi la voie,","Le chemin à suivre.","Oh! Mon Dieu...."]],[0,["L’Éternel est droit,","Il est bon et juste","Oh! Mon Dieu...."]],[0,["L’amitié de Dieu","Est pour ceux qui L’aiment.","Oh! Mon Dieu...."]]]},{"n":128,"t":"J’ai trouvé en Jésus l’ami","s":[[0,["J’ai trouvé en Jésus l’ami","Qui est toute chose pour moi.","C’est le plus beau d’entre","Dix mille pour mon âme ;","Il est le Lys de la vallée","Et en Lui seul, je trouve","Ma purification et ma guérison."]],[1,["Mon réconfort dans les peines,","Appui dans les tourments,","Il m’invite à Lui confier","Chaque souci, Alléluia !","La brillante étoile du matin","Le Lys de la vallée","C’est le plus beau d’entre","Dix nulle pour mon âme."]],[0,["Il a pris et porté sur Lui","Tous mes soucis et peines ;","Ma tour forte et puissante","Dans les tentations.","Pour Lui j’ai tout abandonné","Et ôté de mon cœur mes idoles.","Par Sa puissance, Il me garde."]],[1,["Même si le monde m’abandonne","Ou que Satan me tente,","Par Jésus j’atteindrai","Sûrement le but, Alléluia !","La brillante étoile du matin,","Le Lys de la vallée,","C’est le plus beau d’entre","Dix mille pour mon âme."]],[0,["Il ne me quittera jamais,","Ni me laissera ici","Tant que j’ai la foi","Et fais Sa volonté.","Un mur de feu autour de moi,","Maintenant je ne crains rien :","Mon âme affamée se nourrit de Sa manne"]],[1,["Et nous, ravis dans la gloire,","Verrons Sa face bénie.","Là à jamais coulent","Les fleuves de délices, Alléluia !","La brillante étoile du matin,","Le Lys de la vallée,","C'est le plus beau d’entre","Dix mille pour mon âme."]]]},{"n":129,"t":"Nous allons bientôt","s":[[0,["Nous allons bientôt","Quitter la terre pour le ciel","Gloire à Dieu! (ter) Amen!"]],[0,["Nous quitterons","Tous les soucis pour le bonheur.","Gloire à Dieu! (ter) Amen!"]],[0,["Tous les pleurs et les larmes","Finiront pour toujours,","Gloire à Dieu! (ter) Amen!"]],[0,["Rachetés de Jésus,","Poussons des cris de joie","Gloire à Dieu! (ter) Amen!"]]]},{"n":130,"t":"Ton Amour nous environne, ô Seigneur !","s":[[0,["Ton Amour nous environne, ô Seigneur !","Ta gloire resplendit tout comme le soleil.","Ton amour nous environne, ô Seigneur !","C’est pourquoi nous espérons tous en Toi."]],[0,["Gloire à Ton Nom! Auteur de notre joie.","Gloire à Ton Nom! Toi qui nous as sauvés","Gloire à Ton Nom! Toi qui nous aime tant","C’est pourquoi nous espérons tous en Toi."]],[0,["Tu n’as pas exigé de garantie","Avant de manifester Ton amour.","Ton bras de Père, Tu l’as tendu vers nous","Pour nous arracher du feu de l’enfer."]]]},{"n":131,"t":"Oh! Quand sera-ce, Fils de Dieu,","s":[[0,["Oh! Quand sera-ce, Fils de Dieu,","Que Ton Eglise émue","Verra son Époux, du saint lieu","Descendre sur la nue?","Réponds à notre cri, Seigneur","Et viens bientôt, puissant Vainqueur!"]],[1,["Oh! Viens, Seigneur Jésus!","Oh! Viens, Seigneur Jésus!"]],[0,["Tu nous donnes Ta douce paix,","Nous sentons Ta Présence;","Tu ne nous laisseras jamais,","C’est là notre assurance;","Mais quand pourrons-nous donc enfin","Te voir, ô notre Epoux divin?"]],[0,["De tous Tes ennemis, ô Dieu,","Nous voyons la puissance:","Que de rebelles en tout lieu,","De vice et de souffrance!","Viens bientôt, grand Triomphateur,","Mettre un terme à tant de douleur!"]],[0,["Veillez, priez, nous dit Jésus,","Tenez vos lampes prêtes!","Que rien ne nous entrave plus,","Levons, levons nos têtes !","Il vient, Il vient! Entendez-vous","Ce cri: Voici, voici l’Époux!"]],[1,["Tu viens, Seigneur Jésus!","Tu viens, Seigneur Jésus!"]]]},{"n":132,"t":"Jésus-Christ est mon Rocher, ma Forteresse.","s":[[0,["Jésus-Christ est mon Rocher, ma Forteresse.","C’est Lui qui me protège dans les combats.","Avec Lui, je suis toujours dans l’allégresse.","Il me guide et restaure mes pas."]],[1,["Il me connaît par mon âme,","C’est Lui qui dirige","Mes pas dans les combats."]],[0,["Jésus-Christ est mon Rocher, ma Forteresse.","C’est Lui qui me protège sur cette terre.","Il me comble de tout bien avec largesse.","Je suis confiant sous Sa bannière."]],[0,["Jésus-Christ est mon Rocher, ma Forteresse.","La lumière qui éclaire mon chemin.","Il me fortifie toujours dans Sa sagesse.","Il me guide selon Son dessein."]]]},{"n":133,"t":"Trace mon chemin, pour Canaan (ter)","s":[[0,["Trace mon chemin, pour Canaan (ter)","Trace mon chemin Seigneur pour Canaan"]],[0,["Mon frère, ma sœur, allons-y ensemble (ter)","Trace mon chemin Seigneur pour Canaan"]],[0,["Si tu ne vas pas, ne m’empêche pas (ter)","Trace mon chemin Seigneur pour Canaan"]],[0,["La joie de vivre, c’est en Jésus-Christ (ter)","Trace mon chemin Seigneur pour Canaan"]],[0,["Aime ton Dieu, Il te soutiendra (ter)","Trace mon chemin Seigneur pour Canaan"]],[0,["Donne-moi la victoire sur mes ennemis (ter)","Trace mon chemin Seigneur pour Canaan"]],[0,["Soutiens ma foi, je veux T’obéir (ter)","Trace mon chemin Seigneur pour Canaan"]]]},{"n":134,"t":"Je suis sur le Roc, le Roc des âges","s":[[0,["Je suis sur le Roc, le Roc des âges","Je suis sur le Roc des âges","Mon âme a trouvé le vrai repos","Je suis sur le Roc des âges."]],[0,["Jésus est le Roc, le Roc des âges","Jésus est le Roc des âges.","Mon âme a trouvé le vrai repos,","Jésus est le Roc des âges."]],[0,["Nous sommes sur le Roc, le Roc des âges.","Nous sommes sur le Roc des âges.","Nos âmes ont trouvé le vrai repos,","Nous sommes sur le Roc des âges."]]]},{"n":135,"t":"Du ciel bientôt, Jésus va revenir. Si c’était","s":[[0,["Du ciel bientôt, Jésus va revenir. Si c’était","aujourd’hui ?","Tout radieux, nous Le verrons venir. Si c’était","aujourd’hui ?","Alors, tous les saints à Sa vue,","Ses enfants sûrs de Sa venue Iront avec Lui sur","la nuée ; Si c’était aujourd’hui ?"]],[1,["Gloire! Gloire! Jésus revient bientôt.","Gloire! Gloire! Tous L’acclameront.","Gloire! Gloire! Et nous L’adorerons.","Gloire! Gloire! Jésus revient bientôt."]],[0,["Dans ce beau ciel, le mal ne sera plus.","Si c’était aujourd’hui ?","Plus de douleur, le regard de Jésus","Si c’était aujourd’hui ?","Notre âme après ce jour soupire","Et déjà la nuit se retire","Le grand matin va bientôt luire ;","Si c’était aujourd’hui ?"]],[0,["Oh, que Jésus trouve en nous","Des cœurs droits.","S’il revient aujourd’hui","Veillant, priant, docile à Sa voix,","S’il revient aujourd’hui,","Avons-nous tous cette assurance","D’être enlevés en Sa présence","Dans le séjour de Sa puissance ?","S’il revient aujourd’hui !"]]]},{"n":136,"t":"Tenons nos lampes prêtes,","s":[[0,["Tenons nos lampes prêtes,","Chrétiens, préparons-nous","Pour l’heure où les trompettes","Annonceront l’Epoux."]],[1,["Qu’à répondre, on s’empresse, Hosanna!","Hosanna!","Et qu’avec allégresse","On chante: Alléluia! (bis)"]],[0,["Voici déjà les anges,","Avec eux les élus,","Unissant leurs louanges","En l’honneur de Jésus,"]],[0,["Voici Jésus Lui-même,","Puissant, victorieux!","De Son pur diadème","L'éclat remplit les cieux."]],[0,["Venez, bénis du Père,","Qui m’avez attendu;","Entrez dans la lumière,","Le Ciel vous est rendu."]]]},{"n":137,"t":"Un vêtement blanc, une harpe d’or,","s":[[0,["Un vêtement blanc, une harpe d’or,","Un beau Palais, une couronne;","La sainte joie, le vrai trésor,","Le Sauveur me les donne."]],[0,["Car Jésus est mon Sauveur,","Il m’a tant aimé,","Payé ma dette sur le calvaire,","Il m’a dans Son grand amour","Sauvé du péché.","Je vis dans Sa sainte Lumière"]],[0,["Oui, nous marchons,","Nous marchons tout joyeux! (ter)","Oui, nous marchons,","Nous marchons tout joyeux (bis)","Vers les cieux."]]]},{"n":138,"t":"Oh! Ciel écoute! Terre! Prête l’oreille!","s":[[0,["Oh! Ciel écoute! Terre! Prête l’oreille!","C'est l’Éternel qui dit :","Je t’ai élevé et Je t’ai bien nourri.","Maintenant, tu M’as abandonné, (bis)"]],[1,["Le bœuf connaît son maître,","Et l’âne son conducteur,","Mais Israël ne Me reconnaît plus.","Mon peuple M’a abandonné, (bis)"]],[0,["Oh! Saint Esprit,","Oui, Tu m’as délivré de l’esclavage.","Dès aujourd’hui, je voudrai T’obéir,","Car seul Tu es le Roi des rois, (bis)"]]]},{"n":139,"t":"La trompette a retenti","s":[[0,["La trompette a retenti","(Écoutez, écoutez)","Du ciel résonne ce cri :","Le Seigneur revient.","Oh! Toi qui sommeilles,","(Écoutez, écoutez)","Viens et te réveille.","Le Seigneur revient!"]],[0,["Entendez-vous le clairon ?","(Écoutez, écoutez)","L’Épouse en connaît le son :","Jésus vient bientôt!","Et dans l’allégresse,","(Écoutez, écoutez)","Son cœur dit sans cesse","Jésus, viens bientôt!"]],[0,["La trompette a retenti ;","(Écoutez, écoutez)","Levez-vous, il est minuit,","Voici, l’Époux vient!","Au banquet de fête","(Écoutez, écoutez)","Que chacun s’apprête:","Voici, l’Époux vient!"]]]},{"n":140,"t":"Dieu ne peut te laisser voir","s":[[0,["Dieu ne peut te laisser voir","Toujours ton chemin.","Mais marcher par la foi","Tel est l’ordre divin.","Dieu ne peut de ta route","Enlever chaque pierre","Tu lâcheras Sa tendre main mon frère"]],[1,["Dieu ne peut t’épargner","Ni les pleurs ni la croix,","Ni le joug qui t’oppresse","Et t’irrite parfois.","Il faut pour vivre au Ciel","Passer par le calvaire.","La douleur doit nous","Guider pas à pas."]],[0,["Souvent à la nacelle,","Il faut avoir l’orage","Pour que les matelots","Pointent droit au rivage."]],[0,["Souvent à la brebis","Il faut prendre l’agneau,","Pour qu’elle entre avec tout le troupeau."]],[0,["Ainsi, dans Son amour,","Dieu permet la fournaise;","Il l’attise parfois","Plutôt qu’Il ne l’apaise.","Mais lee Dieu Tout-Puissant","A dit que pour les Siens,","Le feu ne brûlerait que les liens."]],[0,["En Dieu qui te conduit,","Mais donc ta confiance;","Chante si tu le peux","Un hymne d’espérance.","Peut-être qu’en écoutant,","Un coeur auprès de toi,","Désespéré, retrouvera la foi."]],[0,["Qu’importe si ta voix hésite,","Pleure ou tremble,","Dieu permet de chanter","Et pleurer tous ensemble.","Marchons les yeux fixés","Sur le but constament,","Dans la joie ou les pleures","Mais toujours en chantant."]]]},{"n":141,"t":"Est-ce que tu sais (ter)","s":[[0,["Est-ce que tu sais (ter)","Que Jésus est ton Sauveur ?"]],[1,["Je sais (ter)","Que Jésus est mon Sauveur"]],[0,["Est-ce que tu sais (ter)","Que Jésus est ton libérateur ?"]],[0,["Est-ce que tu sais (ter)","Que Jésus est mort pour toi ?"]],[0,["Est-ce que tu sais (ter)","Que Jésus revient te chercher ?"]]]},{"n":142,"t":"Il y aura pluies de bénédictions","s":[[0,["Il y aura pluies de bénédictions","C’est la promesse d'Amour","Il y aura temps de rafraîchissement","Venant du Sauveur céleste"]],[1,["Pluies de bénédictions","Nous en avons besoin","Des gouttes tombent autour de nous","Mais nous plaidons pour les pluies."]],[0,["Il y aura pluies de bénédictions","Un précieux réveil encore,","Sur les collines et les vallées,","Les bruits d’une pluie abondante."]],[0,["Il y aura pluies de bénédictions","Envoie-les sur nous, Seigneur","Accorde nous un rafraîchissement","Viens et honores Ta parole."]],[0,["Il y aura pluies de bénédictions","Puisse-t-elle tomber aujourd’hui;","Comme nous confessons à Dieu","Comme nous implorons Jésus."]]]},{"n":143,"t":"A la Croix, aux pieds du Maître,","s":[[0,["A la Croix, aux pieds du Maître,","A genoux, j’ai fait mon choix.","Son disciple je veux être,","Tout près de Lui, par la foi.","Brebis de Sa bergerie,","Nul ne m’ôte de Sa main.","Sur les monts, dans les prairies,","Oui, mon bonheur est divin"]],[1,["A la Croix, aux pieds du Maître","A genoux, j’ai fait mon choix.","Son disciple, je veux être,","Tout près de Lui, par la foi."]],[0,["Depuis lors, ô choix splendide,","La joie demeure dans mon cœur.","Adieu, mes soucis perfides,","Par Jésus, je suis vainqueur.","Adieu, vaines convoitises","Du monde qui me tenta.","J’ai trouvé la paix promise","Dans le Sang de Golgotha."]],[0,["Bientôt, ma tâche accomplie,","J’entrerai tout droit au port,","Où m’attend, douce Patrie,","Le Grand Vainqueur de la mort.","Là, je chanterai Ta gloire,","O Toi qui m’a tant aimé,","Et dont l’œuvre expiatoire","Pour toujours m’a racheté."]]]},{"n":144,"t":"Il est une race immortelle,","s":[[0,["Il est une race immortelle,","Marquée au front du sceau de Dieu;","L’enfer recule devant elle,","La paix l’accompagne en tout lieu.","Cette race, née au Calvaire,","Du cœur percé de Jésus-Christ,","C’est l’Église, sel de la terre,","Peuple nouveau du Saint Esprit."]],[0,["Elle est la lumière du monde.","Reine et rebut des nations;","Elle n’est jamais plus féconde,","Qu’au sein des persécutions,","Car Celui qui lui donna l’être,","La suit d’un regard Paternel,","Et le sang dont Il la fît naître","Garde son pouvoir éternel!"]],[0,["Elle est ici-bas la colonne","Et l’appui de la vérité;","Elle est le phare d’où rayonne","La grâce sur l’humanité!","O grâce, ô divine lumière,","Tu luis jusque dans nos tombeaux,","Et de notre indigne poussière,","Fais surgir des hommes nouveaux!"]],[0,["Mon frère, à la race immortelle","Ne veux-tu pas appartenir?","En vain, loin du Dieu qui t’appelle,","Le péché veut te retenir:","Apporte à la croix de ton Maître","L’aveu tremblant d’une humble foi...","Crois seulement! Croire c’est naître!...","Enfant de Dieu, réjouis-toi!"]],[0,["Pour toi, le Ciel se met en fête:","Il compte un racheté de plus!","Pour toi la couronne s’apprête,","La palme promise aux élus!","Sur loi, l’Esprit met Son empreinte,","Et cette onction te fait roi...","Nouveau fils de la race sainte,","Réjouis-toi, réjouis-toi!"]]]},{"n":145,"t":"Comme une terre altérée","s":[[0,["Comme une terre altérée","Soupire après l’eau du Ciel,","Nous appelons la rosée","De Ta grâce, Emmanuel!"]],[1,["Fraîches rosées,","Descendez sur nous tous!","O divines ondées,","Venez, arrosez-nous!"]],[0,["Descends, ô pluie abondante,","Coule à flots dans notre cœur,","Donne à l’âme languissante","Une nouvelle fraîcheur."]],[0,["Ne laisse en nous rien d’aride","Qui ne soit fertilisé;","Que le cœur le plus avide","Soif pleinement arrosé."]],[0,["Oui, que les déserts fleurissent","Sous Tes bienfaisantes eaux;","Que les lieux secs reverdissent","Et portent des fruits nouveaux."]],[0,["Viens, ô salutaire pluie,","Esprit de grâce et de paix,","Répands en nous une vie","Qui ne tarisse jamais."]]]},{"n":146,"t":"Appartiens-tu à l’Épouse","s":[[0,["Appartiens-tu à l’Épouse","De Jésus, notre Seigneur?","Sera-ce pour toi un jour de joie","Ou un jour de frayeur?","Quand Il reviendra, ton vêtement","Sera-t-il pur et serein?","Oui, c’est l’instant","D’être prêt pour le festin."]],[1,["Maranatha, Alléluia! (ter)","Jésus vient, et Son festin est préparé."]],[0,["Pour cela, pourrais-tu renoncer","Au monde et ses plaisirs?","Marches-tu dans la lumière,","Es-tu prêt pour L’accueillir?","Si tu n’es pas encore libre,","Alors Jésus te dit: «Viens!»","Car c’est l’instant","D’être prêt pour le festin."]],[0,["L’état mondial nous révèle aussi","Que Jésus vient bientôt.","Lorsque tout va s’accomplir,","Ta délivrance viendra d’en-haut.","Dans les ténèbres profondes,","Brillera l’Etoile du matin."]],[0,["Oui, c’est l’instant","D’être prêt pour le festin."]],[0,["Que mon cœur attend ce règne","Sans mort et sans destruction.","Passées seront les choses anciennes:","C’est une nouvelle création.","Là, je pourrai rencontrer Jésus","Mon Roi, et tous les Saints ...","Oui, c’est l’instant","D’être prêt pour le festin."]]]},{"n":147,"t":"Connais-tu l’Agneau de Dieu qui purifie,","s":[[0,["Connais-tu l’Agneau de Dieu qui purifie,","Par Son Sang, es-tu déjà lavé?","Ton habit est-il pur, aussi blanc que neige","Es-tu lavé dans le Sang de l’Agneau?"]],[1,["Es-tu lavé dans le Sang,","Dans le Sang de Jésus, ton Sauveur?","Ton habit est-il pur, aussi blanc que neige","Es-tu lavé dans le Sang de l’Agneau?"]],[0,["Ôte donc ton habit souillé de péchés,","Sois lavé dans le Sang de l’Agneau;","Plonge ton âme impure dans la fontaine sacrée.","Sois lavé dans le Sang de l’Agneau!"]],[1,["Oh, sois lavé dans le Sang,","Dans le Sang de Jésus, ton Sauveur.","Ton habit sera pur, aussi blanc que neige.","O sois lavé dans le Sang de l’Agneau!"]]]},{"n":148,"t":"Romps-nous le pain de vie! Que Ta bonté,","s":[[0,["Romps-nous le pain de vie! Que Ta bonté,","Seigneur, nous rassasie de vérité!","Amour qui nous fait vivre, révèle-Toi!","Parle dans le saint Livre à notre foi!"]],[0,["O Toi dont la clémence créa du pain","Pour une foule immense, mourant de faim.","Vois, Ton peuple se presse autour de Toi...","Secours notre détresse et notre foi!"]],[0,["C’est Toi le Pain de vie, Verbe puissant!","C’est de Ta chair meurtrie, c’est de Ton sang","Que notre âme doit vivre... Ah! Donne-Toi","Par l’Esprit et le Livre à notre foi!"]],[0,["Tu bénis Tes apôtres, puis, à leur tour,","Ils portèrent à d’autres Ton grand Amour","O Parole féconde, que notre foi","T’offre à ce pauvre monde qui meurt sans Toi!"]]]},{"n":149,"t":"Debout sur les promesses de Christ mon Roi,","s":[[0,["Debout sur les promesses de Christ mon Roi,","Qu’à travers les âges, Sa louange soit!","Je chante et j’adore, je loue et je crois.","Debout sur les promesses de Dieu."]],[1,["Debout! Debout!","Debout sur les promesses de Dieu mon Sauveur.","Debout! Debout!","Je me tiens sur les promesses de Dieu"]],[0,["Debout sur les promesses qui me soutiennent,","Je tiens ferme dans la liberté sereine.","Jésus m’en a fait don, et elle est bien mienne.","Debout sur les promesses de Dieu."]],[0,["Debout sur les promesses de Dieu.","Je vois le Sang de Jésus-Christ répandu pour moi","Pureté parfaite est donné à ma foi;","Debout sur les promesses de Dieu."]],[0,["Debout sur les promesses de Jésus-Christ.","Je crois et je vois Sa main qui me guérit.","C’est Lui qui me baptise du Saint-Esprit.","Debout sur les promesses de Dieu."]],[0,["Debout sur les promesses de mon Seigneur,","Uni à Lui pour toujours avec ferveur;","Par l’épée du Saint-Esprit plus que vainqueur!","Debout sur les promesses de Dieu."]]]},{"n":150,"t":"Dans mon cœur, chante un amour","s":[[0,["Dans mon cœur, chante un amour","Amour de mon sauveur","Dans mon cœur, chante un amour","Qui fait tout mon bonheur"]],[0,["C’est pour moi qu’il fut tant maltraité","Pour moi qui ne mérite rien","C’est pour moi qu’il fut tant maltraité","Pour moi, oui Seigneur, oui pour moi"]],[0,["C’est pour moi qu’il a tant souffert","Pour moi qui ne mérite rien","C’est pour moi qu’il a tant souffert","Pour moi, oui Seigneur, oui pour moi"]],[0,["C’est pour moi qu’il fut crucifié","Pour moi qui ne mérite rien","C’est pour moi qu’il fut crucifié","Pour moi, oui Seigneur, oui pour moi","C’est pour moi qu’il est ressuscité","Pour moi qui ne mérite rien","C’est pour moi qu’il est ressuscité","Pour moi, oui Seigneur, oui pour moi"]],[0,["C’est pour moi qu’il est glorifié","Pour moi qui ne mérite rien","C’est pour moi qu’il est glorifié","Pour moi, oui Seigneur, oui pour moi"]],[0,["C’est pour moi que Jésus reviendra","Pour moi qui ne mérite rien","C'est pour moi que Jésus reviendra","Pour moi, oui Seigneur, oui pour moi"]]]},{"n":151,"t":"Dieu Tout-Puissant, quand mon cœur considère","s":[[0,["Dieu Tout-Puissant, quand mon cœur considère","Tout l’univers créé par Ton pouvoir;","Le ciel d’azur, les éclairs, le tonnerre,","Le clair matin et les ombres du soir:","De tout mon être alors s’élève un chant:","Dieu Tout-Puissant, que Tu es grand!"]],[0,["Quand par les bois ou la forêt profonde,","J’erre et j’entends tous les oiseaux chanter","Quand sur les monts, la source avec son onde","Livre au zéphyr son chant doux et léger:","Mon cœur heureux s’écrie à chaque instant","Dieu d’Amour, que Tu es grand!"]],[0,["Mais quand je songe, ô sublime mystère,","Qu’un Dieu si grand a pu penser à moi;","Que Son cher Fils est devenu mon frère,","Et que je suis l’héritier du grand Roi:","Alors mon cœur redit la nuit, le jour:","Que Tu es bon, ô Dieu d’Amour!"]],[0,["Quand mon Sauveur, éclatant de lumière,","Rayonnera de Sa gloire éternelle;","Et que laissant les douleurs de la terre,","Je verrai les splendeurs de Son beau ciel:","Je redirai alors, la nuit, le jour:","Rien n’est plus grand que Ton Amour!"]]]},{"n":152,"t":"Le Dieu Puissant c’est Jésus,","s":[[0,["Le Dieu Puissant c’est Jésus,","C’est le Prince de Paix,","Le Père de l’Éternité","Et le Roi de beauté.","I e Merveilleux en Sagesse","Par qui toute chose est faite,","I a Plénitude divine","En Jésus incarnée."]],[1,["Tout est en Lui, tout est en Lui,","La plénitude divine est tout en Lui,","Tout est en Lui, tout est en Lui","Jésus est Dieu Tout-Puissant","Et tout est en Lui,"]],[0,["Emmanuel: Dieu avec nous,","Jéhovah l’Éternel,","L’Esprit tout omniprésent","Qui remplit l’univers,","Le Grand Sacrificateur","Et l’Agneau des pécheurs,","L’Auteur de la rédemption.","Que béni soit Son Nom!"]],[0,["Le Commencement et la fin,","L’Alpha et l’Oméga,","La vraie Parole incarnée,","L’Ami des rachetés,","La Sagesse et perfection,","Ma Justice et Puissance,","Tout ce dont j’ai le besoin,","Je le trouve en Sa main."]],[0,["“Le Dieu que nous attendions”","Sera la gaie chanson","De l’Israël revenu","Quand paraîtra Jésus.","Il viendra pour délivrer,","Notre Agneau immolé.","La plénitude est en Lui,","Le vainqueur de la nuit."]]]},{"n":153,"t":"Dieu vient chercher Son Aimée:","s":[[0,["Dieu vient chercher Son Aimée:","Elle sera à Ses côtés.","Dieu travaille une fois","Encore dans mon cœur.","Oh, soit prêt, mon tendre ami,","Car ce monde est bientôt fini."]],[1,["Dieu travaille une fois","Encore en mon cœur.","Pour accomplir Ses promesses,","Nous accorder la sagesse,","Dieu travaille une fois","Encore en mon cœur."]],[0,["Mon corps était affaibli:","Il m’a béni et guéri.","Dieu travaille une fois","Encore en mon cœur.","Quand je Le prie chaque jour,","Il m’accorde Son amour."]]]},{"n":154,"t":"Entre deux chemins, large ou étroit,","s":[[0,["Entre deux chemins, large ou étroit,","Je prends celui de Jésus.","Même s’il doit passer par la Croix,","Je choisis celui de Jésus."]],[1,["Chemin si raide et si étroit,","Par monts, par vaux, rude par endroits.","C’est le chemin du plein salut,","Rempli de l’amour de Jésus."]],[0,["Large est le chemin des faux plaisirs,","Je prends celui de Jésus.","Vivre près de Dieu, mon seul désir,","Je choisis celui de Jésus."]],[0,["Ton chemin, ô monde, est si trompeur,","Je prends celui de Jésus.","Il conduit aux plus riches splendeurs;","Je choisis celui de Jésus."]],[0,["Malgré les épines du chemin,","Je prends celui de Jésus,","Et j’y marche tenu par Sa main","Merveilleux chemin de Jésus!"]]]},{"n":155,"t":"Établi sur les promesses de Christ mon Roi","s":[[0,["Établi sur les promesses de Christ mon Roi","A travers les âges, la louange va,","Gloire aux lieux très hauts!","Je veux chanter la Foi,","Scellé sur les promesses de Dieu."]],[1,["Scellé, scellé,","Scellé sur les promesses de Dieu,","Mon Sauveur.","Scellé, scellé,","Je suis scellé sur les promesses de Dieu."]],[0,["Scellé sur une promesse qui ne peut faillir,","Quand rugit la peur et le doute en mon cœur,","Par la Parole vivante du Seigneur,","Je triompherai par la Promesse."]],[0,["Scellé sur les promesses, oui, je puis croire","Que le Sang m’a lavé et donne la victoire.","Je me tiens debout et dans la liberté","Que Christ m’a donné et veux chanter."]],[0,["Scellé sur les promesses de Christ le Seigneur","Lié avec Lui par les cordes d’amour,","Je serai vainqueur par l’Épée de l’Esprit,","Scellé sur les promesses de Dieu."]],[0,["Scellé sur les promesses, je ne puis tomber,","Car j’entends l’Esprit sans cesse me parler.","Mon Sauveur me tient, je me laisse porter,","Scellé sur les promesses de Dieu!"]]]},{"n":156,"t":"Ah! Qu’il est beau de voir des frères","s":[[0,["Ah! Qu’il est beau de voir des frères","D’un même Amour unis entre eux.","Esprit de Dieu, Tu les éclaires,","Tu les embrases de Tes feux.","Leurs chants pieux et leurs prières","Comme un encens montent aux cieux,","Leurs chants pieux et leurs prières","Comme un encens montent aux cieux."]],[0,["O Rédempteur, en Ta présence,","Dans Ta sainte communion,","Ils savourent la jouissance","D’une céleste affection.","Aussi leurs cœurs en assurance","T’offrent leur adoration,","Aussi leurs cœurs en assurance","T’offrent leur adoration."]],[0,["Dans tous les lieux la même Vie","Anime tous Tes rachetés,","Partout leur âme est réjouie","De Tes douces gratuités.","Oui, Ton Église est enrichie","De Tes magnifiques bontés,","Oui, Ton Église est enrichie","De Tes magnifiques bontés."]],[0,["Répands sur nous, Dieu charitable!","Ton Esprit de grâce et de paix,","Accueillis à la même table","Et goûtant les mêmes bienfaits,","Qu’un amour saint et véritable","Nous unisse en Toi pour jamais,","Qu’un amour saint et véritable","Nous unisse en Toi pour jamais."]]]},{"n":157,"t":"L’Amour de Jésus-Christ nous presse:","s":[[0,["L’Amour de Jésus-Christ nous presse:","Il s’est livré pour Son troupeau;","À suivre les pas de l’Agneau,","L’un l’autre animons-nous sans cesse."]],[0,["Au nom du Rédempteur, chers frères,","Donnons-nous tous ici la main,","Pour ne marcher jusqu’à la fin","Que sous Ses regards tutélaires."]],[0,["Vois Tes enfants, Dieu notre Père,","Qui se consacrent à Ton Fils.","Viens à notre aide et nous remplis","D’amour, de zélé et de lumière."]],[0,["Qu’en nous quittant, Sauveur fidèle,","Nous demeurions unis en Toi;","Habite en nos cœurs par la foi,","Et que l’Esprit nous renouvelle!"]]]},{"n":158,"t":"Je chante sur le chemin,","s":[[0,["Je chante sur le chemin,","Conduisant les cœurs","Au Calvaire où coule à plein","Le Ruisseau vainqueur. .","Bien des flèches m’ont blessé,","Mon Seigneur le sait.","Il dirige, Il conduit, et moi je Le suis."]],[1,["Je désire Le voir, Le voir face à face,","Et chanter pour toujours","Sa divine grâce.","Dans les rues pavées d’or,","Élever ma voix.","Les soucis sont finis, je suis à l’abri."]],[0,["Quand les flots rugissent encore,","Du fond de l’abîme,","Le Sauveur prend en main","La barre divine.","Lui seul me dirigera","En vallée d’en bas;","Mais je serai bientôt arrivé là-haut"]],[0,["An service de mon Dieu,","La nuit peut sembler","Si sombre que je ne peux","Plus voir mon sentier","Je me rapproche de Lui:","Il m’éclaire alors.","Unissant nos efforts, me conduit au port."]],[0,["Du fin fond de la vallée,","Je vois les glaciers.","Il m’est donné d’entrevoir","Le Seigneur de gloire.","Il est armé de l’Épée,","Conduit la mêlée,","Et je suis protégé: gloire à mon Rocher!"]]]},{"n":159,"t":"Jésus est mon divin Berger,","s":[[0,["Jésus est mon divin Berger,","Réjouis-toi, mon âme!","Seul Il délivre du danger,","Tout en moi Le réclame!"]],[0,["Non, je ne manquerai de rien,","Car, ô grâce infinie,","Jésus est l’Ami, le Gardien,","En qui je me confie."]],[0,["Jour après jour, Il me conduit","Dans Ses verts pâturages.","De Son amour, Il me nourrit","Sous Ses divins ombrages."]],[0,["Je ne craindrai donc aucun mal","Quand, au bout du voyage,","Il me faudra, du sombre val","Franchir le noir passage."]],[0,["Toujours Sa grâce et Son amour","Me suivent sur la terre;","Mais tout sera, dans Son séjour,","Paix, Gloire, Amour, Lumière."]]]},{"n":160,"t":"Je marche à la lumière de Jésus,","s":[[0,["Je marche à la lumière de Jésus,","Aucun nuage ne peut obscurcir","Celui que mon cœur ne cesse de bénir","Pour les péchés qu’il a vaincus."]],[1,["Je marche à la lumière de Jésus,","Et j’écoute Sa douce voix","Non rien, plus rien ne peut me séparer","De l’Amour de mon divin Roi!"]],[0,["Je marche à la lumière de Jésus,","Lui adressant cette prière:","«Puissé-je moi aussi être une lumière","Pour ce monde qui est perdu»"]]]},{"n":161,"t":"Je voguais en nuit obscure,","s":[[0,["Je voguais en nuit obscure,","Pauvre pécheur condamné.","Je marchais en route impure,","Mais Jésus-Christ m’a cherché."]],[1,["Oui, je sais, oui, je sais","Que Jésus vient racheter tous les pécheurs.","Oui, je sais, oui, je sais","Que Son Sang a purifié mon pauvre cœur."]],[0,["Maintenant, je suis Son enfant,","Son pouvoir m’a transformé,","Son amour m’a rempli de chants","Et Sa paix m’a consolé."]],[0,["« Viens à Moi », te dit Jésus,","Ton ami, ton Rédempteur.","Je ne te condamnerai plus:","Seulement, donne-Moi ton cœur."]]]},{"n":162,"t":"Jésus est mon Roi souverain.","s":[[0,["Jésus est mon Roi souverain.","Ma joie, c’est de chanter Son bien.","Me cherchant dans tous les déserts,","Jésus a fait de moi Son frère.","Quittant le trône de Sa gloire,","Il m’a retiré de la boue.","Je suis joyeux, je suis heureux,","Je suis heureux en Lui."]],[0,["Jésus est mon sincère Ami:","Dans l’ombre et lumière Il me suit,","Patient et humble à mes côtés,","Il m’aime et veut me racheter.","Aussi, je Le suis constamment,","Car Il détruit tous mes tourments.","Je suis joyeux, je suis heureux,","Je suis heureux en Lui."]],[0,["Seigneur, que puis-je Te donner","Pour tant d’amour manifesté!","Il me plaît de bien Te servir","Et de Te confier l’avenir.","Veuille accepter mon humble vie:","À Toi seul je serai soumis.","Je suis joyeux, je suis heureux","Je suis heureux par Lui."]]]},{"n":163,"t":"Serrons nos rangs autour du Maître.","s":[[0,["Serrons nos rangs autour du Maître.","Soyons unis, la victoire est à nous;","Par notre amour, faisons à tous connaître","De notre Dieu combien le joug est doux."]],[1,["Frères, frères, Son nom est Amour;","Frères, frères, aimons-nous toujours."]],[0,["C’est par amour qu’il entra dans notre âme,","C’est par amour qu’il lave nos péchés;","Nous embrasant d’une céleste flamme,","Que Son amour nous retienne attachés."]],[0,["Amour, amour! Insondable mystère","Qui nous unit, et tous ensemble à Dieu!","Amour, amour, si doux sur cette terre,","Amour, amour, oh! Que sera-ce aux cieux?"]]]},{"n":164,"t":"Jésus, Jésus, je T’aime, (ter)","s":[[1,["Jésus, Jésus, je T’aime, (ter)","Jésus, Jésus mon Roi!"]],[0,["Tu souffris sur la croix pour moi,","Moi, si petit, aimé d’un Roi!","Tu voulais me faire vivre en Toi,","Jésus, Jésus, mon Roi."]],[0,["Pourrais-je oublier mon Roi,","Mon Roi si tendre est mort pour moi!","Je veux toujours suivre Sa voie,","Jésus, Jésus, mon Roi"]],[0,["Et maintenant, Tu vis en gloire,","Tu m’as donné ce grand espoir","Que bientôt, je verrai mon Roi,","Jésus, Jésus, c’est Toi."]]]},{"n":165,"t":"Jésus, mon Sauveur, coule dans mon cœur.","s":[[0,["Jésus, mon Sauveur, coule dans mon cœur.","Source de grâce, ôte mes douleurs.","En Toi, je puise la Vie pour moi.","Seigneur, je veux être ancré en Toi."]],[0,["Ancré en Toi, ancré en Toi","O Fleuve de grâce, répands-Toi sur moi","Ancré en Toi, ancré en Toi","O Fleuve de grâce, verse tes flots sur moi."]],[0,["Fleuve de puissance, inonde mon cœur.","Sur le péché Tu restes vainqueur.","Abreuve-moi de jour et de nuit;","Ancré en Toi, pour porter du fruit."]]]},{"n":166,"t":"Béni soit le lien","s":[[0,["Béni soit le lien","Qui nous unit en Christ,","Le saint amour, l’amour divin","Que verse en nous l’Esprit!"]],[0,["Au ciel, vers notre Dieu,","Avec joie et ferveur,","S'élèvent nos chants et nos vœux,","Parfum doux au Seigneur."]],[0,["Nous mettons en commun","Nos fardeaux, nos labeurs;","En Jésus nous ne sommes qu’un","Dans la joie et les pleurs!"]],[0,["Si nous devons bientôt","Quitter ces lieux bénis,","Nous nous retrouverons là-haut,","Pour toujours réunis."]]]},{"n":167,"t":"La lutte suprême nous appelle tous,","s":[[0,["La lutte suprême nous appelle tous,","Et Jésus Lui-même marche devant nous.","One Sa vue enflamme tous Ses combattants","Et soutienne l’âme des plus hésitants."]],[1,["Du Christ la bannière se déploie au vent","Pour la Sainte guerre, soldats, en avant!"]],[0,["L’ennemi redoute le Nom seul du Roi,","Il fuit en déroute au cri de la foi.","Acclamons ensemble Jésus d’un seul cœur,","Et que l’enfer tremble à ce Nom vainqueur!"]],[0,["Nous suivons la trace des saints d’autrefois,","Par la même grâce, sous les mêmes lois.","Vivant de miracles, l’Eglise de Dieu","De tous les obstacles triomphe en tous lieux"]],[0,["Que les ans s’écoulent, que de toutes parts,","A grand bruit s’écroulent trônes et remparts.","Notre citadelle, ferme contre tout,","L’Eglise fidèle, restera debout!"]],[0,["Reçois, Chef suprême, Monarque éternel,","D’un peuple qui T’aime le vœu solennel.","Gloire, amour, hommage, au Ressuscité,","Qu’Il soit d’âge en âge partout exalté!"]]]},{"n":168,"t":"Le Nom de mon Sauveur et Maître","s":[[0,["Le Nom de mon Sauveur et Maître","M’est bien plus précieux que l’or.","Il remplit de paix tout mon être,","Il vaut plus que tous les trésors."]],[1,["Ton Nom est gravé dans mon cœur","Ton Amour calme ma douleur.","O Jésus, Ami si fidèle,","Ton Nom est gravé dans mon cœur."]],[0,["Quand l’ennemi cruel me tente,","S’obstine à me décourager,","Tu sais répondre à mon attente,","Ton Nom vient me fortifier."]],[0,["Ton Nom, ô Jésus, me délivre","De la dette de mes péchés,","Guérit peines et maladies,","Je veux Te rester attaché."]]]},{"n":169,"t":"Mon cœur est plein de joie,","s":[[0,["Mon cœur est plein de joie,","Je suis l’enfant de Dieu,","Jésus le dit et je le crois.","Je sais qu’il est venu pour moi,","Pour moi, Il est mort sur la Croix.","Je suis l’enfant de Dieu!"]],[1,["Oh, Alléluia! Mes péchés sont effacés,","Jésus vit en moi, Je Lui appartiens.","Oh! Alléluia! Je suis né du Saint-Esprit !","Je suis l’enfant de Dieu!"]],[0,["Tous les liens du passé","Ont été déliés,","Plus rien ne me tient prisonnier.","Quelle merveilleuse liberté!","A Jésus je suis attaché,","Je suis l’enfant de Dieu!"]],[0,["A une source claire,","Je bois à plein gosier,","Le Dieu de Jésus est mon Père;","Comment ne pas le glorifier?","Avec Lui, je suis si joyeux!","Je suis l’enfant de Dieu !"]]]},{"n":170,"t":"Nous avons déclaré la guerre","s":[[0,["Nous avons déclaré la guerre","Aux démons, à tout péché.","Nous voulons à toute la terre","Proclamer la liberté."]],[1,["Nous marchons avec assurance,","Nous qui devons porter l'espérance.","Vaine est toute résistance,","Jésus-Christ sera vainqueur."]],[0,["Le salut, notre cri de guerre,","La foi, notre bouclier,","Et notre force, la prière,","Nous ferons tout surmonter!"]],[0,["Bien des pécheurs, dans cette guerre,","Au Sauveur se sont rendus;","Et maintenant, dans la lumière,","Ils combattent pour Jésus."]],[0,["Dieu nous donne la victoire","Par Son Tout-puissant Esprit;","Rendons-Lui donc toute la gloire,","Et servons-Le jour et nuit."]]]},{"n":171,"t":"Unissons nos cœurs et nos voix","s":[[0,["Unissons nos cœurs et nos voix","Pour célébrer le Roi des rois","Qui mourut pour nous sur la croix,","Victime expiatoire!"]],[1,["Béni soit le jour du Seigneur,","Jour de triomphe et de bonheur!","Que partout monte en Son honneur","Un hymne de victoire!"]],[0,["Il vit, Il est ressuscité!","Rayonnant d’immortalité!","Du sépulcre Il est remonté","Vers Son trône de gloire!"]],[0,["Du haut de Son trône, Il sourit","Au pécheur qui pleure, contrit:","Et la clarté de Son Esprit","Dissipe la nuit noire."]],[0,["Ah! Que nos regards, en ce jour,","Le cherchent au divin séjour!","C’est là qu’Il attend, plein d’amour,","Quiconque en Lui veut croire."]]]},{"n":172,"t":"Oh, merveilleuse délivrance,","s":[[0,["Oh, merveilleuse délivrance,","Sous le précieux sang de l’Agneau!","Je loue de Jésus la démence,","Il a pris sur Lui mes fardeaux."]],[1,["Sauvé! Sauvé!","Libre par le sang de l’Agneau","Sauvé! Sauvé!","Il a pris sur Lui mes péchés."]],[0,["Libéré de toute souillure,","Je goûte un si parfait bonheur;","Avec Jésus, ma marche est sûre,","En chantant l’Amour de mon Sauveur."]],[0,["De tous mes liens enfin libre,","De sainte lumière rempli,","Et du vrai bonheur mon cœur vibre","Sous la puissance de l’Esprit."]]]},{"n":173,"t":"O pauvre cœur, qui toujours craint,","s":[[0,["O pauvre cœur, qui toujours craint,","Las de lutter en vain,","De doutes rongé,","Et si découragé,","Espère, ami, car Ton Sauveur","Veut restaurer ton cœur;","Si seulement tu peux croire","Que tu verras Sa gloire"]],[1,["Oui, la puissance de ton Sauveur","Est sans limites, reprends espoir!","Tous Ses miracles, tu peux les voir,","Si tu peux croire, de tout ton cœur !"]],[0,["Es-tu lassé de lourds fardeaux?","Dépose-les plutôt","Aux pieds de Jésus,","Ami, ne doute plus:","Du cœur qui se confie en Lui,","Il bannit les soucis;","Si seulement tu peux croire","Que tu verras Sa gloire."]]]},{"n":174,"t":"Oh! Voyez combien le monde nous envie","s":[[0,["Oh! Voyez combien le monde nous envie","La joie et la paix inondent notre cœur.","C’est la Gloire du Seigneur qui vivifie,","Et qui nous remplit de Son parfait bonheur"]],[1,["Alléluia! Alléluia!","Alléluia! Mes péchés sont pardonnés!","Oui, c’est Jésus qui nous sauve,","Et qui veut faire autant pour toi que pour moi"]],[0,["Aujourd’hui mon frère, ma sœur, c’est jour de grâce,","N’hésite pas, mais donne ton cœur à ton Sauveur","Tu verras comme il est bon d’être avec Jésus,","Il le remplira de Son parfait bonheur."]],[0,["Aujourd’hui, Il vous appelle, vous, les brebis"]],[1,["[perdues!"]],[0,["Jésus-Christ est le Berger, le Bon Berger,","Il veut vous sauver, aussi vous guérir,","Soyez prêts à recevoir notre Seigneur."]]]},{"n":175,"t":"Moment si doux de la prière,","s":[[0,["Moment si doux de la prière,","Où Dieu, m’élevant jusqu’à Lui,","Se révèle à moi comme un Père,","Comme un Sauveur, comme un Appui."]],[0,["Oh! Oui, je t’aime, heure bénie!","Je te désire avec ardeur,","Car déjà souvent dans la vie","Tu m’as sauvé du tentateur."]],[0,["C’est toi, doux moment de prière,","Qui me transportes jusqu’aux cieux,","Où Jésus, mon ami, mon frère,","Lui-même présente mes vœux."]],[0,["Déjà souvent dans la tristesse","Tu fus ma force et mon espoir;","Pour qui te recherche sans cesse","Jamais il n’est de ciel trop noir."]]]},{"n":176,"t":"Plein de zèle, fils de Dieu,","s":[[0,["Plein de zèle, fils de Dieu,","Parle de Lui, parle de Lui.","Viens, témoigne en tout lieu,","Parle de Lui."]],[1,["Mène les âmes à la Croix","Où le Sang fut répandu.","Qu’elles écoutent et fassent leur choix","Pour Jésus."]],[0,["Prêche le Nom de Jésus,","Parle de Lui, parle de Lui.","En Lui seul est le salut,","Parle de Lui","Apporte la bonne nouvelle,","Parle de Lui, parle de Lui.","Ton salaire sera éternel,","Parle de Lui."]]]},{"n":177,"t":"Prends-moi par la main, mon Père,","s":[[0,["Prends-moi par la main, mon Père,","Tu es mon repos;","Pour la vie, sois mon refuge,","Surveille-moi d’En-Haut;","Sauve-moi, quand je sombre,","Car je T’appartiens.","Pour que jamais je ne m’égare,","Prends-moi par la main."]],[1,["Prends-moi par la main, mon Père (bis)","Pour que jamais je ne m’égare,","Prends-moi par la main."]],[0,["Prends-moi par la main, mon Père","Dans la sombre nuit.","Sois l’Etoile qui toujours","Guide mes pas indécis.","Toi seul, je veux suivre","Au Séjour divin,","Ton amour peut m’y conduire,","Prends-moi par la main."]],[0,["Prends-moi par la main, mon Père,","En partant d’ici.","Accorde-moi donc Ta grâce,","Quand vers Toi je fuis.","Donne-moi Ton repos,","Loin du monde malin.","Emmène-moi aux Cieux. ô Père,","Prends-moi par la main."]]]},{"n":178,"t":"Près du Trône de la grâce et de la paix,","s":[[0,["Près du Trône de la grâce et de la paix,","J’ai reçu la promesse d’un Dieu parfait.","En Jésus est la victoire,","Par Sa mort expiatoire.","Près du Trône de la grâce et de la paix."]],[1,["Viens, mon frère.","Viens au Trône de la grâce.","Viens aussi, ma sœur,","Chacun trouve une place","Au pied de la croix,","Faites votre choix."]],[1,["Oh! Ne voulez-vous pas","Venir avec moi?"]],[0,["Fuis vain monde, vanité des vanités.","Point de paix pour Pâme des frivolités.","Par toi, Satan nous opprime,","Nous conduisant à l’abîme.","Fuis vain monde, vanité des vanités."]],[0,["Je veux être un vaillant soldat du Seigneur","Lutter, combattre, toujours avec ferveur.","Et rempli de confiance,","J’accepterai la souffrance.","Je veux être un vaillant soldat du Seigneur"]],[0,["Quand devant moi s’ouvriront les Portes d’or,","Et qu’enfin j’atteindrai le céleste Port;","Un bonheur pur et sans ombre","Remplacera la nuit sombre.","Quand devant moi s’ouvriront les Portes d’or."]]]},{"n":179,"t":"Je m’approche de Toi, (bis)","s":[[0,["Je m’approche de Toi, (bis)","Source de vie, (bis)","Mon Sauveur, bénis-moi!"]],[0,["Fais silence en mon cœur, (bis)","Viens et me parle, (bis)","O mon divin Sauveur!"]],[0,["Rends-moi conforme à Toi, (bis)","Divin Modèle, (bis)","Mets Ton image en moi!"]],[0,["Rends-moi bouillant, Seigneur! (bis)","Pour Ton service, (bis)","Que je parte en vainqueur!"]],[0,["Et quand Tu reviendras, (bis)","Dans Tes milices, (bis)","Tu me retrouveras!"]]]},{"n":180,"t":"Quel bonheur de marcher avec Lui! (bis)","s":[[0,["Quel bonheur de marcher avec Lui! (bis)","Il conduira tous les pas","De mon voyage ici-bas,","Quel bonheur de marcher avec Lui!"]],[0,["Alléluia! Gloire à Son saint Nom! (bis)","Le Seigneur m’a racheté,","Dans Son Sang, Il m’a lavé.","Alléluia! Gloire à Son saint Nom!"]],[0,["Alléluia! Jésus me guérit! (bis)","Il guérit parfaitement,","Me libère entièrement.","Alléluia! Jésus me guérit!"]],[0,["Il me baptise de son Esprit! (bis)","Il me rend tellement heureux,","En me baptisant de Feu.","Il me baptise de son Esprit!"]],[0,["Avec Lui, je monte toujours plus haut (bis)","Jésus est le Bon Berger,","Je ne crains aucun danger.","Avec Lui, je monte toujours plus haut!"]],[0,["Alléluia! Gloire à Son saint Nom! (bis)","Bientôt, Jésus reviendra,","Dans Son règne, Il me prendra.","Alléluia! Gloire à Son saint Nom!"]]]},{"n":181,"t":"Mon Dieu, mon Père, écoute-moi,","s":[[0,["Mon Dieu, mon Père, écoute-moi,","Car ma prière s’élève à Toi.","En Jésus-Christ, Tu nous l’as dit,","Je puis, Seigneur, T’ouvrir mon cœur.","Ah! Fais-moi grâce, Dieu tout-puissant!","Tourne Ta face vers Ton enfant."]],[0,["Viens, je Te prie, change mon cœur;","Guide ma vie loin de l’erreur.","Mon seul désir est de choisir","La bonne part sous Ton regard.","Que mon offense ne lasse plus","Ta patience, Seigneur Jésus!"]],[0,["Fais-moi comprendre Ta charité","Et bien entendre Ta vérité.","Oui, que Ta main, sur mon chemin,","Soit, ô Dieu fort, mon seul support!","Que Ta puissance soit chaque jour","Ma délivrance, O Dieu d’amour!"]],[0,["Rends-moi fidèle par Ton secours,","Et sous Ton aile tiens-moi toujours;","Loin du danger, O bon Berger!","Conduis mes pas jusqu’au trépas.","Vois ma faiblesse et me soutiens","Par Ta tendresse: je T’appartiens."]]]},{"n":182,"t":"Mon Dieu, plus près de Toi,","s":[[0,["Mon Dieu, plus près de Toi,","Plus près de Toi!","C’est le mot de ma foi:","Plus près de Toi!","Dans le jour où l’épreuve","Déborde comme un fleuve,","Garde-moi près de Toi,","Plus près de Toi."]],[0,["Plus près de Toi, Seigneur,","Plus près de Toi!","Tiens-moi dans ma douleur","Tout près de Toi!","Alors que la souffrance","Fait son œuvre en silence,","Toujours plus près de Toi,","Seigneur, tiens-moi!"]],[0,["Plus près de Toi, toujours","Plus près de Toi!","Donne-moi Ton secours,","Soutiens ma foi!","One Satan se déchaîne,","Ton amour me ramène","Toujours plus près de Toi,","Plus près de Toi."]],[0,["Mon Dieu, plus près de Toi!","Dans le désert","J’ai vu, plus près de Toi,","Ton ciel ouvert.","Pèlerin, bon courage!","Ton chant brave l’orage.","Mon Dieu, plus près de Toi,","Plus près de Toi."]]]},{"n":183,"t":"Triomphons, chantons d’allégresse,","s":[[0,["Triomphons, chantons d’allégresse,","Réjouissons-nous devant Dieu!","Qu’un chant de louanges sans cesse,","A Sa gloire monte en tout lieu!"]],[1,["Triomphe, triomphe,","Tressaille de joie en ton Dieu !"]],[0,["Chantons à celui qui S’avance","Dans les cieux, les deux éternels,","Il fait entendre avec puissance","Sa voix, c’est le Dieu d’Israël!"]],[0,["Il donne à Son peuple victoire,","Puissance, force, liberté.","A notre Dieu, rendons la gloire,","Louons Sa Sainte Majesté!"]],[0,["De concert avec les saints anges,","Faisons retentir notre voix.","Chantons à jamais les louanges,","De l’Agneau divin mis en Croix."]]]},{"n":184,"t":"J’ai soif de Ta Présence,","s":[[0,["J’ai soif de Ta Présence,","Divin chef de ma foi;","Dans ma faiblesse immense","Que ferais-je sans Toi?"]],[1,["Chaque jour, à chaque heure,","Oh! j'ai besoin de Toi;","Viens, Jésus, et demeure","Auprès de moi."]],[0,["Des ennemis, dans l’ombre,","Rôdent autour de moi;","Accablé par le nombre,","Que ferais-je sans Toi?"]],[0,["Pendant les jours d’orage,","D’obscurité, d’effroi,","Quand faiblit mon courage,","Que ferais-je sans Toi?"]],[0,["O Jésus! Ta présence","C’est la vie et la paix;","La paix dans la souffrance,","Et la vie à jamais."]]]},{"n":185,"t":"Un jour, je verrai la gloire de Jésus;","s":[[0,["Un jour, je verrai la gloire de Jésus;","Quand nous serons avec Lui,","Nous Lui rendrons l’honneur","Qui Lui est dû, car il a tout accompli"]],[1,["Quelle gloire m’est réservée (bis)","De voir Jésus, et d’être à Ses côtés.","Quelle gloire pour moi,","Pour tous les rachetés."]],[0,["Pour me sauver, Il prit mon châtiment,","Subit même la mort pour moi.","Seul par Sa grâce, une couronne m’attend.","Cela me comble de joie."]],[0,["Je retrouverai tous mes bien-aimés","Chantant au milieu des anges.","Que cette atmosphère de joie spontanée","Eveille déjà nos louanges."]],[0,["J’entends le chant de la mer de cristal","Louant le Sang de Jésus","Tout l’univers se joint à cette chorale,","Ainsi que tous les élus."]]]},{"n":186,"t":"Viens donc à Jésus pour te purifier,","s":[[0,["Viens donc à Jésus pour te purifier,","Te laver dans le Sang de l’Agneau!","En Sa grâce, aujourd’hui,","Peux-tu te confier,","Bien lavé dans le Sang de l’Agneau,"]],[1,["Lave-toi dans le Sang,","Dans le Sang qui purifie ton âme","Tes vêtements sont-ils blancs,","Plus blancs que neige?","Lave-toi dans le Sang de l’Agneau."]],[0,["Chaque jour, es-tu aux côtés de Jésus,","Et lavé dans le Sang de l’Agneau","Chaque instant du jour?","Es-tu en Son amour,","Bien lavé dans le Sang de l’Agneau?"]],[0,["Quand viendra l’Époux, ta robe sera-t-elle","Bien lavée dans le Sang de l’Agneau?","Et ton âme prête","Pour le pays d’en-haut,","Bien lavée dans le Sang de l’Agneau?"]],[0,["Ce qui est terni, souillé par le péché:","Lave le dans le Sang de l’Agneau","Pour ton âme impure,","Il y a source pure:","Lave-toi dans le Sang de l’Agneau,"]],[0,["Dans la nuit a jailli ce cri:","« L’Epoux vient! »","Tends l’oreille et prie.","Que ta lampe soit allumée !","Le matin vient : voici le Bien-aimé"]],[1,["Jésus vient, Il nous l’a promis.","Sa Parole est la Vérité,","Crois en Lui,","Il est ton Sauveur !","Le matin vient, voici le Bien-aimé !"]]]},{"n":187,"t":"Viens éclairer les âmes enténébrées","s":[[0,["Viens éclairer les âmes enténébrées","Lève le flambeau! Lève le flambeau!","Éclaire tout ce qui vit dans le péché.","Lève le flambeau! Lève le flambeau!"]],[1,["Le flambeau porté par les croyants,","Lève-le, lève-le aussi.","Vers ces peuples esclaves de Satan,","Lève le flambeau de Jésus-Christ."]],[0,["Des millions attendent la Parole de Dieu,","Lève le flambeau! Lève le flambeau!","Distribue-leur les biens du Royaume des cieux.","Lève le flambeau! Lève le flambeau!"]],[0,["T’engages-tu à porter la divine lumière?","Lève le flambeau! Lève le flambeau!","Rallie-toi maintenant sous l’éclatante bannière,","Lève le flambeau! Lève le flambeau!"]]]},{"n":188,"t":"Ville de perles et de lumière,","s":[[0,["Ville de perles et de lumière,","Existant sur les hauteurs,","Personne n’a encore sur terre","Pu contempler ta splendeur."]],[1,["Là, l’Amour de Dieu éclaire,","Ce sera l’Agneau Lui-même","Dans cette ville hospitalière:","La nouvelle Jérusalem."]],[0,["C’est là où la gloire abonde,","Où l’arbre de Vie fleurit,","Où le fleuve de Vie inonde","De ses flots, ce saint abri."]],[0,["Quand les pèlerins arrivent","Épuisés des grands déserts,","Aux fontaines des eaux vives,","Quel repos leur est offert!"]],[0,["Oh, quelle joie bientôt sur terre","Quand Jésus sera présent!","Cette ville aux mille lumières","Y sera éternellement"]]]},{"n":189,"t":"Reste avec moi! C’est l’heure où le jour baisse","s":[[0,["Reste avec moi! C’est l’heure où le jour baisse","L’ombre grandit... Seigneur, attarde-Toi!","Tons les appuis manquent à ma faiblesse:","Force du faible, ô Christ, reste avec moi!"]],[0,["Le flot des jours rapidement s’écoule;","Leur gloire est vaine et leur bonheur déçoit","Tout change et meurt, tout chancelle et s’écroule...","Toi qui ne changes point, reste avec moi!"]],[0,["J’ose implorer plus qu’un regard qui passe","Viens, comme à Tes disciples, autrefois,","Plein de douceur, de tendresse et de grâce,","Et pour toujours, Seigneur, reste avec moi!"]],[0,["Viens, mais non pas armé de Ta colère.","Parle à mon cœur, apaise son émoi;","Etends sur moi Ton aile tutélaire:","Ami des péagers, reste avec moi!"]],[0,["Heure après heure, il me faut Ta présence:","Le tentateur ne redoute que Toi;","Qui donc prendrait contre lui ma défense?","Dans l’ombre ou la

 «Viens, mon enfant!»"]],[0,["Reviens à ton Père,","Ici tu péris.","Son eau désaltère:","Reviens à tout prix!","Oh! crois à Sa grâce;","Sa paix est pour toi.","Chez Lui, prends ta place,","Deviens fils du Roi!"]],[0,["Reviens à ton Père;","Reviens, c’est le port;","Reviens, et préfère","La vie à la mort.","Vois-tu, Son cœur saigne","Devant ton malheur.","Viens donc, qu’il t’étreigne","Enfin sur Son cœur!"]]]},{"n":586,"t":"Chaque instant de chaque jour,","s":[[0,["Chaque instant de chaque jour,","Jésus prend soin de moi.","Chaque instant de chaque jour,","Mon cœur est dans la joie.","Depuis que Christ m’a sauvé,","C’est le bonheur;","Libéré de mon péché,","J’ai la paix dans mon cœur."]]]},{"n":587,"t":"D’où...dit-on que Je viens?","s":[[0,["D’où...dit-on que Je viens?","Qui dit-on que Je suis?","Connaissez-vous le Père?","Connaissez-vous Son Nom?","En Jésus-Christ demeure","Plénitude de Dieu,","En Jésus est le grand “JE SUIS’’","Le Seigneur des seigneurs."]]]},{"n":588,"t":"Il est mort pour moi","s":[[0,["Il est mort pour moi","Sur la Croix du Calvaire;","Il est mort pour moi","Sur l’infâme bois;","Il est mort pour moi","Qui ne suis que misère;","Il est mort pour moi","Jésus-Christ, mon Roi."]]]},{"n":589,"t":"Il est tout pour moi (bis)","s":[[0,["Il est tout pour moi (bis)","Jésus mon Roi;","Il est mon Ami,","Il est mon Appui,","Je n’ai que Lui."]],[0,["Il est tout pour moi (bis)","Jésus mon Roi;","Il est mon Sauveur,","Et mon Rédempteur,","Mon doux Seigneur."]]]},{"n":590,"t":"J’ai saisi ma harpe,","s":[[0,["J’ai saisi ma harpe,","Pour chanter mon Dieu,","Chanter Sa victoire,","Jusque dans les cieux.","La tristesse n’est plus,","La joie est revenue;","J’ai une maison, là-haut","Dans les nues, tout près de Jésus."]]]},{"n":591,"t":"J’ai vu un saint ruisseau de Sang","s":[[0,["J’ai vu un saint ruisseau de Sang","Qui coule du Calvaire.","Ses flots qui montent droit à Dieu","Ont purifié mon cœur."]]]},{"n":592,"t":"J’ai trouvé bien loin du monde,","s":[[0,["J’ai trouvé bien loin du monde,","Un abri paisible et sûr;","Ici, le bonheur abonde,","Sous un ciel toujours d’azur!","Oh! oui, je veux dresser ma tente","Dans ce pays merveilleux,","Et toujours vivre plus près de Dieu."]]]},{"n":593,"t":"Je marche avec Jésus,","s":[[0,["Je marche avec Jésus,","Pas à pas sur l’étroit chemin.","Je marche avec Jésus,","Ma main dans Sa forte main.","Jésus me précède,","Il m’entoure et me suit;","Et sans cesse Il m’aide,","Dans la voie qui mène à la Vie."]]]},{"n":594,"t":"Je n’ai ni argent, ni or,","s":[[0,["Je n’ai ni argent, ni or,","Mais ce que j’ai, je veux te le donner:","Au Nom de Jésus-Christ","De Nazareth, lève-toi et marche!","Je marche, je saute, je loue mon Dieu.","Je marche, je saute, je loue mon Dieu.","Et au Nom de Jésus-Christ","De Nazareth, lève-toi et marche."]]]},{"n":595,"t":"Je suis un pèlerin ici,","s":[[0,["Je suis un pèlerin ici,","Un étranger.","Je vais à la Maison,","Douce Maison.","Avec les rachetés,","Toujours je chanterai:","Alléluia! Jésus, Tu m’as sauvé."]]]},{"n":596,"t":"Jésus est vivant (bis)","s":[[0,["Jésus est vivant (bis)","Par Son sang Il m’a racheté,","Par Sa force Il m’a transformé,","Une Vie nouvelle Il m’a donné.","Oui, Jésus est vivant."]],[0,["Jésus est vivant,","Pour toi maintenant,","Crois en Lui, et sois purifié,","Reçois Sa force, et sois transformé.","Confie-toi donc en Son amour,","Car Jésus est vivant."]]]},{"n":597,"t":"Jésus est un tout puissant Sauveur,","s":[[0,["Jésus est un tout puissant Sauveur,","Il nous aidera partout.","Jusqu’au bout chemin,","Il nous rend plus que vainqueurs:","Il nous aidera partout.","Frère et sœur,","Tu ne peux te sauver toi-même,","Va donc à Jésus avec tes peines,","Il te secourra,","N’est-Il pas mort pour toi?","Va donc à Jésus,","Il donne la paix."]]]},{"n":598,"t":"La voix du Seigneur m’appelle:","s":[[0,["La voix du Seigneur m’appelle:","Prends ta croix et viens, suis-moi!","Je réponds:","«Sauveur Fidèle,","Me voici, je suis à Toi!»"]],[1,["Jusqu’au bout je veux Te suivre,","Dans les bons, les mauvais jours,","À Toi pour mourir et vivre,","A Toi, Jésus, pour toujours."]],[0,["Mais le chemin du Calvaire","Est étroit et périlleux,","C’est un chemin solitaire,","Difficile et ténébreux."]],[0,["Il faut quitter ceux qu’on aime,","Savoir être mal jugé,","Endurer l’injure même,","Du monde être méprisé."]],[0,["Oui, perdre sa propre vie,","Consentir à n’être rien,","N’avoir qu’une seule envie:","Aimer Jésus, le seul bien!"]],[0,["Jésus donne grâce et gloire","Pour le suivre pas à pas,","Avec Lui, joie et victoire,","Paix et bonheur ici-bas!"]]]},{"n":599,"t":"J’entends Ta douce voix,","s":[[0,["J’entends Ta douce voix,","Jésus, je viens à Toi.","Je viens, ô Sauveur, lave-moi","Dans le sang de Ta Croix!"]],[1,["Jésus, Roi des rois,","Qui mourus pour moi,","Je veux mourir avec Toi,","Avec Toi sur la Croix"]],[0,["J’entends Ta douce voix,","Qui me dit: «Crois en Moi!»","Je crois, Seigneur, soutiens ma foi,","Tiens-moi près de Ta Croix!"]],[0,["J’entends Ta douce voix,","Elle pénètre en moi","Et me dit d’aimer comme Toi.","De l’amour de la Croix!"]],[0,["J’entends Ta douce voix,","Toi qui mourus pour moi,","Seigneur, que je m’unisse à Toi","Dans Ta mort, par la foi!"]]]},{"n":600,"t":"Il a pris mon lourd fardeau,","s":[[0,["Il a pris mon lourd fardeau,","M’a donné le repos,","Je connais la liberté,","Je suis sauvé.","Si tu veux la vraie joie,","Si tu veux la vraie foi,","Regarde simplement à Jésus.","Avec moi de tout ton cœur,","Tu loueras le Seigneur;","L’âme libre, tu chanteras: Alléluia!"]]]},{"n":601,"t":"Jésus t’invite: Viens au festin,","s":[[0,["Jésus t’invite: Viens au festin,","Déjà ta place est préparée.","Pourquoi donc attends-tu à demain,","Aujourd’hui, tu peux entrer.","Viens, Jésus t’appelle,","Décide maintenant.","Accepte la Bonne Nouvelle,","Qu’Il donne à qui la prend."]]]},{"n":602,"t":"Le bonheur et la grâce m’accompagneront","s":[[0,["Le bonheur et la grâce m’accompagneront","Tous les jours, tous les jours de ma vie.","Le bonheur et la grâce m'accompagneront","Tous les jours, tous les jours de ma vie."]],[0,["J’habiterai dans la maison de l’Éternel,","J’habiterai dans la maison du Père.","Le bonheur et la grâce m’accompagneront","Tous les jours, tous les jours de ma vie."]]]},{"n":603,"t":"Mon Jésus, je T’aime,","s":[[0,["Mon Jésus, je T’aime,","Je Te sais à moi.","Oh! quel charme extrême","Me retient à Toi!","Les plaisirs du monde","Ne m’attirent plus,","Ton amour m’inonde,","Je T’aime, ô Jésus!"]],[0,["Mon Jésus, je T’aime,","Car Tu m’as sauvé.","En T’offrant Toi-même,","Ton sang m’a lavé!","Sur la croix bénie,","Pour moi, Tu mourus.","Ta mort est ma vie,","Je T’aime, ô Jésus!"]],[0,["Qu’ici-bas je T’aime","Jusque dans la mort,","A l’heure suprême","Du dernier effort,","Ma voix expirante","Ne s’entendra plus,","Sachez que je chante:","«Je T’aime, ô Jésus!»"]],[0,["Je verrai Ta face,","Quel ravissement!","Je louerai Ta grâce","Eternellement,","Et dirai sans cesse","Avec les élus","L’hymne d’allégresse:","«Je T’aime, ô Jésus!»"]]]},{"n":604,"t":"Le Sang de Jésus-Christ (bis)","s":[[0,["Le Sang de Jésus-Christ (bis)","A purifié tous mes péchés.","Tous mes péchés (bis)","Le Sang de Jésus-Christ (bis)","A purifié tous mes péchés."]]]},{"n":605,"t":"Dans les jours où tout est joie,","s":[[0,["Dans les jours où tout est joie,","Lumière et félicité,","Quand les fleurs sur notre voie","S’ouvrent au soleil d’été,"]],[1,["Dieu peut-il compter sur nous?","Dieu peut-il compter sur nous?","Le pourra-t-il jusqu ’au bout?","Dieu peut-il compter sur nous?"]],[0,["À l’heure du sacrifice,","Qui n’a pas son Morija?...","Lorsque notre front se plisse,","Qu’en nous se livre un combat,"]],[0,["Et si l’obstacle se dresse,","Effrayant, sur le chemin,","Si notre cœur en détresse,","N’ose penser à demain,"]],[0,["Quand Dieu cherche sur la terre","Un fidèle intercesseur,","S’adonnant à la prière","Pour un monde si pécheur,"]],[0,["Par Son Esprit, par Sa grâce,","Dieu pourra compter sur moi.","Je le suivrai, quoi qu’il fasse,","Sur le chemin de la foi."]],[1,["Oui, Tu peux compter sur moi,","Car je peux compter sur Toi.","Je Te suivrai par la foi...","Oui, Tu peux compter sur moi."]]]},{"n":606,"t":"Merci, Seigneur, car Tu m’as aimé.","s":[[0,["Merci, Seigneur, car Tu m’as aimé.","Merci, Seigneur, car Tu m’as sauvé.","Merci, Seigneur, car Tu m’as donné","Ton grand salut et la liberté."]],[0,["Merci Seigneur, car Tu m’as cherché.","Merci Seigneur, car Tu m’as trouvé.","Merci Seigneur, car Tu m’as donné","Ton grand amour et la liberté."]]]},{"n":607,"t":"Merveilleux Jésus, (bis)","s":[[0,["Merveilleux Jésus, (bis)","Merveilleux Nom qu’adorent les anges,","Merveilleux Jésus, (bis)","Merveilleux Nom suprême des cieux."]],[0,["Il est Dieu pour moi (bis)","Jésus-Christ, le Sauveur de mon âme.","Je veux L’adorer, je veux Le louer","Car Il est vraiment le Véritable."]]]},{"n":608,"t":"Mets de l’huile dans ma lampe,","s":[[0,["Mets de l’huile dans ma lampe,","Et fais la briller.","Mets de l’huile","Et remplis-la bien!","Mets de l’huile dans ma lampe,","Et fais-la briller,","Et fais-la briller jusqu’au matin."]],[0,["Chante hosanna! (ter)","Pour le Roi des rois.","Chante hosanna! (ter)","Pour le Roi."]]]},{"n":609,"t":"Veux-tu briser du péché le pouvoir?","s":[[0,["Veux-tu briser du péché le pouvoir?","La force est en Christ ! (bis)","Si dans ton cœur tu veux le recevoir:","La force est dans le sang de Christ!"]],[1,["Je suis fort, fort!","Oui, plus que vainqueur,","Par le sang de Jésus!","Je suis fort, fort!","Oui, plus que vainqueur !","Par le sang de Jésus, mon Sauveur!"]],[0,["Veux-tu braver et la mort et l’enfer?","La force est en Christ ! (bis)","Jésus, d’un mot fait tomber tous tes fers:","La force est dans le sang de Christ!"]],[0,["Veux-tu marcher toujours pur, triomphant?","La force est en Christ ! (bis)","Pour te garder, Jésus est tout-puissant:","La force est dans le sang de Christ!"]],[0,["Veux-tu du Ciel t’approcher chaque jour?","La force est en Christ ! (bis)","Avec Jésus, demeurer pour toujours?","La force est dans le sang de Christ!"]]]},{"n":610,"t":"Il faut, pour Te suivre,","s":[[0,["Il faut, pour Te suivre,","Tout perdre d’abord:","On ne peut revivre","Sans subir la mort.","Bien-aimé du Père,","Tu mourus pour moi;","Je veux, au Calvaire,","Mourir avec Toi."]],[0,["Mourir à moi-même,","N’être pas compris,","Et de ceux que j’aime","Souffrir le mépris,","Sans regret, sans haine,","Renoncer à tout,","Et l’âme sereine,","Tenir jusqu’au bout!"]],[0,["Jésus nous appelle,","En avant, soldats!","L’armée immortelle","Ne recule pas!","Qu’aurions-nous à craindre","Étant rachetés?","Quel mal peut atteindre","Des ressuscités?"]],[0,["Notre guerre est sainte:","Notre arme est la croix,","Combattons sans crainte","Pour le Roi des rois.","Arrachons aux flammes","Les pécheurs perdus...","Pour sauver leurs âmes,","O Christ! Tu mourus."]]]},{"n":611,"t":"Mon cœur est aussi blanc","s":[[0,["Mon cœur est aussi blanc","Que la neige, le lis des champs.","Aussi pur que les ruisseaux,","Aussi léger que les oiseaux.","Si pur, si blanc,","Je voudrais m’envoler","Avec les anges","Vers le beau firmament."]]]},{"n":612,"t":"Oh! Il est l’Alpha et l’Oméga,","s":[[0,["Oh! Il est l’Alpha et l’Oméga,","Le Premier et le Dernier,","Le grand “JE SUIS”","Qui est, était,","Et qui va revenir.","Quoiqu’il subit la mort,","La mort de la croix,","Il vit pour toujours,","Et son Nom est JESUS."]]]},{"n":613,"t":"Oh! joie et paix du cœur,","s":[[0,["Oh! joie et paix du cœur,","Jésus est mon Sauveur.","Sa croix m’a sauvé de la mort.","Il va me guider jusqu’au port.","Oh! joie et paix du cœur,","Jésus est mon Sauveur.","Toujours, Il me rendra vainqueur.","Oui, gloire à mon Sauveur!"]]]},{"n":614,"t":"Jésus te confie","s":[[0,["Jésus te confie","Une œuvre d’amour,","Utile et bénie","Jusqu’à Son retour;","Cette sainte tâche,","Veux-tu l’accomplir","Pour Lui, sans relâche,","Sans jamais faiblir?"]],[1,["Prie, agis, jour après jour,","Sans broncher,","Suis ton Sauveur avec amour;","Sois fidèle, obéissant,","Et le Maître rendra ton travail puissant."]],[0,["Va chercher ton frère,","Esclave enlacé,","Las de sa misère,","De son noir passé;","Arrache son âme","Au plaisir trompeur,","Le salut proclame,","En Christ, ton Sauveur."]],[0,["Va vers la jeunesse,","Que le tentateur","Veut leurrer sans cesse,","Loin du vrai bonheur;","Combattant le doute,","Parle-lui d’amour;","Montre-lui la route","Du ciel, saint séjour."]],[0,["Va vers ceux qui meurent","Sans Dieu, sans espoir;","Dis à ceux qui pleurent","Quand tout semble noir:","«Jésus donne vie,","Bonheur, joie et paix","À qui se confie","En Lui, pour jamais,»"]]]},{"n":615,"t":"Semons dès l’aurore, (bis)","s":[[0,["Semons dès l’aurore, (bis)","Quand le soleil luit (bis)","Et semons encore","Lorsque vient la nuit","Dieu peut faire éclore","La fleur et le fruit."]],[1,["Bon courage, amis!","Bon courage, amis!","Nous irons joyeux","Cueillir les épis.","Bon courage, amis!","Bon courage, amis!","Nous irons joyeux","Cueillir les épis."]],[0,["Semons pour le Maître, (bis)","Parlons du Sauveur, (bis)","Semons, car peut-être","Un pauvre pécheur","Par nous pourra naître","Au seul vrai bonheur."]],[0,["La tâche est immense, (bis)","Et dur le terrain (bis)","Mais, bonne espérance!","Nul travail n’est vain","De Dieu la puissance","Fait germer le grain."]]]},{"n":616,"t":"Oui, l’Eglise est en marche (bis)","s":[[0,["Oui, l’Eglise est en marche (bis)","Sur les chemins et les sentiers,","Les monts et les vallées.","Levons nos étendards,","Agitons-les bien haut,","Car Jésus vient pour rencontrer","L’Epouse sanctifiée."]]]},{"n":617,"t":"Sur le Congo solitaire","s":[[0,["Sur le Congo solitaire","Je vais chantant ;","Voix du ciel, voix de la terre","Rendent mon cœur content.","Car tout parle de Ta grâce,","Divin Rédempteur,","Qui vins T'unir à ma race,","Pour me sauver, moi pécheur !"]],[1,["Oh ! la merveilleuse histoire !","Christ est mort pour moi !","Jésus est le Roi de gloire","Et je suis frère du Roi."]],[0,["Fini, l'horrible esclavage !","Le Dieu d'amour","Transforme l'homme sauvage,","Change la nuit en jour.","Plus de fétiche, d'idole,","Plus de mauvais sort","Pour qui croit cette parole :","« Jésus a vaincu la mort ! »"]],[1,["Oh ! la glorieuse histoire !","Christ est mort pour moi !","Jésus est le Roi de gloire","Et je suis frère du Roi."]],[0,["Là-bas, Loualaba chante :","« Il est venu ! »","Congo, que ta voix puissante,","Proclame : « Il a vaincu ! »","Toi, large Oubangui, murmure :","« Il revient bientôt ! »","Et que toute la nature","Redise comme un écho :"]],[1,["La miraculeuse histoire","Du Christ mort pour moi !","Jésus est le Roi de gloire","Et je suis frère du Roi."]]]},{"n":618,"t":"Un peu plus de Jésus,","s":[[0,["Un peu plus de Jésus,","Toujours un peu plus!","Je veux plus de Jésus","Que je n’en ai jamais eu!","Je veux plus de Son amour,","Chaque heure du jour,","Je veux plus de Jésus,","Afin de Lui donner plus"]]]},{"n":619,"t":"Vivant, vivant, mon Sauveur est vivant!","s":[[0,["Vivant, vivant, mon Sauveur est vivant!","Oui, vivant pour toujours.","Il a, dans Son amour,","Versé en moi Sa vie et Son retour.","Mon Sauveur est vivant.","Chante alléluia! Chante alléluia!","Car mon Sauveur est vivant,","Car mon Sauveur (Oui, pour toujours!)","Chante alléluia! Chante alléluia!","Car mon Sauveur est vivant.","Dieu nous aime!"]]]},{"n":620,"t":"Oh! Quel amour profond (ter)","s":[[0,["Oh! Quel amour profond (ter)","L’Amour de Dieu.","Vivre avec Jésus,","Marcher avec Lui,","Il est devenu mon cher ami.","Oh! Quel amour profond","L’Amour de Dieu."]]]},{"n":621,"t":"Un autre monde m’attend là-haut, là-haut.","s":[[0,["Un autre monde m’attend là-haut, là-haut.","Un autre monde m’attend là-haut.","Mon Sauveur va me préparer un lieu.","Un autre monde m’attend là-haut."]]]},{"n":622,"t":"Ton Nom, le plus beau Nom,","s":[[0,["Ton Nom, le plus beau Nom,","Don divin fait à la terre!","Jésus, Toi qui m’aimes,","En Toi seul, mon âme espère","Tu vis, Tu baptises, Tu guéris","Et Tu reviens","C’est à Toi que j’appartiens."]]]},{"n":623,"t":"Oh! Mon Dieu, je viens à toi.","s":[[0,["Oh! Mon Dieu, je viens à toi.","Ne n’abandonne pas.","Si je me confie à Toi,","Ne m’abandonne pas.","Oh! Mon Dieu je viens à Toi,","Ne m’abandonne pas."]]]},{"n":624,"t":"Chez mon Père là-haut.","s":[[0,["Chez mon Père là-haut.","Il y’a des places préparées.","Elles sont préparées par nous.","La vie, la vie, la vie est là-bas. (ter)","Mais il faut la foi pour y aller,"]]]},{"n":625,"t":"Eternel Dieu, nous T’adorons.","s":[[0,["Eternel Dieu, nous T’adorons.","Eternel Dieu, nous T’adorons.","En dehors de Toi,","Il n’y a plus personne.","Eternel Dieu nous Te louons."]]]},{"n":626,"t":"Flots mugissants, flots en furie,","s":[[0,["Flots mugissants, flots en furie,","Entourez-moi, je n’ai pas peur","Quoi qu’il en soit, paix infinie","Puisqu’à la barre est mon Sauveur."]],[1,["Le gouvernail de ma nacelle,","Oh! quel repos, Jésus le tient.","Si dans la nuit mon cœur chancelle,","Avec Jésus, Oui, tout est bien."]],[0,["Et vous récifs, écueils, menaces,","Qui présagez plus d’un malheur,","Calme, je puis vous voir en face,","Puisqu’à la barre est mon Sauveur."]],[0,["Jour après jour, nouveaux orages,","Nouveaux périls: point de frayeur!","Bientôt j’atteins le grand rivage,","Puisqu’à la barre est mon Sauveur."]],[0,["Avec Jésus pour mon pilote,","Pour moi tout est paix et bonheur.","En sûreté, mon esquif flotte,","Puisqu’à la barre est mon Sauveur."]]]},{"n":627,"t":"Pas à pas, dit Jésus,","s":[[0,["Pas à pas, dit Jésus,","Suis bien Mon chemin ;","Lui seul te conduira","Au bonheur sans fin.","Avance les regards","Sur Jésus","Viens auprès de Lui.","Aime ce nom : Jésus ;","Offre-Lui ta vie"]]]},{"n":628,"t":"L’Eternel est mon guide,","s":[[0,["L’Eternel est mon guide,","Mon Libérateur.","Je ne crains aucun mal.","Dans son Saint Nom,","Oui le bonheur et la grâce","M’accompagneront tous les jours de ma vie"]]]},{"n":629,"t":"L’Eternel est mon berger.","s":[[0,["L’Eternel est mon berger.","Je ne manquerai de rien.","Il restaure mon âme.","Il me dirige dans les verts pâturages,","Mon âme est délivrée."]]]},{"n":630,"t":"O! Rends-moi semblable à Toi.","s":[[0,["O! Rends-moi semblable à Toi.","Fais de moi ce que Tu voudras.","Tout mon cœur est à Toi,","Oh! Jésus mon Roi.","Oh! Rends-moi semblable à Toi."]]]},{"n":631,"t":"De Canaan quand verrons-nous","s":[[0,["De Canaan quand verrons-nous","Le céleste rivage?","Vers le Jourdain, entendez-vous?","Christ nous appelle tous.","Près de Lui, doux partage!","A l’abri de l’orage,","Nous pourrons chanter à jamais","Le cantique de paix:"]],[1,["Oh ! quel parfait bonheur,","Quel bonheur ! quel bonheur !","Oh ! quel parfait bonheur","Après tant de labeur !","Pour toujours réunie,","L'Eglise, en sa patrie,","Entonnera : Alléluia !","Gloire à toi, Jéhovah !"]],[0,["Vêtus de blanc, les rachetés","De Christ verront la gloire ;","Par sa vertu ressuscités,","Ils diront ses bontés.","Célébrant sa victoire,","Son œuvre expiatoire,","Autour de son trône, avec eux,","Nous lui rendrons nos vœux."]],[0,["Du grand jour de l'éternité","Quand brillera l'aurore,","Tous consommés dans l'unité","Et dans la charité,","A celui qu'on adore","Nous redirons encore :","Digne est l'Agneau de recevoir","Force, empire et pouvoir !"]]]},{"n":632,"t":"Regarde à Jésus!","s":[[0,["Regarde à Jésus!","Regarde à lui seul","Quand la force te manque.","Regarde à Jésus!","C’est de lui seul","Que viendra le secours."]]]},{"n":633,"t":"Que votre cœur ne se trouble point.","s":[[0,["Que votre cœur ne se trouble point.","Croyez en Dieu, croyez en moi.","Il y a plusieurs demeures dans la maison,","Dans la maison de Mon Père.","De Mon Père."]]]},{"n":634,"t":"Alléluia ! Gloire à Son Nom ! (bis)","s":[[0,["Alléluia ! Gloire à Son Nom ! (bis)","Du haut des deux,","Christ nous appelle","Pour faire de nous,","Des fils de Dieu !"]]]},{"n":635,"t":"Ouvre mes yeux","s":[[0,["Ouvre mes yeux","Pour que je contemple","Les merveilles de Ta loi.","Je suis un étranger sur la terre.","Ne me cache pas Tes commandements."]]]},{"n":636,"t":"Que c’est merveilleux!","s":[[0,["Que c’est merveilleux!","Vraiment merveilleux!","D’abandonner ce monde,","De suivre Jésus.","Devenir ami du Seigneur Jésus.","Que c’est merveilleux!","Vraiment merveilleux!"]]]},{"n":637,"t":"Eprouvez-Moi pour voir","s":[[0,["Eprouvez-Moi pour voir","Si Je n’ouvre pas.","Les écluses des deux.","Qui a demandé, J’ai refusé (bis)","Eprouvez-moi pour voir","Si Je n’ouvre pas","Les écluses des cieux."]]]},{"n":638,"t":"Rendons grâce au Seigneur,","s":[[0,["Rendons grâce au Seigneur,","Rendons grâce.","Rendons grâce pour Son amour.","Dès le matin les oiseaux chantent","Toutes les louanges de Dieu, le Créateur.","Et toi mon ami, pourquoi ne chantes-tu pas","L’Amour de Jésus ton sauveur ?"]]]},{"n":639,"t":"Puisque Christ remplit","s":[[0,["Puisque Christ remplit","Les exigences de Dieu ;","Je pourrai chanter « le ciel m’appartient ».","Je pourrai chanter, oui chanter","Je pourrai chanter « le ciel m’appartient »"]]]},{"n":640,"t":"Pour le royaume des cieux! Alléluia!","s":[[0,["Pour le royaume des cieux! Alléluia!","Pour le royaume des cieux!","Si ton cœur est plein de péchés,","Demande pardon pour le Royaume des Cieux","Si ton cœur est plein de péchés,","Demande grâce pour le Royaume des Cieux."]]]},{"n":641,"t":"J’aime le Seigneur de tout mon cœur.","s":[[0,["J’aime le Seigneur de tout mon cœur.","J’aime le Seigneur de tout mon cœur.","J’aime le Seigneur","Qui est mort pour moi.","Et je veux lui obéir toujours"]]]},{"n":642,"t":"Va dire à ceux dont l’âme est chancelante","s":[[0,["Va dire à ceux dont l’âme est chancelante","\"Courage! Dieu viendra! Il nous délivrera!\"","Et toi, sois fort et ferme dans l’attente.","Travaille, prie et chante, bientôt Dieu régnera."]]]},{"n":643,"t":"Sûr de la victoire,","s":[[0,["Sûr de la victoire,","Soldat du Seigneur,","Marche, chante: «Gloire!»,","Tu seras vainqueur.","Le grand Capitaine,","Qui va devant toi,","Te la rend certaine;","Combats avec foi:"]],[1,["Oui, la victoire, tu l’auras.","Chante donc: «Gloire!», tu verras","Ton adversaire fort, vaillant,","Tomber à terre à l’instant!"]],[0,["L’ennemi s’avance","Redoublant le pas","Et, plein d’assurance,","Ne s’arrête pas;","Mais Christ va combattre,","Reste près de Lui","Déjà pour l’abattre","Son épée a lui."]],[1,["Et, la victoire, Tu l’auras.","Chante donc: «Gloire !» tu verras","Ton adversaire fort, vaillant,","Tomber à terre à l’instant!"]],[0,["Dieu tient la couronne","Promise au vainqueur","C’est Lui qui la donne","Avec le bonheur;","Bientôt sur ta tête,","Il va la poser;","Dans Sa paix parfaite,","Tu vas reposer,"]],[1,["Car la victoire, tu l’auras.","Chante donc: «Gloire!», tu verras","Ton adversaire fort, vaillant,","Tomber à terre à l’instant!"]]]},{"n":644,"t":"Dans mon âme un beau soleil brille;","s":[[0,["Dans mon âme un beau soleil brille;","Son rayon doux et joyeux","Répand un éclat qui scintille;","C’est le sourire de Dieu."]],[1,["Oh! Quel beau soleil dans mon âme!","Il éclaire, il illumine tout,","A ses rayons mon cœur s’enflamme,","Et je vais chantant partout."]],[0,["Mon cœur était plein de ténèbres Quand parut","un jour nouveau, Au loin, fuyez ombres","funèbres, Devant un soleil si beau!"]],[0,["Nuages des plaintes, du doute, Gaiement je","vous dis adieu! Voici resplendir sur ma route","Le soleil dans un ciel bleu!","A","O mon cœur, éclate en louanges, Pour toi le","soleil a lui;","Je serai parmi les phalanges","Qui loueront Dieu jour et nuit!"]]]},{"n":645,"t":"L’Eternel a fait pour moi des merveilles","s":[[1,["L’Eternel a fait pour moi des merveilles","L’Eternel a fait pour moi des merveilles","Il a permis à mon âme et à mon cœur","A tout mon être,","De retrouver la position perdue."]],[0,["Marchez, Marchez dans l‘amour","Comme aussi Christ nous a aimés","Et S’est livré Lui-même pour nous","Comme offrande et Sacrifice à Dieu","En parfum de bonne odeur.","Alléluia !"]],[0,["Nous étions tous errants comme des brebis","Chacun suivait sa propre voie","Et l’Éternel a fait retomber sur Lui","L’iniquité de nous tous."]],[0,["Consolez, consolez mon peuple,","Dit votre Dieu.","Parlez au cœur de Jérusalem,","Et criez-lui : Que sa servitude est finie","Que son iniquité est expiée","Qu’elle a reçu de la main de l’Eternel,","Au double de tous ses péchés."]]]},{"n":646,"t":"Toujours joyeux!","s":[[0,["Toujours joyeux!","Telle est notre devise,","Joyeux d’avoir Jésus-Christ pour Sauveur.","Oui, joyeux même","Alors qu’on nous méprise","Rien ne saurait assombrir notre cœur."]],[1,["N’ayons pas peur de l’adversaire!","Marchons en chantant vers les deux.","Triomphant déjà sur la terre,","Toujours joyeux, toujours joyeux!"]],[0,["Joyeux encore","Au fort de la bataille,","Nous combattrons pour Lui jusqu’au tombeau","Ah! Pourrions-nous,","Pour plaire à qui nous raille,","Trahir jamais de Jésus le drapeau!"]],[1,["Que nul de nous ne le renie!","N’est-il pas le Roi glorieux?","Bravons pour Lui la moquerie,","Toujours joyeux, toujours joyeux!"]],[0,["Toujours joyeux!","Un jour, devant les anges,","Jésus dira: «Ces vaillants sont à moi.»","Nos cœurs alors","D’éclater en louanges,","Pour ce Jésus, notre bien-aimé Roi."]],[1,["Souffrir pour Lui, bonheur suprême!","Victorieux par Son secours,","Nous resterons, puisqu’il nous aime,","Toujours joyeux, joyeux toujours."]]]},{"n":647,"t":"Tout ce que tu fais, appelle ton Dieu","s":[[0,["Tout ce que tu fais, appelle ton Dieu","Dans la souffrance, appelle Son Nom","Même dans la joie, appelle Son Nom","Car c’est Lui seul qui t’a créé."]]]},{"n":648,"t":"Jésus Christ m’a aimé.","s":[[0,["Jésus Christ m’a aimé.","Il m’a aimé, Jésus m’a aimé.","J’étais perdu, H m’a aimé beaucoup.","Il a donné Sa vie pour moi","Le fils de Dieu m’a aimé.","Il m’a aimé, Jésus m’a aimé."]]]},{"n":649,"t":"Oui, Jésus-Christ est tout pour moi,","s":[[0,["Oui, Jésus-Christ est tout pour moi,","Il est la raison de ma foi.","Le jour, la nuit, Il est présent;","J’exalterai Son Nom puissant.","Pourquoi redouter l’avenir?","Puisque Christ marche devant moi,","Contre le mal je puis tenir,","Gloire à mon divin Roi!"]]]},{"n":650,"t":"Chantons Eben-Ezer","s":[[0,["Chantons Eben-Ezer","La grâce intime de Dieu","Souviens-toi de l'Amour de Dieu","Et bénis le Roi des rois","Eben-Ezer, la grâce infinie de Dieu","Souviens-toi de l’Amour de Jésus","Et bénis le Roi des rois"]]]},{"n":651,"t":"Jésus Christ ne perdra jamais Sa force.","s":[[0,["Jésus Christ ne perdra jamais Sa force.","Ne la perdra. Ne la perdra.","Jésus Christ ne perdra jamais Sa force","Ne la perdra, jamais ne la perdra"]],[0,["Alléluia, alléluia!","Viens voir le Dieu des miracles","Viens voir le Dieu des miracles."]]]},{"n":652,"t":"Il y a un lieu d’assurance","s":[[0,["Il y a un lieu d’assurance","Préparé par le Seigneur","Pour le repos de l’Épouse","Portant l’anneau de l’Époux"]],[1,["De Vautre côté de la rivière","Où il n y a que la lumière","Là où se jouent dans la gloire","Tous les bons chants de victoire."]],[0,["Quand finira la bataille","Contre l’armée de Satan","Nous rentrerons en chantant","Dans la cité éternelle."]],[0,["Quand sonnera la sirène","Du vieux bateau de Sion,","Le vent de paix soufflera","Faisant flotter la bannière."]],[0,["Bientôt deux mille ans s’achèvent","Nous entendrons la trompette,","Pour que tous les saints se lèvent","Et que commence la fête."]]]},{"n":653,"t":"Petit troupeau ne crains rien (bis)","s":[[1,["Petit troupeau ne crains rien (bis)","Je vais te donner la vie","Petit troupeau ne crains rien"]],[0,["Je suis Dieu, l’Eternel Dieu","J’étais mort je suis vivant","Tout pouvoir m’a été donné","Dans le ciel et sur la terre"]],[0,["Je connais ta tribulation","Je connais tes souffrances","Demeure fidèle et sois vainqueur","Car Je viens, Je viens bientôt."]]]},{"n":654,"t":"Quand viendra la fin","s":[[0,["Quand viendra la fin","Du pèlerinage","Que mon Dieu m’avait assigné","Le bon combat","Jusqu’au bout du voyage","La foi en Toi je garderai"]],[1,["Quand Tu l’auras décidé","Vers Toi Jésus j’irai","Ma place sera préparée","Près de Toi, ô bien aimé"]],[0,["Avec les années","S’additionne mon âge,","A Toi, je demeure attaché.","Même si les gens","N’aiment pas mon langage,","Toujours je veux te louer."]],[0,["Je suis serviteur","Du plus grand des maîtres.","Fidèle, je veux Te rester.","D’ici le jour","De la grande fête","Ton salut, j’annoncerai."]]]},{"n":655,"t":"Mon cœur voudrait T’aimer,","s":[[0,["Mon cœur voudrait T’aimer,","Assez T’aimer,","Pour pouvoir supporter,","Tout supporter","La souffrance et la peine,","L’injustice et la haine.","Je veux assez T’aimer","Pour tout supporter."]],[0,["Mon cœur voudrait T’aimer,","Assez T’aimer,","Pour pouvoir accepter,","Tout accepter:","Quand je ne puis T’entendre,","Accepter sans comprendre.","Je veux assez T’aimer","Pour tout accepter."]],[0,["Mon cœur voudrait T’aimer,","Assez T’aimer,","Pour pouvoir espérer,","Tout espérer:","La fin de la souffrance,","La pleine délivrance.","Je veux assez T’aimer","Pour tout espérer."]]]},{"n":656,"t":"Quand Jésus t’invite,","s":[[0,["Quand Jésus t’invite,","Réponds-Lui bien vite,","Si c’est pour Le suivre,","N’hésite pas"]],[1,["Il peut passer outre","Poursuivre Sa route,","Le temps de la grâce","C'est maintenant.","Il peut passer outre","Poursuivre Sa route,","Le temps de la grâce","C'est maintenant."]],[0,["Le Seigneur Lui-même,","Ce Jésus qui t’aime,","Par Sa Voix si douce,","Touche ton cœur."]],[1,["Pourquoi vouloir taire","Cette Voix si chère,","Elle pourrait se taire","A tout jamais.","Pourquoi vouloir taire","Cette Voix si chère,","Elle pourrait se taire","A tout jamais."]],[0,["S’il frappe à ta porte,","Le Seigneur t’apporte,","Le pardon, la grâce,","La paix de ton Dieu."]],[1,["Pour briser tes chaînes,","Il porta Lui-même,","Sur le mont du Calvaire","Tous tes péchés.","Donne-Lui ta vie","Jésus te convie","Fais-Lui confiance,","Tout peut changer !"]]]},{"n":657,"t":"Je vis étranger sur la terre ;","s":[[0,["Je vis étranger sur la terre ;","Mon espoir n’est point ici-bas.","Je suis du pays de lumière","Et mon cœur est déjà là-bas.","Là, jamais péché ni tristesse","Ne viennent troubler le bonheur ;","Mais une éternelle allégresse","Déborde sans cesse des cœurs."]],[0,["Oui, c’est un pays de merveille,","Qui s’étend dans l’immensité,","Un lieu de gloire sans pareille","Où tout est joie et sainteté.","Là, Jésus prépare ma place","Et va revenir me chercher","Pour me conduire, ô quelle grâce","Chez Lui dans la sainte Cité."]],[0,["L’Amour y règne incomparable ;","Car sa source n’est qu’en Jésus.","C’est un bien des plus désirables,","La félicité des élus.","O sainte et divine allégresse,","Tu seras mon lot pour jamais,","Là, j’ignorerai la tristesse","Et mon cœur sera satisfait."]],[0,["O toi dont l’âme est tourmentée,","Ne voudrais-tu pas cet espoir ?","D’avoir une place assurée","Dans ce beau pays du revoir.","Jésus Lui-même t’y invite,","Pourquoi donc ne viendrais-tu pas ?","Vois, Son Amour te sollicite,","Accepte-Le n’hésite pas."]]]},{"n":658,"t":"Espère en Dieu quand la nuit sombre","s":[[0,["Espère en Dieu quand la nuit sombre","Voile le ciel et horizon.","Jamais là-haut ne règne l’ombre,","Là-haut t’attend une Maison."]],[1,["Espère en Dieu quand la tempête","Contre la nef jette ses flots.","Un mot vainqueur déjà s’apprête","À commander paix et repos."]],[0,["Espère en Dieu quand la souffrance","Brisant ton corps, trouble ton cœur.","Chez Lui, jamais l’indifférence","Ne Le distrait de ton malheur."]],[1,["Espère en Dieu quand sonne l’heure","D’abandonner les biens d’en bas.","Crois aux trésors de Sa Demeure,","Car Son Amour t’ouvre Ses Bras."]],[0,["Espère en Dieu quand on t’oublie","Ou qu’on te raille avec dédain.","Pour te sauver, jamais ne plie !","Va plutôt seul sur ton chemin."]],[1,["Espère en Dieu quand ton pied glisse","Sous les efforts du tentateur.","Saisis la Main libératrice","Qui te rendra toujours vainqueur."]]]},{"n":659,"t":"Bénie soit la fontaine de Sang","s":[[0,["Bénie soit la fontaine de Sang","Révélée au monde pécheur","Béni soit le cher Fils de Dieu","Qui guérit par Ses meurtrissures.","J’ai erré loin de Sa bergerie","J’ai causé des larmes en mon cœur","Laves-moi dans le Sang de l’Agneau","Je serai plus blanc que la neige."]],[1,["Blanc, plus blanc que neige (bis)","Laves-moi dans le Sang de l’Agneau","Je serai plus blanc que la neige."]],[0,["Oh ! Père, j’ai erré loin de Toi","Souvent mon cœur s’est égaré","Mes péchés sont rouge cramoisi","L’eau ne peut pas les nettoyer.","Jésus, je viens à Ta fontaine","Ne comptant que sur Ta promesse","Laves-moi par Ton divin lavage","Je serai plus blanc que la neige."]]]},{"n":660,"t":"Tout seul dans ce monde","s":[[0,["Tout seul dans ce monde","Abandonné de tous,","Pauvre et misérable,","Qui voudrait m’aimer ?","Montrez-moi dans ce monde","Un homme de compassion :","Celui qui voudrait être","Mon Compagnon."]],[1,["Compagnon dans la misère","Compagnon dans la joie,","Compagnon de route dans ce monde difficile"]],[0,["Déçu dans ce monde","Ne trouvant point d’amis","Oh, je vous en prie","Montrez-moi un ami,","Donnez-moi des conseils","Comment le trouver","Celui qui voudrait être","Mon Compagnon."]],[0,["Si comme moi,","Vous cherchez ce Compagnon","Laissez-moi vous dire","Où vous pouvez Le trouver","Car moi je L’ai trouvé","Et Il vit avec moi","Enfin je L’ai trouvé","Mon genre de Compagnon."]],[0,["Tous vos compagnons","Le soir rentreront chez eux,","Mais mon Compagnon","En tout temps reste avec moi,","Dans toutes mes douleurs,","Il vient me consoler,","C’est l’Homme de compassion,","L’Ami de tout temps."]],[0,["Oui Jésus-Christ,","Oui je veux l’affirmer,","Est le véritable et l’unique Compagnon","Il donna même Sa Vie","Pour sauver Ses amis","Leur ouvre même la Porte","Du Paradis.","Abandonne tes recherches","Et viens à Jésus.","Il veut te sauver,","Te donner le bonheur,","Etre ton Compagnon","Ton Compagnon en tout temps,"]]]},{"n":661,"t":"Tous mes péchés, (bis)","s":[[0,["Tous mes péchés, (bis)","Son Sang les a lavés !","Tous mes péchés, (bis)","Son Sang les a lavés !"]],[0,["Tous mes soucis, (bis)","Mon Sauveur les a pris !","Tous mes soucis, (bis)","Mon Sauveur les a pris !"]],[0,["C’est à la croix, (bis)","Qu’Il en ôta le poids ;","C’est à la croix, (bis)","Qu’Il en ôta le poids"]],[0,["L’éternité ! (bis)","Où vas-tu la passer ?","L’éternité ! (bis)","Où vas-tu la passer ?"]],[0,["Jésus t’attend, (bis)","Oh ! Viens en ce moment !","Jésus t’attend, (bis)","Oh ! Viens en ce moment !"]]]},{"n":662,"t":"Shadrac- Meschac- Abed-negro","s":[[1,["Shadrac- Meschac- Abed-negro","Témoins fidèles du Dieu très haut.","Shadrac- Meschac- Abed Négro","Chantons ces trois vaillants héros"]],[0,["Nebucadnestar avait fait faire","Une statue en or","Tous ses sujets soumis, l’adorèrent","Pour éviter la mort. Alléluia!"]],[0,["Nations et peuples se prosternèrent,","Les petits et les grands","Pourtant, nos trois héros refusèrent,","Craignant le Tout-Puissant. Alléluia!"]],[0,["Quelques chaldéens les accusèrent","A Nebucadnestar","Il ordonna à ses émissaires,","De chercher sans retard. Alléluia!"]],[0,["Aux pieds de la statue imposante","Allez, prosternez-vous","Sinon, dans une fournaise ardente","Vous serez jetés tous; Alléluia!"]],[0,["Jamais, ô roi, devant ton idole","Nous n’irons adorer","Car de ta main, si tu nous immoles","Dieu peut nous délivrer, Alléluia!"]],[0,["Nébucadnestar prit de colère,","Appela ses soldats.","Il fît ligoter les réfractaires,","Dans le feu, les jeta. Alléluia!"]],[0,["Le roi regarda dans la fournaise","Et voici, que vit-il ?","Quatre hommes circulant à leur aise","Echappant au péril. Alléluia!"]],[0,["Le roi les fît sortir de la braise,","Proclamant en tout lieu.","Dieu les a délivrés de la braise,","Lui seul est le vrai Dieu. Alléluia!"]]]},{"n":663,"t":"Ce monde n’est pas chez moi :","s":[[0,["Ce monde n’est pas chez moi :","Je suis juste un passant.","Et mes trésors s’entassent","Quelque part là au ciel.","Les anges me font signe","Depuis la porte du ciel,","Et je ne me sens jamais","Comme chez moi dans ce monde."]],[1,["Seigneur, Tu sais,","Il n’y a point d’Ami comme Toi.","Si le ciel n’est pas chez moi","Alors que ferai-je ?","Les anges me font signe","Depuis la porte du Ciel,","Et je ne me sens jamais","Comme chez moi dans ce monde."]],[0,["Tous sont à mon attente,","C’est tout ce que je sais,","Il y a longtemps avec Christ","J’ai bien tout arrangé.","Bien que faible et pauvre,","Je sais qu’il me soutient.","Et je ne me sens jamais","Comme chez moi dans ce monde."]],[0,["Dans le pays de gloire, Nous vivrons à jamais ;","De tous côtés les saints","Crient « victoire ! » dans des chants","De la plus douce louange Qui monte depuis le","ciel Et je ne me sens jamais","Comme chez moi dans ce monde."]]]},{"n":664,"t":"Le grand médecin est ici maintenant,","s":[[0,["Le grand médecin est ici maintenant,","Le compatissant Jésus","Réconforte le cœur brisé","Ecoute la voix de Jésus"]],[1,["Le son plus doux des séraphins","Le nom plus doux pour les mortels","Le chant plus doux jamais chanté","Jésus béni soit Jésus."]],[0,["Tes nombreux péchés par donnés","Écoute la voix de Jésus","Vas-en paix sur ta route au ciel","Et porte ta couronne."]],[0,["Toute gloire à l’Agneau immolé","Je crois maintenant en Jésus","J’aime le nom béni du Sauveur","J’aime le nom de Jésus"]],[0,["Son Nom dissipe mes fautes et peurs","Pas autre nom mais Jésus","Combien mon âme se réjouit","D’entendre ce Nom Jésus."]]]},{"n":665,"t":"Je m’abrite à l’ombre de Tes ailes","s":[[0,["Je m’abrite à l’ombre de Tes ailes","Tu es mon Guide dans le danger ;","Tendre Berger, Ton amour fidèle","Seul peut me protéger."]],[1,["Oui. Ton amour m’enchante (bis)","Repos parfait, car je Te connais,","Oui, Ton amour m’enchante."]],[0,["L’amour qui T’a conduit à la mort","Est plus grand que tout amour humain ;","De l’enfer pour le céleste port","Il changea mon destin."]],[0,["Quand je passe par l’épreuve amère,","Que mes amis sont sourds à ma plainte,","Ta Parole est ma seule lumière","L’amour chasse la crainte."]],[0,["Il m’a mis comme un sceau sur Son cœur,","Son amour est fort comme la mort.","Un pèlerin î C’est là mon bonheur,","Souffrir, quel heureux sort !"]],[0,["Pour ce monde je ne veux enfreindre","Les lois parfaites de Ton amour.","Les grandes eaux ne peuvent m’atteindre","Quand j’attends Ton retour."]]]},{"n":667,"t":"Mon Sauveur m’aime","s":[[0,["Mon Sauveur m’aime","Il vient pour me sauver","Il vient dans la Gloire","Mon sauveur est Roi"]],[1,["Un jour Il viendra me","Prendre à la Maison","Pour régner avec Lui","Éternellement"]],[0,["Mon Sauveur m’aime","Il me l’a prouvé","En donnant Sa Vie","Pour moi pécheur"]],[0,["Mon Sauveur m’aime","Il m’a racheté","Du fond de l’abime","Il m’a tiré"]],[0,["Mon sauveur connaît","L’état de mon cœur","Dans ma faiblesse","Il me rend fort"]],[0,["Je suis dans la peine","Il me console","Dans la maladie","Il me guérit"]],[0,["Oui, j’ai fait mon choix","Je suivrai Sa voie","Il me conduira","Dans ce désert."]]]},{"n":668,"t":"J’étais éloigné de Ta Parole","s":[[0,["J’étais éloigné de Ta Parole","Tu m’as envoyé Elie promis","J’étais vraiment dans la confusion,","Tu m’as donné le Message de l’heure."]],[1,["Comment ne pourrais-je Te louer,","Pour tout ce que Tu as fait pour moi","Tu as toujours été mon secours,","Chaque fois que l’ennemi me combat."]],[0,["J’étais dans le monde, aveuglé","Tu m’as donné la lumière du soir","Je vivais dans l’ombre de la mort,","Tu m’as montré le chemin de vie."]],[0,["L’ennemi m’attaque, Tu me défends","L’ennemi me tente, Tu me soutiens","Je suis dans la peine, Tu me consoles","Dans la maladie, Tu me guéris."]],[0,["Malgré tout le mal que j’avais fait,","Tu m’as montré Ton Amour, Seigneur !","Il n’y a plus de doute dans mon cœur,","Tu es pour moi le parfait bonheur !"]]]},{"n":669,"t":"Céleste Père, je T’aime à genoux.","s":[[0,["Céleste Père, je T’aime à genoux.","Céleste Père, je T’aime à genoux.","Je veux invoquer Ton Nom si doux.","Céleste Père, je T’aime à genoux."]]]},{"n":670,"t":"Celui qui boira de l’eau","s":[[0,["Celui qui boira de l’eau","Que Je lui donnerai,","N’aura jamais soif dans sa vie.","Et ce que Je donnerai","Deviendra une source d’eau","Qui jaillira dans la vie éternelle."]]]},{"n":671,"t":"C’est vrai, (bis)","s":[[0,["C’est vrai, (bis)","Oui, je sais que c’est vrai!","Cette pluie de Pentecôte","Est descendue sur nous."]],[0,["C’est vrai, (bis)","Oui, je sais que c’est vrai!","Cette pluie de Pentecôte","Est une réalité."]]]},{"n":672,"t":"Ce monde n’est pas fait pour moi (bis)","s":[[0,["Ce monde n’est pas fait pour moi (bis)","Je ne veux vivre que pour Toi!","Jésus, tu es mon divin Roi!"]]]},{"n":673,"t":"C’est la promesse de la dernière pluie","s":[[0,["C’est la promesse de la dernière pluie","Lève les yeux et vois le blé mûr,","Signes puissants, miracles au Nom de Jésus","Bois, oh! Bois, mon peuple:","C’est la dernière pluie."]]]},{"n":674,"t":"C’est le Sauveur de mon âme,","s":[[0,["C’est le Sauveur de mon âme,","Mon Jésus, mon Jésus !","C’est le Sauveur de mon âme, (bis)","Jésus! Jésus! Jésus! Jésus!","C’est le Sauveur de mon aine, (bis)"]]]},{"n":675,"t":"C’est un si merveilleux Sauveur pour moi!","s":[[0,["C’est un si merveilleux Sauveur pour moi!","J’étais perdu et maudit,","Mais Jésus me conquit.","C’est vraiment le Messie promis."]]]},{"n":676,"t":"Ce que je suis ou que je serai,","s":[[0,["Ce que je suis ou que je serai,","Tout ce que j’ai, tout ce que j’aurai,","Je Te le donne à Toi pour jamais,","Oui, tout ce que j’aimais."]]]},{"n":677,"t":"Chaque jour avec Ton amour,","s":[[0,["Chaque jour avec Ton amour,","La colombe plus près toujours,","Je suivrai Ton sentier,","Chantant, souriant,","Chaque jour avec Ton amour."]]]},{"n":678,"t":"Connais-tu mon Jésus?","s":[[0,["Connais-tu mon Jésus?","Connais-tu mon Ami?","Sais-tu bien comme Il t’aime","Et qu’il sera toujours avec toi."]]]},{"n":679,"t":"J’étais pauvre, Christ m’a enrichi","s":[[0,["J’étais pauvre, Christ m’a enrichi","Etant riche Il s’est fait pauvre pour moi","Mon Sauveur bien-aimé","Expia mes péchés","J’étais pauvre, Christ m’a enrichi."]]]},{"n":680,"t":"Oh Seigneur! Vois ma misère","s":[[0,["Oh Seigneur! Vois ma misère","Les angoisses de mon cœur","Que l’ennemi ne se réjouisse","Pas de mes faiblesses.","Retire mon pied de son filet","Et rend moi vainqueur","Car Tes bontés sont éternelles."]]]},{"n":681,"t":"Dans l’Eglise triomphante,","s":[[0,["Dans l’Eglise triomphante,","Dans l’Épouse du Sauveur,","Baptisé dans le Nom de Jésus,","Je vis éternellement."]]]},{"n":682,"t":"Déjà, j’ai revu Jérusalem,","s":[[0,["Déjà, j’ai revu Jérusalem,","Déjà, j’ai revu mon pays;","Il est encore sous la flamme,","Mais bientôt Jésus va revenir."]]]},{"n":683,"t":"Dieu exauce les prières,","s":[[0,["Dieu exauce les prières,","Matin, midi, soir,","Dieu exauce les prières;","Garde ton cœur en Lui."]]]},{"n":684,"t":"Dieu n’est pas mort, Il vit encore! (ter)","s":[[0,["Dieu n’est pas mort, Il vit encore! (ter)","Je le sens dans mes mains,","Je le sens dans mes pieds,","Je le sens dans mon cœur,","Je le sens dans mon âme,","Je le sens tout autour de moi."]]]},{"n":685,"t":"En Toi Jésus, je mets toute confiance;","s":[[0,["En Toi Jésus, je mets toute confiance;","En Toi Jésus, je mets toute ma foi;","En Toi Jésus, je mets toute ma vie."]]]},{"n":686,"t":"Combien j’aime Jésus, (ter)","s":[[0,["Combien j’aime Jésus, (ter)","Car Il m’a tant aimé.","Oh, puis-je L’oublier! (ter)","Jésus m’a tant aimé."]]]},{"n":687,"t":"Gloire à Jésus,","s":[[0,["Gloire à Jésus,","Il ne change jamais (Alléluia!)","Il m’a sauvé, Il m’a guéri,","M’a rempli de Son Saint-Esprit,","Gloire à Jésus!","Il ne changera jamais."]]]},{"n":688,"t":"Gloire au Seigneur, Alléluia! (3 x)","s":[[0,["Gloire au Seigneur, Alléluia! (3 x)","Gloire au Seigneur,","Alléluia! (4x) Gloire au Seigneur.","Alléluia! (4x) Gloire au Seigneur.","Gloire au Seigneur, Alléluia! (4x).","Gloire au Seigneur!"]]]},{"n":689,"t":"Il m’a retiré de la boue du fossé,","s":[[0,["Il m’a retiré de la boue du fossé,","Etabli mes pieds sur le Grand Rocher,","Il a mis un chant en mon cœur troublé,","Un chant d’allégresse, Alléluia!"]]]},{"n":690,"t":"J’aime ce beau Nom de Jésus, (ter)","s":[[0,["J’aime ce beau Nom de Jésus, (ter)","Car Il m’a aimé le premier."]]]},{"n":691,"t":"J’aime Jésus! J’aime Jésus!","s":[[0,["J’aime Jésus! J’aime Jésus!","Alléluia! Alléluia!","J’aime Jésus! Alléluia!"]]]},{"n":692,"t":"J’ai reçu la Vie du Dieu Créateur,","s":[[0,["J’ai reçu la Vie du Dieu Créateur,","J’ai usé ma vie, en bien des douleurs.","J’ai reçu la Vie du Dieu Rédempteur,","Et n’ai d’autre Vie qu’en Christ mon Seigneur."]]]},{"n":693,"t":"Je suis délivré par le Seigneur,","s":[[0,["Je suis délivré par le Seigneur,","Je suis délivré par Sa Parole.","Auparavant, j’étais lié par Satan","Je suis délivré par le Seigneur"]]]},{"n":694,"t":"Jésus-Christ, ouvre-nous la porte,","s":[[0,["Jésus-Christ, ouvre-nous la porte,","Nous foulons entrer","Dans la maison de l’Éternel.","Amen! Alléluia!","Nous voulons entrer","Dans la maison de l’Eternel."]]]},{"n":695,"t":"Jésus est vainqueur (bis)","s":[[0,["Jésus est vainqueur (bis)","Jésus est vainqueur de Satan.","Alléluia! Alléluia!","Jésus est vainqueur de Satan."]],[0,["Jésus rend vainqueur (bis)","Jésus rend vainqueur le croyant.","Alléluia! Alléluia!","Jésus rend vainqueur le croyant."]],[0,["Jésus rend vainqueur (bis)","Jésus rend vainqueur de Satan.","Alléluia! Alléluia!","Jésus rend vainqueur de Satan."]]]},{"n":696,"t":"Jésus est mon doux Sauveur,","s":[[0,["Jésus est mon doux Sauveur,","Il a lavé mon cœur,","J’ai la joie de Son pardon","Dans Son beau Nom.","Il a pris mon lourd fardeau,","M’a donné le repos.","Je connais la liberté,","Je suis sauvé.","Si tu veux la vrai joie,","Si tu veux la vrai foi,","Regarde simplement à Jésus.","Avec moi de tout ton coeur,","Tu loueras le Seigneur;","Lâme libre, tu chanteras: Alléluia!"]]]},{"n":697,"t":"Jésus est vivant (bis)","s":[[0,["Jésus est vivant (bis)","Par Son Sang Il m’a racheté.","Par Sa puissance Il m’a délivré","De Son Esprit je suis baptisé,","Car Jésus est vivant."]]]},{"n":698,"t":"Jésus reste fidèle,","s":[[0,["Jésus reste fidèle,","Reste fidèle, reste fidèle.","Jésus reste fidèle,","Oui, toujours."]]]},{"n":699,"t":"Jésus, mon Sauveur, arrête","s":[[0,["Jésus, mon Sauveur, arrête","Tes pas à ma voix.","En bénissant d’autres, Maître,","Ne m’oublie pas.","Jésus, Jésus, écoute ma voix!","En bénissant d’autres, Maître,","Ne m’oublie pas!"]]]},{"n":700,"t":"Jésus, mon Sauveur,","s":[[0,["Jésus, mon Sauveur,","Mon divin Rédempteur,","Tu m’as sauvé du péché!","Et mon cœur déborde","De Ta grâce immense.","Chaque jour, je suis heureux! (ter)","Jésus, mon Sauveur,","Mon suprême bonheur,","Chaque jour, je suis heureux!"]]]},{"n":701,"t":"Le feu de Ton Esprit.","s":[[0,["Le feu de Ton Esprit.","Ce qui me donne la Vie,","C’est le feu de Ton Esprit.","Le feu de Ton Esprit!","Le feu de Ton Esprit!","Ce qui me donne la Vie,","C’est le feu de Ton Esprit,","Jésus, le feu de Ton Esprit!"]]]},{"n":702,"t":"Lave-toi dans le Sang,","s":[[0,["Lave-toi dans le Sang,","Dans le Sang (bis) de l’Agneau.","Tes vêtements sont-ils lavés","Dans le Sang?","Dans le Sang sans défaut de l’Agneau."]]]},{"n":703,"t":"Le Saint-Esprit agit comme un aimant","s":[[0,["Le Saint-Esprit agit comme un aimant","Le Saint-Esprit agit comme un aimant","Ii agit sur toi, il agit sur moi,","Tout comme aux beaux jours d’autrefois.","Le Saint-Esprit agit comme un aimant!"]]]},{"n":704,"t":"Le feu divin brûle en mon cœur, (4 x)","s":[[0,["Le feu divin brûle en mon cœur, (4 x)","J’aime Jésus de tout mon cœur, (4 x)","Mon cœur Le loue avec ferveur, (4 x)","Alléluia! Gloire à Son Nom, (4 x)","Jésus revient pour me chercher, (4 x)","Oh! Reçois-Le de tout ton cœur! (4 x)"]]]},{"n":705,"t":"Il a promis d’être avec nous","s":[[0,["Il a promis d’être avec nous","Je m’accroche à Lui (bis)","Il a promis d’être avec nous","Sa fidélité durera toujours (bis)"]]]},{"n":706,"t":"Merveilleux, Merveilleux amour de Dieu,","s":[[0,["Merveilleux, Merveilleux amour de Dieu,","Jésus mon Sauveur frappé et meurtri,","M’a sauvé, m’a guéri, m’a délivré.","Merveilleux amour de Dieu."]]]},{"n":707,"t":"Mon meilleur Ami,","s":[[0,["Mon meilleur Ami,","Jésus, c’est Toi","Oh, combien Tu m’aimes!","A mon tour, je T’aime,","Mon meilleur Ami,","Jésus, c’est Toi."]]]},{"n":708,"t":"Mon amour pour Jésus grandit (bis)","s":[[0,["Mon amour pour Jésus grandit (bis)","Oui, tous les jours","Jusqu’à Son retour,","Mon amour pour Jésus-Christ grandit"]]]},{"n":709,"t":"Ne refuse pas, accepte donc!","s":[[0,["Ne refuse pas, accepte donc!","Ne persiste pas à Lui dire “Non”.","Maintenant Jésus t’appelle,","“Une autre fois” peur être trop tard!"]]]},{"n":710,"t":"Oh! Viens et vois","s":[[0,["Oh! Viens et vois","Combien le Seigneur est bon.","Oh! Viens et vois! (4x)"]],[0,["Oh! Viens et vois","Combien le Seigneur est bon!"]]]},{"n":711,"t":"Nous chantons le Sauveur,","s":[[0,["Nous chantons le Sauveur,","Car Il est Tout-Puissant;","Il a sur Golgotha","Sauvé le monde méchant.","Lui, le Libérateur,","Sur Satan triompha.","Nous louons le Sauveur","De tout cœur."]]]},{"n":712,"t":"Oh! Je L’aime, oui, je L’aime,","s":[[0,["Oh! Je L’aime, oui, je L’aime,","Parce qu’il m’a aimé","Et a donné Sa vie pour moi à Golgotha."]]]},{"n":713,"t":"Jésus revient! Alléluia! (ter)","s":[[0,["Jésus revient! Alléluia! (ter)","Alléluia! Alléluia!","Seras-tu prêt quand Il viendra? (bis)","Si tu es prêt, Il te prendra,","Alléluia! Alléluia!"]]]},{"n":714,"t":"Je veux suivre, toujours suivre (ter)","s":[[0,["Je veux suivre, toujours suivre (ter)","Le chemin que Jésus a tracé pour moi.","Je veux suivre,","Toujours suivre,","Le chemin que Jésus","A tracé pour moi."]]]},{"n":715,"t":"Joie, joie,","s":[[0,["Joie, joie,","Mon cœur est plein de joie!","Mon Sauveur est vivant en moi,","C’est pourquoi maintenant","Mon cœur est plein de joie."]]]},{"n":716,"t":"Espère, adore et crois","s":[[0,["Espère, adore et crois","Jésus mon rédempteur","Au loin déjà je vois","Sa gloire enfin paraître."]]]},{"n":717,"t":"L’amour de Dieu m’a racheté.","s":[[0,["L’amour de Dieu m’a racheté.","Gloire! (bis) Je suis lavé","Dans le Sang précieux de Christ.","Alléluia! Je suis sauvé."]]]},{"n":718,"t":"Oh! Quand je songe à l’Amour de Jésus,","s":[[0,["Oh! Quand je songe à l’Amour de Jésus,","Et à tout ce qu’il a fait pour moi,","Alors, je veux chanter,","Alléluia! Merci pour Golgotha."]]]},{"n":719,"t":"Oh! Sang de Jésus,","s":[[0,["Oh! Sang de Jésus,","Précieux Sang de Jésus,","Oh! Sang de Jésus,","A lavé mon péché."]]]},{"n":720,"t":"Oh, que c’est merveilleux!","s":[[0,["Oh, que c’est merveilleux!","Tous mes nombreux péchés,","Dieu les a oubliés.","Oh, que c’est merveilleux!","Merveilleux pour moi."]]]},{"n":721,"t":"Par Satan, j’étais enchaîné;","s":[[0,["Par Satan, j’étais enchaîné;","Par Jésus, je suis délivré;","Quand je sombrais dans la boue du péché,","Christ m’a délivré."]]]},{"n":722,"t":"Quel bonheur d’être tout à Jésus (ter)","s":[[0,["Quel bonheur d’être tout à Jésus (ter)","Alléluia! Gloire à Dieu!","Gloire à Dieu! Alléluia!","Alléluia! Gloire à Dieu!"]]]},{"n":723,"t":"Quelle joie, Jésus m’a cherché!","s":[[0,["Quelle joie, Jésus m’a cherché!","Quelle joie, Jésus m’a trouvé!","Quelle joie, Jésus m’a pardonné!","Alléluia! Louange et gloire","A ce divin Roi!"]]]},{"n":724,"t":"Quelle joie incomparable,","s":[[0,["Quelle joie incomparable,","Pleine de gloire! (ter)","Quelle joie incomparable,","Pleine de gloire!","Jamais la moitié n’en fut comptée."]]]},{"n":725,"t":"Semblable à Jésus (bis)","s":[[0,["Semblable à Jésus (bis)","Sur la route de la gloire,","Semblable à Jésus (bis)","Oui, c’est là mon seul espoir."]]]},{"n":726,"t":"Se donner à Dieu pour louer et prier;","s":[[0,["Se donner à Dieu pour louer et prier;","Se donner à Dieu pour prêcher et chanter,","Pour montrer le chemin","A qui ne connaît point;","Oh, servir Jésus, chaque matin!"]]]},{"n":727,"t":"Servons Jésus-Christ,","s":[[0,["Servons Jésus-Christ,","Bannissons l’effroi;","Triomphons par le Sang","De l’Agneau divin;","Soyons pleins d’ardeur,","Ne défaillons en rien,","Mais conquérons la terre à notre Roi."]]]},{"n":728,"t":"Ta volonté, Seigneur, Ta volonté,","s":[[0,["Ta volonté, Seigneur, Ta volonté,","Oh, manifeste-la, car c’est Ton droit!","Je ne suis que poussière","Entre Tes mains,","Modèle-moi, Potier, Sauveur divin."]]]},{"n":729,"t":"Tu aimeras le Seigneur de tout ton cœur.","s":[[0,["Tu aimeras le Seigneur de tout ton cœur.","C’est à Lui seul que tu obéiras.","Tes ennemis s’enfuiront devant toi;","Tu aimeras le Seigneur de tout ton cœur."]]]},{"n":730,"t":"Une couronne, Jésus la donne","s":[[0,["Une couronne, Jésus la donne","Aux soldats de la Croix.","Pour toi, pour moi,","Pour tous ceux qui combattront","En Son Nom,","Jésus donnera cette couronne."]]]},{"n":731,"t":"Veux-tu accepter Jésus? (bis)","s":[[0,["Veux-tu accepter Jésus? (bis)","Pour toi le pardon, le plein salut,","Si tu acceptes Jésus."]]]},{"n":732,"t":"Viens mon frère, viens ma sœur.","s":[[0,["Viens mon frère, viens ma sœur.","Jésus-Christ t’attend:","C’est pour toi qu’H est mort","Sur la Croix du Calvaire.","Viens mon frère, viens ma sœur.","Jésus-Christ t’attend!"]]]},{"n":733,"t":"Viens dans mon cœur (bis)","s":[[0,["Viens dans mon cœur (bis)","Viens dans mon cœur,","Seigneur Jésus.","C’est aujourd’hui","L’instant béni:","Viens dans mon cœur,","Seigneur Jésus."]]]},{"n":734,"t":"Au plus fort de l’orage,","s":[[0,["Au plus fort de l’orage,","Tu Te tiens près de moi,","Ranimant mon courage","Et soutenant ma foi."]]]},{"n":735,"t":"Marchons vers notre patrie,","s":[[0,["Marchons vers notre patrie,","Marchons vers notre demeure,","Marchons avec des cris de joie,","Marchons avec des chants d’amour."]]]},{"n":736,"t":"Libéré, libéré","s":[[0,["Libéré, libéré","Jésus-Christ nous a libérés","Libéré, libéré","Joie de vivre pour l’Eternité","Alléluia, alléluia","Gloire à Dieu, gloire à Dieu! Amen"]]]},{"n":737,"t":"Tout est accompli, le voile est déchiré","s":[[0,["Tout est accompli, le voile est déchiré","Tout est accompli, victoire","Seigneur, Ta parole est vérité, Amen!","Ta parole est vérité, victoire."]]]},{"n":738,"t":"Jésus Christ va nous unir (bis)","s":[[0,["Jésus Christ va nous unir (bis)","L’Esprit de Dieu Va venir bientôt.","Il va nous unir en Christ."]]]},{"n":739,"t":"Bientôt Jésus va te juger.","s":[[0,["Bientôt Jésus va te juger.","Seras-tu condamné, ou sauvé ?","Jésus t’appelle Es-tu prêt ?","Car un jour viendra,","La mort te surprendra."]]]},{"n":740,"t":"Crois et tu seras sauvé (ter)","s":[[0,["Crois et tu seras sauvé (ter)","Crois au Seigneur Jésus","Et tu seras sauvé."]]]},{"n":741,"t":"Paradis, c’est la demeure de Dieu,","s":[[0,["Paradis, c’est la demeure de Dieu,","Le paradis c’est la demeure de Dieu","Pour y aller, il faut s’apprêter","Comme tous les saints."]]]},{"n":742,"t":"Paradis, la demeure de Dieu","s":[[0,["Paradis, la demeure de Dieu","Préparée pour ceux qui ont lavé","Leur robe dans le sang de l’Agneau","Paradis, la demeure de Dieu"]]]},{"n":743,"t":"Viens Esprit du Dieu vivant!","s":[[0,["Viens Esprit du Dieu vivant!","Sois le Maître en moi.","Sonde-moi! Courbe-moi!","Brise-moi! Façonne-moi!","Viens Esprit du Dieu vivant ;","Viens et règne en moi."]]]},{"n":744,"t":"Nous serons changés, (bis)","s":[[0,["Nous serons changés, (bis)","De mortel à l’immortalité,","En un clin d’œil."]]]},{"n":745,"t":"Jésus aime les enfants","s":[[0,["Jésus aime les enfants","Il les aime (bis)","Jésus aime les enfants","Il les aime tendrement","Les petits blancs, les petits noirs","Il les aime, (bis)","Les petits blancs, les petits noirs","Il les aime tendrement"]]]},{"n":746,"t":"À Tes pieds, Seigneur","s":[[0,["À Tes pieds, Seigneur","Je dépose tous mes fardeaux","A Tes pieds, Seigneur","Je dépose tous mes fardeaux","A Tes pieds, tous mes soucis","À Tes pieds toute ma faiblesse","Oh! Jésus mon avocat (bis)"]]]},{"n":747,"t":"A Golgotha, Tu meurs pour moi,","s":[[0,["A Golgotha, Tu meurs pour moi,","Dans Ton immense Amour","Jésus mon Roi, je viens à Toi,","Pour T’aimer à mon tour."]]]},{"n":748,"t":"Soyons soldats du Seigneur contre Satan,","s":[[0,["Soyons soldats du Seigneur contre Satan,","En priant d’une même voix.","As-tu pris ton fardeau ?","As-tu pris ta croix ?","Alors viens et suis moi","Partout où je passerai"]]]},{"n":749,"t":"Pays béni, ô pays béni (bis)","s":[[0,["Pays béni, ô pays béni (bis)","Quand est-ce que je m’en irai","O Jérusalem, pays béni."]]]},{"n":750,"t":"J’aimerais que Jésus Christ","s":[[0,["J’aimerais que Jésus Christ","Habite mon cœur Habite mon cœur (4x)","J’aimerais que Jésus Christ Habite mon cœur."]]]},{"n":751,"t":"Ta parole est une lampe à mes pieds ;","s":[[0,["Ta parole est une lampe à mes pieds ;","Et une lumière (bis)","Ta parole est une lampe à mes pieds.","Et une lumière sur mon sentier."]]]},{"n":752,"t":"Christ même vous convie","s":[[0,["Christ même vous convie","Avec tant de douceur.","Donnez-moi toute votre vie ;","Donnez-moi tout votre cœur."]]]},{"n":753,"t":"Ces os vivront encore (4 x)","s":[[0,["Ces os vivront encore (4 x)","Seul Jésus-Christ peut donner la vie,","Oui, peut donner la vie;","Ces os vivront encore."]]]},{"n":754,"t":"Qui nous séparera","s":[[0,["Qui nous séparera","De l’amour de Jésus.","J’ai trouvé la Vie","La Vie en Jésus.","Qui nous séparera","De l’amour de Jésus."]]]},{"n":755,"t":"Sous le Sang, le précieux Sang, (bis)","s":[[0,["Sous le Sang, le précieux Sang, (bis)","Je reçois un cœur nouveau.","Sous le précieux Sang."]]]},{"n":756,"t":"Petit troupeau,","s":[[0,["Petit troupeau,","Notre père a trouvé bon","De nous donner le royaume","De nous donner le royaume des cieux"]]]},{"n":757,"t":"Que le Nom de l’Éternel soit béni.","s":[[0,["Que le Nom de l’Éternel soit béni.","Dès maintenant et à jamais.","Du lever du soleil jusqu’à son couchant","Que le Nom de l’Éternel soit célébré."]]]},{"n":758,"t":"Satan terrassé!","s":[[0,["Satan terrassé!","Il est vraiment terrassé.","Jésus-Christ est le Tout Puisant.","Louons-Le!","Acclamons Son Nom.","Jésus est le Tout Puissant."]]]},{"n":759,"t":"J’aime Ta paix Seigneur, j’aime Ta paix","s":[[0,["J’aime Ta paix Seigneur, j’aime Ta paix","J’aime Ta paix Jésus, Alléluia!","Quand Tu prendras Tes enfants","Souvient-Toi de moi, Seigneur"]]]},{"n":760,"t":"Fortifiez vos mains languissantes","s":[[0,["Fortifiez vos mains languissantes","Et vos genoux affaiblis.","Et suivez avec vos pieds, les voies droites.","Afin que ce qui est boiteux ne dévie pas","Mais plutôt se raffermisse."]]]},{"n":761,"t":"Viens! Esprit du Seigneur.","s":[[0,["Viens! Esprit du Seigneur.","Viens! Nous T’attendons.","Alléluia!","Mets la joie dans nos cœurs.","Par le Christ, Alléluia!"]]]},{"n":762,"t":"Là où deux ou trois","s":[[0,["Là où deux ou trois","Sont assemblées en Mon Nom,","Je suis, Je suis, Je suis au milieu d’eux."]]]},{"n":763,"t":"Sois avec nous!","s":[[0,["Sois avec nous!","Jésus, sois avec nous!","Jésus, Fils de Dieu","Sois avec nous!"]]]},{"n":764,"t":"Quel jour de gloire quand Jésus m’a sauvé","s":[[1,["Quel jour de gloire quand Jésus m’a sauvé","(4x)"]],[0,["Des chaînes de péché, Jésus m’a libéré (ter)"]],[0,["Ce n’est plus moi qui vis, c’est Christ qui vit en","moi (ter)"]],[0,["Aux choses du passé, je n’y veux plus toucher","(ter)"]],[0,["Je suis prédestiné avant la fondation (ter)"]]]},{"n":765,"t":"Combattons Satan","s":[[0,["Combattons Satan","Sans fusil et sans épée.","Combattons Satan sans fusil.","O Eternel notre Dieu!","Au secours, au secours dans ce combat."]]]},{"n":766,"t":"Combattant, viens!","s":[[0,["Combattant, viens!","Viens! Viens! Viens!","Notre Dieu","Combat pour nous."]]]},{"n":767,"t":"Nous sommes soldats,","s":[[0,["Nous sommes soldats,","Soldats, soldats","Les soldats de Jésus-Christ.","Combattons, combattons, combattons!","Nous sommes des victorieux."]]]},{"n":768,"t":"Bienvenue les adorateurs de Dieu","s":[[0,["Bienvenue les adorateurs de Dieu","Notre Seigneur revient bientôt.","Unissons nos voix pour L’adorer","Bienvenue, bienvenue, bienvenue."]]]},{"n":769,"t":"A la Croix, à la Croix,","s":[[0,["A la Croix, à la Croix,","Où j’ai reçu le pardon,","Le fardeau de mon cœur est ôté.","Je ne crains plus, car je suis racheté,","Et je chante à Celui qui m’a sauvé."]]]},{"n":770,"t":"Je Te louerai Seigneur dans ma vie.","s":[[0,["Je Te louerai Seigneur dans ma vie.","Je Te louerai, je Te louerai","Je Te louerai Seigneur dans ma vie.","Je Te louerai toujours."]]]},{"n":771,"t":"Dis tout! Dis tout à Jésus (bis)","s":[[0,["Dis tout! Dis tout à Jésus (bis)","Tout ce que tu as sur ton cœur ;","Dis tout! Dis tout à Jésus."]]]},{"n":772,"t":"Pitié, pitié","s":[[0,["Pitié, pitié","Pitié Seigneur, viens au secours !","Vois! La nuit tombe,","Et Tes enfants sont tous troublés.","Plus de courage,","Pour lutter jusqu’au bout."]]]},{"n":773,"t":"La grâce coule de Golgotha,","s":[[0,["La grâce coule de Golgotha,","La grâce coule, coule pour moi;","Profond mystère, oui, je le crois,","La grâce coule, coule pour moi."]]]},{"n":774,"t":"Et je sais, je peux chanter:","s":[[0,["Et je sais, je peux chanter:","Jésus viendra me chercher!","Es-tu prêt pour rencontrer","Ton Sauveur qui souffrit sur la Croix?"]]]},{"n":775,"t":"Je vis pour Jésus, jour après jour (bis)","s":[[0,["Je vis pour Jésus, jour après jour (bis)","Au Saint-Esprit, j’obéirai","Je vis pour Jésus, jour après jour."]]]},{"n":776,"t":"Il tient ma main.","s":[[0,["Il tient ma main.","Jésus tient ma main.","Vers le Ciel, Il me montre Son chemin."]]]},{"n":777,"t":"Quelque soit mon importance sur la terre","s":[[0,["Quelque soit mon importance sur la terre","Sans Jésus, tout est vanité","Vanité, vanité sans Jésus tout est vanité"]]]},{"n":778,"t":"Je connais Son Nom (bis)","s":[[0,["Je connais Son Nom (bis)","Son Nom c’est Jésus Christ","Je connais Son Nom."]]]},{"n":779,"t":"Conduis-moi par la main (bis)","s":[[0,["Conduis-moi par la main (bis)","L’obscurité envahit mon chemin,","Conduis-moi par la main"]],[0,["Réjouissons-nous, chrétiens (bis)","Car nous avons un Sauveur merveilleux","Réjouissons-nous, chrétiens!"]]]},{"n":780,"t":"Alléluia! Les anges des cieux chantent","s":[[0,["Alléluia! Les anges des cieux chantent","Des cantiques. Alléluia!","Du matin, à midi, le soir,","Des cantiques. Alléluia!"]]]},{"n":781,"t":"J’invoquerai Ton Nom (bis)","s":[[0,["J’invoquerai Ton Nom (bis)","Ta parole met la joie dans mon cœur","J’invoquerai Ton Nom."]]]},{"n":782,"t":"Oh! Bénis Dieu. Oh! Mon âme.","s":[[0,["Oh! Bénis Dieu. Oh! Mon âme.","Que tout ce qui est en moi","Que tout ce qui est en moi,","Bénisse Son saint Nom,"]]]},{"n":783,"t":"Etre comme Jésus, Lui, le souverain (ter)","s":[[0,["Etre comme Jésus, Lui, le souverain (ter)","Seul Maître (ter)","Qui vécut sans péché."]]]},{"n":784,"t":"Qui sera mon témoin devant le Seigneur ?","s":[[0,["Qui sera mon témoin devant le Seigneur ?","Qui sera mon témoin là-haut ?","Qui sera mon témoin devant le Seigneur ?","Jésus sera mon témoin."]]]},{"n":785,"t":"Ouvres mon cœur","s":[[0,["Ouvres mon cœur","Et guide mon attention","Pour observer Tes préceptes.","Daigne me garder sous Ton aile","Pour que je ne chancelle pas."]]]},{"n":786,"t":"C’est Lui le Roi des rois.","s":[[0,["C’est Lui le Roi des rois.","C’est Lui, le Seigneur des seigneurs.","Son nom, c’est Jésus, Jésus, Jésus, Jésus,","Oh! C’est Lui le Roi."]]]},{"n":787,"t":"Demeurez dans Mon amour,","s":[[0,["Demeurez dans Mon amour,","Aimez-vous les uns les autres,","C’est l’ordre que nous laissa,","Notre bien-aimé Sauveur.","Veillez toujours dans la prière,","Soyez remplis de l’Esprit,","C’est l’ordre que nous laissa,","Notre bien-aimé Sauveur."]]]},{"n":788,"t":"O Seigneur, donne-moi des armes","s":[[0,["O Seigneur, donne-moi des armes","Pour combattre Satan.","Pour remporter la victoire","Au nom de Jésus."]]]},{"n":789,"t":"Si tu es vivant,","s":[[0,["Si tu es vivant,","Il faut louer le Seigneur.","Car, après la mort,","Ce sera trop tard."]]]},{"n":790,"t":"Jéhovah, le Dieu des nations.","s":[[0,["Jéhovah, le Dieu des nations.","Jéhovah, le Dieu des nations.","Nous Te louons","Toujours, toujours, toujours","Le Dieu des nations"]]]},{"n":791,"t":"Je chante « alléluia! »","s":[[0,["Je chante « alléluia! »","De tout mon cœur.","A Jésus-Christ.","Car Il m’a sauvé."]]]},{"n":792,"t":"Quand l’Esprit Saint est sur toi,","s":[[0,["Quand l’Esprit Saint est sur toi,","Chante des louanges à l‘Éternel.","Tu seras témoin fidèle","Pour le royaume des Cieux."]]]},{"n":793,"t":"Oh! Seigneur, je suis à Toi (bis)","s":[[0,["Oh! Seigneur, je suis à Toi (bis)","Si je meurs ou si je vis,","Oh! Seigneur, je suis à Toi."]]]},{"n":794,"t":"Il faut que le Christ règne (bis)","s":[[0,["Il faut que le Christ règne (bis)","De l’orient jusqu’à l’occident","Il faut que le Christ règne."]]]},{"n":795,"t":"Je suis chargé de péchés,","s":[[0,["Je suis chargé de péchés,","Je suis chargé de fardeaux.","Je suis fatigué,","Oh! Mon Dieu, répond moi."]]]},{"n":796,"t":"Je L’aime, je L’aime","s":[[0,["Je L’aime, je L’aime","Parce qu’il m’aima le premier","Et a acquis mon salut","Sur le bois du calvaire."]]]},{"n":797,"t":"Il m’a aimé,","s":[[0,["Il m’a aimé,","Seigneur Jésus m’a aimé. Alléluia!","Sa croix est devant moi","Je ne peux plus jamais retourner."]]]},{"n":798,"t":"Oh! Seigneur, nous périssons.","s":[[0,["Oh! Seigneur, nous périssons.","La tempête nous menace.","Sauve-nous, nous T’en prions","Ne dors pas, le fleuve inonde."]]]},{"n":799,"t":"Préparez le chemin du Seigneur,","s":[[0,["Préparez le chemin du Seigneur,","Aplanissez Son sentier,","Là-bas dans le désert.","Prépare le chemin du Seigneur Jésus"]]]},{"n":800,"t":"L’heure de la victoire","s":[[0,["L’heure de la victoire","Et de la vérité","A sonné dans mon cœur","Que Jésus soit loué.","Que Jésus soit loué Dans la vérité"]]]},{"n":801,"t":"Prépare-moi Seigneur","s":[[0,["Prépare-moi Seigneur","Prépare-moi avant Ton retour.","Sépare-moi de tous mes péchés","Avant que Tu ne reviennes."]]]},{"n":802,"t":"Si la Croix n’existait pas","s":[[0,["Si la Croix n’existait pas","Je serai un néant.","Mais Jésus a vu mon cœur,","Il m’a dit : enfant reviens!"]]]},{"n":803,"t":"Nous allons commencer Ton travail","s":[[0,["Nous allons commencer Ton travail","Nous allons glorifier Ton Nom","Nous allons prêcher Ta Parole","Par tout le monde.","Oh Seigneur! Envoie-nous Ta puissance."]]]},{"n":804,"t":"Ne crains pas la tempête.","s":[[0,["Ne crains pas la tempête.","Reste tranquille, la paix viendra.","Relève donc la tête,","Regarde à Jésus: Il pourvoira!","Qu’importe, l’adversaire!","Reste tranquille, il est vaincu.","Au Nom puissant de Jésus,","L’ennemi s’enfuit: Tu es vainqueur"]]]},{"n":805,"t":"Ô Dieu, Tes bienfaits,","s":[[0,["Ô Dieu, Tes bienfaits,","Tes bienfaits sont infinis","Je Te glorifie","Je Te loue toujours","Je chante alléluia","Ô Dieu, Tes bienfaits,","Tes bienfaits sont infinis"]]]},{"n":806,"t":"Moi et ma maison (bis)","s":[[1,["Moi et ma maison (bis)","Nous servirons l’Éternel","Moi et ma maison Le servirons","Car Il est fidèle et Il est bon","Moi et ma maison","Nous servirons l’Éternel"]],[0,["Au milieu des problèmes","Comme aux jours de beaux temps","Moi et ceux que j’aime","Ma femme et mes enfants,","Servirons le Seigneur,","Qui nous a affranchis","De tout notre cœur","Tout au long de notre vie."]]]},{"n":807,"t":"Je suis né de Dieu, j’ai la victoire","s":[[0,["Je suis né de Dieu, j’ai la victoire","Je suis né de Dieu,","C’est pourquoi j’ai la victoire"]]]},{"n":808,"t":"Il m’a tant aimé, Il m’a sauvé (bis)","s":[[1,["Il m’a tant aimé, Il m’a sauvé (bis)"]],[0,["On L’a cloué, cloué sur la croix","Tout cela pour me donner la vie"]],[0,["Il a souffert pour moi sur la croix","Tout cela pour me donner la vie","On a percé, percé dans Son côté","Tout cela pour me donner la vie","On L’a traîné, traîné dans la rue","Tout cela pour me donner la vie","L’Agneau de Dieu a été immolé","Tout cela pour me donner la vie"]]]},{"n":809,"t":"Oh! Doux Jésus","s":[[0,["Oh! Doux Jésus","Je ne suis pas digne","De Te recevoir en mon cœur souillé.","Mais si Tu le veux,","Tu peux me guérir (ô Seigneur)","Dis simplement un mot","Et je revivrai."]]]},{"n":810,"t":"Je m’en allais dans la nuit sombre","s":[[0,["Je m’en allais dans la nuit sombre","Je m’en allais sans aucun guide.","Je Le suivrai toute ma vie.","Le Seigneur Jésus m’a sauvé.","Je Le suivrai toute ma vie.","C’est mon salut."]]]},{"n":811,"t":"Quelle immensité !","s":[[0,["Quelle immensité !","Je ne Te renierais point","Pour un autre dieu","Qui ne pourra pas me sauver,","O Seigneur, j’ai vu Ton pouvoir.","A Toi, sois la gloire !"]]]},{"n":812,"t":"Je suis enfant de Dieu (bis)","s":[[0,["Je suis enfant de Dieu (bis)","J’ai lavé ma robe dans le sang de l’Agneau","Je suis enfant de Dieu"]]]},{"n":813,"t":"Oh! Combien heureux je suis en Jésus.","s":[[0,["Oh! Combien heureux je suis en Jésus.","De tous mes péchés Il m’a lavé.","Un vêtement blanc Il m’a donné,","Dans Son sang mon cœur est purifié.","Avec lui, joyeux, je suivrai mon chemin.","Si l’ennemi vient, je ne craindrai rien,","Car Jésus, mon ami, est près de moi.","Et pour toujours Il me gardera."]]]},{"n":814,"t":"Hosanna! Hosanna!","s":[[0,["Hosanna! Hosanna!","Hosanna à Toi, oh! Mon Dieu","Tu m’as délivré du péché et de l’enfer","Hosanna à Toi, oh! Mon Dieu."]]]},{"n":815,"t":"Jérusalem, cité de Dieu","s":[[0,["Jérusalem, cité de Dieu","Jérusalem, séjour de paix","Un jour sûrement","Nous serons avec Lui","Chantant alléluia!"]]]},{"n":816,"t":"Sois loué! Le Roi des rois","s":[[0,["Sois loué! Le Roi des rois","Sois loué! Seigneur de seigneurs","Sois loué! Loué à jamais","Que tout ce qui respire loue l’Éternel."]]]},{"n":817,"t":"Vous qui êtes chargés,","s":[[0,["Vous qui êtes chargés,","Fatigués venez à Moi :","Je vous donnerai du repos.","Venez, venez à Moi :","Je vous donnerai du repos."]]]},{"n":818,"t":"Dieu Tout-Puissant, nous venons à Toi","s":[[0,["Dieu Tout-Puissant, nous venons à Toi","Avec nos offrandes","Daigne les accepter (alléluia!)","Dieu Tout-Puissant","Nous venons à Toi"]]]},{"n":819,"t":"Rien n’est impossible à Jésus (bis)","s":[[0,["Rien n’est impossible à Jésus (bis)","Amen! Alléluia! (4x)"]]]},{"n":820,"t":"Jésus me dirige, un pas à la fois.","s":[[0,["Jésus me dirige, un pas à la fois.","Mon âme est ravie et remplie de joie.","Demain ne me trouble, Il trace la voie","Jésus me dirige, un pas à la fois."]]]},{"n":821,"t":"Ce que l’homme ne peut pas faire","s":[[0,["Ce que l’homme ne peut pas faire","Dieu est capable de le faire.","Ce que l'homme ne peut pas faire (ter)","Dieu est capable de le faire."]]]},{"n":822,"t":"Apportez à la maison","s":[[0,["Apportez à la maison","De l’Éternel votre Dieu","Vos dons de reconnaissance","Avec allégresse","Mettez-Le à l’épreuve","Et vous verrez ;","Il vous ouvrira les portes","De Ses bénédictions"]]]},{"n":823,"t":"Jésus, ma seule espérance","s":[[0,["Jésus, ma seule espérance","Jésus, mon seul espoir.","Le seul qui fait ma vraie joie,","Le seul sur qui je compte.","Viens, prends toute ma vie","Espoir de la terre, joie du ciel."]]]},{"n":824,"t":"Sans le Seigneur Jésus","s":[[0,["Sans le Seigneur Jésus","Je ne suis rien dans ce monde.","C’est vrai Seigneur,","Je ne suis rien dans ce monde"]]]},{"n":825,"t":"Garde-moi près de Toi pour toujours","s":[[0,["Garde-moi près de Toi pour toujours","Mon Jésus, Toi le Père Éternel","A Tes pieds goûtant l’Amour","Répandu pour moi pécheur","Pour toujours près de Toi, garde-moi"]]]},{"n":826,"t":"Venez amis pécheurs","s":[[0,["Venez amis pécheurs","La trompette a retenti","C’est la voix du grand Dieu","Il est temps de s’éveiller","Animez-vous d’amour","Bannissez en vous la haine","Fortifiez votre foi,","Vivez dans la joie"]]]},{"n":827,"t":"C’est à Toi que je viens tout offrir","s":[[0,["C’est à Toi que je viens tout offrir","Tout mon cœur et tous mes biens,","C’est Toi qui as gardé ma semence,","Maintenant, c’est la moisson.","Vive la moisson (bis)","Oh! Mon Dieu,","Viens bénir nos offrandes."]]]},{"n":828,"t":"Il y a pouvoir.","s":[[0,["Il y a pouvoir.","Pouvoir, (ter)","Il y a pouvoir,","Pouvoir dans le Sang.","Il y a un puissant pouvoir,","Merveilleux pouvoir","Pouvoir dans le Sang."]]]},{"n":829,"t":"Louez le Nom de l’Éternel,","s":[[0,["Louez le Nom de l’Éternel,","Le Dieu des armées.","Venez à Lui, car","Il est le Prince de la paix.","Bénissez le Seigneur,","Le Sauveur Jésus Christ.","Les rachetés de toute nation."]]]},{"n":830,"t":"Eternel! Donne-moi des armes","s":[[0,["Eternel! Donne-moi des armes","Pour combattre Satan.","Pour remporter la victoire","Au Nom puissant de Jésus."]]]},{"n":831,"t":"Garde-moi, Seigneur, fidèle à Toi (bis)","s":[[0,["Garde-moi, Seigneur, fidèle à Toi (bis)","J’ai des prix à remporter","Des victoires à gagner.","Oh! Seigneur Garde-moi fidèle à Toi."]]]},{"n":832,"t":"Doux Sauveur, je désire Te voir","s":[[0,["Doux Sauveur, je désire Te voir","Toi qui as donné Ta vie pour moi","Un jour!"]]]},{"n":833,"t":"Allez! Réjouissons-nous dans l’allégresse","s":[[0,["Allez! Réjouissons-nous dans l’allégresse","Allez! Réjouissons-nous dans l’allégresse","Alléluia!","C’est Lui le Rédempteur et le Messie","Notre Sauveur."]]]},{"n":834,"t":"Une cloche sonne dans mon cœur, (bis)","s":[[0,["Une cloche sonne dans mon cœur, (bis)","C’est le chant d’amour du Seigneur Jésus.","Une cloche sonne dans mon cœur."]]]},{"n":835,"t":"Je vais louer le Seigneur Jésus ;","s":[[0,["Je vais louer le Seigneur Jésus ;","Il S’est donné à la croix.","Il m’a tant aimé,","Il est mort pour moi.","Je vais louer le Seigneur Jésus.","Alléluia! (4 x)"]]]},{"n":836,"t":"Il est un pays magnifique","s":[[0,["Il est un pays magnifique","Où sont les bienheureux.","Peines et chagrins n’y sont plus","Tout est lumière et luit"]]]},{"n":837,"t":"Pourquoi crier (4x) Jésus est là","s":[[0,["Pourquoi crier (4x) Jésus est là","Pourquoi crier (bis)","Pourquoi douter (4x) Seigneur Jésus","Pourquoi douter (bis)","Purifie-nous (4x) Seigneur Jésus","Purifie-nous (bis)","Transforme-nous (4x) Seigneur Jésus","Transforme-nous (bis)"]]]},{"n":838,"t":"Nous disons que Jésus est bon","s":[[0,["Nous disons que Jésus est bon","Nous le disons matin et soir","Il est miséricordieux, Il est le médiateur,","Nous disons que Jésus est bon."]]]},{"n":839,"t":"Quand je vois les bontés de Jésus,","s":[[0,["Quand je vois les bontés de Jésus,","Et tout ce qu’il a fait pour moi,","Mon cœur crie bien fort : alléluia!","Gloire à Dieu, Il est mon Roi."]]]},{"n":840,"t":"Baptisé en Lui,","s":[[0,["Baptisé en Lui,","Sauvé par Sa vie:","Jésus est le Nom que j’aime."]]]},{"n":841,"t":"Jésus, ce Nom que j’aime","s":[[0,["Jésus, ce Nom que j’aime","Jésus, ce Nom suprême","Jamais je n’oublierai ce Nom","Jésus, ce Nom que j’aime"]]]},{"n":842,"t":"Quand mon serviteur M’appelle","s":[[0,["Quand mon serviteur M’appelle","Dit le Seigneur,","Je lui réponds.","Je reste auprès de lui","Dans son épreuve","Je viens le délivrer, le glorifier"]]]},{"n":843,"t":"Si ta vie n’est que débauche","s":[[0,["Si ta vie n’est que débauche","Il est temps de la changer.","Oui, Son Nom, c’est Jésus-Christ.","Prépare-toi à Sa rencontre","Notre Roi revient bientôt","Il revient bientôt."]]]},{"n":844,"t":"Ames perdues, revenez à Jésus","s":[[0,["Ames perdues, revenez à Jésus","N’endurcissez pas vos cœurs.","A Lui appartiennent,","Le temps et la joie de votre vie.","Pécheur, pécheur reviens","Reviens à ton Sauveur Jésus"]]]},{"n":845,"t":"Pour Sa venue sur la terre ici-bas","s":[[0,["Pour Sa venue sur la terre ici-bas","Jésus se fit humain, mais non pécheur.","Il ne fît que la volonté de Dieu,","Afin que les prophéties","Ne soient pas confondues."]]]},{"n":846,"t":"Oh! Oui, c’est vrai, je sais que c’est vrai.","s":[[0,["Oh! Oui, c’est vrai, je sais que c’est vrai.","Il est écrit, cela suffît.","Que Jésus m’aime, ô bonheur suprême,","La bible me le dit."]]]},{"n":847,"t":"Sa moisson est abondante","s":[[0,["Sa moisson est abondante","Mais les ouvriers sont peu","Ils sont peu","Priez donc le Seigneur Dieu","D’envoyer des ouvriers à Sa moisson"]]]},{"n":848,"t":"Éternel, mon Rocher, mon Abri","s":[[0,["Éternel, mon Rocher, mon Abri","Mon lieu fort, mon Bouclier, mon Salut","Je T’aime et je T’adore","Gloire à Ton Nom! (bis)"]]]},{"n":849,"t":"Laisses tout tomber et repends-toi","s":[[0,["Laisses tout tomber et repends-toi","Aux pieds de Jésus.","Oh! Laisses tomber, mon frère","Laisses tomber ce pesant fardeau pécheur","Abandonne ce fardeau aux pieds de Jésus."]]]},{"n":850,"t":"Son amour est merveilleux (bis)","s":[[0,["Son amour est merveilleux (bis)","L’amour de Dieu est merveilleux (ter)","Son amour est merveilleux"]]]},{"n":851,"t":"Mets ta confiance","s":[[0,["Mets ta confiance","En Jésus-Christ seul,","C’est en Lui seul","Que tout est redonné","Qu’attends-Tu donc,","Pauvre pécheur ?","Accours vers Lui et Il te sauvera"]]]},{"n":852,"t":"Je suis dans la joie quand on me dit :","s":[[0,["Je suis dans la joie quand on me dit :","Allons à la maison de l’Éternel."]],[0,["Une heure dans Ses parvis","Vaut mieux que mille ailleurs. Alléluia !"]],[0,["Ce que vous demandez","Il vous l’accordera. Alléluia !"]],[0,["Si Dieu est avec nous","Qui sera contre nous ? Alléluia !"]]]},{"n":853,"t":"Rien ne peut m’arracher","s":[[0,["Rien ne peut m’arracher","De la main de mon Dieu","Ce n’est ni les choses du monde","Ce n’est ni la séduction...etc."]]]},{"n":854,"t":"Israël, mets ton espoir","s":[[0,["Israël, mets ton espoir","En l’Éternel dès maintenant","Élu de Dieu mets ton espoir","En l’Éternel quand ça ne va pas"]]]},{"n":855,"t":"Je croyais que tout était perdu","s":[[0,["Je croyais que tout était perdu","Pour moi, ô Dieu, je ne savais pas","Que j’avais du prix à Tes yeux","O Seigneur de ma Vie !","Pour ce que Tu as fait pour moi","Mon cœur T’exaltera","Mon Rocher, mon Secours"]]]},{"n":856,"t":"Sanctifions-nous, aimons-nous","s":[[0,["Sanctifions-nous, aimons-nous","Pour attendre Jésus car Il revient bientôt","S’il revient, nous sommes sauvés","Nous sommes sauvés, alléluia!"]]]},{"n":857,"t":"Nuit et jour je crie","s":[[0,["Nuit et jour je crie","Après Toi, mon Dieu Sauveur.","Viens me délivrer","De l’angoisse de la mort.","Réconforte-moi et je serai tout à Toi.","Viens me délivrer de l’angoisse de la mort."]]]},{"n":858,"t":"J’estime que les souffrances","s":[[0,["J’estime que les souffrances","Du temps présent,","Ne sauraient être comparées","A la gloire à venir","Qui sera révélée pour nous."]]]},{"n":859,"t":"L’eau de Vie qui coule dans mon cœur","s":[[0,["L’eau de Vie qui coule dans mon cœur","C’est la Parole, c’est la Parole","L’eau de Vie qui coule dans mon cœur","C’est la Parole de Dieu."]]]},{"n":860,"t":"Enseigne-moi à faire ce qui Te plait (bis)","s":[[0,["Enseigne-moi à faire ce qui Te plait (bis)","Car Tu es mon Dieu, Tu es mon Dieu","Enseigne-moi à faire ce qui Te plait."]]]},{"n":861,"t":"Je n’ai point honte de l’évangile","s":[[0,["Je n’ai point honte de l’évangile","C’est une puissance de Dieu","Je n’ai point honte de l’évangile","C’est une puissance de Dieu"]]]},{"n":862,"t":"O Père, ne compte pas mes forfaits","s":[[0,["O Père, ne compte pas mes forfaits","Voici le don de mon cœur","C’est le fruit de ma prière","Étend Ta main et bénis-moi","Accepte-moi tel que je suis"]]]},{"n":863,"t":"Persévère et sois vainqueur (bis)","s":[[0,["Persévère et sois vainqueur (bis)","Si Satan veut te tromper","Persévère et sois vainqueur"]]]},{"n":864,"t":"Un homme peut-il se faire","s":[[0,["Un homme peut-il se faire","Un chemin vers Dieu ?","La voie est là, déjà là.","C’est Jésus, Jésus.","Falsifiez, tordez.","Mais il y a ici une race élue de Dieu","Qui marche par la foi.","De ces pierres des enfants à Abraham.","Qui marchent par la foi."]]]},{"n":865,"t":"Reprenez courage,","s":[[0,["Reprenez courage,","Bientôt c’est la fin des combats.","La couronne est réservée","A tous les vainqueurs.","Celui qui a fait la promesse est fidèle.","Veillez jusqu’à ce que","Le temps soit accompli."]]]},{"n":866,"
